# How each point on Hanabira's N5 and N4 lists maps to Open Japanese Grammar.
#
# Every title in grammar-n5.titles.json and grammar-n4.titles.json appears
# exactly once. A group is one of:
#   ojg:  the point already has an entry; nothing is added, and the entry is
#         not changed (a changed entry loses its reviews).
#   new:  a point OJG did not have; scripts/import-hanabira.mjs adds a stub.
#         The pattern is ours; the gloss is for people reading this file.
#   skip: not a grammar point here (a word taught from the vocabulary lists).
#
# Only the list and its levels are used. Hanabira's explanations and
# examples are not (see README.md).
