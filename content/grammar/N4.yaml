  - id: OJG-0066
    pattern: ～たら
    title: If, when (once A has happened)
    meaning: 'た-form + ら: "if A" or "when A"; with an event, B follows once A has happened.'
    when: "Use it for a condition (もし雨が降ったら, \"if it rains\") and for \"when, once\" about something sure to happen (駅に着いたら電話します, \"I'll call when I get to the station\"). It is the most widely usable conditional in speech and works before requests, invitations and intentions. With a past-tense B, it can tell what you found when you did A: 窓を開けたら、雪が降っていました."
    why: 'たら is built on the past form: A is pictured as realised, and B is what holds from that point. With an event, such as arriving, B follows once A has happened; with a state, such as 安かったら, B applies if the state holds. That is why it covers both "if", when A may not happen, and "when", when A surely will, and why a request or intention fits after it. With a past-tense B, it often tells what the speaker found, or what happened, when A was done.'
    formation:
      - form: V (た-form) + ら
        note: 行ったら, 食べたら, したら, 来たら; negative 行かなかったら.
      - form: い-adjective (た-form) + ら
        note: 高かったら; いい → よかったら.
      - form: Noun / な-adjective + だったら
        note: 雨だったら, ひまだったら.
    examples:
      - japanese: 駅に着いたら、電話してください。
        reading: えきについたら、でんわしてください。
        romaji: eki ni tsuitara, denwa shite kudasai.
        english: When you get to the station, please call me.
      - japanese: もし雨が降ったら、試合は中止です。
        reading: もしあめがふったら、しあいはちゅうしです。
        romaji: moshi ame ga futtara, shiai wa chūshi desu.
        english: If it rains, the match will be cancelled.
      - japanese: 窓を開けたら、雪が降っていました。
        reading: まどをあけたら、ゆきがふっていました。
        romaji: mado o aketara, yuki ga futte imashita.
        english: When I opened the window, it was snowing.
      - japanese: よかったら、いっしょに食べませんか。
        reading: よかったら、いっしょにたべませんか。
        romaji: yokattara, issho ni tabemasen ka.
        english: If you'd like, shall we eat together?
    mistake:
      wrong: 旅行に行ったら、ガイドブックを買います。
      problem: Meant as "I'll buy a guidebook before the trip". With two events like these, たら puts B after A, so this says you will buy it once you are on the trip. For something done beforehand, use なら.
      right: 旅行に行くなら、ガイドブックを買います。
    distinguish_from:
      - id: OJG-0064
        note: ば is more restricted before requests and intentions, especially after an action by the same person. たら takes them freely.
      - id: OJG-0070
        note: と normally does not introduce a one-off request or decision. たら does.
      - id: OJG-0044
        note: なら takes A as given and can give advice for before A. With two successive events, たら puts B after A.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～たら
          ref: 510
    references:
      - source_id: tanos
        ref: 510
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: cb18954737d6a0a02618864db519c69e60c0fa2845909633040fc57a00e6b99c
          note: "The meaning, reasoning and comparison notes overstate the temporal ordering: たら does not always mean that A finishes before B. State conditions such as 安かったら買います need not describe an earlier event. Write: 'たら presents A as a condition. With an event such as arriving, B normally follows its occurrence; with a state, B applies if that state holds.' Likewise, past-tense B does not necessarily mark discovery: お金があったら買ったのに is counterfactual. Write: 'In past narratives, たら can introduce something discovered or something that happened when A occurred; past counterfactual uses are also possible.' Retain the guidebook correction, but restrict its temporal explanation to this event sequence. Replace the ば comparison with: 'ば is more restricted before requests and intentions, especially when A is a controllable action by the same person; たら readily permits these endings.'"
  - id: OJG-0067
    pattern: ～なくてもいい
    title: Don't have to, needn't
    meaning: "V-なくてもいい: \"you don't have to V\"; it is fine not to do V."
    when: "Use it to say something is not necessary, or to ask whether you can skip it: 明日は来なくてもいいです, \"you don't have to come tomorrow\"; 靴を脱がなくてもいいですか, \"is it all right to keep my shoes on?\". It is the \"no\" answer to a question with なければなりませんか. Politer: なくても大丈夫です, なくてもかまいません."
    why: "It is ても, \"even if\", plus いい, \"fine\": \"even if you don't V, it's fine\". So it gives permission not to act, the negative partner of てもいい. It does not forbid anything: 来なくてもいい still allows you to come. For \"must not\", use てはいけない."
    formation:
      - form: V (ない-form, drop い) + くてもいい
        note: "行かなくてもいい, 食べなくてもいい, しなくてもいい, 来なくてもいい. Polite: いいです."
    examples:
      - japanese: 明日は来なくてもいいですよ。
        reading: あしたはこなくてもいいですよ。
        romaji: ashita wa konakute mo ii desu yo.
        english: You don't have to come tomorrow.
      - japanese: ここでは靴を脱がなくてもいいです。
        reading: ここではくつをぬがなくてもいいです。
        romaji: koko de wa kutsu o nuganakute mo ii desu.
        english: You don't need to take your shoes off here.
      - japanese: 「全部食べなければいけませんか。」「いいえ、全部食べなくてもいいですよ。」
        reading: 「ぜんぶたべなければいけませんか。」「いいえ、ぜんぶたべなくてもいいですよ。」
        romaji: '"zenbu tabenakereba ikemasen ka." "iie, zenbu tabenakute mo ii desu yo."'
        english: "\"Do I have to eat all of it?\" \"No, you don't have to eat it all.\""
    mistake:
      wrong: ここで写真を撮らなくてもいいです。
      problem: Meant as "you mustn't take photos here". なくてもいい only says it is not necessary. A prohibition is てはいけません.
      right: ここで写真を撮ってはいけません。
    distinguish_from:
      - id: OJG-0015
        note: てもいい permits doing something. なくてもいい permits not doing it.
      - id: OJG-0332
        note: なければならない says you must. なくてもいい says you don't have to.
