  - id: OJG-0083
    pattern: ～ているあいだに,～
    title: While (something happens during a period)
    meaning: 'V-ている間に, N の間に: "while…", "during…"; something happens at some point within that period.'
    when: 'Use it when one event happens at some point during a period marked by another action or state: 母が寝ている間に、部屋を掃除しました, "while my mother was asleep, I cleaned the room". With a noun: 夏休みの間に. The two parts can have different subjects. Without に, 間 means "the whole time": 待っている間、ずっと本を読んでいました.'
    why: 間 (あいだ) is "the space between", here a stretch of time. With に, it marks a point inside that stretch where something happens, the same に as in 三時に. Without に, the stretch itself is the time, so the main part describes something that lasts all the way through it, usually in the ている form or with ずっと. The period is a state, so a verb before 間 is usually in the ている form, or a verb of state such as いる.
    formation:
      - form: V (ている) + 間に
        note: Something happens at some point within the period.
      - form: Noun + の + 間に
        note: 夏休みの間に, 留守の間に.
      - form: V (ている) / Noun + の + 間
        note: Without に, for something that lasts through the whole period.
    examples:
      - japanese: 母が寝ている間に、部屋を掃除しました。
        reading: ははがねているあいだに、へやをそうじしました。
        romaji: haha ga nete iru aida ni, heya o sōji shimashita.
        english: While my mother was asleep, I cleaned the room.
      - japanese: 夏休みの間に、運転免許を取りたいです。
        reading: なつやすみのあいだに、うんてんめんきょをとりたいです。
        romaji: natsuyasumi no aida ni, unten menkyo o toritai desu.
        english: I want to get my driving licence during the summer holidays.
      - japanese: 電車を待っている間、ずっと本を読んでいました。
        reading: でんしゃをまっているあいだ、ずっとほんをよんでいました。
        romaji: densha o matte iru aida, zutto hon o yonde imashita.
        english: The whole time I was waiting for the train, I was reading.
        note: No に, because the reading lasted through the whole wait.
    mistake:
      wrong: 電車を待っている間に、ずっと本を読んでいました。
      problem: ずっと says the reading lasted the whole time, which needs 間 without に. 間に is for something that happens at one point inside the period.
      right: 電車を待っている間、ずっと本を読んでいました。
    distinguish_from:
      - id: OJG-0071
        note: ながら is one person doing two things at once. 間 and 間に mark a period, and the two parts can have different subjects.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～ているあいだに,～
          ref: 527
    references:
      - source_id: tanos
        ref: 527
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0084
    pattern: ～く/ ～にする
    title: Making something (a certain way)
    meaning: "い-adj (く) or な-adj / noun (に) + する: make something that way; someone deliberately causes the change."
    when: 'Use it when someone changes something on purpose: 部屋をきれいにする, "tidy the room"; 音を小さくする, "turn the sound down"; 髪を短くする. It is common in requests: 静かにしてください, "please be quiet".'
    why: 'く and に are the forms adjectives take to describe how. する is "do, make". So 小さくする is "make (it) so that it is small". It is the transitive partner of くなる／になる: なる says a change happens (音が小さくなる), する says someone makes it happen (音を小さくする). That is why the thing changed takes を, and why requests to change something use する.'
    formation:
      - form: Noun を + い-adjective (drop い) + く + する
        note: 小さくする, 短くする, 安くする; いい → よくする.
      - form: Noun を + な-adjective / noun + に + する
        note: きれいにする, 静かにする, 半分にする.
    examples:
      - japanese: テレビの音を小さくしてください。
        reading: テレビのおとをちいさくしてください。
        romaji: terebi no oto o chiisaku shite kudasai.
        english: Please turn the TV down.
      - japanese: 週末に部屋をきれいにしました。
        reading: しゅうまつにへやをきれいにしました。
        romaji: shūmatsu ni heya o kirei ni shimashita.
        english: I tidied my room at the weekend.
      - japanese: 髪を短くしました。
        reading: かみをみじかくしました。
        romaji: kami o mijikaku shimashita.
        english: I got my hair cut short.
      - japanese: 図書館では静かにしてください。
        reading: としょかんではしずかにしてください。
        romaji: toshokan de wa shizuka ni shite kudasai.
        english: Please be quiet in the library.
    mistake:
      wrong: 部屋がきれいにしました。
      problem: する says someone makes the change, so the thing changed is the object and takes を. が goes with なる (部屋がきれいになりました).
      right: 部屋をきれいにしました。
    distinguish_from:
      - id: OJG-0028
        note: くなる／になる says a change happens by itself (が). くする／にする says someone causes it (を).
      - id: OJG-0310
        note: Noun + にする on its own is "decide on, choose" (コーヒーにします). Here にする after an adjective means "make it so".
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～く/ ～にする
          ref: 528
    references:
      - source_id: tanos
        ref: 528
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
