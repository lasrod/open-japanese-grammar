  - id: OJG-0058
    pattern: ～ていただけませんか
    title: Could you possibly…? (a very polite request)
    meaning: 'V-ていただけませんか: "could you please V?"; a very polite request, asked as whether you may receive the favour.'
    when: "Use it for polite requests to strangers, customers, teachers, or anyone above you, especially for a real favour: もう少しゆっくり話していただけませんか. Other members of the same family are てもらえませんか and てくれませんか, which are less deferential, and てくださいませんか, which is also very polite."
    why: "いただく is the humble verb for \"receive\", and いただける is its potential form, \"can receive\". ませんか asks in the negative. Put together: \"can't I receive your doing V?\". The request is softened twice: it asks about your receiving instead of telling the listener to act, and the negative question leaves room for no. Since the speaker is the one receiving, the listener, who does the action, is usually not named."
    formation:
      - form: V (て-form) + いただけませんか
        note: いただけますか is a little less soft. いただけないでしょうか is softer still.
    examples:
      - japanese: もう少しゆっくり話していただけませんか。
        reading: もうすこしゆっくりはなしていただけませんか。
        romaji: mō sukoshi yukkuri hanashite itadakemasen ka.
        english: Could you speak a little more slowly, please?
      - japanese: すみません、この字の読み方を教えていただけませんか。
        reading: すみません、このじのよみかたをおしえていただけませんか。
        romaji: sumimasen, kono ji no yomikata o oshiete itadakemasen ka.
        english: Excuse me, could you tell me how to read this character?
      - japanese: 明日までに書類を送っていただけませんか。
        reading: あしたまでにしょるいをおくっていただけませんか。
        romaji: ashita made ni shorui o okutte itadakemasen ka.
        english: Could you send the documents by tomorrow?
    mistake:
      wrong: 先生、この本を貸していただきませんか。
      problem: The request needs the potential form いただける, "can I receive". いただきませんか asks "won't (we) receive?", which is not a request to the listener.
      right: 先生、この本を貸していただけませんか。
    distinguish_from:
      - id: OJG-0327
        note: てくれませんか and てもらえませんか make the same request less deferentially. てくださいませんか is also very polite; it respectfully asks about the listener's giving, where ていただけませんか humbly asks about your receiving.
