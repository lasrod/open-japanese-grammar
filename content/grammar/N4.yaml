  - id: OJG-0074
    pattern: ～てよかった
    title: I'm glad that…
    meaning: "V-てよかった: \"I'm glad (that) V\", \"it's good that V\"; relief or pleasure at how something turned out."
    when: "Use it for something that happened and turned out well: 日本に来てよかったです, \"I'm glad I came to Japan\"; 間に合ってよかった, \"thank goodness we made it\". For something that did not happen, use なくて: 雨が降らなくてよかった."
    why: 'The て-form gives the cause and よかった gives the verdict: "V happened, and so it is good". よかった expresses relief or pleasure about a situation that has come about, whether a past event or a present state (元気でよかった). The negative takes なくて, the negative て-form that gives a reason. Compare ばよかった, which is about something that did not happen (regret); てよかった is about how things actually are (relief).'
    formation:
      - form: V (て-form) + よかった
        note: 来てよかった, 間に合ってよかった; negative 降らなくてよかった.
      - form: い-adjective (くて) / noun or な-adjective (で) + よかった
        note: 安くてよかった, 元気でよかった.
    examples:
      - japanese: 日本に来てよかったです。
        reading: にほんにきてよかったです。
        romaji: nihon ni kite yokatta desu.
        english: I'm glad I came to Japan.
      - japanese: 雨が降らなくてよかったですね。
        reading: あめがふらなくてよかったですね。
        romaji: ame ga furanakute yokatta desu ne.
        english: It's good it didn't rain, isn't it.
      - japanese: みんな元気でよかった。
        reading: みんなげんきでよかった。
        romaji: minna genki de yokatta.
        english: I'm glad everyone is well.
    mistake:
      wrong: 試験に合格すればよかったです。
      problem: Meant as "I'm glad I passed". 合格すればよかった means "I wish I had passed", regret about something that did not happen. For relief about what did happen, use てよかった.
      right: 試験に合格してよかったです。
    distinguish_from:
      - id: OJG-0072
        note: ばよかった regrets something that did not happen. てよかった is glad about how things actually are, including something not happening (なくてよかった).
