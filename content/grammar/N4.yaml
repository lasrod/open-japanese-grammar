  - id: OJG-0345
    pattern: ～かな／～かしら
    title: I wonder…
    meaning: 'Plain form + かな／かしら: "I wonder (if)…"; the speaker wonders aloud or to themselves. Casual.'
    when: "Use it when you wonder about something, half to yourself: 明日は晴れるかな, \"I wonder if it'll be sunny tomorrow\". It invites a response without asking directly. かな is used by everyone; かしら is traditionally women's speech and now sounds refined or a little old-fashioned. With a negative, it can express a wish that something would happen, especially with 早く: バス、早く来ないかな, \"I wish the bus would hurry up\"."
    why: "か marks a question, and な (or しら) turns it inwards: instead of asking the listener, the speaker asks themselves. That is why it is softer than a question and fits talking to yourself. It is plain and casual, so in polite speech people use でしょうか, or wrap it: …かなと思います. A noun or な-adjective goes straight before it, without だ: 本当かな."
    formation:
      - form: Verb / い-adjective (plain form) + かな／かしら
        note: 晴れるかな, 開いているかな, おいしいかな.
      - form: Noun / な-adjective + かな／かしら
        note: "No だ: 本当かな, 誰かしら."
      - form: V (ない-form) + かな
        note: Can express a wish that something would happen (早く来ないかな); context tells this apart from an ordinary negative question.
    examples:
      - japanese: 明日は晴れるかな。
        reading: あしたははれるかな。
        romaji: ashita wa hareru ka na.
        english: I wonder if it'll be sunny tomorrow.
      - japanese: この店、まだ開いているかな。
        reading: このみせ、まだあいているかな。
        romaji: kono mise, mada aite iru ka na.
        english: I wonder if this shop is still open.
      - japanese: バス、早く来ないかな。
        reading: バス、はやくこないかな。
        romaji: basu, hayaku konai ka na.
        english: I wish the bus would hurry up and come.
      - japanese: あの人、誰かしら。
        reading: あのひと、だれかしら。
        romaji: ano hito, dare kashira.
        english: I wonder who that is.
    mistake:
      wrong: お客様、こちらでよろしいかな。
      problem: かな is casual, for talking to yourself or to friends. To a customer, ask politely with でしょうか.
      right: お客様、こちらでよろしいでしょうか。
    distinguish_from:
      - id: OJG-0038
        note: でしょう guesses and でしょうか asks politely. かな wonders, casually and half to yourself.
    register:
      - casual
      - spoken
