  - id: OJG-0086
    pattern: のに
    title: Even though (and that's not how it should be)
    meaning: 'Plain form + のに: "even though A, B"; B goes against what A led you to expect, often with surprise or frustration.'
    when: 'Use it when a result goes against what the first fact would lead you to expect, and you feel something about it: disappointment, surprise, complaint. 一生懸命勉強したのに、試験に落ちました, "even though I studied hard, I failed the exam". Both parts are real facts. Left at the end of a sentence, it sighs: もっと早く言えばよかったのに, "you should have told me sooner".'
    why: "の turns A into a fact, and に sets it against B: \"given the fact A, still B\". Because A is a fact, のに is not used for \"even if\" about something that may happen; that is ても. Because the speaker is reacting to a result, B is not a request, an invitation or the speaker's own plan. A noun or な-adjective takes な before のに (日曜日なのに, 静かなのに), as with other の-patterns."
    formation:
      - form: Verb / い-adjective (plain form) + のに
        note: 勉強したのに, 来ないのに, 安いのに.
      - form: Noun / な-adjective + な + のに
        note: 日曜日なのに, 静かなのに.
    examples:
      - japanese: 一生懸命勉強したのに、試験に落ちました。
        reading: いっしょうけんめいべんきょうしたのに、しけんにおちました。
        romaji: isshōkenmei benkyō shita noni, shiken ni ochimashita.
        english: Even though I studied hard, I failed the exam.
      - japanese: 日曜日なのに、会社に行かなければなりません。
        reading: にちようびなのに、かいしゃにいかなければなりません。
        romaji: nichiyōbi na noni, kaisha ni ikanakereba narimasen.
        english: Even though it's Sunday, I have to go to work.
      - japanese: 約束したのに、彼は来ませんでした。
        reading: やくそくしたのに、かれはきませんでした。
        romaji: yakusoku shita noni, kare wa kimasen deshita.
        english: He promised, and yet he didn't come.
    mistake:
      wrong: 明日雨が降るのに、サッカーをします。
      problem: Meant as "even if it rains tomorrow". のに is for facts that already hold; for "even if" about what may happen, use ても.
      right: 明日雨が降っても、サッカーをします。
    distinguish_from:
      - id: OJG-0065
        note: ても covers "even if" for things that may happen, and is neutral. のに is for facts, and carries the speaker's reaction.
      - id: OJG-0290
        note: が and けど simply join two contrasting facts. のに adds that the result is unexpected or unwelcome.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: のに
          ref: 530
    references:
      - source_id: tanos
        ref: 530
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: Covers the "even though" のに only. The purpose のに (この箱は本を入れるのに使います, "used for holding books") is a different point and is not written here.
  - id: OJG-0087
    pattern: ～のような
    title: Like, such as (before a noun)
    meaning: 'N のような + noun: "a (noun) like N"; compares, or gives N as an example of the kind meant.'
    when: 'Use it before a noun to compare (夢のような一日, "a day like a dream") or to give an example of the kind of thing you mean (ラーメンのような温かい物, "something warm, like ramen"). In conversation, みたいな is common: 東京みたいな町.'
    why: "よう means \"manner, likeness\". The noun joins it with の, and ような then joins the next noun with な, the way a な-adjective does. So N のような X is \"an X of N's kind\". Whether that compares X to N or offers N as an example comes from the context. The form before a verb or adjective is ように (OJG-0088): the choice depends on what comes next."
    formation:
      - form: Noun + の + ような + noun
        note: 夢のような一日, 父のような人.
      - form: Verb (plain form) + ような + noun
        note: 夢を見ているような気持ち, "a feeling as if I were dreaming".
    examples:
      - japanese: 父のような優しい人になりたいです。
        reading: ちちのようなやさしいひとになりたいです。
        romaji: chichi no yō na yasashii hito ni naritai desu.
        english: I want to become a kind person like my father.
      - japanese: ラーメンのような温かい物が食べたいです。
        reading: ラーメンのようなあたたかいものがたべたいです。
        romaji: rāmen no yō na atatakai mono ga tabetai desu.
        english: I want to eat something warm, like ramen.
      - japanese: 夢のような一日でした。
        reading: ゆめのようないちにちでした。
        romaji: yume no yō na ichinichi deshita.
        english: It was a day like a dream.
    mistake:
      wrong: 父ような人になりたいです。
      problem: After a noun, よう needs の.
      right: 父のような人になりたいです。
    distinguish_from:
      - id: OJG-0088
        note: ように goes before a verb or adjective (魚のように泳ぐ). ような goes before a noun.
      - id: OJG-0068
        note: みたいな is the conversational equivalent and joins the noun directly, without の.
    register:
      - plain
      - polite
      - written
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～のような
          ref: 531
    references:
      - source_id: tanos
        ref: 531
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0088
    pattern: ～のように
    title: Like, as (before a verb or adjective)
    meaning: 'N のように + verb or adjective: "like N", "as N does"; also "as" in 次のように, 言ったように.'
    when: 'Use it to say how something is done or how something is, by comparison: 魚のように泳ぐ, "swim like a fish"; 春のように暖かい, "as warm as spring". It also means "as" when pointing to something shown or said: 次のように書いてください, "write it as follows"; 前にも言ったように, "as I said before".'
    why: 'のように is the adverb form of のような. Like a な-adjective (静かな部屋, 静かに話す), it takes な before a noun and に before a verb or adjective. So choose by what comes next. With a verb before it (言ったように), it points to the way something was said or shown: "in the way that…".'
    formation:
      - form: Noun + の + ように + verb or adjective
        note: "魚のように泳ぐ, 春のように暖かい. Conversation: みたいに."
      - form: Verb (plain form) + ように
        note: 言ったように, 次に書いてあるように.
    examples:
      - japanese: マリアさんは日本人のように日本語を話します。
        reading: マリアさんはにほんじんのようににほんごをはなします。
        romaji: maria-san wa nihonjin no yō ni nihongo o hanashimasu.
        english: Maria speaks Japanese like a native speaker.
      - japanese: 今日は春のように暖かいです。
        reading: きょうははるのようにあたたかいです。
        romaji: kyō wa haru no yō ni atatakai desu.
        english: Today is as warm as spring.
      - japanese: 次のように書いてください。
        reading: つぎのようにかいてください。
        romaji: tsugi no yō ni kaite kudasai.
        english: Please write it as follows.
    mistake:
      wrong: 魚のような泳ぎます。
      problem: Before a verb, the adverb form ように is needed. ような goes only before a noun.
      right: 魚のように泳ぎます。
    distinguish_from:
      - id: OJG-0087
        note: ような goes before a noun. ように goes before a verb or adjective.
      - id: OJG-0340
        note: The ように of ように言う follows a verb and reports an instruction. This ように compares or points to a manner.
    register:
      - plain
      - polite
      - written
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～のように
          ref: 532
    references:
      - source_id: tanos
        ref: 532
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0089
    pattern: ～させられる
    title: Being made to do something (the causative passive)
    meaning: 'Causative passive V-させられる: "be made to V", usually against your will; the one made to act is the subject.'
    when: 'Use it to say, from your own side, that someone made you do something you did not want to do: 子どものころ、母に野菜を食べさせられました, "as a child, my mother made me eat vegetables". The one who made you is marked with に. Being kept waiting is a common case: 一時間も待たされました.'
    why: It stacks two changes. The causative (食べさせる) adds someone who makes another act. The passive (られる) then turns the one who acted into the subject, and moves the causer to に. So the sentence is about the person who had to act, and like other passives it usually carries a sense of being put upon. Godan verbs have a shorter spoken form, される for せられる (飲まされる, 待たされる), except those ending in す (話させられる).
    formation:
      - form: Ichidan verb (stem) + させられる
        note: 食べる → 食べさせられる.
      - form: Godan verb (ない-stem) + せられる, or される
        note: 飲む → 飲ませられる／飲まされる, 待つ → 待たされる. Verbs in す take only させられる (話させられる).
      - form: する → させられる; 来る → 来させられる (こさせられる)
    examples:
      - japanese: 子どものころ、母に野菜を食べさせられました。
        reading: こどものころ、ははにやさいをたべさせられました。
        romaji: kodomo no koro, haha ni yasai o tabesaseraremashita.
        english: When I was a child, my mother made me eat vegetables.
      - japanese: 駅で一時間も待たされました。
        reading: えきでいちじかんもまたされました。
        romaji: eki de ichijikan mo matasaremashita.
        english: I was kept waiting at the station for a whole hour.
      - japanese: 先輩にお酒をたくさん飲まされました。
        reading: せんぱいにおさけをたくさんのまされました。
        romaji: senpai ni osake o takusan nomasaremashita.
        english: My senior made me drink a lot.
    mistake:
      wrong: 母は私に野菜を食べさせられました。
      problem: The roles are reversed. In the causative passive, the one who was made to act is the subject, and the one who made them takes に.
      right: 私は母に野菜を食べさせられました。
    distinguish_from:
      - id: OJG-0062
        note: させる tells it from the causer's side (母が私に食べさせた). させられる tells it from the side of the one made to act.
      - id: OJG-0081
        note: られる is "have something done to you". させられる is "be made to do something yourself".
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～させられる
          ref: 533
    references:
      - source_id: tanos
        ref: 533
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0090
    pattern: ～ことにする
    title: Deciding to do something
    meaning: "V (plain) + ことにする: \"decide to V\", by one's own choice; ことにしている: \"make a point of V-ing\"."
    when: "Use it to say you, or someone, decided on an action: 来年、日本に留学することにしました, \"I've decided to study in Japan next year\". With a negative verb, decide not to: 甘い物を食べないことにした. ことにしている describes a personal rule you keep: 毎朝走ることにしています."
    why: こと turns the verb into a noun, "doing V", and にする is "settle on", the same にする as in コーヒーにします, "I'll have coffee". So ことにする is "settle on doing V". It is a decision made by the person, in contrast to ことになる, where the matter is decided by others or by circumstances. The past, ことにした, is the usual way to announce a decision just made, and ことにしている says the decision is still being kept.
    formation:
      - form: V (dictionary form or ない-form) + ことにする
        note: 留学することにした, 食べないことにした.
      - form: V + ことにしている
        note: A rule or habit you have set yourself.
    examples:
      - japanese: 来年、日本に留学することにしました。
        reading: らいねん、にほんにりゅうがくすることにしました。
        romaji: rainen, nihon ni ryūgaku suru koto ni shimashita.
        english: I've decided to study abroad in Japan next year.
      - japanese: 今日から甘い物を食べないことにします。
        reading: きょうからあまいものをたべないことにします。
        romaji: kyō kara amai mono o tabenai koto ni shimasu.
        english: From today, I'm not going to eat sweets.
      - japanese: 毎朝三十分走ることにしています。
        reading: まいあささんじゅっぷんはしることにしています。
        romaji: maiasa sanjuppun hashiru koto ni shite imasu.
        english: I make a point of running for thirty minutes every morning.
    mistake:
      wrong: 父の仕事で、来年アメリカに引っ越すことにしました。
      problem: The move is decided by the father's job, not by the speaker. For something decided by others or by circumstances, use ことになる.
      right: 父の仕事で、来年アメリカに引っ越すことになりました。
    distinguish_from:
      - id: OJG-0093
        note: ことになる is decided by others or by circumstances. ことにする is your own decision.
      - id: OJG-0027
        note: つもり is an intention you hold. ことにした announces the moment of deciding.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～ことにする
          ref: 534
    references:
      - source_id: tanos
        ref: 534
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0295
    pattern: それで
    title: And so, that's why
    meaning: "それで: \"and so\", \"that's why\"; starts a sentence that gives the result of what was just said. Also \"and then?\"."
    when: 'Use it at the start of a sentence to give what followed from the previous one: 昨日は熱がありました。それで、学校を休みました, "I had a fever yesterday. So I stayed home from school". In conversation, それで？ asks the other person to go on: "and then?".'
    why: 'それ points back at the previous sentence, and で presents it as the cause: "with that, …". So the second sentence is what came about because of the first. Because it reports a result, it is used for things that happened or hold, and not to lead into your own request, suggestion or order; だから is used for those.'
    formation:
      - form: Sentence A。それで、sentence B。
    examples:
      - japanese: 昨日は熱がありました。それで、学校を休みました。
        reading: きのうはねつがありました。それで、がっこうをやすみました。
        romaji: kinō wa netsu ga arimashita. sorede, gakkō o yasumimashita.
        english: I had a fever yesterday. So I stayed home from school.
      - japanese: 電車が遅れました。それで、会議に間に合いませんでした。
        reading: でんしゃがおくれました。それで、かいぎにまにあいませんでした。
        romaji: densha ga okuremashita. sorede, kaigi ni maniaimasen deshita.
        english: The train was late. That's why I didn't make it to the meeting.
      - japanese: 「駅で田中さんに会ったんです。」「それで？」
        reading: 「えきでたなかさんにあったんです。」「それで？」
        romaji: '"eki de tanaka-san ni atta n desu." "sorede?"'
        english: '"I ran into Tanaka-san at the station." "And then?"'
    mistake:
      wrong: 明日はテストがあります。それで、今日は早く寝てください。
      problem: それで introduces a result that came about. It does not lead into a request; use だから.
      right: 明日はテストがあります。だから、今日は早く寝てください。
    distinguish_from:
      - id: OJG-0294
        note: だから can lead into anything, including requests and opinions. それで reports a result.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: 文A。それで 文B (Bun A. Sorede Bun B)
    references:
      - source_id: hanabira
        ref: それで
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0296
    pattern: それに／そのうえ
    title: Besides, what's more
    meaning: 'それに／そのうえ: "besides", "on top of that"; adds another point of the same kind to what was just said.'
    when: 'Use it at the start of a sentence to add a further point pushing in the same direction: この店は安いです。それに、料理もおいしいです. それに is common in conversation; そのうえ is a little more formal and suggests "and even more than that". Both often add one more reason.'
    why: 'それ points back at what was said, and に adds to it: "to that, (add) this". そのうえ is literally "on top of that". Both pile points up, so the added point goes the same way as the first: good on good, or bad on bad. To add a point that goes against the first, use でも or しかし.'
    formation:
      - form: Sentence A。それに、sentence B。
      - form: Sentence A。そのうえ、sentence B。
    examples:
      - japanese: この店は安いです。それに、料理もおいしいです。
        reading: このみせはやすいです。それに、りょうりもおいしいです。
        romaji: kono mise wa yasui desu. soreni, ryōri mo oishii desu.
        english: This restaurant is cheap. Besides, the food is good too.
      - japanese: 今日は雨です。それに、とても寒いです。
        reading: きょうはあめです。それに、とてもさむいです。
        romaji: kyō wa ame desu. soreni, totemo samui desu.
        english: It's raining today. And on top of that, it's very cold.
      - japanese: 道に迷いました。そのうえ、スマホの電池も切れてしまいました。
        reading: みちにまよいました。そのうえ、スマホのでんちもきれてしまいました。
        romaji: michi ni mayoimashita. sono ue, sumaho no denchi mo kirete shimaimashita.
        english: I got lost. On top of that, my phone battery ran out.
    mistake:
      wrong: このアパートは駅から近いです。それに、家賃が高いです。
      problem: それに adds a point of the same kind, but "close to the station" is good and "the rent is high" is bad. For a point that goes against the first, use でも.
      right: このアパートは駅から近いです。でも、家賃が高いです。
    distinguish_from:
      - id: OJG-0293
        note: そして and それから add the next thing, or what happened next, with no weighing. それに piles up another point for the same conclusion.
      - id: OJG-0041
        note: し piles up points inside one sentence. それに starts a new sentence to add one.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: 文A。そのうえ 文B。
        - source_id: hanabira
          level: N4
          item: 文A。それに 文B (Bun A. Soreni Bun B)
    references:
      - source_id: hanabira
        ref: それに／そのうえ
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0299
    pattern: AはBほど～ない
    title: A is not as … as B
    meaning: 'A は B ほど + negative: "A is not as (adjective) as B"; B sets a level that A does not reach.'
    when: "Use it to compare by saying one thing falls short of another: 今年の夏は去年ほど暑くない, \"this summer isn't as hot as last year's\". It is a natural way to say something is less so, and it sounds gentler than a direct comparison with より."
    why: "ほど means \"extent, degree\". B ほど is \"to B's degree\", and the negative says A does not reach it. So the end of the sentence must be negative; A は B ほど暑い is not a comparison. The sentence also takes for granted that B has the quality to a clear degree: 去年ほど暑くない implies last year was hot."
    formation:
      - form: A は B ほど + negative
        note: い-adjective 暑くない; な-adjective にぎやかではない／じゃない; verb 読まない. Polite くないです／くありません, ではありません, ません.
    examples:
      - japanese: 今年の夏は去年ほど暑くないです。
        reading: ことしのなつはきょねんほどあつくないです。
        romaji: kotoshi no natsu wa kyonen hodo atsuku nai desu.
        english: This summer isn't as hot as last year's.
      - japanese: 私の町は東京ほどにぎやかではありません。
        reading: わたしのまちはとうきょうほどにぎやかではありません。
        romaji: watashi no machi wa tōkyō hodo nigiyaka de wa arimasen.
        english: My town isn't as lively as Tokyo.
      - japanese: 弟は私ほど本を読みません。
        reading: おとうとはわたしほどほんをよみません。
        romaji: otōto wa watashi hodo hon o yomimasen.
        english: My little brother doesn't read as much as I do.
    mistake:
      wrong: 東京は大阪ほど大きいです。
      problem: ほど in a comparison needs a negative. To say A is bigger than B, use より.
      right: 東京は大阪より大きいです。
    distinguish_from:
      - id: OJG-0025
        note: より and のほうが say which one has more of the quality. ほど～ない says one falls short of the other.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: A は B ほど～ありません (A wa B hodo ～ arimasen)
        - source_id: hanabira
          level: N4
          item: A は B ほど～ない (A wa B hodo ~ nai)
    references:
      - source_id: hanabira
        ref: AはBほど～ない
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0306
    pattern: ～までに
    title: By (a deadline)
    meaning: 'Time + までに: "by (then)", "before (then)"; a one-time action happens at some point before the deadline.'
    when: "Use it for a deadline: 金曜日までにレポートを出してください, \"please hand in the report by Friday\". The action is done once, at any point up to that time. It can also follow a verb: 暗くなるまでに帰ります, \"I'll be home before it gets dark\"."
    why: まで is "until" and marks the end of a stretch of time; に marks a point where something happens. Together they say "at some point within the stretch up to X". That is why までに goes with one-time actions (出す, 帰る, 着く, 終わる). まで without に says an action lasts all the way to X (五時まで働く), so its verb is one that goes on.
    formation:
      - form: Noun (time) + までに
        note: 金曜日までに, 三時までに.
      - form: V (dictionary form) + までに
        note: 暗くなるまでに, 母が帰るまでに.
    examples:
      - japanese: 金曜日までにレポートを出してください。
        reading: きんようびまでにレポートをだしてください。
        romaji: kin'yōbi made ni repōto o dashite kudasai.
        english: Please hand in the report by Friday.
      - japanese: 暗くなるまでに帰ります。
        reading: くらくなるまでにかえります。
        romaji: kuraku naru made ni kaerimasu.
        english: I'll be home before it gets dark.
      - japanese: 三時までに駅に来てください。
        reading: さんじまでにえきにきてください。
        romaji: sanji made ni eki ni kite kudasai.
        english: Please come to the station by three.
    mistake:
      wrong: 五時までに働きます。
      problem: 働く goes on over time, and the speaker means it lasts until five. That is まで. までに is for a one-time action done before a deadline.
      right: 五時まで働きます。
    distinguish_from:
      - id: OJG-0305
        note: まで marks how long something goes on ("until"). までに marks a deadline for a one-time action ("by").
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～までに (〜made ni)
    references:
      - source_id: hanabira
        ref: ～までに
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0317
    pattern: そんなに～ない
    title: Not that (much), not so
    meaning: 'そんなに + negative: "not that (adjective)", "not so much"; tones down a degree the listener might expect.'
    when: "Use it to say something is less than might be thought: この料理はそんなに辛くないですよ, \"this dish isn't that spicy\". It is common in modest or reassuring answers: 「日本語が上手ですね。」「いいえ、そんなに上手じゃないです。」. Without a negative, そんなに means \"that much\", usually with surprise: そんなに食べたの？"
    why: 'そんな points at something near the listener or already mentioned: "that kind, to that degree". So そんなに～ない says "not to the degree you have in mind", measured against what the listener said or might expect. That is why it sits naturally in answers and reassurances. あまり～ない is a general "not very"; そんなに ties the degree to what was said or expected.'
    formation:
      - form: そんなに + negative
        note: い-adjective 辛くない; な-adjective 上手じゃない; verb 食べない.
    examples:
      - japanese: この料理はそんなに辛くないですよ。
        reading: このりょうりはそんなにからくないですよ。
        romaji: kono ryōri wa sonna ni karaku nai desu yo.
        english: This dish isn't that spicy.
      - japanese: 「日本語が上手ですね。」「いいえ、そんなに上手じゃないです。」
        reading: 「にほんごがじょうずですね。」「いいえ、そんなにじょうずじゃないです。」
        romaji: '"nihongo ga jōzu desu ne." "iie, sonna ni jōzu ja nai desu."'
        english: "\"Your Japanese is good.\" \"No, it's not that good.\""
      - japanese: 駅はここからそんなに遠くないです。
        reading: えきはここからそんなにとおくないです。
        romaji: eki wa koko kara sonna ni tōku nai desu.
        english: The station isn't that far from here.
    mistake:
      wrong: この本はそんなにおもしろいです。
      problem: Meant as "this book is so interesting". そんなに measures against the listener's idea and, in a statement, mostly goes with a negative. For "very", use とても.
      right: この本はとてもおもしろいです。
    distinguish_from:
      - id: OJG-0315
        note: あまり～ない is a general "not very". そんなに～ない is "not as much as you think", tied to what was said or expected.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: そんなに～ (sonna ni〜)
    references:
      - source_id: hanabira
        ref: そんなに～ない
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0325
    pattern: さしあげる／いただく／くださる
    title: Giving and receiving with respect
    meaning: "さしあげる (give, humble), いただく (receive, humble), くださる (give me, honorific): あげる, もらう, くれる towards superiors."
    when: 'Use them in place of あげる, もらう and くれる when the other person is someone you show respect to, such as a teacher, a customer or someone older: 先生に辞書をいただきました, "I received a dictionary from my teacher"; 社長がお土産をくださいました, "the company president gave me a souvenir".'
    why: "Each keeps the direction of its plain verb and adds respect. さしあげる and いただく are humble: they lower your own side, whether you are the giver or the receiver. くださる is honorific: it raises the superior who gives to you. So your own action takes the humble verb, and the superior's action takes the honorific one. くださる has an irregular ます-form, くださいます. いただく is also the humble verb for eating and drinking, as in いただきます."
    formation:
      - form: さしあげる
        note: Humble あげる. You or your side give to a superior.
      - form: いただく
        note: Humble もらう. You receive from a superior, marked with に or から.
      - form: くださる
        note: "Honorific くれる. A superior gives to you. Polite: くださいます, くださいました."
    examples:
      - japanese: 先生に辞書をいただきました。
        reading: せんせいにじしょをいただきました。
        romaji: sensei ni jisho o itadakimashita.
        english: I received a dictionary from my teacher.
      - japanese: 社長がお土産をくださいました。
        reading: しゃちょうがおみやげをくださいました。
        romaji: shachō ga omiyage o kudasaimashita.
        english: The company president gave me a souvenir.
      - japanese: 先生の誕生日に花をさしあげました。
        reading: せんせいのたんじょうびにはなをさしあげました。
        romaji: sensei no tanjōbi ni hana o sashiagemashita.
        english: I gave my teacher flowers for their birthday.
    mistake:
      wrong: 先生が本をいただきました。
      problem: Meant as "the teacher gave me a book". いただく is humble and describes your own receiving, so the teacher cannot be its subject. For the teacher's giving, use くださる.
      right: 先生が本をくださいました。
    distinguish_from:
      - id: OJG-0322
        note: あげる is the plain verb; さしあげる is its humble form for giving to a superior.
      - id: OJG-0323
        note: くれる is the plain verb; くださる is its honorific form for a superior giving to you.
      - id: OJG-0324
        note: もらう is the plain verb; いただく is its humble form for receiving from a superior.
    register:
      - polite
      - humble
      - honorific
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Nounをいただく (Noun wo itadaku)
        - source_id: hanabira
          level: N4
          item: Nounをくださる
        - source_id: hanabira
          level: N4
          item: Noun を さしあげる (Noun wo sashiageru)
    references:
      - source_id: hanabira
        ref: さしあげる／いただく／くださる
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: Handing a gift directly with さしあげます can sound as if the favour is being pointed out; the entry does not go into this. Is that worth a line?
  - id: OJG-0326
    pattern: ～てさしあげる／～ていただく／～てくださる
    title: Doing favours with respect
    meaning: "V-てさしあげる, V-ていただく, V-てくださる: てあげる, てもらう, てくれる when a superior gives or receives the favour."
    when: "Use ていただく and てくださる when someone above you does something for you: 先生に作文を直していただきました and 先生が作文を直してくださいました both mean the teacher corrected your essay, the first told from your side, the second from the teacher's. てさしあげる is for doing a favour for a superior, and is used with care."
    why: These are the respectful favour verbs, with the same directions as the plain ones. ていただく, the humble もらう, keeps you as the subject and marks the superior with に. てくださる, the honorific くれる, makes the superior the subject. ていただく is very common in polite speech, because it lets you acknowledge a kindness while humbly staying the subject. てさしあげる still announces that you did someone a favour, so to that person's face it can sound presumptuous, and speakers often choose another humble expression instead.
    formation:
      - form: V (て-form) + いただく
        note: The superior is marked with に. Polite いただきます.
      - form: V (て-form) + くださる
        note: The superior is the subject. Polite くださいます.
      - form: V (て-form) + さしあげる
        note: You do something for a superior. Used with care.
    examples:
      - japanese: 先生に作文を直していただきました。
        reading: せんせいにさくぶんをなおしていただきました。
        romaji: sensei ni sakubun o naoshite itadakimashita.
        english: My teacher kindly corrected my essay.
      - japanese: 部長が駅まで送ってくださいました。
        reading: ぶちょうがえきまでおくってくださいました。
        romaji: buchō ga eki made okutte kudasaimashita.
        english: My manager kindly took me to the station.
      - japanese: お客様に道を教えてさしあげました。
        reading: おきゃくさまにみちをおしえてさしあげました。
        romaji: okyakusama ni michi o oshiete sashiagemashita.
        english: I showed the customer the way.
        note: Reported to someone else. Said to the customer, it would sound as if the speaker were pointing out the favour.
    mistake:
      wrong: 私は先生に作文を直してくださいました。
      problem: てくださる makes the superior the subject. With 私は as subject and the teacher marked with に, the verb must be ていただく.
      right: 私は先生に作文を直していただきました。
    distinguish_from:
      - id: OJG-0055
        note: てあげる is the plain form of giving a favour; てさしあげる is its humble form.
      - id: OJG-0056
        note: てくれる is the plain form; てくださる is its honorific form.
      - id: OJG-0057
        note: てもらう is the plain form; ていただく is its humble form.
    register:
      - polite
      - humble
      - honorific
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb ていただく (〜te itadaku)
        - source_id: hanabira
          level: N4
          item: Verb て くださる (Verb-te kudasaru)
        - source_id: hanabira
          level: N4
          item: Verb て + さしあげる (Verb TE sashiageru)
    references:
      - source_id: hanabira
        ref: ～てさしあげる／～ていただく／～てくださる
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: Is the example with てさしあげる, reported to a third person, natural enough to keep, or better replaced?
  - id: OJG-0327
    pattern: ～てくれませんか／～てもらえませんか／～てくださいませんか
    title: Would you…? Could you…? (polite requests)
    meaning: "V-てくれませんか, V-てもらえませんか, V-てくださいませんか: polite requests, softer than てください."
    when: 'Use them to ask someone to do something politely: ちょっと手伝ってくれませんか, "could you give me a hand?". てくれませんか suits people you are on polite but familiar terms with; てもらえませんか is a little more modest; てくださいませんか is more polite, for superiors and strangers. The most polite everyday form is ていただけませんか (OJG-0058). Casual: てくれない？, てもらえない？'
    why: てください is polite, but it is still an instruction. These forms turn it into a negative question, which leaves the listener room to say no and so sounds softer. With くれる and くださる you ask "won't you give me V-ing?", with the listener as the one acting. もらえる is the potential form of もらう, so てもらえませんか asks "can't I receive V-ing?", from your own side. Asking about your receiving is less direct than asking the listener to act, which is why it feels more modest.
    formation:
      - form: V (て-form) + くれませんか
      - form: V (て-form) + もらえませんか
        note: The potential form もらえる, "can receive".
      - form: V (て-form) + くださいませんか
        note: てくれますか, てもらえますか and てくださいますか also occur and are a little more direct.
    examples:
      - japanese: ちょっと手伝ってくれませんか。
        reading: ちょっとてつだってくれませんか。
        romaji: chotto tetsudatte kuremasen ka.
        english: Could you give me a hand?
      - japanese: 写真を撮ってもらえませんか。
        reading: しゃしんをとってもらえませんか。
        romaji: shashin o totte moraemasen ka.
        english: Could you take a picture for me?
      - japanese: もう一度説明してくださいませんか。
        reading: もういちどせつめいしてくださいませんか。
        romaji: mō ichido setsumei shite kudasaimasen ka.
        english: Would you please explain it once more?
    mistake:
      wrong: 写真を撮ってもらいませんか。
      problem: The request needs the potential form もらえる, "can I receive". もらいませんか means "won't we receive?", which is not a request to the listener.
      right: 写真を撮ってもらえませんか。
    distinguish_from:
      - id: OJG-0014
        note: てください is a polite instruction. These negative questions ask, and leave room to refuse.
      - id: OJG-0058
        note: ていただけませんか is the most polite member of the same family.
    register:
      - polite
      - casual
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb て くださいませんか (Verb-te kudasaimasen ka)
        - source_id: hanabira
          level: N4
          item: Verb てくれませんか (〜te kuremasen ka)
        - source_id: hanabira
          level: N4
          item: Verb てもらえませんか (～te moraemasen ka)
    references:
      - source_id: hanabira
        ref: ～てくれませんか／～てもらえませんか／～てくださいませんか
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: The relative politeness of てくれませんか, てもらえませんか and てくださいませんか is given as a rough order; speakers and textbooks differ on it. Please check.
  - id: OJG-0328
    pattern: ～てほしい
    title: Wanting someone to do something
    meaning: "V-てほしい: \"I want (someone) to V\"; a wish about another person's action. Negative: ないでほしい."
    when: "Use it to say what you want someone else to do: 母に早く元気になってほしい, \"I want my mother to get well soon\". The person is marked with に. Negative: 行かないでほしい, \"I don't want you to go\". Said to someone, it works as an indirect request; towards a superior, ていただきたい is used instead."
    why: "ほしい is \"want (a thing)\". After a て-form, the thing wanted is another person's action. Because ほしい is your own feeling, the one who wants is the speaker, or the listener in a question, and the one who should act is someone else, marked with に as the person you want it from. たい cannot do this job: it is only for your own actions."
    formation:
      - form: (person に) V (て-form) + ほしい
        note: "Polite: ほしいです; softened: ほしいんですが."
      - form: (person に) V (ない-form) + でほしい
        note: 吸わないでほしい, 行かないでほしい.
    examples:
      - japanese: 母に早く元気になってほしいです。
        reading: ははにはやくげんきになってほしいです。
        romaji: haha ni hayaku genki ni natte hoshii desu.
        english: I want my mother to get well soon.
      - japanese: 大事な話なので、よく聞いてほしいです。
        reading: だいじなはなしなので、よくきいてほしいです。
        romaji: daiji na hanashi na node, yoku kiite hoshii desu.
        english: This is important, so I want you to listen carefully.
      - japanese: 部屋でたばこを吸わないでほしい。
        reading: へやでたばこをすわないでほしい。
        romaji: heya de tabako o suwanaide hoshii.
        english: I don't want you to smoke in the room.
    mistake:
      wrong: 私は友だちが来たいです。
      problem: たい is only for your own actions. To want someone else to act, use てほしい and mark the person with に.
      right: 私は友だちに来てほしいです。
    distinguish_from:
      - id: OJG-0046
        note: がほしい wants a thing. てほしい wants someone to do something.
      - id: OJG-0029
        note: たい wants to do something yourself. てほしい wants someone else to do it.
      - id: OJG-0329
        note: てもらいたい means much the same, and has a humble form, ていただきたい, for superiors.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb て ほしい (Verb-te hoshii)
    references:
      - source_id: hanabira
        ref: ～てほしい
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0329
    pattern: ～てもらいたい／～ていただきたい
    title: I'd like (someone) to do…
    meaning: "V-てもらいたい, V-ていただきたい (humble): \"I'd like (someone) to V\"; a wish, or a firm request, about someone's action."
    when: "Use it to say you want someone to do something for you, often as a polite but firm request: この書類を明日までに出していただきたいんですが. ていただきたい is the humble form, for superiors and customers; てもらいたい is for equals and people below you. Adding んですが or けど softens it."
    why: 'たい added to もらう, "receive", gives "want to receive". So てもらいたい is "want to receive V-ing from someone": the wish is about your own receiving, which is why たい can be used even though someone else acts. The one who acts is marked with に, as with てもらう. It means about the same as てほしい, but because it is built on a receiving verb, it has a humble form, ていただきたい, for polite situations. It still states your wish directly, so it can sound demanding without a softener.'
    formation:
      - form: (person に) V (て-form) + もらいたい
      - form: (person に) V (て-form) + いただきたい
        note: Humble. Often ていただきたいんですが.
    examples:
      - japanese: この書類を明日までに出していただきたいんですが。
        reading: このしょるいをあしたまでにだしていただきたいんですが。
        romaji: kono shorui o ashita made ni dashite itadakitai n desu ga.
        english: I'd like you to hand in this document by tomorrow, if you could.
      - japanese: 子どもにはもっと本を読んでもらいたいです。
        reading: こどもにはもっとほんをよんでもらいたいです。
        romaji: kodomo ni wa motto hon o yonde moraitai desu.
        english: I'd like my children to read more books.
      - japanese: 先生に私の作文を見ていただきたいです。
        reading: せんせいにわたしのさくぶんをみていただきたいです。
        romaji: sensei ni watashi no sakubun o mite itadakitai desu.
        english: I'd like my teacher to look at my essay.
    mistake:
      wrong: 先生が作文を見ていただきたいです。
      problem: ていただきたい is about your receiving, so the superior who acts is marked with に, not が.
      right: 先生に作文を見ていただきたいです。
    distinguish_from:
      - id: OJG-0328
        note: てほしい means much the same but has no humble form. てもらいたい／ていただきたい is built on a receiving verb.
      - id: OJG-0057
        note: てもらう reports a favour received. てもらいたい wants one.
    register:
      - polite
      - humble
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb ていただきたい (te itadakitai)
        - source_id: hanabira
          level: N4
          item: Verb てもらいたい (～te moraitai)
    references:
      - source_id: hanabira
        ref: ～てもらいたい／～ていただきたい
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0331
    pattern: ～と思う
    title: I think (that)…
    meaning: "Plain form + と思う: \"I think (that)…\"; presents a statement as the speaker's opinion or guess."
    when: 'Use it to give your opinion or a guess: 明日は雨が降ると思います, "I think it will rain tomorrow"; この映画はおもしろいと思います. For what someone else thinks, use と思っている: 兄は日本語は難しいと思っています. Japanese speakers also use it to soften statements.'
    why: "と marks what is thought, like quotation marks, and 思う is \"think\". So the part before と is a complete statement in plain form, with its own tense and negation, and a noun or な-adjective needs だ to make it complete (先生だと思う). 思う reports an inner process, so a plain と思う is the speaker's own thought (or the listener's, in a question); another person's opinion is reported with と思っている. For a negative opinion, Japanese usually makes the content negative: 来ないと思う, \"I don't think he'll come\"."
    formation:
      - form: Verb / い-adjective (plain form) + と思う
        note: 降ると思う, 降らないと思う, おもしろいと思う.
      - form: Noun / な-adjective + だ + と思う
        note: 先生だと思う, 静かだと思う.
      - form: … と思っている
        note: An opinion someone holds, often someone else's.
    examples:
      - japanese: 明日は雨が降ると思います。
        reading: あしたはあめがふるとおもいます。
        romaji: ashita wa ame ga furu to omoimasu.
        english: I think it'll rain tomorrow.
      - japanese: この映画はとてもおもしろいと思います。
        reading: このえいがはとてもおもしろいとおもいます。
        romaji: kono eiga wa totemo omoshiroi to omoimasu.
        english: I think this film is really good.
      - japanese: 田中さんは今日来ないと思います。
        reading: たなかさんはきょうこないとおもいます。
        romaji: tanaka-san wa kyō konai to omoimasu.
        english: I don't think Tanaka-san is coming today.
      - japanese: 兄は、日本語は難しいと思っています。
        reading: あには、にほんごはむずかしいとおもっています。
        romaji: ani wa, nihongo wa muzukashii to omotte imasu.
        english: My older brother thinks Japanese is difficult.
    mistake:
      wrong: あの人は先生と思います。
      problem: A noun before と思う needs だ, because what is thought has to be a complete statement.
      right: あの人は先生だと思います。
    distinguish_from:
      - id: OJG-0339
        note: ようと思う, with the volitional form, is "I'm thinking of doing". と思う after an ordinary plain form gives an opinion or guess.
      - id: OJG-0038
        note: でしょう is a guess stated by itself. と思う frames it explicitly as your own thought.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～と思う (〜to omou)
    references:
      - source_id: hanabira
        ref: ～と思う
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0332
    pattern: ～なければならない／～なくてはいけない／～ないといけない
    title: Must, have to
    meaning: 'V-なければならない／V-なくてはいけない／V-ないといけない: "must V", "have to V".'
    when: 'Use these to say something is necessary: 明日は六時に起きなければなりません, "I have to get up at six tomorrow". なければならない is the most formal and the usual choice in writing; ないといけない and なくてはいけない are common in speech. In casual speech they shrink to なきゃ and なくちゃ (OJG-0037).'
    why: "All three say \"if you don't V, it won't do\". The first half (なければ, なくては, ないと) sets up \"not doing V\", and ならない or いけない says that is not acceptable. Two negatives make \"must\". ならない tends to sound like a general or objective necessity, and いけない more like a personal or situational one, but in everyday speech they overlap a great deal. All are built on the ない-form: 行かない → 行かなければ, 行かなくては, 行かないと."
    formation:
      - form: V (ない-form, drop い) + ければならない
        note: 起きなければならない. Polite なりません.
      - form: V (ない-form, drop い) + くてはいけない
        note: 返さなくてはいけない. Polite いけません.
      - form: V (ない-form) + といけない
        note: しないといけない. Polite いけません.
    examples:
      - japanese: 明日は六時に起きなければなりません。
        reading: あしたはろくじにおきなければなりません。
        romaji: ashita wa rokuji ni okinakereba narimasen.
        english: Tomorrow I have to get up at six.
      - japanese: 今日は宿題をしないといけません。
        reading: きょうはしゅくだいをしないといけません。
        romaji: kyō wa shukudai o shinai to ikemasen.
        english: I have to do my homework today.
      - japanese: 図書館の本を返さなくてはいけません。
        reading: としょかんのほんをかえさなくてはいけません。
        romaji: toshokan no hon o kaesanakute wa ikemasen.
        english: I have to return the library books.
    mistake:
      wrong: 毎日この薬を飲んではいけません。
      problem: Meant as "you must take this medicine every day". てはいけない means "must not". "Must" is the double negative.
      right: 毎日この薬を飲まなければなりません。
    distinguish_from:
      - id: OJG-0037
        note: なくちゃいけない and なきゃ are the casual spoken contractions of the same point.
      - id: OJG-0067
        note: なくてもいい says you don't have to.
      - id: OJG-0016
        note: てはいけない says you must not.
    register:
      - plain
      - polite
      - written
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～ないといけない (〜nai to ikenai)
        - source_id: hanabira
          level: N4
          item: ～なくてはいけない (〜nakute wa ikenai)
        - source_id: hanabira
          level: N4
          item: ～なければ ならない (〜nakereba naranai)
    references:
      - source_id: hanabira
        ref: ～なければならない／～なくてはいけない／～ないといけない
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: Overlaps OJG-0037 (N5, the casual contractions of the same obligation). A candidate to merge, or to keep as the formal and casual halves.
  - id: OJG-0334
    pattern: ～とか～とか
    title: Things like A and B (examples, in conversation)
    meaning: 'A とか B (とか): "things like A and B", "A, B and so on"; gives examples from a larger set. Conversational.'
    when: 'Use it in conversation to give a few examples: 休みの日は、映画とか買い物とかに行きます, "on days off I go to films, go shopping and so on". Unlike や, it can join verbs and whole clauses: 掃除するとか、洗濯するとか. A single とか makes a suggestion vague and gentle: お茶とか飲みませんか, "how about some tea or something?".'
    why: 'とか is built from と, which quotes, and か, which marks uncertainty: "things such as…, or something". So it names examples without claiming the list is complete, like や, but more loosely: it can follow nouns, verbs and clauses, and a single とか leaves the suggestion open. Because it is loose and conversational, や (with など) is the usual choice for listing nouns in writing and formal speech.'
    formation:
      - form: Noun とか noun (とか)
        note: The second とか is often kept before a particle (映画とか買い物とかに), and may be dropped.
      - form: Verb (plain form) とか verb とか
        note: 掃除するとか、洗濯するとか.
    examples:
      - japanese: 休みの日は、映画とか買い物とかに行きます。
        reading: やすみのひは、えいがとかかいものとかにいきます。
        romaji: yasumi no hi wa, eiga toka kaimono toka ni ikimasu.
        english: On my days off I go to films, go shopping and so on.
      - japanese: 週末は、掃除するとか、洗濯するとか、家のことをします。
        reading: しゅうまつは、そうじするとか、せんたくするとか、いえのことをします。
        romaji: shūmatsu wa, sōji suru toka, sentaku suru toka, ie no koto o shimasu.
        english: At weekends I do things around the house, like cleaning and laundry.
      - japanese: 疲れたら、お茶とか飲みませんか。
        reading: つかれたら、おちゃとかのみませんか。
        romaji: tsukaretara, ocha toka nomimasen ka.
        english: If you get tired, how about some tea or something?
    mistake:
      wrong: 日本には東京とか大阪とかの大きい町があります。
      problem: Written in a formal report. とか is conversational; in writing and formal speech, noun examples are listed with や and など.
      right: 日本には東京や大阪などの大きい町があります。
    distinguish_from:
      - id: OJG-0032
        note: や lists nouns only and suits writing. とか also joins verbs and clauses, and is conversational.
    register:
      - casual
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: A とか B とか
    references:
      - source_id: hanabira
        ref: ～とか～とか
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0335
    pattern: N + 中
    title: In the middle of (an activity)
    meaning: 'Noun + 中 (ちゅう): "in the middle of N", "now doing N", as in 会議中, "in a meeting", or 工事中, "under construction".'
    when: 'Use it after a noun that names an activity to say it is going on now: 会議中, "in a meeting"; 電話中, "on the phone"; 授業中, "during class"; 工事中, "under construction". It is very common on signs and in short statements: 田中は今、会議中です.'
    why: 中 means "middle, inside". After a noun of activity, read ちゅう, it says someone or something is inside that activity, partway through it. It works with nouns, most often Sino-Japanese nouns for activities (会議, 食事, 勉強, 工事), and the result is itself a noun, used with です or with の before another noun (授業中の教室). It is not added to verbs; for "in the middle of doing" with a verb, use ているところ. The same kanji read じゅう after a period or a place means "throughout" (一日中, "all day"; 世界中, "all over the world"), which is a different use.
    formation:
      - form: Noun (activity) + 中 (ちゅう)
        note: 会議中, 電話中, 食事中, 工事中, 営業中. Used with です, or with の before a noun.
    examples:
      - japanese: 田中は今、会議中です。
        reading: たなかはいま、かいぎちゅうです。
        romaji: tanaka wa ima, kaigichū desu.
        english: Tanaka is in a meeting right now.
        note: Said of a colleague to someone outside the company, so without さん.
      - japanese: 父は電話中なので、少し待ってください。
        reading: ちちはでんわちゅうなので、すこしまってください。
        romaji: chichi wa denwachū na node, sukoshi matte kudasai.
        english: My father is on the phone, so please wait a moment.
      - japanese: 授業中は、スマホを使わないでください。
        reading: じゅぎょうちゅうは、スマホをつかわないでください。
        romaji: jugyōchū wa, sumaho o tsukawanaide kudasai.
        english: Please don't use your phone during class.
      - japanese: この道は工事中です。
        reading: このみちはこうじちゅうです。
        romaji: kono michi wa kōjichū desu.
        english: This road is under construction.
    mistake:
      wrong: 今、食べる中です。
      problem: 中 follows a noun of activity, not a verb. Use the noun 食事, or a verb with ているところ.
      right: 今、食事中です。
    distinguish_from:
      - id: OJG-0336
        note: ているところ says the same with a verb (食べているところ). 中 needs a noun (食事中).
    register:
      - plain
      - polite
      - written
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Noun + 中 (Noun + ちゅう)
    references:
      - source_id: hanabira
        ref: N + 中
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0336
    pattern: ～ところ
    title: About to, in the middle of, just done
    meaning: "V + ところ: a stage of an action; about to (V-るところ), in the middle of (V-ているところ), or just done (V-たところ)."
    when: "Use it to say exactly where you are in an action: 今から出かけるところです, \"I'm just about to go out\"; 今、晩ご飯を作っているところです, \"I'm in the middle of making dinner\"; 今、駅に着いたところです, \"I've just got to the station\". It is common when explaining why you cannot do something right now."
    why: 'ところ means "place", here a place in time: a point in the course of an action. The verb form before it chooses the point: the dictionary form looks ahead (about to), ている is inside the action (in the middle of it), and た is just after it (just done). ところ is a noun, so it is followed by です or だ. たところ is about the moment right after an action, so it goes with 今 or さっき, not with something long ago.'
    formation:
      - form: V (dictionary form) + ところ
        note: About to.
      - form: V (ている) + ところ
        note: In the middle of.
      - form: V (た-form) + ところ
        note: Just done.
    examples:
      - japanese: 今から出かけるところです。
        reading: いまからでかけるところです。
        romaji: ima kara dekakeru tokoro desu.
        english: I'm just about to go out.
      - japanese: 今、晩ご飯を作っているところです。
        reading: いま、ばんごはんをつくっているところです。
        romaji: ima, bangohan o tsukutte iru tokoro desu.
        english: I'm in the middle of making dinner.
      - japanese: 今、駅に着いたところです。
        reading: いま、えきについたところです。
        romaji: ima, eki ni tsuita tokoro desu.
        english: I've just got to the station.
    mistake:
      wrong: 去年日本に来たところです。
      problem: たところ is for the moment just after an action, and last year is not that. For something that feels recent from the speaker's point of view, use たばかり.
      right: 去年日本に来たばかりです。
    distinguish_from:
      - id: OJG-0091
        note: たばかり says something happened recently, as the speaker feels it, and can reach back months. たところ is the moment right after.
      - id: OJG-0335
        note: Noun + 中 says "in the middle of" with a noun (食事中). ているところ says it with a verb.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb た ところ (Verb ta tokoro)
        - source_id: hanabira
          level: N4
          item: Verb て いる ところ (Verb te iru tokoro)
        - source_id: hanabira
          level: N4
          item: Verb る ところ (Verb-ru tokoro)
    references:
      - source_id: hanabira
        ref: ～ところ
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0337
    pattern: ～ていく／～てくる
    title: Going and coming, in space and in time
    meaning: "V-ていく／V-てくる: do V and go / come; also change moving on from now (ていく) or up to now (てくる)."
    when: "Use them first for movement: 傘を持っていく, \"take an umbrella (with you)\"; パンを買ってくる, \"go and buy bread (and come back)\". Then for change over time: これからもっと寒くなっていく, \"it will keep getting colder\"; 日本語がわかってきた, \"I've begun to understand Japanese\". てくる also marks something starting to come towards you: 雨が降ってきた, \"it's started to rain\"."
    why: 'いく and くる are "go" and "come", pointing away from the speaker and towards the speaker. After the て-form, they add that direction to the action. In space, 持っていく is "hold it and go (away)" and 持ってくる is "hold it and come (here)". The same picture works for time, with "now" as where the speaker stands: ていく is change going forward from now, and てくる is change that has come up to now, or is just beginning to show. As helpers, いく and くる are usually written in kana.'
    formation:
      - form: V (て-form) + いく
        note: "Polite: ていきます. Casual: てく (持ってく)."
      - form: V (て-form) + くる
        note: "Polite: てきます."
    examples:
      - japanese: 雨が降りそうだから、傘を持っていきます。
        reading: あめがふりそうだから、かさをもっていきます。
        romaji: ame ga furisō da kara, kasa o motte ikimasu.
        english: It looks like rain, so I'll take an umbrella.
      - japanese: ちょっとパンを買ってきます。
        reading: ちょっとパンをかってきます。
        romaji: chotto pan o katte kimasu.
        english: I'll just pop out and buy some bread.
        note: Go, do V, and come back.
      - japanese: だんだん日本語がわかってきました。
        reading: だんだんにほんごがわかってきました。
        romaji: dandan nihongo ga wakatte kimashita.
        english: I've gradually started to understand Japanese.
      - japanese: これからもっと寒くなっていくでしょう。
        reading: これからもっとさむくなっていくでしょう。
        romaji: kore kara motto samuku natte iku deshō.
        english: It will probably keep getting colder from now on.
    mistake:
      wrong: 学校にお弁当を持ってきます。
      problem: Said at home in the morning. The lunch is going away from where the speaker is, so it is ていく. てくる would mean bringing it here.
      right: 学校にお弁当を持っていきます。
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb て いく (Verb-te iku)
        - source_id: hanabira
          level: N4
          item: Verb て くる (Verb te kuru)
    references:
      - source_id: hanabira
        ref: ～ていく／～てくる
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0338
    pattern: ～ことがある
    title: Sometimes; there are times when
    meaning: "V (dictionary or ない-form) + ことがある: \"sometimes V\", \"there are times when (I don't) V\"."
    when: "Use it for something that happens now and then, not regularly: 忙しいときは、朝ご飯を食べないことがあります, \"when I'm busy, I sometimes skip breakfast\"; この電車はときどき遅れることがあります. Do not confuse it with たことがある, which is about experience."
    why: こと turns the verb into a noun, "the case of V-ing", and がある says such cases exist. With a non-past verb, "there are occasions when V" means "sometimes". With a past verb, たことがある, the thing that exists is a past event, so it means "have done it before". The verb form decides the meaning. It often comes with ときどき or たまに.
    formation:
      - form: V (dictionary form) + ことがある
        note: 遅れることがある. Polite ことがあります.
      - form: V (ない-form) + ことがある
        note: 食べないことがある, "sometimes I don't eat".
    examples:
      - japanese: 忙しいときは、朝ご飯を食べないことがあります。
        reading: いそがしいときは、あさごはんをたべないことがあります。
        romaji: isogashii toki wa, asagohan o tabenai koto ga arimasu.
        english: When I'm busy, I sometimes skip breakfast.
      - japanese: この電車は、ときどき遅れることがあります。
        reading: このでんしゃは、ときどきおくれることがあります。
        romaji: kono densha wa, tokidoki okureru koto ga arimasu.
        english: This train is sometimes late.
      - japanese: 週末は、友だちと料理をすることがあります。
        reading: しゅうまつは、ともだちとりょうりをすることがあります。
        romaji: shūmatsu wa, tomodachi to ryōri o suru koto ga arimasu.
        english: At weekends I sometimes cook with friends.
    mistake:
      wrong: 富士山に登ることがあります。
      problem: Meant as "I have climbed Mount Fuji". The dictionary form gives "sometimes"; for experience, the verb must be past.
      right: 富士山に登ったことがあります。
    distinguish_from:
      - id: OJG-0031
        note: たことがある, with a past verb, is experience ("have done it"). ことがある with a non-past verb is "sometimes".
    register:
      - plain
