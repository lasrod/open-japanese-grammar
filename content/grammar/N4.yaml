  - id: OJG-0339
    pattern: ～ようと思う
    title: I'm thinking of doing…
    meaning: "Volitional + と思う: \"I'm thinking of V-ing\", \"I intend to V\"; an intention the speaker has formed."
    when: "Use it to tell someone what you intend to do: 夏休みに国へ帰ろうと思います, \"I'm thinking of going home for the summer holidays\". と思っている suggests an intention you have held for some time: 来年、日本語の試験を受けようと思っています."
    why: "The volitional form (帰ろう) is the speaker's will, \"I'll go home\", and と思う frames it as a thought: \"I think, 'I'll go home'\". So it reports an intention instead of declaring a decision on the spot, which sounds gentler than a bare statement. と思っている stretches the thought over time, as an intention that has been held for a while, and can also report someone else's intention: 兄は車を買おうと思っています."
    formation:
      - form: V (volitional) + と思う
        note: 帰ろうと思う, 受けようと思う, しようと思う.
      - form: V (volitional) + と思っている
        note: An intention held for some time, or someone else's.
    examples:
      - japanese: 夏休みに国へ帰ろうと思います。
        reading: なつやすみにくにへかえろうとおもいます。
        romaji: natsuyasumi ni kuni e kaerō to omoimasu.
        english: I'm thinking of going back to my country for the summer holidays.
      - japanese: 来年、日本語の試験を受けようと思っています。
        reading: らいねん、にほんごのしけんをうけようとおもっています。
        romaji: rainen, nihongo no shiken o ukeyō to omotte imasu.
        english: I'm planning to take a Japanese exam next year.
      - japanese: 今晩は早く寝ようと思います。
        reading: こんばんははやくねようとおもいます。
        romaji: konban wa hayaku neyō to omoimasu.
        english: I think I'll go to bed early tonight.
    mistake:
      wrong: 夏休みに国へ帰ると思います。
      problem: Meant as an intention. The dictionary form + と思う is a prediction, "I think I'll (probably) go home". For your own intention, use the volitional form.
      right: 夏休みに国へ帰ろうと思います。
    distinguish_from:
      - id: OJG-0053
        note: The volitional form on its own declares a decision or invites. With と思う it reports an intention.
      - id: OJG-0027
        note: つもり is a firm plan. ようと思う is an intention you are thinking about, often less settled.
      - id: OJG-0331
        note: と思う after an ordinary plain form gives an opinion or prediction, not an intention.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb ようと思う (Verb-you to omou)
    references:
      - source_id: hanabira
        ref: ～ようと思う
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0340
    pattern: ～ように言う
    title: Tell someone to do something (reported)
    meaning: 'V (dictionary or ない-form) + ように言う: "tell (someone) to V / not to V"; reports an instruction or request.'
    when: 'Use it to report what someone told someone to do: 先生は学生に、宿題を出すように言いました, "the teacher told the students to hand in their homework". With a negative verb: "not to". Other verbs of passing on work the same way: ように頼む, "ask to"; ように伝える, "pass on (the message) to".'
    why: 'ように is "so that, in such a way that": the verb before it is the aim. ように言う is "say, so that someone will V", the content of an instruction reported in plain form instead of quoted. It passes the instruction on without its exact words or politeness: 出してください becomes 出すように. The person told is marked with に. To quote the exact words, use 「…てください」と言いました.'
    formation:
      - form: (person に) V (dictionary form) + ように言う
        note: 出すように言った. Also ように頼む, ように伝える.
      - form: (person に) V (ない-form) + ように言う
        note: '飲まないように言った. Passive, "was told to": ように言われた.'
    examples:
      - japanese: 先生は学生に、宿題を出すように言いました。
        reading: せんせいはがくせいに、しゅくだいをだすようにいいました。
        romaji: sensei wa gakusei ni, shukudai o dasu yō ni iimashita.
        english: The teacher told the students to hand in their homework.
      - japanese: 医者にお酒を飲まないように言われました。
        reading: いしゃにおさけをのまないようにいわれました。
        romaji: isha ni osake o nomanai yō ni iwaremashita.
        english: The doctor told me not to drink alcohol.
      - japanese: 田中さんに、あとで電話するように伝えてください。
        reading: たなかさんに、あとででんわするようにつたえてください。
        romaji: tanaka-san ni, ato de denwa suru yō ni tsutaete kudasai.
        english: Please tell Tanaka-san to call later.
    mistake:
      wrong: 先生は私に、宿題を出してくださいように言いました。
      problem: ように takes the plain form of the verb. The instruction is reported, not quoted, so てください drops out.
      right: 先生は私に、宿題を出すように言いました。
    distinguish_from:
      - id: OJG-0088
        note: のように compares or points to a manner (魚のように). ように言う reports an instruction.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb ように言う (Verb-you ni iu)
    references:
      - source_id: hanabira
        ref: ～ように言う
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0341
    pattern: ～出す
    title: Suddenly start to
    meaning: 'V (ます-stem) + 出す: "start to V", usually suddenly or unexpectedly; in some compounds, literally "out".'
    when: 'Use it for an action or event that starts suddenly or without warning: 急に雨が降り出しました, "it suddenly started to rain"; 赤ちゃんが泣き出しました, "the baby burst into tears". In some compound verbs 出す keeps its meaning "out": 取り出す, "take out"; 思い出す, "recall".'
    why: "出す means \"put out, let out\". Joined to a ます-stem, it presents the action as breaking out into the open, which is why starts made with 出す often feel sudden or beyond anyone's control: 泣き出す, 笑い出す, 降り出す. It is not the verb for a planned start, such as starting a study plan; that is 始める. The compound is a godan verb (降り出す, 降り出した)."
    formation:
      - form: V (ます-stem) + 出す
        note: 降り出す, 泣き出す, 走り出す, 笑い出す.
    examples:
      - japanese: 急に雨が降り出しました。
        reading: きゅうにあめがふりだしました。
        romaji: kyū ni ame ga furidashimashita.
        english: It suddenly started to rain.
      - japanese: 赤ちゃんが泣き出しました。
        reading: あかちゃんがなきだしました。
        romaji: akachan ga nakidashimashita.
        english: The baby burst into tears.
      - japanese: 犬は私を見ると、走り出しました。
        reading: いぬはわたしをみると、はしりだしました。
        romaji: inu wa watashi o miru to, hashiridashimashita.
        english: When the dog saw me, it started running.
    mistake:
      wrong: 来月から日本語を勉強し出します。
      problem: This is a planned start. 出す suits starts that break out suddenly; for a planned one, use 始める.
      right: 来月から日本語を勉強し始めます。
    distinguish_from:
      - id: OJG-0138
        note: 始める is a neutral "begin", including planned starts. 出す is a sudden or unexpected start.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb 出す (~dasu)
    references:
      - source_id: hanabira
        ref: ～出す
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0342
    pattern: ～終わる
    title: Finish doing
    meaning: 'V (ます-stem) + 終わる: "finish V-ing"; the action is carried through to its end.'
    when: "Use it to say an action has been completed: やっと本を読み終わりました, \"I've finally finished reading the book\"; 食べ終わったら、お皿を洗ってください. It fits actions with a natural end: reading a book, eating a meal, writing a report."
    why: '終わる means "come to an end". Joined to a ます-stem, it says the action reached its end: 読み終わる is "read to the end". Because there has to be an end to reach, it goes with actions that have one (a book, a meal, a letter), and not with open-ended ones such as 待つ. The object of the first verb keeps を: 本を読み終わる. In writing, 終える is also used (読み終える).'
    formation:
      - form: V (ます-stem) + 終わる
        note: 読み終わる, 食べ終わる, 書き終わる. Written style also 終える.
    examples:
      - japanese: やっと本を読み終わりました。
        reading: やっとほんをよみおわりました。
        romaji: yatto hon o yomiowarimashita.
        english: I've finally finished reading the book.
      - japanese: 食べ終わったら、お皿を洗ってください。
        reading: たべおわったら、おさらをあらってください。
        romaji: tabeowattara, osara o aratte kudasai.
        english: When you've finished eating, please wash the plates.
      - japanese: レポートはもう書き終わりましたか。
        reading: レポートはもうかきおわりましたか。
        romaji: repōto wa mō kakiowarimashita ka.
        english: Have you finished writing the report yet?
    mistake:
      wrong: 本を読むのが終わりました。
      problem: Understandable but clumsy. Japanese joins 終わる to the ます-stem to make one verb.
      right: 本を読み終わりました。
    distinguish_from:
      - id: OJG-0343
        note: 続ける says the action keeps going. 終わる says it reached its end.
      - id: OJG-0069
        note: てしまう can also mean "finish completely", but often adds regret. 終わる simply reports the end.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb 終わる (〜owaru)
    references:
      - source_id: hanabira
        ref: ～終わる
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0343
    pattern: ～続ける
    title: Keep on doing
    meaning: 'V (ます-stem) + 続ける: "keep V-ing", "continue to V"; the action goes on without stopping.'
    when: 'Use it for an action that goes on, often longer than expected or in spite of something: 三時間歩き続けました, "I kept walking for three hours". For things that happen by themselves, such as rain, 続く is also used: 雨が降り続いています.'
    why: '続ける is "continue (something)". Joined to a ます-stem, it says the action keeps going. It is an ichidan verb (続けます, 続けて). Because it is about going on, it fits actions that can last or repeat (歩く, 待つ, 話す), not one-moment ones such as 着く. With natural events, where nobody is doing the continuing, the intransitive 続く is common: 降り続く. For a する-verb, the stem is し: 勉強し続ける.'
    formation:
      - form: V (ます-stem) + 続ける
        note: 歩き続ける, 待ち続ける, 話し続ける, 勉強し続ける.
      - form: V (ます-stem) + 続く
        note: For natural events such as rain (降り続く).
    examples:
      - japanese: 駅から三時間歩き続けました。
        reading: えきからさんじかんあるきつづけました。
        romaji: eki kara sanjikan arukitsuzukemashita.
        english: I kept walking for three hours from the station.
      - japanese: 彼は一時間話し続けました。
        reading: かれはいちじかんはなしつづけました。
        romaji: kare wa ichijikan hanashitsuzukemashita.
        english: He kept talking for an hour.
      - japanese: 雨が一週間降り続いています。
        reading: あめがいっしゅうかんふりつづいています。
        romaji: ame ga isshūkan furitsuzuite imasu.
        english: It has been raining non-stop for a week.
    mistake:
      wrong: 毎日日本語を勉強続けています。
      problem: 続ける joins the ます-stem, and for a する-verb that is し.
      right: 毎日日本語を勉強し続けています。
    distinguish_from:
      - id: OJG-0342
        note: 終わる says the action reached its end. 続ける says it keeps going.
      - id: OJG-0018
        note: ている says an action is under way. 続ける stresses that it goes on and on.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb + 続ける (つづける, tsuzukeru)
    references:
      - source_id: hanabira
        ref: ～続ける
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0344
    pattern: ～方
    title: How to do, the way of doing
    meaning: 'V (ます-stem) + 方 (かた): "the way of V-ing", "how to V"; makes a noun.'
    when: 'Use it to talk about how something is done: この漢字の読み方, "how to read this kanji"; この機械の使い方を教えてください, "please show me how to use this machine". Common ones are 作り方, "recipe, how to make"; 行き方, "how to get there"; and 書き方.'
    why: "方, read かた, means \"way, manner\". Joined to a ます-stem, it makes a noun: 読み方 is \"way of reading\". Because the result is a noun, the verb's を-object cannot stay with を; it joins the noun with の instead: 漢字を読む → 漢字の読み方. Other particles are kept and take の: 駅までの行き方. For a する-verb, し + 方 is 仕方 (しかた): 勉強の仕方. The same kanji read ほう is a different word, \"side, direction\", as in ほうがいい."
    formation:
      - form: V (ます-stem) + 方
        note: The を-object becomes Noun + の. Other particles add の (までの, への).
      - form: Noun + の + 仕方
        note: "For する-verbs: 勉強の仕方."
    examples:
      - japanese: この漢字の読み方を教えてください。
        reading: このかんじのよみかたをおしえてください。
        romaji: kono kanji no yomikata o oshiete kudasai.
        english: Please tell me how to read this kanji.
      - japanese: 駅までの行き方がわかりません。
        reading: えきまでのいきかたがわかりません。
        romaji: eki made no ikikata ga wakarimasen.
        english: I don't know how to get to the station.
      - japanese: 母にカレーの作り方を習いました。
        reading: ははにカレーのつくりかたをならいました。
        romaji: haha ni karē no tsukurikata o naraimashita.
        english: I learned how to make curry from my mother.
    mistake:
      wrong: この機械を使い方を教えてください。
      problem: 使い方 is a noun, so the verb's object joins it with の. The を belongs to 教えて.
      right: この機械の使い方を教えてください。
    distinguish_from:
      - id: OJG-0035
        note: 方 read ほう, as in ほうがいい, is a different word ("side, direction"). 方 read かた after a ます-stem is "way of doing".
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb 方 (〜hou)
    references:
      - source_id: hanabira
        ref: ～方
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0345
    pattern: ～かな／～かしら
    title: I wonder…
    meaning: 'Plain form + かな／かしら: "I wonder (if)…"; the speaker wonders aloud or to themselves. Casual.'
    when: "Use it when you wonder about something, half to yourself: 明日は晴れるかな, \"I wonder if it'll be sunny tomorrow\". It invites a response without asking directly. かな is used by everyone; かしら is traditionally women's speech and now sounds refined or a little old-fashioned. With a negative, it turns into a wish: バス、早く来ないかな, \"I wish the bus would hurry up\"."
    why: "か marks a question, and な (or しら) turns it inwards: instead of asking the listener, the speaker asks themselves. That is why it is softer than a question and fits talking to yourself. It is plain and casual, so in polite speech people use でしょうか, or wrap it: …かなと思います. A noun or な-adjective goes straight before it, without だ: 本当かな."
    formation:
      - form: Verb / い-adjective (plain form) + かな／かしら
        note: 晴れるかな, 開いているかな, おいしいかな.
      - form: Noun / な-adjective + かな／かしら
        note: "No だ: 本当かな, 誰かしら."
      - form: V (ない-form) + かな
        note: A wish that something would happen (早く来ないかな).
    examples:
      - japanese: 明日は晴れるかな。
        reading: あしたははれるかな。
        romaji: ashita wa hareru ka na.
        english: I wonder if it'll be sunny tomorrow.
      - japanese: この店、まだ開いているかな。
        reading: このみせ、まだあいているかな。
        romaji: kono mise, mada aite iru ka na.
        english: I wonder if this shop is still open.
      - japanese: バス、早く来ないかな。
        reading: バス、はやくこないかな。
        romaji: basu, hayaku konai ka na.
        english: I wish the bus would hurry up and come.
      - japanese: あの人、誰かしら。
        reading: あのひと、だれかしら。
        romaji: ano hito, dare kashira.
        english: I wonder who that is.
    mistake:
      wrong: お客様、こちらでよろしいかな。
      problem: かな is casual, for talking to yourself or to friends. To a customer, ask politely with でしょうか.
      right: お客様、こちらでよろしいでしょうか。
    distinguish_from:
      - id: OJG-0038
        note: でしょう guesses and でしょうか asks politely. かな wonders, casually and half to yourself.
    register:
      - casual
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～かしら (〜kashira)
        - source_id: hanabira
          level: N4
          item: ～かなあ (〜kanaa)
    references:
      - source_id: hanabira
        ref: ～かな／～かしら
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0346
    pattern: ～させてください
    title: Please let me…
    meaning: 'Causative て-form + ください: "please let me V"; asks permission to do something yourself, often as a polite offer.'
    when: 'Use it to ask to be allowed to do something: 少し考えさせてください, "please let me think about it for a while"; 今日は私に払わせてください, "please let me pay today". It is also a polite way to say what you would like to do: 明日は休ませてください. More polite: させていただけませんか.'
    why: 'The causative (させる) is "make or let someone do", and てください asks the listener to do something. So させてください is "please let (me) do V": the listener is asked to be the one who allows, and the speaker is the one who acts. The speaker is usually left out, or marked with に (私に払わせてください). Because it asks permission, it sounds modest even when you are offering to do something for the listener. Casual: させて.'
    formation:
      - form: V (causative て-form) + ください
        note: 考えさせてください, 払わせてください, 休ませてください; する → させてください.
    examples:
      - japanese: 少し考えさせてください。
        reading: すこしかんがえさせてください。
        romaji: sukoshi kangaesasete kudasai.
        english: Please let me think about it for a while.
      - japanese: 今日は私に払わせてください。
        reading: きょうはわたしにはらわせてください。
        romaji: kyō wa watashi ni harawasete kudasai.
        english: Please let me pay today.
      - japanese: 明日は休ませてください。
        reading: あしたはやすませてください。
        romaji: ashita wa yasumasete kudasai.
        english: Please let me take tomorrow off.
    mistake:
      wrong: 今日は私に払ってください。
      problem: Meant as "let me pay". てください asks the listener to do the paying, so this says "please pay me". To ask to be allowed to pay yourself, use the causative.
      right: 今日は私に払わせてください。
    distinguish_from:
      - id: OJG-0062
        note: させる is the causative in general. させてください uses it to ask permission for yourself.
      - id: OJG-0015
        note: てもいいですか asks whether something is allowed. させてください asks the listener to let you, and so leans more towards a request.
    register:
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
