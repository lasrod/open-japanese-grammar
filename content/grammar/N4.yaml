# Open Japanese Grammar: points commonly listed at N4.
# See CONTRIBUTING.md before editing.

schema_version: 0.1.0
level: N4
entries:
  - id: OJG-0041
    pattern: ～し
    title: Giving reasons, and there may be more
    meaning: "Plain form + し: lines up reasons or points, often towards a conclusion; a single し can hint that there are others."
    when: "Use it to list reasons or features that add up to a conclusion: この店は安いし、おいしいし、よく来ます, \"this shop is cheap, and it's good, so I come often\". A single し gives one reason and often suggests it is not the only one. When the conclusion is obvious, it can be left unsaid: 今日は忙しいし… can be a gentle way of saying no."
    why: し adds a point to a pile. Each clause before it is a complete statement, so it keeps its own tense and negation (高いし, 高くないし, 雨だったし). For an affirmative non-past noun or な-adjective, that means keeping だ (静かだし, 学生だし); in polite speech, です can take its place. Because the points are piled up towards one conclusion, they usually point the same way. A single し often suggests there are other reasons too, and so can sound softer than から, though that depends on the context. から presents the cause; し offers supporting points.
    formation:
      - form: Verb / い-adjective (plain form) + し
        note: "行くし, 行かないし, 行ったし; 高いし, 高くないし. In polite speech, polite forms also occur before し: 行きますし."
      - form: Noun / な-adjective + copula + し
        note: 学生だし, 静かだし; polite 学生ですし; past 雨だったし; negative 静かじゃないし. Do not drop the だ of an affirmative non-past form.
    examples:
      - japanese: この部屋は広いし、駅から近いし、とてもいいです。
        reading: このへやはひろいし、えきからちかいし、とてもいいです。
        romaji: kono heya wa hiroi shi, eki kara chikai shi, totemo ii desu.
        english: This room is spacious, and it's close to the station; it's really good.
      - japanese: 今日は雨だし、寒いし、うちにいます。
        reading: きょうはあめだし、さむいし、うちにいます。
        romaji: kyō wa ame da shi, samui shi, uchi ni imasu.
        english: It's raining today, and it's cold, so I'm staying home.
      - japanese: もう遅いし、そろそろ帰ります。
        reading: もうおそいし、そろそろかえります。
        romaji: mō osoi shi, sorosoro kaerimasu.
        english: It's late, for one thing, so I'll be heading home.
        note: One し, which here suggests there may be other reasons too.
    mistake:
      wrong: この町は静かし、きれいだし、大好きです。
      problem: A な-adjective needs だ before し, because each item has to be a complete statement. 静か on its own is not one.
      right: この町は静かだし、きれいだし、大好きです。
    distinguish_from:
      - id: OJG-0017
        note: から states the reason as the cause of what follows. し offers one or more reasons as supporting points and often leaves room for more, which can make it sound less absolute.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～し
          ref: 485
    references:
      - source_id: tanos
        ref: 485
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 10bd4de0a6633df2a5fb88658b631d6a441f2fe81c24a77e659e33d76dfcc0f7
          note: "The copula explanation is too broad: nouns and な-adjectives can form independent casual statements without だ, although affirmative plain nonpast predicates require it before し. Formation also omits polite copulas and negative forms. Write: 'Before し, use the predicate's conjugated form: 学生だし／学生ですし, 静かだったし, 静かじゃないし, 静かでしたし.' Replace 'The だ cannot be left out' with 'Do not omit だ from an affirmative plain nonpast noun or な-adjective predicate before し.' Also replace the categorical claims about additional reasons and softness with: 'A single し often suggests other supporting considerations and can soften a reason, but neither implication nor softness is guaranteed.' Apply that qualification to the meaning, why, example note, and から comparison."
  - id: OJG-0042
    pattern: そうです
    title: I hear that… (passing on what you heard)
    meaning: 'Plain form + そうです: reports something the speaker heard or read, "I hear that…", "apparently".'
    when: "Use it to pass on information that came from someone else, the news, a notice: 明日は雨が降るそうです, \"I hear it's going to rain tomorrow\". The source can be named first with によると: 天気予報によると."
    why: 'そう here means "so, like that", and points back at a statement: "it is said so". Because it attaches to a complete statement, the reported part keeps its own tense and negation (降った, 降らない), and an affirmative non-past noun or な-adjective keeps its だ (雨だそうです). The そうです itself normally stays non-past: tense and negation go in the part before it. The form marks the content as information from an outside source.'
    formation:
      - form: Verb / い-adjective (plain form, any tense) + そうです
        note: "降るそうです, 降ったそうです, 降らないそうです; 高いそうです. Casual: そうだ."
      - form: Noun / な-adjective + だ + そうです
        note: 雨だそうです, 静かだそうです; past 雨だったそうです.
    examples:
      - japanese: 天気予報によると、明日は雨が降るそうです。
        reading: てんきよほうによると、あしたはあめがふるそうです。
        romaji: tenki yohō ni yoru to, ashita wa ame ga furu sō desu.
        english: According to the weather forecast, it's going to rain tomorrow.
      - japanese: 田中さんは来月結婚するそうです。
        reading: たなかさんはらいげつけっこんするそうです。
        romaji: tanaka-san wa raigetsu kekkon suru sō desu.
        english: I hear Tanaka-san is getting married next month.
      - japanese: あの店のラーメンはとてもおいしいそうです。
        reading: あのみせのラーメンはとてもおいしいそうです。
        romaji: ano mise no rāmen wa totemo oishii sō desu.
        english: I hear the ramen at that shop is really good.
    mistake:
      wrong: ニュースによると、明日はとても寒そうです。
      problem: This is grammatical, but it says the speaker infers from the news that tomorrow looks likely to be cold. To pass on what the news said, use the full plain form before そうです.
      right: ニュースによると、明日はとても寒いそうです。
    distinguish_from:
      - id: OJG-0061
        note: The "looks like" そうです attaches to a stem (降りそう, 寒そう) and gives your own impression. The hearsay そうです attaches to a full plain form (降るそう, 寒いそう) and passes on what you heard.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: そうです
          ref: 486
    references:
      - source_id: tanos
        ref: 486
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: Tanos lists そうです (486) and ～そうです (505) separately; this entry takes 486 as the hearsay use, since Hanabira's ～そうだ was mapped to 0061 as "looks like". Is that the right split?
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 44312c8c8cbaf42a293063afd92eaf08261bcceadfa0c2b91b13c931a75c958c
          note: "The mistake sentence is valid: 寒そうです can express the speaker's inference from a news report, not just something directly seen. Replace the diagnosis with: 'This says that tomorrow looks likely to be cold, based on the news. To transmit the news report itself rather than draw your own inference, use 寒いそうです.' Label this a meaning mismatch, not an ungrammatical sentence. Also, 'そうです itself does not change' and 'has no past form' are too absolute; retrospective reporting can use そうだった／そうでした. Write: 'Hearsay normally uses nonpast そうだ／そうです. Put the reported proposition's tense and negation before そう; do not confuse its forms with appearance そう.' Finally, replace 'not your own knowledge' with 'information attributed to an external source'; the speaker may also know it independently."
  - id: OJG-0043
    pattern: てみる
    title: Try doing something to see how it goes
    meaning: 'V-てみる: do V to see what it is like or what happens; "try V-ing".'
    when: 'Use it when you do something as an experiment, or for the first time, to find out the result: 着てみる, "try it on"; 食べてみる, "try eating it". It is common in requests (聞いてみてください) and wishes (行ってみたい).'
    why: 'みる is "see, look". After the て-form it says "do V, and see": you try the action out to find out what happens or what it is like. In an affirmative past statement, the trial normally was carried out, though it need not have succeeded (問題を解いてみたが、解けなかった). V-ようとする is different: it focuses on setting out to do something. Because the point is to find something out, てみる suits new and unfamiliar things. As a helper verb, みる is normally written in kana.'
    formation:
      - form: V (て-form) + みる
        note: "Polite: てみます. Wish: てみたい. Request: てみてください."
    examples:
      - japanese: この靴をはいてみてもいいですか。
        reading: このくつをはいてみてもいいですか。
        romaji: kono kutsu o haite mite mo ii desu ka.
        english: May I try these shoes on?
      - japanese: 初めて納豆を食べてみました。
        reading: はじめてなっとうをたべてみました。
        romaji: hajimete nattō o tabete mimashita.
        english: I tried natto for the first time.
      - japanese: わからないときは、先生に聞いてみてください。
        reading: わからないときは、せんせいにきいてみてください。
        romaji: wakaranai toki wa, sensei ni kiite mite kudasai.
        english: When you don't understand, try asking the teacher.
    mistake:
      wrong: 早く起きてみましたが、起きられませんでした。
      problem: 起きてみました presents getting up as something actually tried out, which clashes with saying you could not get up. For an attempt that failed, 起きようとしました says what is meant.
      right: 早く起きようとしましたが、起きられませんでした。
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: てみる
          ref: 487
    references:
      - source_id: tanos
        ref: 487
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 00db513e5715523b86cebcb9b469f103d8456bc1e320318cb27b338e35e19c33
          note: "The claim that てみる 'is not an attempt that can fail' is false. For example, 問題を解いてみたが、解けなかった naturally describes trying the problem without succeeding. Write: 'てみる presents an action as a trial to discover its result. In an affirmative past statement, it normally indicates that the trial was undertaken, but it does not guarantee successful completion. ようとする focuses instead on attempting or intending to initiate the action.' Revise the mistake diagnosis to: '起きてみました normally presents getting up as something actually tried out, which clashes here with saying you could not get up. 起きようとしました clearly expresses the intended unsuccessful attempt.'"
  - id: OJG-0044
    pattern: なら
    title: If it's that…, if that's the case
    meaning: "X なら: \"if it's X\", \"if (as you say) X\"; takes up something given and says what applies to it."
    when: "Use it to respond to something just said or to the situation, with advice, a suggestion or an opinion about it: 京都に行くなら、秋がいいですよ, \"if you're going to Kyoto, autumn is good\". After a noun, it picks that thing out as the topic of what you are about to say: 駅なら、あそこです, \"the station? it's over there\"."
    why: "なら takes something as given, usually from the listener or the context, and then says what applies if that is so. It only sets up a premise, so the advice can be something to do before A: in 京都に行くなら、ガイドブックを買ったほうがいい, you buy the guidebook before you go. With two successive events, たら normally puts B after A has happened, which is why なら is the natural choice for advice about someone's plan."
    formation:
      - form: Noun / な-adjective + なら
        note: 駅なら, 静かなら; past 学生だったなら; negative 静かではないなら. のなら also occurs (学生なのなら).
      - form: Verb / い-adjective (plain form) + なら
        note: 行くなら, 行かないなら, 行ったなら; 寒いなら. のなら and, in speech, んなら also occur.
    examples:
      - japanese: 京都に行くなら、秋がいいですよ。
        reading: きょうとにいくなら、あきがいいですよ。
        romaji: kyōto ni iku nara, aki ga ii desu yo.
        english: If you're going to Kyoto, autumn is a good time.
      - japanese: 「駅はどこですか。」「駅なら、あそこです。」
        reading: 「えきはどこですか。」「えきなら、あそこです。」
        romaji: '"eki wa doko desu ka." "eki nara, asoko desu."'
        english: "\"Where is the station?\" \"The station? It's over there.\""
      - japanese: 寒いなら、窓を閉めましょうか。
        reading: さむいなら、まどをしめましょうか。
        romaji: samui nara, mado o shimemashō ka.
        english: If you're cold, shall I close the window?
    mistake:
      wrong: 駅に着くなら、電話してください。
      problem: The call should come after arriving. なら does not set an order, so this reads as "if you are going to arrive, call me", possibly beforehand. For "when you have arrived, then call", use たら.
      right: 駅に着いたら、電話してください。
    distinguish_from:
      - id: OJG-0066
        note: With two successive events, たら normally puts B after A has happened. なら takes A as given and can give advice for before A.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: なら
          ref: 488
    references:
      - source_id: tanos
        ref: 488
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 01d405933ff4fdd85064b0c0993a000d460a14bf270d6a5f2994afd392ef5955
          note: "The temporal contrast overstates たら and と: they do not universally require an earlier event followed by a later event. In particular, conditional states and hypothetical past situations need not have that sequence. Replace the why claim and distinguish_from note with: 'With successive events, たら normally places B after A occurs, whereas なら can introduce a premise for advice to be acted on before A. This is not a universal temporal-order rule for every use of たら or と.' Expand noun/な-adjective formation to include conjugated predicates: '学生なら／静かなら; 学生だったなら／静かだったなら; 学生ではないなら／静かではないなら. Before のなら, use 学生なのなら／静かなのなら.'"
  - id: OJG-0045
    pattern: (period)に(frequency)
    title: How many times in a period
    meaning: 'Period + に + count: "so many times per period", as in 一週間に三回, "three times a week".'
    when: 'Use it to say how often something happens within a length of time: 一日に三回, "three times a day"; 一か月に一度, "once a month". The period comes first, then に, then the number of times.'
    why: "に marks the frame an action is placed in. Here the frame is a length of time, and the count says how many times the action fits into it. The count works like an adverb and needs no particle of its own: 一週間に三回、プールで泳ぎます. With 週, 月 and 年, the 一 is often dropped: 週に二回, 月に一回, 年に一度."
    formation:
      - form: Period (一日, 一週間, 一か月, 一年; or 週, 月, 年) + に + number + 回／度
        note: 回 is the everyday counter for times; 度 is a little more formal.
    examples:
      - japanese: 一週間に三回、プールで泳ぎます。
        reading: いっしゅうかんにさんかい、プールでおよぎます。
        romaji: isshūkan ni sankai, pūru de oyogimasu.
        english: I swim at the pool three times a week.
      - japanese: この薬は一日に二回飲んでください。
        reading: このくすりはいちにちににかいのんでください。
        romaji: kono kusuri wa ichinichi ni nikai nonde kudasai.
        english: Please take this medicine twice a day.
      - japanese: 母には月に一度電話します。
        reading: ははにはつきにいちどでんわします。
        romaji: haha ni wa tsuki ni ichido denwa shimasu.
        english: I call my mother once a month.
    mistake:
      wrong: 三回一週間にジムに行きます。
      problem: This follows the English order, "three times a week". For an ordinary statement of how often, the period comes first and frames the count; 三回一週間に sounds awkward here.
      right: 一週間に三回ジムに行きます。
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: (period)に(frequency)
          ref: 489
    references:
      - source_id: tanos
        ref: 489
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: Is 一週間で三回 worth mentioning as a neighbour (a total within one week, rather than a regular rate)? Left out as uncertain.
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 9e5f304fba6d6694482440bb026ad498d13ee95a6c8ca57ef4c5fed8c40f733a
          note: "The count does not have to sit 'just before the verb'; your own examples put プールで or プールに between it and the verb. Replace that explanation with: 'The count functions adverbially and normally needs no additional particle. It need not be immediately adjacent to the verb: 一週間に三回、プールで泳ぎます.' The mistake diagnosis also treats the normal order as an absolute Japanese word-order rule. Write: 'For a neutral frequency expression, put the period before the count: 一週間に三回. 三回一週間に is awkward here without special emphasis or a pause, although Japanese allows reordered quantities in suitable contexts.'"
  - id: OJG-0046
    pattern: ～がほしい
    title: Wanting a thing
    meaning: "N がほしい: \"I want N\". ほしい is an い-adjective for wanting a thing; in a plain statement, normally the speaker's want."
    when: "Use it to say what you want to have: 新しいかばんがほしいです. In a question, ask what the listener wants: 何がほしいですか. For what someone else wants, see ～たがる."
    why: 'ほしい is an い-adjective describing a feeling: the thing is "wanted". Like other feeling words such as 好き or 痛い, it reports an inner state. In an ordinary statement about a present want, the one who wants is the speaker, and in a question, usually the listener. For someone else, Japanese normally reports what shows (ほしがっている) or what they said (ほしいと言っている), though ほしい can describe another person in suitable contexts, such as a story told from their point of view. The wanted thing is marked with が, not を, because ほしい is an adjective, not a verb: the thing is what the feeling is about, just as in 犬が好き. ほしい is for things; to want to do something, use the verb with たい.'
    formation:
      - form: Noun + が + ほしい
        note: "Polite: ほしいです. Negative: ほしくない; past: ほしかった. は replaces が for contrast: お金はほしくないです."
    examples:
      - japanese: 新しいパソコンがほしいです。
        reading: あたらしいパソコンがほしいです。
        romaji: atarashii pasokon ga hoshii desu.
        english: I want a new computer.
      - japanese: 誕生日に何がほしいですか。
        reading: たんじょうびになにがほしいですか。
        romaji: tanjōbi ni nani ga hoshii desu ka.
        english: What do you want for your birthday?
      - japanese: 子どものころ、犬がとてもほしかったです。
        reading: こどものころ、いぬがとてもほしかったです。
        romaji: kodomo no koro, inu ga totemo hoshikatta desu.
        english: When I was a child, I really wanted a dog.
    mistake:
      wrong: 水をほしいです。
      problem: ほしい is an adjective, not a verb, so the thing wanted is not its object. It takes が.
      right: 水がほしいです。
    distinguish_from:
      - id: OJG-0029
        note: たい is for wanting to do something (水を飲みたい). ほしい is for wanting a thing (水がほしい).
      - id: OJG-0328
        note: てほしい is for wanting someone else to do something (手伝ってほしい). ほしい on its own wants a thing.
      - id: OJG-0047
        note: ほしい states a want directly, normally your own. ほしがる reports someone else's want as it shows.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～がほしい
          ref: 490
    references:
      - source_id: tanos
        ref: 490
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 00efa4ac342a46dca77086e935860d68bf13275a6d9872469c2452750534a246
          note: "The person restriction is overstated. A plain statement with ほしい need not describe the speaker: third-person uses occur when the desire is established in context or the speaker adopts that person's perspective. Replace the relevant explanation with: 'In an ordinary direct statement about a current personal desire, ほしい normally describes the speaker; questions commonly ask about the listener. For another person's desire, use ほしがっている for outward indications, or ほしいと言っている／ほしいそうだ for a report. Direct third-person ほしい is possible with suitable context or perspective.' Qualify the ほしがる comparison accordingly."
  - id: OJG-0047
    pattern: ～たがる
    title: Someone else wants to (as it shows)
    meaning: 'V-たがる: a third person shows signs of wanting to do V; "X wants to V", judged from how they act.'
    when: "Use it to say what someone other than you wants to do, going by what they say or do: 弟は外で遊びたがっています. It is usually in the ている form for a current want, or the plain form for a habit. ほしがる does the same for wanting a thing."
    why: "たい and ほしい describe feelings from the inside, so Japanese usually avoids stating another person's want as plain fact. がる turns an inner feeling into outward behaviour: \"show signs of wanting\". So 行きたがる reports what can be seen from outside. It makes an ordinary godan verb, and since it now describes an action, the object takes を: 水を飲みたがる, ゲームをほしがる. For the same reason it is normally not used of yourself in an ordinary statement."
    formation:
      - form: V (ます-stem) + たがる
        note: "行きたがる, 行きたがっている, 行きたがらない. Polite: 行きたがっています."
      - form: Noun + を + ほしがる
        note: The same change made from ほしい.
    examples:
      - japanese: 弟は毎日外で遊びたがります。
        reading: おとうとはまいにちそとであそびたがります。
        romaji: otōto wa mainichi soto de asobitagarimasu.
        english: My little brother wants to play outside every day.
      - japanese: 息子が新しいゲームをほしがっています。
        reading: むすこがあたらしいゲームをほしがっています。
        romaji: musuko ga atarashii gēmu o hoshigatte imasu.
        english: My son wants a new video game.
      - japanese: 子どもは野菜を食べたがりません。
        reading: こどもはやさいをたべたがりません。
        romaji: kodomo wa yasai o tabetagarimasen.
        english: The children don't want to eat vegetables.
    mistake:
