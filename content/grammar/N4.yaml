  - id: OJG-0296
    pattern: それに／そのうえ
    title: Besides, what's more
    meaning: 'それに／そのうえ: "besides", "on top of that"; adds another point, usually supporting the same line as the first.'
    when: 'Use it at the start of a sentence to add a further point pushing in the same direction: この店は安いです。それに、料理もおいしいです. それに is common in conversation; そのうえ is a little more formal and suggests "and even more than that". Both often add one more reason.'
    why: "それ points back at what was said, and に adds to it: \"to that, (add) this\". そのうえ is literally \"on top of that\". Both add another point, usually one that supports the same conclusion; how the points relate depends on the speaker's argument. To add a point that goes against the first, use でも or しかし."
    formation:
      - form: Sentence A。それに、sentence B。
      - form: Sentence A。そのうえ、sentence B。
    examples:
      - japanese: この店は安いです。それに、料理もおいしいです。
        reading: このみせはやすいです。それに、りょうりもおいしいです。
        romaji: kono mise wa yasui desu. soreni, ryōri mo oishii desu.
        english: This restaurant is cheap. Besides, the food is good too.
      - japanese: 今日は雨です。それに、とても寒いです。
        reading: きょうはあめです。それに、とてもさむいです。
        romaji: kyō wa ame desu. soreni, totemo samui desu.
        english: It's raining today. And on top of that, it's very cold.
      - japanese: 道に迷いました。そのうえ、スマホの電池も切れてしまいました。
        reading: みちにまよいました。そのうえ、スマホのでんちもきれてしまいました。
        romaji: michi ni mayoimashita. sono ue, sumaho no denchi mo kirete shimaimashita.
        english: I got lost. On top of that, my phone battery ran out.
    mistake:
      wrong: このアパートは駅から近いです。それに、家賃が高いです。
      problem: Meant as a contrast between the handy location and the high rent. For a contrast, use でも. それに adds a point that supports the same line, which is not what is meant here.
      right: このアパートは駅から近いです。でも、家賃が高いです。
    distinguish_from:
      - id: OJG-0293
        note: そして broadly joins facts or events; それから often introduces the next event or item. それに specifically adds another point.
      - id: OJG-0041
        note: し links points or reasons inside one sentence. それに starts a new sentence to add one.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: 文A。そのうえ 文B。
        - source_id: hanabira
          level: N4
          item: 文A。それに 文B (Bun A. Soreni Bun B)
    references:
      - source_id: hanabira
        ref: それに／そのうえ
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: b2cb3fa41a9cb73b0963eea4731bf00d9d5b9eaef18f67085154e5e435a3ccc1
          note: "The same-direction explanation is too categorical: the points need not both be objectively good or both bad; their relationship depends on the speaker's argument. Replace 'good on good, or bad on bad' with 'usually adding another supporting point; whether the points support the same conclusion depends on context'. In the mistake, write: 'If the intended meaning contrasts convenient location with expensive rent, use でも. The original can work when both facts support the speaker’s argument.' The distinction notes also overstate things. Replace them with: 'そして broadly connects facts or events and can also add reasons; それから often introduces the next event or item. それに specifically adds another point.' And: 'し links cumulative points or reasons and can also end an utterance with the continuation implied. それに is a connector introducing an additional point.'"
  - id: OJG-0299
    pattern: AはBほど～ない
    title: A is not as … as B
    meaning: 'A は B ほど + negative: "A is not as (adjective) as B", or does not do something as much; B is the standard.'
    when: "Use it to compare by saying one thing falls short of another: 今年の夏は去年ほど暑くない, \"this summer isn't as hot as last year's\". It is a natural way to say something is less so, and it can sound gentler than a direct comparison with より."
    why: ほど means "extent, degree". B ほど is "to B's degree", and the negative says A does not reach it. In this "not as … as" pattern, the end of the sentence must be negative. B is the standard; the context may suggest that B has the quality strongly, but it need not.
    formation:
      - form: A は B ほど + negative
        note: い-adjective 暑くない; な-adjective にぎやかではない／じゃない; verb 読まない. Polite くないです／くありません, ではありません, ません.
    examples:
      - japanese: 今年の夏は去年ほど暑くないです。
        reading: ことしのなつはきょねんほどあつくないです。
        romaji: kotoshi no natsu wa kyonen hodo atsuku nai desu.
        english: This summer isn't as hot as last year's.
      - japanese: 私の町は東京ほどにぎやかではありません。
        reading: わたしのまちはとうきょうほどにぎやかではありません。
        romaji: watashi no machi wa tōkyō hodo nigiyaka de wa arimasen.
        english: My town isn't as lively as Tokyo.
      - japanese: 弟は私ほど本を読みません。
        reading: おとうとはわたしほどほんをよみません。
        romaji: otōto wa watashi hodo hon o yomimasen.
        english: My little brother doesn't read as much as I do.
    mistake:
      wrong: 東京は大阪ほど大きいです。
      problem: Meant as "Tokyo is bigger than Osaka". ほど does not express "more than"; use より.
      right: 東京は大阪より大きいです。
    distinguish_from:
      - id: OJG-0025
        note: より and のほうが say which one has more of the quality. ほど～ない says one falls short of the other.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: A は B ほど～ありません (A wa B hodo ～ arimasen)
        - source_id: hanabira
          level: N4
          item: A は B ほど～ない (A wa B hodo ~ nai)
    references:
      - source_id: hanabira
        ref: AはBほど～ない
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: e7ba56f86ef40478163c402431f98e203274064c99c1d8dee0b92798e9c7b8a9
          note: "B need not possess the quality to a clearly high degree: 去年ほど暑くない compares temperatures without necessarily asserting that last year was hot. Replace that claim with: 'B supplies the comparison standard; context may suggest that B has the quality strongly, but this is not required.' The negative requirement must be limited to this pattern, not all comparisons using ほど; affirmative uses exist, such as 去年ほどの暑さだ. Write: 'This “not as … as” pattern requires a negative ending.' Replace the mistake diagnosis with: 'To mean “Tokyo is bigger than Osaka”, use より; ほど does not express “more than”.' Also change 'it sounds gentler' to 'it can sound gentler', and broaden the meaning to include the verb use shown: 'A does not have the quality, or do the activity, to the same degree as B.'"
  - id: OJG-0306
    pattern: ～までに
    title: By (a deadline)
    meaning: 'Time + までに: "by (then)"; marks a deadline by which something happens or is completed.'
    when: "Use it for a deadline: 金曜日までにレポートを出してください, \"please hand in the report by Friday\". The action is done at some point up to that time. It can also follow a verb: 暗くなるまでに帰ります, \"I'll be home before it gets dark\"."
    why: "まで marks the end of a stretch of time; に marks a point where something happens. Together they give a deadline: by X, the thing happens or is completed. It does not say how many times. まで without に says an activity or state goes on all the way to X (五時まで働く)."
    formation:
      - form: Noun (time) + までに
        note: 金曜日までに, 三時までに.
      - form: V (dictionary form) + までに
        note: 暗くなるまでに, 母が帰るまでに.
    examples:
      - japanese: 金曜日までにレポートを出してください。
        reading: きんようびまでにレポートをだしてください。
        romaji: kin'yōbi made ni repōto o dashite kudasai.
        english: Please hand in the report by Friday.
      - japanese: 暗くなるまでに帰ります。
        reading: くらくなるまでにかえります。
        romaji: kuraku naru made ni kaerimasu.
        english: I'll be home before it gets dark.
      - japanese: 三時までに駅に来てください。
        reading: さんじまでにえきにきてください。
        romaji: sanji made ni eki ni kite kudasai.
        english: Please come to the station by three.
    mistake:
      wrong: 五時までに働きます。
      problem: Meant as "I work until five". That is まで, for an activity that lasts up to a time. までに sets a deadline for something to happen or be completed.
      right: 五時まで働きます。
    distinguish_from:
