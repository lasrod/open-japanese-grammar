  - id: OJG-0331
    pattern: ～と思う
    title: I think (that)…
    meaning: "Plain form + と思う: \"I think (that)…\"; presents a statement as the speaker's opinion or guess."
    when: 'Use it to give your opinion or a guess: 明日は雨が降ると思います, "I think it will rain tomorrow"; この映画はおもしろいと思います. For what someone else thinks, use と思っている: 兄は日本語は難しいと思っています. Japanese speakers also use it to soften statements.'
    why: "と marks what is thought, like quotation marks, and 思う is \"think\". So the part before と is a complete statement in plain form, with its own tense and negation; for an affirmative non-past noun or な-adjective that means keeping だ (先生だと思う). In an ordinary statement, と思う gives the speaker's present thought (or the listener's, in a question); to report an opinion someone else holds, と思っている is the usual choice. For a negative opinion, Japanese usually makes the content negative: 来ないと思う, \"I don't think he'll come\"."
    formation:
      - form: Verb / い-adjective (plain form) + と思う
        note: 降ると思う, 降らないと思う, おもしろいと思う.
      - form: Noun / な-adjective + plain copula + と思う
        note: 先生だと思う, 先生だったと思う, 静かではないと思う.
      - form: … と思っている
        note: An opinion someone holds, usually someone else's.
    examples:
      - japanese: 明日は雨が降ると思います。
        reading: あしたはあめがふるとおもいます。
        romaji: ashita wa ame ga furu to omoimasu.
        english: I think it'll rain tomorrow.
      - japanese: この映画はとてもおもしろいと思います。
        reading: このえいがはとてもおもしろいとおもいます。
        romaji: kono eiga wa totemo omoshiroi to omoimasu.
        english: I think this film is really good.
      - japanese: 田中さんは今日来ないと思います。
        reading: たなかさんはきょうこないとおもいます。
        romaji: tanaka-san wa kyō konai to omoimasu.
        english: I don't think Tanaka-san is coming today.
      - japanese: 兄は、日本語は難しいと思っています。
        reading: あには、にほんごはむずかしいとおもっています。
        romaji: ani wa, nihongo wa muzukashii to omotte imasu.
        english: My older brother thinks Japanese is difficult.
    mistake:
      wrong: あの人は先生と思います。
      problem: Before と思う, an affirmative non-past noun keeps だ, because what is thought is a complete statement.
      right: あの人は先生だと思います。
    distinguish_from:
      - id: OJG-0339
        note: ようと思う, with the volitional form, is "I'm thinking of doing". と思う after an ordinary plain form gives an opinion or guess.
      - id: OJG-0038
        note: でしょう is a guess stated by itself. と思う frames it explicitly as your own thought.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～と思う (〜to omou)
    references:
      - source_id: hanabira
        ref: ～と思う
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 51cfb2c48d1a92193e069844301f676cccd2909a1d931fd21e440c91a44abe0d
          note: "The person restriction is overstated: と思う is not grammatically limited to the speaker's thoughts, and と思っている is not mandatory for every third-person subject. Replace the relevant statements with: 'In an ordinary unqualified statement, と思う normally expresses the speaker’s present thought. To report an opinion someone else holds, と思っている is the usual choice; other constructions and narrative contexts also permit third-person と思う.' The noun/な-adjective formation is also incomplete for the tense and negation described. Replace it with: 'Noun / な-adjective + plain-form copula + と思う: 先生だと思う, 先生だったと思う, 先生ではないと思う, 静かではなかったと思う.' Explain that だ is the standard affirmative non-past form here, rather than saying nouns and な-adjectives always need だ."
  - id: OJG-0332
    pattern: ～なければならない／～なくてはいけない／～ないといけない
    title: Must, have to
    meaning: 'V-なければならない／V-なくてはいけない／V-ないといけない: "must V", "have to V".'
    when: 'Use these to say something is necessary: 明日は六時に起きなければなりません, "I have to get up at six tomorrow". なければならない is the most formal and the usual choice in writing; ないといけない and なくてはいけない are common in speech. In casual speech they shrink to なきゃ and なくちゃ (OJG-0037).'
    why: "All three say \"if you don't V, it won't do\". The first half (なければ, なくては, ないと) sets up \"not doing V\", and ならない or いけない says that is not acceptable. Two negatives make \"must\". ならない tends to sound like a general or objective necessity, and いけない more like a personal or situational one, but in everyday speech they overlap a great deal. All are built on the ない-form: 行かない → 行かなければ, 行かなくては, 行かないと."
    formation:
      - form: V (ない-form, drop い) + ければならない
        note: 起きなければならない. Polite なりません.
      - form: V (ない-form, drop い) + くてはいけない
        note: 返さなくてはいけない. Polite いけません.
      - form: V (ない-form) + といけない
        note: しないといけない. Polite いけません.
    examples:
      - japanese: 明日は六時に起きなければなりません。
        reading: あしたはろくじにおきなければなりません。
        romaji: ashita wa rokuji ni okinakereba narimasen.
        english: Tomorrow I have to get up at six.
      - japanese: 今日は宿題をしないといけません。
        reading: きょうはしゅくだいをしないといけません。
        romaji: kyō wa shukudai o shinai to ikemasen.
        english: I have to do my homework today.
      - japanese: 図書館の本を返さなくてはいけません。
        reading: としょかんのほんをかえさなくてはいけません。
        romaji: toshokan no hon o kaesanakute wa ikemasen.
        english: I have to return the library books.
    mistake:
      wrong: 毎日この薬を飲んではいけません。
      problem: Meant as "you must take this medicine every day". てはいけない means "must not". "Must" is the double negative.
      right: 毎日この薬を飲まなければなりません。
    distinguish_from:
      - id: OJG-0037
        note: なくちゃいけない and なきゃ are the casual spoken contractions of the same point.
      - id: OJG-0067
        note: なくてもいい says you don't have to.
      - id: OJG-0016
        note: てはいけない says you must not.
