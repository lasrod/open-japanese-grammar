  - id: OJG-0069
    pattern: ～てしまう
    title: Doing something completely, or regrettably
    meaning: "V-てしまう: V is done completely, or happened with regret, by accident or unexpectedly. Casual: ちゃう／じゃう."
    when: "Use it for two things: to say an action is finished completely (宿題を全部やってしまった, \"I've finished all my homework\"), and, very often, to show that something happened that you regret, or that happened without your meaning it to (傘を忘れてしまいました, \"I (unfortunately) left my umbrella behind\"). In speech, てしまう becomes ちゃう and でしまう becomes じゃう: 食べちゃった, 飲んじゃった."
    why: "しまう means \"put away, close up\". After the て-form it marks an action as completed, and often adds the speaker's reaction to it: regret, or a sense that it happened without meaning to or unexpectedly. 忘れてしまった says you forgot, and wish you hadn't. Context decides which reading you get: a chore finished, or a mistake made. It adds the speaker's view of the event; without it, 傘を忘れました states the bare fact."
    formation:
      - form: V (て-form) + しまう
        note: "Polite: てしまいます, てしまいました."
      - form: V (て-form) → ちゃう／じゃう
        note: "Casual: 食べちゃう, 忘れちゃった; 飲んじゃう, 読んじゃった."
    examples:
      - japanese: 電車に傘を忘れてしまいました。
        reading: でんしゃにかさをわすれてしまいました。
        romaji: densha ni kasa o wasurete shimaimashita.
        english: I left my umbrella on the train.
      - japanese: 宿題はもう全部やってしまいました。
        reading: しゅくだいはもうぜんぶやってしまいました。
        romaji: shukudai wa mō zenbu yatte shimaimashita.
        english: I've already finished all my homework.
      - japanese: ケーキを全部食べちゃった。
        reading: ケーキをぜんぶたべちゃった。
        romaji: kēki o zenbu tabechatta.
        english: I ate the whole cake. (Oops.)
    mistake:
      wrong: 試験に合格してしまいました。
      problem: Meant as a plain announcement of good news. てしまう adds a reaction to the event, most often regret, so it sounds odd here; at most it suggests the pass was unexpected. For plain good news, leave it out.
      right: 試験に合格しました。
    register:
      - plain
      - polite
      - casual
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～てしまう
          ref: 513
    references:
      - source_id: tanos
        ref: 513
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 5ab9718867799afff29039d5ead4a0a04396c4d3e6894c6f50f3680a8be8a976
          note: "The mistake diagnosis wrongly makes passing sound necessarily unfortunate. 試験に合格してしまいました can express unexpected or unintended success, including pleased surprise. Write: 'For a neutral announcement of good news, use 試験に合格しました. 合格してしまいました adds a reaction, such as surprise at an unexpected result; it does not necessarily express regret.' Also replace the reasoning's 'done for good', 'can't be undone' and 'it is too late' claims with: 'しまう can mark completion or the speaker’s reaction to an event, often regret or a sense that it happened unintentionally or unexpectedly. It does not entail that the consequences are irreversible.'"
  - id: OJG-0070
    pattern: Dictionary form+と
    title: When A, B follows (as a matter of course)
    meaning: 'Plain non-past + と: "when/whenever A, B"; B follows regularly from A. Also "when I did A, (I found) B".'
    when: 'Use it when B always or automatically follows A: 春になると、桜が咲きます, "when spring comes, the cherry blossoms bloom"; このボタンを押すと、お湯が出ます. It also gives directions (まっすぐ行くと、右に郵便局があります) and, with a past-tense B, tells what you found when you did A (家に帰ると、姉が来ていました).'
    why: "と links A and B as a regular sequence: when A happens, B comes with it. Because of that, B normally cannot be a one-off request, invitation or decision about what to do if A happens; those take たら. A want that regularly arises can follow (暑いと、冷たい物が飲みたくなる). In a story, と can instead introduce what happened, or what the speaker found, upon doing A. A stays in the non-past plain form even in a story about the past, because the tense is carried by B: 家に帰ると、…いました."
    formation:
      - form: Verb / い-adjective (plain non-past) + と
        note: 押すと, 押さないと; 寒いと.
      - form: Noun / な-adjective + だ + と
        note: 雨だと, 静かだと.
    examples:
      - japanese: 春になると、桜が咲きます。
        reading: はるになると、さくらがさきます。
        romaji: haru ni naru to, sakura ga sakimasu.
        english: When spring comes, the cherry blossoms bloom.
      - japanese: このボタンを押すと、お湯が出ます。
        reading: このボタンをおすと、おゆがでます。
        romaji: kono botan o osu to, oyu ga demasu.
        english: When you press this button, hot water comes out.
      - japanese: まっすぐ行くと、右に郵便局があります。
        reading: まっすぐいくと、みぎにゆうびんきょくがあります。
        romaji: massugu iku to, migi ni yūbinkyoku ga arimasu.
        english: If you go straight on, there's a post office on the right.
      - japanese: 家に帰ると、姉が来ていました。
        reading: いえにかえると、あねがきていました。
        romaji: ie ni kaeru to, ane ga kite imashita.
        english: When I got home, my older sister was there.
        note: A past B tells what the speaker found. A stays non-past.
    mistake:
      wrong: 駅に着くと、電話してください。
      problem: With と, B follows A by itself, so B cannot be a request. Use たら.
      right: 駅に着いたら、電話してください。
    distinguish_from:
      - id: OJG-0066
        note: たら allows one-off requests, invitations and intentions after it. と normally does not.
      - id: OJG-0064
        note: ば focuses on A as a condition to be met. と presents B as what regularly comes with A.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: Dictionary form+と
          ref: 514
    references:
      - source_id: tanos
        ref: 514
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: c6519f4edb9ef3073cd21ab9dc40329128d088b01e1f8ad9730cc73cfbfc9448
          note: "The ban on anything the speaker wants, and specifically on たい, is too broad. と can describe a recurring desire, as in 暑いと冷たいものが飲みたいです. Replace that explanation and the absolute comparison with たら with: 'Conditional と normally does not introduce a one-off request, invitation or decision about what to do if A happens. It can describe desires or intentions that regularly arise under A.' Also qualify the 'fixed sequence: whenever A happens' reasoning: the past narrative/discovery use need not describe an automatic or repeated result. Add: 'In narrative uses, と can instead introduce what happened or what the speaker found upon doing A.'"
  - id: OJG-0071
    pattern: ～ながら
    title: While doing (two actions at once)
    meaning: 'V (ます-stem) + ながら: "while V-ing"; one person does two actions at once, the main one coming last.'
    when: 'Use it when the same person does two things at the same time: 音楽を聞きながら勉強します, "I study while listening to music". The action before ながら is in the background; the one after it is the main action.'
    why: "ながら turns the first verb into a background activity that runs alongside the main one. The tense and politeness of the whole sentence come from the last verb, so the verb before ながら is always the ます-stem, whatever the tense: 聞きながら勉強しました. Because the two actions belong to one person, ながら cannot join two people's actions; for \"while she cooked, I…\", use 間 (あいだ). The order matters: the main action goes last, so 勉強しながら音楽を聞く makes the music the point."
    formation:
      - form: V (ます-stem) + ながら
        note: 聞く → 聞きながら, 食べる → 食べながら, 歩く → 歩きながら.
    examples:
      - japanese: 音楽を聞きながら勉強します。
        reading: おんがくをききながらべんきょうします。
        romaji: ongaku o kikinagara benkyō shimasu.
        english: I study while listening to music.
      - japanese: 歩きながらスマホを見ないでください。
        reading: あるきながらスマホをみないでください。
        romaji: arukinagara sumaho o minaide kudasai.
        english: Please don't look at your phone while walking.
      - japanese: 父はテレビを見ながらご飯を食べます。
        reading: ちちはテレビをみながらごはんをたべます。
        romaji: chichi wa terebi o minagara gohan o tabemasu.
        english: My father eats while watching TV.
    mistake:
      wrong: 母が料理を作りながら、私はテレビを見ていました。
      problem: ながら joins two actions of the same person. For two people doing things at the same time, use 間.
      right: 母が料理を作っている間、私はテレビを見ていました。
    distinguish_from:
      - id: OJG-0083
        note: 間 and 間に can join the actions of two different people, and 間に sets a point within the period. ながら is one person doing two things at once.
    register:
      - plain
      - polite
    levels:
