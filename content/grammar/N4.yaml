          note: "The meaning's 'far from sure' imposes too strong a certainty restriction. Replace it with: 'presents something as possible without asserting that it is true'; かもしれない can also hedge something the speaker considers fairly likely. Formation is incomplete for the described past and negative uses with nouns and な-adjectives. Write: 'Use the plain predicate, omitting only affirmative nonpast だ: 雨かもしれない, 雨だったかもしれない, 雨ではないかもしれない, 静かではなかったかもしれない.' Qualify the mistake explanation accordingly. Under the required separate-particle romanization, replace 'kamo shiremasen' with 'ka mo shiremasen' in examples 1 and 3, and 'kamo shirenai' with 'ka mo shirenai' in example 2."
  - id: OJG-0049
    pattern: ～たらどうですか
    title: Suggesting, "why don't you…?"
    meaning: 'V-たらどうですか: "how about V-ing?"; a suggestion about what the listener could do.'
    when: "Use it to suggest a course of action to someone, often about a problem they have: 疲れているなら、少し休んだらどうですか. More politely, たらいかがですか; casually, たらどう？"
    why: たら sets up a condition, "if you did V", and どうですか asks "how would that be?". So the sentence asks the listener to picture doing V and judge it, and leaves the decision with them. It gives advice or proposes an option; to invite someone to do something with you, ませんか is the usual choice. Because it tells the listener what they could do, some care is needed in using it to people above you.
    formation:
      - form: V (た-form) + ら + どうですか
        note: "休んだらどうですか. Politer: たらいかがですか. Casual: たらどう？"
    examples:
      - japanese: 疲れているなら、少し休んだらどうですか。
        reading: つかれているなら、すこしやすんだらどうですか。
        romaji: tsukarete iru nara, sukoshi yasundara dō desu ka.
        english: If you're tired, why don't you rest a little?
      - japanese: わからないなら、先生に聞いたらどうですか。
        reading: わからないなら、せんせいにきいたらどうですか。
        romaji: wakaranai nara, sensei ni kiitara dō desu ka.
        english: If you don't understand, why not ask the teacher?
      - japanese: そんなに好きなら、買ったらどう？
        reading: そんなにすきなら、かったらどう？
        romaji: sonna ni suki nara, kattara dō?
        english: If you like it that much, why not buy it?
    mistake:
      wrong: いっしょに映画を見たらどうですか。
      problem: Meant as an invitation to watch a film with you. たらどうですか sounds like advice, for example that two other people watch one together. To invite, use ませんか.
      right: いっしょに映画を見ませんか。
    distinguish_from:
      - id: OJG-0035
        note: ほうがいい says one choice is better and often sounds firmer. たらどうですか offers an idea; depending on the tone, it can also sound impatient.
      - id: OJG-0007
        note: ませんか invites the listener to do something with you. たらどうですか gives advice.
    register:
      - polite
      - casual
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～たらどうですか
          ref: 493
    references:
      - source_id: tanos
        ref: 493
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: How presumptuous is たらどうですか (and たらいかがですか) towards a superior? The entry only says some care is needed.
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: eda7ba6600e6091e122e38631285186265ff426a88c13a122533b9d0759a442e
          note: "The restriction to 'the listener alone' is too strong. Suggested actions can involve other people, and いっしょに does not necessarily mean 'with me'. Replace that explanation and the ませんか comparison with: 'たらどうですか normally gives advice or proposes an option; ませんか is the usual choice for directly inviting someone to join you.' The mistake sentence is grammatical advice, for example suggesting that two people watch a film together. Rewrite its diagnosis as: 'If you mean to invite the listener to watch a film with you, 見ませんか expresses that intention more clearly.' Also qualify the ほうがいい comparison: 'ほうがいい often sounds firmer, but tone and context matter; たらどう can also sound impatient or critical.'"
  - id: OJG-0050
    pattern: Number+も
    title: As many as (more than expected)
    meaning: 'Number + も: stresses that an amount is large, "as many as", "a whole…"; 一 + counter + も + negative is "not even one".'
    when: 'Use it after a number and counter when the amount strikes you as a lot: 一時間も待ちました, "I waited a whole hour". With 一 and a negative verb it means "not a single one": 一人もいません.'
    why: 'も means "too, even". After a quantity it says "even this much": the speaker measures the amount against what was expected and finds it more. It stresses the amount as large, and can carry surprise, admiration or complaint; 一時間待ちました only states the time. With a negative, "not even one" becomes "none at all": 一つもない. A number with its counter normally sits just before the verb without a particle, and も simply follows it there.'
    formation:
      - form: Number + counter + も + verb
        note: 三時間も, 五つも, 二杯も.
      - form: 一 + counter + も + negative verb
        note: 一人もいない, 一回も行ったことがない.
    examples:
      - japanese: 駅で一時間も待ちました。
        reading: えきでいちじかんもまちました。
        romaji: eki de ichijikan mo machimashita.
        english: I waited a whole hour at the station.
      - japanese: 兄はケーキを五つも食べました。
        reading: あにはケーキをいつつもたべました。
        romaji: ani wa kēki o itsutsu mo tabemashita.
        english: My older brother ate as many as five pieces of cake.
      - japanese: 教室には学生が一人もいません。
        reading: きょうしつにはがくせいがひとりもいません。
        romaji: kyōshitsu ni wa gakusei ga hitori mo imasen.
        english: There isn't a single student in the classroom.
    mistake:
      wrong: 今朝、りんごを一つも食べました。
      problem: Meant as a neutral "I ate one apple this morning". For that, leave out も. A number + も stresses the amount as large, and 一 + counter + も with a negative means "not even one".
      right: 今朝、りんごを一つ食べました。
    distinguish_from:
      - id: OJG-0002
        note: After a noun, も means "too, also" (私も). After a number and counter, it means "as many as".
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: Number+も
          ref: 494
    references:
      - source_id: tanos
        ref: 494
    review:
      status: draft
