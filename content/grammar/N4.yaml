  - id: OJG-0347
    pattern: ～ずつ
    title: Each, at a time
    meaning: 'Quantity + ずつ: "X each", "X at a time"; the same amount for each person, or in each step.'
    when: 'Use it after a number or amount to say it is shared out equally or repeated in equal steps: 子どもたちにりんごを二つずつあげました, "I gave the children two apples each"; 毎日少しずつ, "a little at a time every day"; 一人ずつ入ってください, "please come in one at a time".'
    why: 'ずつ follows a quantity and repeats it across units: for each person, each day, each turn, the same amount. That is why it follows numbers and words of amount (少し, 一つ, 一人, 半分), not ordinary nouns. 少しずつ, "little by little", is its most common use. Like other quantities, the phrase sits near the verb without a particle.'
    formation:
      - form: Number + counter + ずつ
        note: 二つずつ, 一人ずつ, 一冊ずつ.
      - form: Word of amount + ずつ
        note: 少しずつ, 半分ずつ.
    examples:
      - japanese: 子どもたちにりんごを二つずつあげました。
        reading: こどもたちにりんごをふたつずつあげました。
        romaji: kodomotachi ni ringo o futatsu zutsu agemashita.
        english: I gave the children two apples each.
      - japanese: 毎日少しずつ漢字を覚えています。
        reading: まいにちすこしずつかんじをおぼえています。
        romaji: mainichi sukoshi zutsu kanji o oboete imasu.
        english: I'm learning kanji a little at a time every day.
      - japanese: 一人ずつ部屋に入ってください。
        reading: ひとりずつへやにはいってください。
        romaji: hitori zutsu heya ni haitte kudasai.
        english: Please come into the room one at a time.
    mistake:
      wrong: 学生ずつ本を一冊もらいました。
      problem: ずつ follows the quantity that is repeated, not the people it is shared among.
      right: 学生は本を一冊ずつもらいました。
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～ずつ (〜zutsu)
    references:
      - source_id: hanabira
        ref: ～ずつ
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0348
    pattern: ～たらいい／～ばいい
    title: What should I do? You just need to…
    meaning: 'V-たらいい／V-ばいい: asks for advice (どうしたらいいですか, "what should I do?") or gives it ("you just need to V").'
    when: 'Use it with a question word to ask for advice: 駅までどうやって行ったらいいですか, "how should I get to the station?"; 何を持っていけばいいですか. As an answer, it gives advice, often "all you need to do is": このボタンを押せばいいです. It can also express a hope: 晴れたらいいですね.'
    why: 'The conditional (たら or ば) sets up "if you do V", and いい judges it: "if you do V, it will be good". So どうしたらいい asks "if I do what, will it be good?", the natural way to ask for advice in Japanese. As an answer it says V is enough for a good result, so it often means "you only have to". たら and ば are largely interchangeable here; たらいい is a little more conversational. With the past, ばよかった, the same shape becomes regret.'
    formation:
      - form: V (た-form) + らいい
        note: 行ったらいい, したらいい. Polite いいですか／いいです.
      - form: V (ば-form) + いい
        note: 行けばいい, すればいい.
      - form: Question word … たら／ばいいですか
        note: どうしたらいいですか, 何を持っていけばいいですか.
    examples:
      - japanese: 駅までどうやって行ったらいいですか。
        reading: えきまでどうやっていったらいいですか。
        romaji: eki made dō yatte ittara ii desu ka.
        english: How should I get to the station?
      - japanese: 「何を持っていけばいいですか。」「飲み物だけ持ってくればいいですよ。」
        reading: 「なにをもっていけばいいですか。」「のみものだけもってくればいいですよ。」
        romaji: '"nani o motte ikeba ii desu ka." "nomimono dake motte kureba ii desu yo."'
        english: '"What should I bring?" "You only need to bring something to drink."'
      - japanese: わからないときは、先生に聞けばいいです。
        reading: わからないときは、せんせいにきけばいいです。
        romaji: wakaranai toki wa, sensei ni kikeba ii desu.
        english: When you don't understand, just ask the teacher.
    mistake:
      wrong: 駅まで、どうやって行ってもいいですか。
      problem: Meant as "how should I get to the station?". てもいいですか asks for permission. To ask how you should do something, use たらいい or ばいい.
      right: 駅まで、どうやって行ったらいいですか。
    distinguish_from:
      - id: OJG-0072
        note: ばよかった looks back with regret. ばいい gives advice about what to do.
      - id: OJG-0049
        note: たらどうですか offers a suggestion to the listener. たらいい is mostly used to ask for advice, or to say what is enough.
      - id: OJG-0059
        note: といい is mainly a hope. たらいい and ばいい are mainly advice, though たらいい can also hope.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～たらいい (〜tara ii)
        - source_id: hanabira
          level: N4
          item: ～ばいい (〜ba ii)
    references:
      - source_id: hanabira
        ref: ～たらいい／～ばいい
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: といいですか (何を持っていくといいですか) is also used to ask for advice; the entry leaves it out. Is that right for N4?
  - id: OJG-0349
    pattern: ～ようだ
    title: It seems, it appears (judging from evidence)
    meaning: 'Plain form + ようだ／ようです: "it seems that…", "it looks as if…"; a conclusion drawn from evidence.'
    when: "Use it when you conclude something from what you have seen, heard or noticed: 電気が消えています。誰もいないようです, \"the lights are off; it seems nobody's there\". It is a little more formal than みたい, and common in careful speech and writing."
    why: 'よう means "appearance, likeness". ようだ says "it has the look of…": the speaker has some evidence and draws a conclusion, without stating it as certain. So it is less sure than はず, which reasons from known facts to what must be, and unlike stem + そう it is not limited to how something looks. It joins like a noun: の after a noun (休みのようだ), な after a な-adjective (静かなようだ), and plain forms after verbs and い-adjectives.'
    formation:
      - form: Verb / い-adjective (plain form) + ようだ
        note: いないようだ, 降ったようだ, 忙しいようだ.
      - form: な-adjective + な + ようだ; Noun + の + ようだ
        note: 静かなようだ, 休みのようだ. Polite ようです.
    examples:
      - japanese: 電気が消えています。誰もいないようです。
        reading: でんきがきえています。だれもいないようです。
        romaji: denki ga kiete imasu. dare mo inai yō desu.
        english: The lights are off. It seems nobody's there.
      - japanese: 道がぬれています。夜の間に雨が降ったようです。
        reading: みちがぬれています。よるのあいだにあめがふったようです。
        romaji: michi ga nurete imasu. yoru no aida ni ame ga futta yō desu.
        english: The road is wet. It seems it rained during the night.
      - japanese: 田中さんは今日は忙しいようです。
        reading: たなかさんはきょうはいそがしいようです。
        romaji: tanaka-san wa kyō wa isogashii yō desu.
        english: Tanaka-san seems to be busy today.
      - japanese: この店は、日曜日は休みのようです。
        reading: このみせは、にちようびはやすみのようです。
        romaji: kono mise wa, nichiyōbi wa yasumi no yō desu.
        english: It looks like this shop is closed on Sundays.
    mistake:
      wrong: あの人は学生ようです。
      problem: After a noun, よう needs の.
      right: あの人は学生のようです。
    distinguish_from:
      - id: OJG-0068
        note: みたい means the same, is more conversational, and joins nouns and な-adjectives directly (学生みたい).
      - id: OJG-0061
        note: そう after a stem is an impression from appearance, before you know. ようだ is a conclusion from evidence of any kind.
      - id: OJG-0075
        note: はず reasons from known facts to what should be so. ようだ concludes from what you observe, less firmly.
    register:
      - plain
      - polite
      - written
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～ようだ (〜you da)
    references:
      - source_id: hanabira
        ref: ～ようだ
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
