  - id: OJG-0347
    pattern: ～ずつ
    title: Each, at a time
    meaning: 'Quantity + ずつ: "X each", "X at a time"; the same amount for each person, or in each step.'
    when: 'Use it after a number or amount to say it is shared out equally or repeated in equal steps: 子どもたちにりんごを二つずつあげました, "I gave the children two apples each"; 毎日少しずつ, "a little at a time every day"; 一人ずつ入ってください, "please come in one at a time".'
    why: 'ずつ follows a quantity and repeats it across units: for each person, each day, each turn, the same amount. That is why it follows numbers and words of amount (少し, 一つ, 一人, 半分), not ordinary nouns. 少しずつ, "little by little", is a very common use. A quantity with ずつ usually works like an adverb with no particle, as in these examples, but it can take one where needed (二人ずつのグループ, "groups of two").'
    formation:
      - form: Number + counter + ずつ
        note: 二つずつ, 一人ずつ, 一冊ずつ.
      - form: Word of amount + ずつ
        note: 少しずつ, 半分ずつ.
    examples:
      - japanese: 子どもたちにりんごを二つずつあげました。
        reading: こどもたちにりんごをふたつずつあげました。
        romaji: kodomotachi ni ringo o futatsu zutsu agemashita.
        english: I gave the children two apples each.
      - japanese: 毎日少しずつ漢字を覚えています。
        reading: まいにちすこしずつかんじをおぼえています。
        romaji: mainichi sukoshi zutsu kanji o oboete imasu.
        english: I'm learning kanji a little at a time every day.
      - japanese: 一人ずつ部屋に入ってください。
        reading: ひとりずつへやにはいってください。
        romaji: hitori zutsu heya ni haitte kudasai.
        english: Please come into the room one at a time.
    mistake:
      wrong: 学生ずつ本を一冊もらいました。
      problem: ずつ follows the quantity that is repeated, not the people it is shared among.
      right: 学生は本を一冊ずつもらいました。
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～ずつ (〜zutsu)
    references:
      - source_id: hanabira
        ref: ～ずつ
    review:
      status: draft
