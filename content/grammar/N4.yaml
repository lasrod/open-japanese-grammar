  - id: OJG-0082
    pattern: ～てある
    title: Something has been done on purpose, and the result remains
    meaning: "V-てある: someone deliberately did V to it, and it is still that way. The doer is not mentioned."
    when: "Use it to describe the state a thing is in because someone did something to it on purpose and left it that way, often in preparation for later: the plates are set out, the window has been opened, a name has been written. The sentence is about the thing and the result, not about who did it."
    why: 'ある says that a thing is there. After the て-form of a verb, it says the result of that action is there: 置いてある is "placed, and there". Because ある presents things rather than people, the doer drops out, and the thing the action was done to becomes the subject, usually marked with が, or with は when it is already the topic. Something must have been done to the thing, so only verbs that take を work. A verb like 開く (to open, by itself) has no one acting on anything, and its state is said with ている instead: 窓が開いている.'
    formation:
      - form: V (transitive, て-form) + ある
        note: "Polite: V (て-form) + あります. The helper is always ある, never いる."
      - form: thing が／は … V-てある
        note: The thing acted on is the subject, marked with が, or は as the topic.
    examples:
      - japanese: 本は机の上に置いてあります。
        reading: ほんはつくえのうえにおいてあります。
        english: The book has been put on the desk.
      - japanese: テーブルの上にお皿が置いてあります。
        reading: テーブルのうえにおさらがおいてあります。
        english: Plates have been set out on the table.
      - japanese: ここに名前が書いてあります。
        reading: ここになまえがかいてあります。
        english: A name has been written here.
    mistake:
      wrong: 窓が開いてあります。
      problem: 開く means the window opens by itself, and nobody acted on it, so ある has no result of an action to present. Use the transitive 開ける to say someone opened it, or 開いている for the plain state.
      right: 窓が開けてあります。
    distinguish_from:
      - id: OJG-0018
        note: ている says a thing is in a state (窓が開いている). てある says someone put it in that state on purpose (窓が開けてある). ている also describes people doing things; てある never does.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～てある
          ref: 526
    references:
      - source_id: tanos
        ref: 526
    review:
      status: draft
      note: Adapted from the Mieru Nihongo note on 〜てあります, which two models agreed on (2026-09-21), and rewritten to stand on its own. The rewrite is new text, so it starts again at draft. The を〜てある variant (窓を開けてある) is left out on purpose; it wants its own careful note.
