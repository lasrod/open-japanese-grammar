          verdict: disagree
          content_sha256: 317c1feeb8919e88db1c520e362fd740bd99b6834b1a17b8fff7eeaf5eabe9b8
          note: "The ban on open-ended verbs such as 待つ is too strong. A contextually bounded activity can take 終わる, as in 決められた時間を待ち終わる. Replace that explanation with: '終わる presents an activity as reaching its endpoint. That endpoint may come from the task itself or from context; without an identifiable endpoint, the compound can sound unnatural.' Also, 本を読むのが終わりました is not inherently a grammatical mistake: a nominalized activity can be the subject of 終わる. Use a clear formation error instead: wrong '本を読む終わりました。'; right '本を読み終わりました。'; problem '終わる attaches to the ます-stem 読み, not the dictionary form 読む.'"
  - id: OJG-0343
    pattern: ～続ける
    title: Keep on doing
    meaning: 'V (ます-stem) + 続ける: "keep V-ing", "continue to V"; an action goes on, or keeps being repeated, over time.'
    when: 'Use it for an action that goes on, often longer than expected or in spite of something: 三時間歩き続けました, "I kept walking for three hours". For things that happen by themselves, such as rain, 続く is also used: 雨が降り続いています.'
    why: '続ける is "continue (something)". Joined to a ます-stem, it says the action keeps going, not necessarily without breaks: 勉強し続ける can cover years of study. It is an ichidan verb (続けます, 続けて). It fits actions that can last or be repeated (歩く, 待つ, 話す, 勉強する); a single instant cannot be stretched, though repeated occurrences can. A few set compounds use 続く instead, such as 降り続く, and 降り続ける is used too; 続く cannot be swapped in freely. For a する-verb, the stem is し: 勉強し続ける.'
    formation:
      - form: V (ます-stem) + 続ける
        note: 歩き続ける, 待ち続ける, 話し続ける, 勉強し続ける.
      - form: Some set compounds with 続く
        note: 降り続く. Not a free alternative to 続ける.
    examples:
      - japanese: 駅から三時間歩き続けました。
        reading: えきからさんじかんあるきつづけました。
        romaji: eki kara sanjikan arukitsuzukemashita.
        english: I kept walking for three hours from the station.
      - japanese: 彼は一時間話し続けました。
        reading: かれはいちじかんはなしつづけました。
        romaji: kare wa ichijikan hanashitsuzukemashita.
        english: He kept talking for an hour.
      - japanese: 雨が一週間降り続いています。
        reading: あめがいっしゅうかんふりつづいています。
        romaji: ame ga isshūkan furitsuzuite imasu.
        english: It has been raining non-stop for a week.
    mistake:
      wrong: 毎日日本語を勉強続けています。
      problem: 続ける joins the ます-stem, and for a する-verb that is し.
      right: 毎日日本語を勉強し続けています。
    distinguish_from:
      - id: OJG-0342
        note: 終わる says the action reached its end. 続ける says it keeps going.
      - id: OJG-0018
        note: ている says an action is under way. 続ける stresses that it goes on and on.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb + 続ける (つづける, tsuzukeru)
    references:
      - source_id: hanabira
        ref: ～続ける
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 3dc372e4887fd99c7e026d5bec55be8d0ec37831cc80b050d4c08e8c0d28203b
          note: "'Without stopping' is too restrictive: 勉強し続ける can describe sustained practice over years with ordinary breaks. Write 'continue an activity or keep repeating it over time; not necessarily without breaks.' Likewise, replace the blanket exclusion of one-moment verbs with: 'A single instantaneous event cannot be prolonged, but repeated occurrences can be presented as continuing.' Finally, V-stem + 続く is not a freely productive alternative selected whenever an event has no human agent. Replace that formation row and its explanation with: 'Some established compounds use 続く, for example 降り続く. 続ける is also possible with natural events: 雨が降り続けている. Do not substitute 続く freely for 続ける.'"
  - id: OJG-0344
    pattern: ～方
    title: How to do, the way of doing
    meaning: 'V (ます-stem) + 方 (かた): "the way of V-ing", "how to V"; makes a noun.'
    when: 'Use it to talk about how something is done: この漢字の読み方, "how to read this kanji"; この機械の使い方を教えてください, "please show me how to use this machine". Common ones are 作り方, "recipe, how to make"; 行き方, "how to get there"; and 書き方.'
    why: "方, read かた, means \"way, manner\". Joined to a ます-stem, it makes a noun: 読み方 is \"way of reading\". Because the result is a noun, the verb's を-object joins it with の instead: 漢字を読む → 漢字の読み方. Other relations use a noun-linking form such as までの or への: 駅までの行き方. に cannot simply take の; use への, or rephrase. For a する-verb, し + 方 is 仕方 (しかた): 勉強の仕方. The same kanji read ほう is a different word, \"side, direction\", as in ほうがいい."
    formation:
      - form: V (ます-stem) + 方
        note: The を-object becomes Noun + の. Other relations use までの, への, での and similar.
      - form: Noun + の + 仕方
        note: For する-verbs, 勉強の仕方.
    examples:
      - japanese: この漢字の読み方を教えてください。
        reading: このかんじのよみかたをおしえてください。
        romaji: kono kanji no yomikata o oshiete kudasai.
        english: Please tell me how to read this kanji.
      - japanese: 駅までの行き方がわかりません。
        reading: えきまでのいきかたがわかりません。
        romaji: eki made no ikikata ga wakarimasen.
        english: I don't know how to get to the station.
      - japanese: 母にカレーの作り方を習いました。
        reading: ははにカレーのつくりかたをならいました。
        romaji: haha ni karē no tsukurikata o naraimashita.
        english: I learned how to make curry from my mother.
    mistake:
      wrong: この機械を使い方を教えてください。
      problem: 使い方 is a noun, so the verb's object joins it with の. The を belongs to 教えて.
      right: この機械の使い方を教えてください。
    distinguish_from:
      - id: OJG-0035
        note: 方 read ほう, as in ほうがいい, is a different word ("side, direction"). 方 read かた after a ます-stem is "way of doing".
    register:
      - plain
      - polite
    levels:
