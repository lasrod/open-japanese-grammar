          verdict: disagree
          content_sha256: 1759cbd935b66f3c00b6ceea223073b0934223b65c9ff9ea93f1492d0221b468
          note: "The final sentence of 'why' overstates the particle restriction: quantity + ずつ can take a following particle, as in 二人ずつのグループ. Replace it with: 'Quantity + ずつ is commonly used adverbially without an additional particle, as in the examples here. It can also take a following particle when the construction requires one, as in 二人ずつのグループ (groups of two).' Also replace the unsupported frequency ranking 'its most common use' with 'a very common expression.'"
  - id: OJG-0348
    pattern: ～たらいい／～ばいい
    title: What should I do? You just need to…
    meaning: 'V-たらいい／V-ばいい: asks for advice (どうしたらいいですか, "what should I do?") or gives it ("you just need to V").'
    when: 'Use it with a question word to ask for advice: 駅までどうやって行ったらいいですか, "how should I get to the station?"; 何を持っていけばいいですか. As an answer, it gives advice, often "all you need to do is": このボタンを押せばいいです. It can also express a hope: 晴れたらいいですね.'
    why: 'The conditional (たら or ば) sets up "if you do V", and いい judges it: "if you do V, it will be good". So どうしたらいい asks "if I do what, will it be good?", the natural way to ask for advice in Japanese. As an answer it says V is enough for a good result, so it often means "you only have to". たら and ば are largely interchangeable here; たらいい is a little more conversational. With the past, ばよかった, the same shape becomes regret.'
    formation:
      - form: V (た-form) + らいい
        note: 行ったらいい, したらいい. Polite いいですか／いいです.
      - form: V (ば-form) + いい
        note: 行けばいい, すればいい.
      - form: Question word … たら／ばいいですか
        note: どうしたらいいですか, 何を持っていけばいいですか.
    examples:
      - japanese: 駅までどうやって行ったらいいですか。
        reading: えきまでどうやっていったらいいですか。
        romaji: eki made dō yatte ittara ii desu ka.
        english: How should I get to the station?
      - japanese: 「何を持っていけばいいですか。」「飲み物だけ持ってくればいいですよ。」
        reading: 「なにをもっていけばいいですか。」「のみものだけもってくればいいですよ。」
        romaji: '"nani o motte ikeba ii desu ka." "nomimono dake motte kureba ii desu yo."'
        english: '"What should I bring?" "You only need to bring something to drink."'
      - japanese: わからないときは、先生に聞けばいいです。
        reading: わからないときは、せんせいにきけばいいです。
        romaji: wakaranai toki wa, sensei ni kikeba ii desu.
        english: When you don't understand, just ask the teacher.
    mistake:
      wrong: 駅まで、どうやって行ってもいいですか。
      problem: Meant as "how should I get to the station?". てもいいですか asks for permission. To ask how you should do something, use たらいい or ばいい.
      right: 駅まで、どうやって行ったらいいですか。
    distinguish_from:
      - id: OJG-0072
        note: ばよかった looks back with regret. ばいい gives advice about what to do.
      - id: OJG-0049
        note: たらどうですか offers a suggestion to the listener. たらいい is mostly used to ask for advice, or to say what is enough.
      - id: OJG-0059
        note: といい is mainly a hope. たらいい and ばいい are mainly advice, though たらいい can also hope.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～たらいい (〜tara ii)
        - source_id: hanabira
          level: N4
          item: ～ばいい (〜ba ii)
    references:
