  - id: OJG-0342
    pattern: ～終わる
    title: Finish doing
    meaning: 'V (ます-stem) + 終わる: "finish V-ing"; the action is carried through to its end.'
    when: "Use it to say an action has been completed: やっと本を読み終わりました, \"I've finally finished reading the book\"; 食べ終わったら、お皿を洗ってください. It fits actions with a natural end: reading a book, eating a meal, writing a report."
    why: '終わる means "come to an end". Joined to a ます-stem, it says the action reached its end: 読み終わる is "read to the end". Because there has to be an end to reach, it suits actions with a clear end point, given by the task itself (a book, a meal, a letter) or by the context; without one, the compound sounds odd. The object of the first verb keeps を: 本を読み終わる. In writing, 終える is also used (読み終える).'
    formation:
      - form: V (ます-stem) + 終わる
        note: 読み終わる, 食べ終わる, 書き終わる. Written style also 終える.
    examples:
      - japanese: やっと本を読み終わりました。
        reading: やっとほんをよみおわりました。
        romaji: yatto hon o yomiowarimashita.
        english: I've finally finished reading the book.
      - japanese: 食べ終わったら、お皿を洗ってください。
        reading: たべおわったら、おさらをあらってください。
        romaji: tabeowattara, osara o aratte kudasai.
        english: When you've finished eating, please wash the plates.
      - japanese: レポートはもう書き終わりましたか。
        reading: レポートはもうかきおわりましたか。
        romaji: repōto wa mō kakiowarimashita ka.
        english: Have you finished writing the report yet?
    mistake:
      wrong: 本を読む終わりました。
      problem: 終わる joins the ます-stem 読み, not the dictionary form 読む.
      right: 本を読み終わりました。
    distinguish_from:
      - id: OJG-0343
        note: 続ける says the action keeps going. 終わる says it reached its end.
      - id: OJG-0069
        note: てしまう can also mean "finish completely", but often adds regret. 終わる simply reports the end.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb 終わる (〜owaru)
    references:
      - source_id: hanabira
        ref: ～終わる
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
