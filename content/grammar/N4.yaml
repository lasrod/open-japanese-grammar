  - id: OJG-0053
    pattern: ～よう
    title: Let's…, I'll… (the volitional form)
    meaning: "The volitional form (食べよう, 行こう): \"let's V\" in casual speech, or the speaker's own will, \"I'll V\"."
    when: "Use it in casual speech to suggest doing something together (映画を見よう, \"let's watch a film\") or to state, to yourself or others, what you have decided to do (もう寝よう, \"I'll go to bed now\"). With か it offers or consults: 持とうか, \"shall I carry it?\". It is the plain counterpart of ましょう, and the base of ～ようと思う."
    why: "The volitional form expresses the speaker's will. Whether it comes out as \"let's\" or \"I'll\" depends on who is included: about something you and the listener can do together, it invites; about yourself, it declares an intention. Ichidan verbs add よう to the stem (食べよう, 見よう). Godan verbs move their last sound to the お-row and add う (行く → 行こう, 飲む → 飲もう, 待つ → 待とう, 買う → 買おう), which is why lists name the form by both endings, ～よう and ～おう. Because it states a will, everyday speech does not use it for things nobody controls, such as the weather."
    formation:
      - form: Ichidan verb (stem) + よう
        note: 食べる → 食べよう, 起きる → 起きよう, 見る → 見よう.
      - form: Godan verb (last sound to the お-row) + う
        note: 行く → 行こう, 飲む → 飲もう, 話す → 話そう, 待つ → 待とう, 帰る → 帰ろう, 買う → 買おう.
      - form: する → しよう; 来る → 来よう (こよう)
      - form: Volitional + か
        note: 'Offers or consults: 持とうか, "shall I carry it?"; どうしようか, "what shall we do?". Polite: ましょうか.'
    examples:
      - japanese: 疲れたね。ちょっと休もう。
        reading: つかれたね。ちょっとやすもう。
        romaji: tsukareta ne. chotto yasumō.
        english: We're tired, aren't we. Let's take a short break.
      - japanese: 明日から毎日走ろう。
        reading: あしたからまいにちはしろう。
        romaji: ashita kara mainichi hashirō.
        english: From tomorrow, I'll run every day.
        note: Said to yourself, it states an intention.
      - japanese: 重そうだね。持とうか。
        reading: おもそうだね。もとうか。
        romaji: omosō da ne. motō ka.
        english: That looks heavy. Shall I carry it?
      - japanese: 週末、いっしょに映画を見よう。
        reading: しゅうまつ、いっしょにえいがをみよう。
        romaji: shūmatsu, issho ni eiga o miyō.
        english: Let's watch a film together this weekend.
    mistake:
      wrong: 早く行きよう。
      problem: 行く is a godan verb, so よう is not added to its stem. Its last sound moves to the お-row and takes う.
      right: 早く行こう。
    distinguish_from:
      - id: OJG-0012
        note: ましょう is the polite form of the same will and invitation. The volitional form is the plain one, for friends and family and for talking to yourself.
      - id: OJG-0339
        note: ようと思う reports an intention you hold ("I'm thinking of…"). The volitional form on its own states the decision, or invites.
    register:
      - plain
      - casual
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～よう
          ref: 497
    references:
      - source_id: tanos
        ref: 497
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: Tanos lists ～よう (497) and ～おう (498) separately. They are one form, the volitional, split by verb class, so this entry covers both; OJG-0054 is left as a stub for the owner to retire as a duplicate.
