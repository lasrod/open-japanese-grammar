  - id: OJG-0349
    pattern: ～ようだ
    title: It seems, it appears (judging from evidence)
    meaning: 'Plain form + ようだ／ようです: "it seems that…", "it looks as if…"; a conclusion drawn from evidence.'
    when: "Use it when you conclude something from what you have seen, heard or noticed: 電気が消えています。誰もいないようです, \"the lights are off; it seems nobody's there\". It is a little more formal than みたい, and common in careful speech and writing."
    why: 'よう means "appearance, likeness". ようだ says "it has the look of…": the speaker has some evidence and draws a tentative conclusion, without stating it as certain. はず presents something as expected from facts or assumptions; ようだ presents an inference from evidence; stem + そう gives an impression or prediction from what you can see or sense. Their uses overlap. It joins like a noun: の after an affirmative non-past noun (休みのようだ), な after an affirmative non-past な-adjective (静かなようだ), and the plain form otherwise (休みだったようだ, 静かではないようだ, 降ったようだ).'
    formation:
      - form: Verb / い-adjective (plain form) + ようだ
        note: いないようだ, 降ったようだ, 忙しいようだ.
      - form: な-adjective + な + ようだ; Noun + の + ようだ
        note: For affirmative non-past forms (静かなようだ, 休みのようだ). Other forms use the plain ending (静かではないようだ, 学生だったようだ). Polite ようです.
    examples:
      - japanese: 電気が消えています。誰もいないようです。
        reading: でんきがきえています。だれもいないようです。
        romaji: denki ga kiete imasu. dare mo inai yō desu.
        english: The lights are off. It seems nobody's there.
      - japanese: 道がぬれています。夜の間に雨が降ったようです。
        reading: みちがぬれています。よるのあいだにあめがふったようです。
        romaji: michi ga nurete imasu. yoru no aida ni ame ga futta yō desu.
        english: The road is wet. It seems it rained during the night.
      - japanese: 田中さんは今日は忙しいようです。
        reading: たなかさんはきょうはいそがしいようです。
        romaji: tanaka-san wa kyō wa isogashii yō desu.
        english: Tanaka-san seems to be busy today.
      - japanese: この店は、日曜日は休みのようです。
        reading: このみせは、にちようびはやすみのようです。
        romaji: kono mise wa, nichiyōbi wa yasumi no yō desu.
        english: It looks like this shop is closed on Sundays.
    mistake:
      wrong: あの人は学生ようです。
      problem: After a noun, よう needs の.
      right: あの人は学生のようです。
    distinguish_from:
      - id: OJG-0068
        note: みたい means the same, is more conversational, and joins nouns and な-adjectives directly (学生みたい).
      - id: OJG-0061
        note: Stem + そう gives an impression or prediction from what you can see or sense. ようだ presents a tentative conclusion from evidence. They can overlap.
      - id: OJG-0075
        note: はず presents what is expected from facts or assumptions. ようだ presents an inference from what you observe. Neither is a fixed level of certainty.
    register:
      - plain
      - polite
      - written
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: ～ようだ (〜you da)
    references:
      - source_id: hanabira
        ref: ～ようだ
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 30ac53ad241adb8767dc8bd61d4b33f47ca5e250f6f46eb99829cbf554fe1262
          note: "The contrast with stem + そう incorrectly limits そう to visual appearance. It can express an impression based on nonvisual information or predict an imminent event. Replace that comparison in 'why' and the OJG-0061 note with: 'Stem + そう expresses an impression or prediction from available cues; these need not be visual. ようだ presents a tentative conclusion drawn from evidence. Their uses can overlap.' The comparison with はず is also too categorical about certainty. Replace it with: 'はずだ presents something as expected on the basis of facts or assumptions; ようだ presents it as an inference from evidence. This is not a fixed ranking of certainty.' Finally, the noun/な-adjective formation covers only affirmative nonpast forms. Add: 'For past and negative forms, use the corresponding plain form before ようだ: 静かだったようだ, 静かではないようだ, 学生だったようだ, 学生ではなかったようだ. Do not add な or の after these forms.'"
