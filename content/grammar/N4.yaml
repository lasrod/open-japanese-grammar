          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: agree
          content_sha256: 68092192bbae5afd1d4e028b8d3d81fd1b9a8c162546b585d24df4274a92d401
  - id: OJG-0337
    pattern: ～ていく／～てくる
    title: Going and coming, in space and in time
    meaning: "V-ていく／V-てくる: do V and go / come; also change going on from a point in time (ていく) or up to it (てくる)."
    when: "Use them first for movement: 傘を持っていく, \"take an umbrella (with you)\"; パンを買ってくる, \"go and buy bread (and come back)\". Then for change over time: これからもっと寒くなっていく, \"it will keep getting colder\"; 日本語がわかってきた, \"I've begun to understand Japanese\". てくる also marks a change beginning to show: 雨が降ってきた, \"it's started to rain\"."
    why: 'いく and くる are "go" and "come": away from a point of view and towards it. After the て-form, they add that direction to the action. The point of view is usually where the speaker is, and in time, usually now, though context can shift both. In space, 持っていく is "hold it and go (away)" and 持ってくる is "hold it and come (here)". In time, ていく is change going forward, and てくる is change that has come up to the reference point, or is just beginning to show (雨が降ってきた). As helpers, いく and くる are usually written in kana.'
    formation:
      - form: V (て-form) + いく
        note: "Polite: ていきます. Casual: てく (持ってく)."
      - form: V (て-form) + くる
        note: "Polite: てきます."
    examples:
      - japanese: 雨が降りそうだから、傘を持っていきます。
        reading: あめがふりそうだから、かさをもっていきます。
        romaji: ame ga furisō da kara, kasa o motte ikimasu.
        english: It looks like rain, so I'll take an umbrella.
      - japanese: ちょっとパンを買ってきます。
        reading: ちょっとパンをかってきます。
        romaji: chotto pan o katte kimasu.
        english: I'll just pop out and buy some bread.
        note: Go, do V, and come back.
      - japanese: だんだん日本語がわかってきました。
        reading: だんだんにほんごがわかってきました。
        romaji: dandan nihongo ga wakatte kimashita.
        english: I've gradually started to understand Japanese.
      - japanese: これからもっと寒くなっていくでしょう。
        reading: これからもっとさむくなっていくでしょう。
        romaji: kore kara motto samuku natte iku deshō.
        english: It will probably keep getting colder from now on.
    mistake:
      wrong: 学校にお弁当を持ってきます。
      problem: Said to a family member at home, from home's point of view. The lunch goes away from there to school, so it is ていく. てくる would need the school as the point of view.
      right: 学校にお弁当を持っていきます。
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: hanabira
          level: N4
          item: Verb て いく (Verb-te iku)
        - source_id: hanabira
          level: N4
          item: Verb て くる (Verb te kuru)
