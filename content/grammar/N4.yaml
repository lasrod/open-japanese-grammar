        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: b86d51bc57be8d8eb0fa40ad1d2df0a83302c3b0f466e8ac187e731d53c6b786
          note: "The mistake diagnosis falsely says that 一 + counter + も requires a negative. Affirmative 一時間も, already used in this entry, disproves this; even 一つも can emphasize one whole item when that counts as a lot. Replace the diagnosis with: 'For the neutral statement “I ate one apple,” omit も. Affirmative quantity + も presents that amount as unusually large; 一 + counter + も with a negative means “not even one.”' Label the original as unsuitable for that neutral intended meaning, not ungrammatical. Also replace 'So it carries surprise or complaint' with 'It emphasizes the amount as large and can express surprise, admiration, or complaint.'"
  - id: OJG-0051
    pattern: しか～ない
    title: Only, nothing but
    meaning: 'X しか + negative: "only X", "nothing but X"; often suggests that X is little, or less than wanted.'
    when: 'Use it to say something is limited to X, often with a feeling that it is not enough: 五百円しかありません, "I only have 500 yen". It follows nouns and numbers, and can follow other particles: 日曜日にしか, 田中さんとしか.'
    why: 'しか marks X as the one exception to a negative: "apart from X, there is none". So the verb must be negative, even though English says it positively ("I only have…"). With amounts, this framing often suggests shortage: 五百円しかない can sound like "just 500 yen, not enough", where 五百円だけある is neutral. With habits it may simply mean "nothing else": 朝はコーヒーしか飲みません. しか normally replaces が and を; other particles usually stay in front of it (にしか, からしか).'
    formation:
      - form: Noun / number + しか + negative
        note: しかない, しかありません, しか食べない. が and を are normally replaced by しか.
      - form: Noun + particle + しか + negative
        note: にしか, でしか, としか, からしか.
    examples:
      - japanese: 財布に五百円しかありません。
        reading: さいふにごひゃくえんしかありません。
        romaji: saifu ni gohyakuen shika arimasen.
        english: I only have 500 yen in my wallet.
      - japanese: 朝はコーヒーしか飲みません。
        reading: あさはコーヒーしかのみません。
        romaji: asa wa kōhī shika nomimasen.
        english: In the morning, I drink nothing but coffee.
      - japanese: この店は日曜日にしか開いていません。
        reading: このみせはにちようびにしかあいていません。
        romaji: kono mise wa nichiyōbi ni shika aite imasen.
        english: This shop is only open on Sundays.
    mistake:
      wrong: 五百円しかあります。
      problem: しか needs a negative verb, even though English says "only have".
      right: 五百円しかありません。
    distinguish_from:
      - id: OJG-0309
        note: だけ expresses a limit with a positive or negative verb (五百円だけある). しか needs a negative, excludes everything else, and with amounts often suggests it is not enough.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: しか～ない
          ref: 495
    references:
      - source_id: tanos
        ref: 495
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
