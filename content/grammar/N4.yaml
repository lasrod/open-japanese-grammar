  - id: OJG-0339
    pattern: ～ようと思う
    title: I'm thinking of doing…
    meaning: "Volitional + と思う: \"I'm thinking of V-ing\", \"I intend to V\"; an intention the speaker has formed."
    when: "Use it to tell someone what you intend to do: 夏休みに国へ帰ろうと思います, \"I'm thinking of going home for the summer holidays\". と思っている presents an intention you currently hold: 来年、日本語の試験を受けようと思っています."
    why: "The volitional form (帰ろう) is the speaker's will, \"I'll go home\", and と思う frames it as a thought: \"I think, 'I'll go home'\". So it reports an intention, which can be one just formed, and sounds gentler than a bare declaration. と思っている presents the intention as currently held, often after some thought, and can also report someone else's intention: 兄は車を買おうと思っています."
    formation:
      - form: V (volitional) + と思う
        note: 帰ろうと思う, 受けようと思う, しようと思う.
      - form: V (volitional) + と思っている
        note: An intention currently held, often considered for a while; or someone else's.
    examples:
      - japanese: 夏休みに国へ帰ろうと思います。
        reading: なつやすみにくにへかえろうとおもいます。
        romaji: natsuyasumi ni kuni e kaerō to omoimasu.
        english: I'm thinking of going back to my country for the summer holidays.
      - japanese: 来年、日本語の試験を受けようと思っています。
        reading: らいねん、にほんごのしけんをうけようとおもっています。
        romaji: rainen, nihongo no shiken o ukeyō to omotte imasu.
        english: I'm planning to take a Japanese exam next year.
      - japanese: 今晩は早く寝ようと思います。
        reading: こんばんははやくねようとおもいます。
        romaji: konban wa hayaku neyō to omoimasu.
        english: I think I'll go to bed early tonight.
    mistake:
      wrong: 夏休みに国へ帰ると思います。
      problem: Meant as an intention. The dictionary form + と思う is a prediction, "I think I'll (probably) go home". For your own intention, use the volitional form.
      right: 夏休みに国へ帰ろうと思います。
    distinguish_from:
      - id: OJG-0053
        note: The volitional form on its own declares a decision or invites. With と思う it reports an intention.
      - id: OJG-0027
        note: つもり generally presents an intention as more settled. ようと思う is often less definite.
      - id: OJG-0331
        note: と思う after an ordinary plain form gives an opinion or prediction, not an intention.
    register:
      - plain
      - polite
