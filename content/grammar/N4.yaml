  - id: OJG-0055
    pattern: ～てあげる
    title: Doing something for someone
    meaning: "V-てあげる: do V for someone else's benefit; the favour goes out from you or your side."
    when: 'Use it when you, or someone on your side, do something for another person: 妹に本を読んであげました, "I read a book to my little sister". The person who benefits keeps whatever particle the verb needs (友だちを駅まで送ってあげた, 友だちの宿題を見てあげた), or takes に where the verb has no place for them.'
    why: "あげる is \"give\", outward from the speaker's side. After the て-form it gives the action itself as a favour, so the direction is the same: from me, or my side, to others. Because it presents what you do as a kindness, saying it to the person you are helping can sound condescending, like \"I'll do you the favour\". Offers are made with ましょうか instead (持ちましょうか). For a favour that comes to you, use てくれる or てもらう."
    formation:
      - form: V (て-form) + あげる
        note: "Polite: てあげます. Humble, towards someone above the receiver: てさしあげる (OJG-0326), which has the same problem when said to their face."
    examples:
      - japanese: 妹に本を読んであげました。
        reading: いもうとにほんをよんであげました。
        romaji: imōto ni hon o yonde agemashita.
        english: I read a book to my little sister.
      - japanese: 友だちを車で駅まで送ってあげました。
        reading: ともだちをくるまでえきまでおくってあげました。
        romaji: tomodachi o kuruma de eki made okutte agemashita.
        english: I gave my friend a lift to the station.
      - japanese: 兄は友だちに料理を作ってあげました。
        reading: あにはともだちにりょうりをつくってあげました。
        romaji: ani wa tomodachi ni ryōri o tsukutte agemashita.
        english: My older brother cooked for his friend.
    mistake:
      wrong: 先生、荷物を持ってあげます。
      problem: てあげる frames your help as a favour you are granting. Said to the person you are helping, and especially to a superior, it sounds condescending. Offer with ましょうか.
      right: 先生、荷物を持ちましょうか。
    distinguish_from:
      - id: OJG-0056
        note: てくれる is a favour that comes in, to you or your side. てあげる is a favour going out from your side.
      - id: OJG-0322
        note: あげる gives a thing. てあげる gives an action.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～てあげる
          ref: 499
    references:
      - source_id: tanos
        ref: 499
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0056
    pattern: ～てくれる
    title: Someone does something for me
    meaning: "V-てくれる: someone does V for the speaker or the speaker's side; the doer is the subject, and the favour comes in."
    when: "Use it when someone does something that benefits you or someone on your side, and you want to show it was a kindness: 友だちが駅まで迎えに来てくれました. The doer is the subject (が or は); since the favour comes to you, 私に is usually left out. It also makes casual requests: 手伝ってくれる？"
    why: "くれる is \"give (to me)\": it points only inward, towards the speaker's side. After the て-form it hands an action to you as a gift. 母が弁当を作りました only states a fact; 母が弁当を作ってくれました shows it was done for you and that you appreciate it, and leaving it out where someone did you a favour can sound cold. Because the direction is fixed, the one who benefits is always you or your side, never an outsider."
    formation:
      - form: V (て-form) + くれる
        note: "Polite: てくれます. Honorific: てくださる (OJG-0326). Requests: てくれる？, てくれませんか (OJG-0327)."
    examples:
      - japanese: 友だちが駅まで迎えに来てくれました。
        reading: ともだちがえきまでむかえにきてくれました。
        romaji: tomodachi ga eki made mukae ni kite kuremashita.
        english: My friend came to meet me at the station.
      - japanese: 母がお弁当を作ってくれました。
        reading: ははがおべんとうをつくってくれました。
        romaji: haha ga obentō o tsukutte kuremashita.
        english: My mother made me a packed lunch.
      - japanese: 田中さんが道を教えてくれました。
        reading: たなかさんがみちをおしえてくれました。
        romaji: tanaka-san ga michi o oshiete kuremashita.
        english: Tanaka-san showed me the way.
    mistake:
      wrong: 私は友だちに宿題を手伝ってくれました。
      problem: With てくれる the doer is the subject and the favour comes to you. 私は makes you the doer. Make the friend the subject, or keep 私は and use てもらう.
      right: 友だちが宿題を手伝ってくれました。
    distinguish_from:
      - id: OJG-0057
        note: Same event, other viewpoint. てくれる makes the doer the subject; てもらう makes the receiver the subject and marks the doer with に.
      - id: OJG-0055
        note: てあげる is a favour going out from your side. てくれる is one coming in.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～てくれる
          ref: 500
    references:
      - source_id: tanos
        ref: 500
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0057
    pattern: ～てもらう
    title: Having someone do something for you
    meaning: "V-てもらう: have someone do V for you; the receiver is the subject, and the doer is marked with に."
    when: "Use it to tell a favour from the receiver's side: 友だちに宿題を手伝ってもらいました, \"I had my friend help me with my homework\". It also covers getting something done by someone (時計を直してもらう, \"get a watch repaired\") and forms polite requests (てもらえませんか)."
    why: "もらう is \"receive\". After the て-form it receives an action: you receive someone's doing V. So the subject is the one who benefits, and the one who acts is the source, marked with に just as in 友だちにもらった. Compared with てくれる, the event is the same but told from the receiver's side, and it can suggest you asked for it or arranged it. For a kindness nobody asked for, てくれる is often more natural."
    formation:
      - form: (receiver は) doer に … V (て-form) + もらう
        note: "Polite: てもらいます. Humble: ていただく (OJG-0326). Request: てもらえませんか (OJG-0327)."
    examples:
      - japanese: 友だちに宿題を手伝ってもらいました。
        reading: ともだちにしゅくだいをてつだってもらいました。
        romaji: tomodachi ni shukudai o tetsudatte moraimashita.
        english: I had my friend help me with my homework.
      - japanese: 店の人に写真を撮ってもらいました。
        reading: みせのひとにしゃしんをとってもらいました。
        romaji: mise no hito ni shashin o totte moraimashita.
        english: I had someone from the shop take a photo for me.
      - japanese: 壊れた時計を直してもらいました。
        reading: こわれたとけいをなおしてもらいました。
        romaji: kowareta tokei o naoshite moraimashita.
        english: I had my broken watch repaired.
    mistake:
      wrong: 友だちが私に本を貸してもらいました。
      problem: With てもらう the subject is the receiver. Here the friend did the lending, so either make yourself the subject and mark the friend with に, or keep the friend as subject with てくれる.
      right: 私は友だちに本を貸してもらいました。
    distinguish_from:
      - id: OJG-0056
        note: てくれる tells the same favour with the doer as subject. てもらう tells it with the receiver as subject.
      - id: OJG-0324
        note: もらう receives a thing. てもらう receives an action.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～てもらう
          ref: 501
    references:
      - source_id: tanos
        ref: 501
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
  - id: OJG-0058
    pattern: ～ていただけませんか
    title: Could you possibly…? (a very polite request)
    meaning: 'V-ていただけませんか: "could you please V?"; a very polite request, asked as whether you may receive the favour.'
    when: "Use it for polite requests to strangers, customers, teachers, or anyone above you, especially for a real favour: もう少しゆっくり話していただけませんか. Less formal members of the same family are てもらえませんか, てくださいませんか and てくれませんか."
    why: "いただく is the humble verb for \"receive\", and いただける is its potential form, \"can receive\". ませんか asks in the negative. Put together: \"can't I receive your doing V?\". The request is softened twice: it asks about your receiving instead of telling the listener to act, and the negative question leaves room for no. Since the speaker is the one receiving, the listener, who does the action, is usually not named."
    formation:
      - form: V (て-form) + いただけませんか
        note: いただけますか is a little less soft. いただけないでしょうか is softer still.
    examples:
      - japanese: もう少しゆっくり話していただけませんか。
        reading: もうすこしゆっくりはなしていただけませんか。
        romaji: mō sukoshi yukkuri hanashite itadakemasen ka.
        english: Could you speak a little more slowly, please?
      - japanese: すみません、この字の読み方を教えていただけませんか。
        reading: すみません、このじのよみかたをおしえていただけませんか。
        romaji: sumimasen, kono ji no yomikata o oshiete itadakemasen ka.
        english: Excuse me, could you tell me how to read this character?
      - japanese: 明日までに書類を送っていただけませんか。
        reading: あしたまでにしょるいをおくっていただけませんか。
        romaji: ashita made ni shorui o okutte itadakemasen ka.
        english: Could you send the documents by tomorrow?
    mistake:
      wrong: 先生、この本を貸していただきませんか。
      problem: The request needs the potential form いただける, "can I receive". いただきませんか asks "won't (we) receive?", which is not a request to the listener.
      right: 先生、この本を貸していただけませんか。
    distinguish_from:
      - id: OJG-0327
        note: てくれませんか, てもらえませんか and てくださいませんか make the same request less formally. ていただけませんか is the most polite of the everyday forms.
    register:
      - polite
      - humble
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
