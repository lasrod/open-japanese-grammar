  - id: OJG-0055
    pattern: ～てあげる
    title: Doing something for someone
    meaning: "V-てあげる: do V for someone else's benefit; the action is presented as a favour done for another person."
    when: 'Use it when you, or anyone, do something for another person: 妹に本を読んであげました, "I read a book to my little sister"; 兄は友だちに料理を作ってあげました. The person who benefits keeps whatever particle the verb needs (友だちを駅まで送ってあげた, 友だちの宿題を見てあげた), or takes に where the verb has no place for them.'
    why: あげる is "give", towards someone other than the speaker. After the て-form it gives the action itself as a favour. The doer is often the speaker, but can be anyone doing something for someone else; what it never describes is a favour coming to you. Because it presents the action as a kindness, saying it to the person you are helping can sound condescending. For an offer, especially to a superior, ましょうか is safer (持ちましょうか); with friends and family, てあげようか is also heard. For a favour that comes to you, use てくれる or てもらう.
    formation:
      - form: V (て-form) + あげる
        note: "Polite: てあげます. Humble: てさしあげる (OJG-0326), to show respect to the one who benefits; said to their face, it can still sound like pointing out a favour."
    examples:
      - japanese: 妹に本を読んであげました。
        reading: いもうとにほんをよんであげました。
        romaji: imōto ni hon o yonde agemashita.
        english: I read a book to my little sister.
      - japanese: 友だちを車で駅まで送ってあげました。
        reading: ともだちをくるまでえきまでおくってあげました。
        romaji: tomodachi o kuruma de eki made okutte agemashita.
        english: I gave my friend a lift to the station.
      - japanese: 兄は友だちに料理を作ってあげました。
        reading: あにはともだちにりょうりをつくってあげました。
        romaji: ani wa tomodachi ni ryōri o tsukutte agemashita.
        english: My older brother cooked for his friend.
    mistake:
      wrong: 先生、荷物を持ってあげます。
      problem: てあげる frames your help as a favour you are granting. Said to the person you are helping, and especially to a superior, it sounds condescending. For a tactful offer, use ましょうか.
      right: 先生、荷物を持ちましょうか。
    distinguish_from:
      - id: OJG-0056
        note: てくれる is a favour coming to you or your side. てあげる is a favour done for someone else.
      - id: OJG-0322
        note: あげる gives a thing. てあげる gives an action.
