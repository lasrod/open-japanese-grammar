          verdict: disagree
          content_sha256: 3010a478d59dcbd1647db7b162394fb36937d4d9ecdb145332e313829c42079b
          note: "The statement that a causee with an objectless verb can take either を or に is too broad. Involuntary events generally require を, as in 子どもを泣かせる; に is not simply an alternative permissive marker. Replace that passage with: 'With many volitional intransitive verbs, the causee can take を or に. を presents the causee more directly as affected by the causation, while に can emphasize the causee’s own agency. This often correlates with making versus allowing, but does not determine that distinction: 子どもを遊ばせる can mean “let the children play.” With involuntary events such as 泣く, the causee normally takes を.'"
  - id: OJG-0063
    pattern: ～なさい
    title: Do it! (a firm instruction from above)
    meaning: "V (ます-stem) + なさい: a firm but not rough instruction, used by parents, teachers and in test questions."
    when: "Use it when someone with authority tells someone else to do something: a parent to a child (早く寝なさい), a teacher to pupils, and in written instructions on tests and exercises (正しいものを選びなさい). Adults normally avoid it with adult equals and superiors, where it sounds commanding; between adults it is heard only in a deliberately scolding, encouraging or joking tone."
    why: なさい comes from なさる, the honorific verb for "do", so it sounds gentler than the plain command form (寝ろ, 食べろ). It is still a command, and using it puts the speaker in the position of someone entitled to give orders, which is why it belongs to parents, teachers and written instructions. Like ます, it joins to the ます-stem. It has no negative form; to tell someone not to do something, other forms are used (～てはいけません, ～ないで).
    formation:
      - form: V (ます-stem) + なさい
        note: 寝る → 寝なさい, 食べる → 食べなさい, 勉強する → 勉強しなさい, 来る → 来なさい.
    examples:
      - japanese: 早く寝なさい。
        reading: はやくねなさい。
        romaji: hayaku nenasai.
        english: Go to bed now.
      - japanese: 野菜も食べなさい。
        reading: やさいもたべなさい。
        romaji: yasai mo tabenasai.
        english: Eat your vegetables too.
      - japanese: 正しいものを一つ選びなさい。
        reading: ただしいものをひとつえらびなさい。
        romaji: tadashii mono o hitotsu erabinasai.
        english: Choose the one correct answer.
        note: A typical test instruction.
    mistake:
      wrong: 田中さん、この書類を見なさい。
      problem: Said to an equal colleague as an ordinary request. なさい sounds commanding or patronising here. Ask with てください, or more politely with ていただけませんか.
      right: 田中さん、この書類を見てください。
    register:
      - spoken
      - written
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～なさい
          ref: 507
    references:
      - source_id: tanos
        ref: 507
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 98b6cf06fd831b2f592b488f4cc3949a81a0257438b7d42b227460cc45a55922
          note: "'Adults do not use it to other adults as equals' is too absolute. Adults can use なさい to peers while adopting an admonishing, parental, encouraging, or joking stance. Replace it with: 'Normally avoid it with adult peers or superiors: it can sound patronizing or commanding. Adults sometimes use it to peers when deliberately adopting an admonishing, encouraging, or joking tone.' In the mistake diagnosis, replace 'between adults at work it is rude' with 'addressed to an equal colleague in an ordinary workplace request, it sounds commanding or patronizing.'"
  - id: OJG-0064
    pattern: ～ば/～れば
    title: If (the condition for a result)
    meaning: 'The ば-form: "if A, (then) B"; A is the condition that brings about or allows B.'
    when: "Use it for a condition and what follows from it: 安ければ買います, \"if it's cheap, I'll buy it\"; このボタンを押せば開きます, \"if you press this button, it opens\". It suits general truths, hypotheses, and questions about how to get a result: どうすれば, \"what do I have to do to…\". For advice, see ばいい (OJG-0348)."
    why: "The ば-form puts the weight on the condition: B holds as long as A is met. That makes it sound a little more logical and neutral than たら. It also explains a restriction: when A is something a person does on purpose and B is a request, invitation or intention for that same person's next action, ば usually sounds unnatural, because B is meant to follow A in time, which is what たら says. When A is a state (ある, いる, adjectives, できる), an event nobody controls, or someone else's action, ば is often fine before a request: 時間があれば、手伝ってください."
    formation:
      - form: Godan verb (last sound to the え-row) + ば
        note: 行く → 行けば, 飲む → 飲めば, 買う → 買えば, ある → あれば.
      - form: Ichidan verb (stem) + れば
        note: 食べる → 食べれば, 見る → 見れば.
      - form: する → すれば; 来る → 来れば (くれば)
      - form: い-adjective (drop い) + ければ
        note: 高い → 高ければ; いい → よければ; ない → なければ.
      - form: Noun / な-adjective + なら (or であれば)
        note: The ば-form of だ is なら; であれば is more formal.
    examples:
      - japanese: 安ければ、買います。
        reading: やすければ、かいます。
        romaji: yasukereba, kaimasu.
        english: If it's cheap, I'll buy it.
      - japanese: このボタンを押せば、ドアが開きます。
        reading: このボタンをおせば、ドアがあきます。
        romaji: kono botan o oseba, doa ga akimasu.
        english: If you press this button, the door opens.
      - japanese: 時間があれば、手伝ってください。
        reading: じかんがあれば、てつだってください。
        romaji: jikan ga areba, tetsudatte kudasai.
        english: If you have time, please help me.
        note: A is a state (ある), so a request after ば is fine.
      - japanese: 急げば、間に合いますよ。
        reading: いそげば、まにあいますよ。
        romaji: isogeba, maniaimasu yo.
        english: If you hurry, you'll make it.
    mistake:
      wrong: 家に帰れば、電話してください。
      problem: Going home is something the listener does, and the request is for their next action once home. ば usually sounds unnatural here; たら says "once A has happened, B".
      right: 家に帰ったら、電話してください。
    distinguish_from:
      - id: OJG-0066
        note: たら puts B after A and takes requests and intentions freely. ば avoids them after an action the same person does on purpose.
      - id: OJG-0070
        note: と typically presents a regular or automatic result. ば covers those and also one-off hypotheses.
      - id: OJG-0044
        note: なら takes up something given and comments on it, and the advice can apply before A.
    register:
      - plain
      - polite
      - written
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～ば/～れば
          ref: 508
    references:
      - source_id: tanos
        ref: 508
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: The restriction on ば before requests and intentions is stated as "usually sounds unnatural"; is that the right strength for N4?
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 1711ddc3b862a39437fcca50d3c32a4fd31fbd3135fbc55fa7a682c25d3e529d
          note: "The restriction on requests, commands, invitations, and intentions after an action is too broad. The strongest restriction concerns a volitional action in A and a subsequent intended action by the same person in B. Different-subject conditions can be natural, for example 田中さんが来れば、教えてください. Replace the restriction with: 'ば is generally unsuitable when A is a volitional action and B requests or expresses a subsequent action by the same person; use たら for that sequence. With a state, a nonvolitional event, or different subjects, requests and intentions can be possible.' Update the たら comparison accordingly. Also replace 'と is for results that always or automatically follow' with 'Conditional と typically presents a regular or automatic consequence; it also has narrative uses for particular events or discoveries.'"
  - id: OJG-0065
    pattern: ～ても
    title: Even if, even though
    meaning: 'て-form + も: "even if", "even though"; B holds whatever happens with A.'
    when: "Use it to say B happens or holds regardless of A: 雨が降っても行きます, \"even if it rains, I'll go\". It works for hypotheses and for facts: 何回聞いても、わかりません, \"however many times I hear it, I don't understand\". With a question word it means \"no matter what, who, how\": 何を食べても."
    why: The て-form joins A to B, and も, "even", marks A as something that might have been expected to change B but does not. So the sentence says B survives even A. With a question word, "even whatever" becomes "no matter what". い-adjectives use their て-form (高くても); nouns and な-adjectives use でも (雨でも, 静かでも). This でも is the same pattern, not the word でも that starts a sentence to mean "but".
    formation:
      - form: V (て-form) + も
        note: "降っても, 食べても, しても. Negative: なくても (OJG-0067)."
      - form: い-adjective (drop い) + くても
        note: 高くても; いい → よくても.
      - form: Noun / な-adjective + でも
        note: 雨でも, 静かでも.
    examples:
      - japanese: 雨が降っても、サッカーの練習はあります。
        reading: あめがふっても、サッカーのれんしゅうはあります。
        romaji: ame ga futte mo, sakkā no renshū wa arimasu.
        english: Even if it rains, there's football practice.
      - japanese: 何回聞いても、わかりません。
        reading: なんかいきいても、わかりません。
        romaji: nankai kiite mo, wakarimasen.
        english: No matter how many times I hear it, I don't understand.
      - japanese: 高くても、このかばんを買いたいです。
        reading: たかくても、このかばんをかいたいです。
        romaji: takakute mo, kono kaban o kaitai desu.
        english: Even if it's expensive, I want to buy this bag.
      - japanese: 日曜日でも、店は開いています。
        reading: にちようびでも、みせはあいています。
        romaji: nichiyōbi demo, mise wa aite imasu.
        english: The shop is open even on Sundays.
    mistake:
      wrong: 寒いても、毎朝走ります。
      problem: An い-adjective forms ても from its て-form, 寒くて, so it is 寒くても.
      right: 寒くても、毎朝走ります。
    distinguish_from:
      - id: OJG-0086
        note: のに is for a fact that turned out against expectation, often with frustration. ても covers hypotheses too, and is neutral.
