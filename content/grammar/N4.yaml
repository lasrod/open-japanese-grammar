  - id: OJG-0086
    pattern: のに
    title: Even though (and that's not how it should be)
    meaning: 'Plain form + のに: "even though A, B"; B goes against what A led you to expect, often with surprise or frustration.'
    when: 'Use it when a result goes against what the first fact would lead you to expect, and you feel something about it: disappointment, surprise, complaint. 一生懸命勉強したのに、試験に落ちました, "even though I studied hard, I failed the exam". Both parts are real facts. Left at the end of a sentence, it sighs: もっと早く言えばよかったのに, "you should have told me sooner".'
    why: In its joining use, のに sets A, taken as a fact, against B, which goes against what A would lead you to expect, often with surprise or dissatisfaction. A is treated as established, not as a mere possibility; for "even if", use ても. B normally states something; it is not a request, invitation or command. At the end of a sentence, のに expresses regret, a wish or reproach, including about things that did not happen. Before のに, an affirmative non-past noun or な-adjective takes な (日曜日なのに, 静かなのに); other forms use the plain ending (日曜日だったのに, 静かではないのに).
    formation:
      - form: Verb / い-adjective (plain form) + のに
        note: 勉強したのに, 来ないのに, 安いのに.
      - form: Noun / な-adjective + な + のに
        note: For affirmative non-past forms (日曜日なのに, 静かなのに). Other forms use the plain ending (日曜日だったのに, 静かではないのに).
    examples:
      - japanese: 一生懸命勉強したのに、試験に落ちました。
        reading: いっしょうけんめいべんきょうしたのに、しけんにおちました。
        romaji: isshōkenmei benkyō shita noni, shiken ni ochimashita.
        english: Even though I studied hard, I failed the exam.
      - japanese: 日曜日なのに、会社に行かなければなりません。
        reading: にちようびなのに、かいしゃにいかなければなりません。
        romaji: nichiyōbi na noni, kaisha ni ikanakereba narimasen.
        english: Even though it's Sunday, I have to go to work.
      - japanese: 約束したのに、彼は来ませんでした。
        reading: やくそくしたのに、かれはきませんでした。
        romaji: yakusoku shita noni, kare wa kimasen deshita.
        english: He promised, and yet he didn't come.
    mistake:
      wrong: 明日雨が降るのに、サッカーをします。
      problem: Meant as "even if it rains tomorrow". For a hypothetical "even if", use ても. With のに, the rain is treated as expected or settled, "although it's going to rain".
      right: 明日雨が降っても、サッカーをします。
    distinguish_from:
      - id: OJG-0065
        note: ても covers "even if" for things that may happen, and does not itself carry dissatisfaction. のに takes A as established, and usually carries a reaction.
      - id: OJG-0290
        note: が and けど mark a broad contrast. のに adds that the result goes against expectation.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: のに
          ref: 530
    references:
      - source_id: tanos
        ref: 530
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: Covers the "even though" のに only. The purpose のに (この箱は本を入れるのに使います, "used for holding books") is a different point and is not written here.
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 22878cfcdd3259468d536a986598af0b4ef24c04f2cac85a5f1dee77c4c0a96f
          note: "The factuality and main-clause restrictions are overstated. のに can concern an expected future fact, and a declaratively stated plan can follow it. Sentence-final のに can also express an unrealized wish or counterfactual reproach, as in the entry's own example. Replace the explanation with: 'In its connecting use, のに presents A as an accepted premise and B as contrary to expectation, often with surprise or dissatisfaction. A may concern the future if treated as established, rather than merely hypothetical. B normally states something rather than directly issuing a request, invitation, or command. Sentence-final のに can express regret, wishes, or reproach, including unrealized situations.' Replace the mistake diagnosis with: 'For the intended hypothetical meaning “even if it rains”, use ても. The original can instead mean “although it is going to rain”, treating the rain as expected or established.' Complete the noun/な-adjective formation: 'Use な for affirmative nonpast forms; otherwise use the appropriate plain copular form: 日曜日だったのに, 静かではないのに, 静かではなかったのに.' In the comparison notes, replace 'ても ... is neutral' with 'ても does not inherently convey dissatisfaction', and 'が and けど simply join two contrasting facts' with 'が and けど express a broader contrast without inherently marking violated expectations'."
  - id: OJG-0087
    pattern: ～のような
    title: Like, such as (before a noun)
    meaning: 'N のような + noun: "a (noun) like N"; compares, or gives N as an example of the kind meant.'
    when: 'Use it before a noun to compare (夢のような一日, "a day like a dream") or to give an example of the kind of thing you mean (ラーメンのような温かい物, "something warm, like ramen"). In conversation, みたいな is common: 東京みたいな町.'
    why: "よう means \"manner, likeness\". The noun joins it with の, and ような then joins the next noun with な, the way a な-adjective does. So N のような X is \"an X of N's kind\". Whether that compares X to N or offers N as an example comes from the context. The form before a verb or adjective is ように (OJG-0088): the choice depends on what comes next."
    formation:
      - form: Noun + の + ような + noun
        note: 夢のような一日, 父のような人.
      - form: Verb (plain form) + ような + noun
        note: 夢を見ているような気持ち, "a feeling as if I were dreaming".
    examples:
      - japanese: 父のような優しい人になりたいです。
        reading: ちちのようなやさしいひとになりたいです。
        romaji: chichi no yō na yasashii hito ni naritai desu.
        english: I want to become a kind person like my father.
      - japanese: ラーメンのような温かい物が食べたいです。
        reading: ラーメンのようなあたたかいものがたべたいです。
        romaji: rāmen no yō na atatakai mono ga tabetai desu.
        english: I want to eat something warm, like ramen.
      - japanese: 夢のような一日でした。
        reading: ゆめのようないちにちでした。
        romaji: yume no yō na ichinichi deshita.
        english: It was a day like a dream.
    mistake:
      wrong: 父ような人になりたいです。
      problem: After a noun, よう needs の.
      right: 父のような人になりたいです。
    distinguish_from:
      - id: OJG-0088
        note: ように goes before a verb or adjective (魚のように泳ぐ). ような goes before a noun.
      - id: OJG-0068
        note: みたいな is the conversational equivalent and joins the noun directly, without の.
