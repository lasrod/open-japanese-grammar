  - id: OJG-0090
    pattern: ～ことにする
    title: Deciding to do something
    meaning: "V (dictionary or ない-form) + ことにする: \"decide to V\", as someone's own decision; ことにしている: \"make a point of V-ing\"."
    when: "Use it to say you, or someone, decided on an action: 来年、日本に留学することにしました, \"I've decided to study in Japan next year\". With a negative verb, decide not to: 甘い物を食べないことにした. ことにしている describes a personal rule you keep: 毎朝走ることにしています."
    why: こと turns the verb into a noun, "doing V", and にする is "settle on", the same にする as in コーヒーにします, "I'll have coffee". So ことにする is "settle on doing V". It puts someone's decision in front, where ことになる presents the outcome as settled without foregrounding anyone's choice, often because of circumstances or other people. The past, ことにした, reports a decision that has been made, and ことにしている says the decision is still being kept.
    formation:
      - form: V (dictionary form or ない-form) + ことにする
        note: 留学することにした, 食べないことにした.
      - form: V + ことにしている
        note: A rule or habit you have set yourself.
    examples:
      - japanese: 来年、日本に留学することにしました。
        reading: らいねん、にほんにりゅうがくすることにしました。
        romaji: rainen, nihon ni ryūgaku suru koto ni shimashita.
        english: I've decided to study abroad in Japan next year.
      - japanese: 今日から甘い物を食べないことにします。
        reading: きょうからあまいものをたべないことにします。
        romaji: kyō kara amai mono o tabenai koto ni shimasu.
        english: From today, I'm not going to eat sweets.
      - japanese: 毎朝三十分走ることにしています。
        reading: まいあささんじゅっぷんはしることにしています。
        romaji: maiasa sanjuppun hashiru koto ni shite imasu.
        english: I make a point of running for thirty minutes every morning.
    mistake:
      wrong: 来年、日本に留学するにしました。
      problem: にする needs a noun before it, so the verb is first turned into one with こと.
      right: 来年、日本に留学することにしました。
    distinguish_from:
      - id: OJG-0093
        note: ことになる presents the outcome as settled, often by circumstances or others. ことにする foregrounds someone's own decision.
      - id: OJG-0027
        note: つもり is an intention you hold. ことにした reports that a decision has been made.
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～ことにする
          ref: 534
    references:
      - source_id: tanos
        ref: 534
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: f1d0060a1086521737db33edf78ef4f01c592ed2302525398f269cc59cf6585e
          note: "The proposed wrong sentence is natural if the speaker decided to move because of the father's work. That circumstance does not determine who made the decision. Replace the diagnosis with: 'If you mean that the move was arranged or became settled without presenting it as your own decision, use ことになりました. ことにしました is correct if you are presenting the move as your decision, even when your father's work prompted it.' Replace the categorical contrast in why and distinguish_from with: 'ことにする foregrounds someone's decision; ことになる presents the outcome as settled without foregrounding that person's agency, often because of circumstances or others' decisions.' Change 'ことにした announces the moment of deciding' to 'ことにした reports a decision that has been made; it need not have been made just now.' In the meaning line, replace 'V (plain)' with 'V (dictionary form or ない-form)' to match the decision use taught here."
  - id: OJG-0295
    pattern: それで
    title: And so, that's why
    meaning: "それで: \"and so\", \"that's why\"; starts a sentence that gives the result of what was just said. Also \"and then?\"."
    when: 'Use it at the start of a sentence to give what followed from the previous one: 昨日は熱がありました。それで、学校を休みました, "I had a fever yesterday. So I stayed home from school". In conversation, それで？ asks the other person to go on: "and then?".'
    why: 'それ points back at the previous sentence, and で presents it as the cause: "with that, …". So the second sentence is what came about because of the first. Because it reports a result, it is used for things that happened or hold, and not to lead into your own request, suggestion or order; だから is used for those.'
    formation:
      - form: Sentence A。それで、sentence B。
    examples:
      - japanese: 昨日は熱がありました。それで、学校を休みました。
        reading: きのうはねつがありました。それで、がっこうをやすみました。
        romaji: kinō wa netsu ga arimashita. sorede, gakkō o yasumimashita.
        english: I had a fever yesterday. So I stayed home from school.
      - japanese: 電車が遅れました。それで、会議に間に合いませんでした。
        reading: でんしゃがおくれました。それで、かいぎにまにあいませんでした。
        romaji: densha ga okuremashita. sorede, kaigi ni maniaimasen deshita.
        english: The train was late. That's why I didn't make it to the meeting on time.
      - japanese: 「駅で田中さんに会ったんです。」「それで？」
        reading: 「えきでたなかさんにあったんです。」「それで？」
        romaji: '"eki de tanaka-san ni atta n desu." "sorede?"'
        english: '"I ran into Tanaka-san at the station." "And then?"'
    mistake:
      wrong: 明日はテストがあります。それで、今日は早く寝てください。
      problem: それで introduces a result that came about. It does not lead into a request; use だから.
      right: 明日はテストがあります。だから、今日は早く寝てください。
    distinguish_from:
      - id: OJG-0294
        note: だから can introduce the speaker's conclusion, decision, request or suggestion, as well as a result. それで normally reports what followed from the situation.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N4
      listed:
