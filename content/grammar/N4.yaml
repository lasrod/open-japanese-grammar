  - id: OJG-0328
    pattern: ～てほしい
    title: Wanting someone to do something
    meaning: 'V-てほしい: "I want (someone) to V", or want something to happen. Negative: ないでほしい.'
    when: "Use it to say what you want someone else to do: 母に早く元気になってほしい, \"I want my mother to get well soon\". The person is marked with に. It also wishes for events: 雨がやんでほしい. Negative: 行かないでほしい, \"I don't want you to go\". Said to someone, it works as an indirect request; towards a superior, ていただきたい is used instead."
    why: "ほしい is \"want (a thing)\". After a て-form, what is wanted is someone else's action, or an event. In an ordinary statement, the one who wants is normally the speaker, and in a question, the listener. The one who should act is marked with に, as the person you want it from; an event takes が (雨がやんでほしい). たい cannot do this job: it expresses the subject's wish to do something themselves, not a wish that someone else would."
    formation:
      - form: (person に) V (て-form) + ほしい
        note: "Polite: ほしいです; softened: ほしいんですが."
      - form: (person に) V (ない-form) + でほしい
        note: 吸わないでほしい, 行かないでほしい.
      - form: Event (が) + V (て-form) + ほしい
        note: 雨がやんでほしい.
    examples:
      - japanese: 母に早く元気になってほしいです。
        reading: ははにはやくげんきになってほしいです。
        romaji: haha ni hayaku genki ni natte hoshii desu.
        english: I want my mother to get well soon.
      - japanese: 大事な話なので、よく聞いてほしいです。
        reading: だいじなはなしなので、よくきいてほしいです。
        romaji: daiji na hanashi na node, yoku kiite hoshii desu.
        english: This is important, so I want you to listen carefully.
      - japanese: 部屋でたばこを吸わないでほしい。
        reading: へやでたばこをすわないでほしい。
        romaji: heya de tabako o suwanaide hoshii.
        english: I don't want you to smoke in the room.
    mistake:
      wrong: 私は友だちが来たいです。
      problem: たい expresses a wish to do something yourself, not a wish that someone else would. Use てほしい and mark the person with に.
      right: 私は友だちに来てほしいです。
    distinguish_from:
      - id: OJG-0046
        note: がほしい wants a thing. てほしい wants someone to do something, or something to happen.
      - id: OJG-0029
        note: たい is a wish to do something yourself. てほしい wants someone else to do it.
      - id: OJG-0329
        note: てもらいたい means much the same, and has a humble form, ていただきたい, for people you show respect to.
    register:
      - plain
      - polite
    levels:
