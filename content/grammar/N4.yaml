  - id: OJG-0080
    pattern: ～にくい
    title: Hard to do
    meaning: "V (ます-stem) + にくい: \"hard to V\"; with things that happen, \"doesn't easily V\"."
    when: "Use it for something that is hard to do because of what it is like: この肉は硬くて食べにくい, \"this meat is tough and hard to eat\"; 字が小さくて読みにくい. With verbs for things that happen, it means \"doesn't easily happen\", which can be a good thing: 割れにくいコップ, \"a glass that doesn't break easily\"."
    why: "にくい means \"hard to\". Like やすい, it joins the ます-stem and makes an い-adjective: 読みにくい, 読みにくかった, 読みにくい字. The subject is usually the thing, not the person. 難しい describes a task itself as difficult (この問題は難しい); にくい describes difficulty in doing an action, often because of the thing's properties or the circumstances (字が小さくて読みにくい). The two can overlap."
    formation:
      - form: V (ます-stem) + にくい
        note: 読む → 読みにくい, 食べる → 食べにくい, 割れる → 割れにくい. Conjugates as an い-adjective.
    examples:
      - japanese: この肉は硬くて、食べにくいです。
        reading: このにくはかたくて、たべにくいです。
        romaji: kono niku wa katakute, tabenikui desu.
        english: This meat is tough and hard to eat.
      - japanese: 字が小さくて読みにくいです。
        reading: じがちいさくてよみにくいです。
        romaji: ji ga chiisakute yominikui desu.
        english: The writing is small and hard to read.
      - japanese: このコップは割れにくいです。
        reading: このコップはわれにくいです。
        romaji: kono koppu wa warenikui desu.
        english: This glass doesn't break easily.
    mistake:
      wrong: この道は歩くにくいです。
      problem: にくい joins the ます-stem (歩き), not the dictionary form.
      right: この道は歩きにくいです。
    distinguish_from:
      - id: OJG-0079
        note: やすい is the opposite, "easy to V", and is formed the same way.
