  - id: OJG-0048
    pattern: ～かもしれない
    title: Maybe, might
    meaning: 'Plain form + かもしれない: "may", "might"; presents something as possible without claiming that it is true.'
    when: 'Use it for a possibility you cannot rule out: 午後から雨が降るかもしれません, "it might rain this afternoon". It works for the past and present too: かぎを忘れたかもしれない. Polite: かもしれません. Casual speech often shortens it to かも.'
    why: 'The pieces say it: か is "whether", も is "even", しれない is "cannot be known". "Whether it is so cannot even be known": the speaker admits a possibility without committing to it. The chance can be low or fairly high; かもしれない only says it is possible, where でしょう leans towards yes. Before かもしれない, an affirmative non-past noun or な-adjective drops だ (雨かもしれない), as in a plain question (学生か); other forms keep their endings (雨だったかもしれない, 雨ではないかもしれない).'
    formation:
      - form: Verb / い-adjective (plain form) + かもしれない
        note: 降るかもしれない, 降ったかもしれない, 降らないかもしれない; 高いかもしれない.
      - form: Noun / な-adjective + かもしれない
        note: "Drop only affirmative non-past だ: 雨かもしれない, 静かかもしれない; but 雨だったかもしれない, 静かではないかもしれない."
    examples:
      - japanese: 午後から雨が降るかもしれません。
        reading: ごごからあめがふるかもしれません。
        romaji: gogo kara ame ga furu ka mo shiremasen.
        english: It might rain from the afternoon.
      - japanese: かぎを家に忘れたかもしれない。
        reading: かぎをいえにわすれたかもしれない。
        romaji: kagi o ie ni wasureta ka mo shirenai.
        english: I might have left my keys at home.
      - japanese: あの人は先生かもしれません。
        reading: あのひとはせんせいかもしれません。
        romaji: ano hito wa sensei ka mo shiremasen.
        english: That person might be a teacher.
    mistake:
      wrong: あの人は学生だかもしれません。
      problem: Before かもしれない, the affirmative non-past だ of a noun or な-adjective is dropped.
      right: あの人は学生かもしれません。
    distinguish_from:
      - id: OJG-0038
        note: 'でしょう says "probably": the speaker leans towards yes. かもしれない says "maybe": only that it is possible.'
    register:
      - plain
      - polite
      - casual
    levels:
      commonly: N4
