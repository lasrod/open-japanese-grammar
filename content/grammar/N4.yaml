        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: e831393259aa30eac14378f9e4cd5ff33a4cc5acbd7e42aecf2c675ae9c839bc
          note: "The point-versus-whole-time distinction is too absolute. 間に can contain a bounded activity or repeated events, not just an event at one point; 間 does not require uninterrupted activity throughout every moment. Replace the relevant explanation with: '間に presents an event, completion, or change as occurring within a period. 間 presents the period over which an activity or state continues, or events recur; it often suggests “throughout”.' Replace the mistake diagnosis with: 'For the intended meaning that the reading continued throughout the wait, 間 without に is the natural choice. 間に instead presents something as occurring within that period; it does not itself mean “at one instant”.' The formation also omits the stative いる construction explicitly mentioned in the explanation. Add 'Stative verb such as いる + 間（に）', and split the final formation into 'V-ている + 間' and 'Noun + の + 間' so that の cannot appear to attach to a verb."
  - id: OJG-0084
    pattern: ～く/ ～にする
    title: Making something (a certain way)
    meaning: "い-adj (く) or な-adj / noun (に) + する: make something that way; cause it to have that quality or state."
    when: 'Use it when someone or something causes a change, often on purpose: 部屋をきれいにする, "tidy the room"; 音を小さくする, "turn the sound down"; 髪を短くする. It is common in requests: 静かにしてください, "please be quiet".'
    why: 'く and に are the forms adjectives take to describe how. する is "do, make". So 小さくする is "make (it) so that it is small". It is the transitive partner of くなる／になる: なる describes a change without saying what caused it (音が小さくなる), and する presents it as caused (音を小さくする). That is why the thing changed takes を, and why requests to change something use する. With no object, 静かにする means "be quiet, keep quiet".'
    formation:
      - form: (Noun を) + い-adjective (drop い) + く + する
        note: 小さくする, 短くする, 安くする; いい → よくする.
      - form: (Noun を) + な-adjective / noun + に + する
        note: きれいにする, 静かにする, 半分にする.
    examples:
      - japanese: テレビの音を小さくしてください。
        reading: テレビのおとをちいさくしてください。
        romaji: terebi no oto o chiisaku shite kudasai.
        english: Please turn the TV down.
      - japanese: 週末に部屋をきれいにしました。
        reading: しゅうまつにへやをきれいにしました。
        romaji: shūmatsu ni heya o kirei ni shimashita.
        english: I tidied my room at the weekend.
      - japanese: 髪を短くしました。
        reading: かみをみじかくしました。
        romaji: kami o mijikaku shimashita.
        english: I got my hair cut short.
      - japanese: 図書館では静かにしてください。
        reading: としょかんではしずかにしてください。
        romaji: toshokan de wa shizuka ni shite kudasai.
        english: Please be quiet in the library.
    mistake:
      wrong: 部屋がきれいにしました。
      problem: する says someone makes the change, so the thing changed is the object and takes を. が goes with なる (部屋がきれいになりました).
      right: 部屋をきれいにしました。
    distinguish_from:
      - id: OJG-0028
        note: くなる／になる describes a change without naming a cause (が). くする／にする presents it as caused (を).
      - id: OJG-0310
        note: Noun + にする can mean choosing (コーヒーにします) or making something into a form (半分にする), depending on the noun. After an adjective, にする means "make it so".
    register:
      - plain
      - polite
    levels:
      commonly: N4
      listed:
        - source_id: tanos
          level: N4
          item: ～く/ ～にする
          ref: 528
    references:
      - source_id: tanos
        ref: 528
    review:
      status: draft
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 15bf7f1072b636557d96ec6fb12b6582803acf1b515187670354cf1674a4022e
          note: "Deliberate human agency is not required: a cause can make something a certain way without anyone intending it. Replace 'someone deliberately causes the change' with 'expresses causing something to have the specified property or state', and change 'changes something on purpose' to 'causes a change, often deliberately'. In the OJG-0028 comparison, replace 'a change happens by itself' with 'describes a change without specifying its causer'; なる can describe an intentionally caused change too. The OJG-0310 note incorrectly makes noun + にする exclusively a choice construction, despite the entry's own 半分にする example. Replace it with: 'Noun + にする can express choosing something (コーヒーにします) or making something into a specified state or form (半分にする); the interpretation depends on the noun and context.' Finally, mark 'Noun を' as optional and explain that 静かにする can mean keeping quiet, without an expressed object."
