          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-24
          verdict: disagree
          content_sha256: cf0ac0059b54f7af7fb85603dbd2b5014a6d4b3730c9fc9a53403e66868113eb
          note: "The claim that でしょう never has ます before it is false in contemporary usage: forms such as 分かりますでしょうか occur in especially polite speech, though they can be criticized as redundant. Write: 'Normally attach でしょう directly to the plain form, omitting present affirmative だ after nouns and な-adjectives. ～ますでしょう(か) also occurs in especially polite speech, but plain form + でしょう is the standard learner pattern.' Keep 暑いでしょう as the correction, but explain that 暑いですでしょう is redundant and not the standard construction, rather than deriving a universal ban from politeness. In the ましょう comparison, write '～ましょう proposes an action, including invitations and offers; ～でしょう expresses conjecture or seeks confirmation,' since ましょう is not limited to doing something together."
