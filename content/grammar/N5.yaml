  - id: OJG-0013
    pattern: ～ましょうか
    title: Shall I...? / Shall we...?
    meaning: "V-ましょうか: \"shall I V?\" offering to do something, or \"shall we V?\" suggesting it and asking the listener's view."
    when: Use it to offer help (荷物を持ちましょうか, "Shall I carry your bags?"), to suggest doing something together while checking the listener agrees (ちょっと休みましょうか), and with a question word to ask what to do (何時に会いましょうか, "What time shall we meet?").
    why: ましょう expresses the will to do something; か turns it into a question. Instead of deciding, the speaker puts the intention to the listener. Who would do the action is not said and comes from the situation. When the action would help the listener and only the speaker would do it, it is heard as an offer. When both would do it, it is a suggestion, softer than a plain ましょう because it asks. With a question word, it asks the listener to help choose. An offer is typically answered with お願いします or declined with 大丈夫です; a suggestion with そうしましょう.
    formation:
      - form: V (ます-stem) + ましょうか
        note: 持ちます → 持ちましょうか.
      - form: question word … V-ましょうか
        note: 何を食べましょうか, "What shall we eat?"
      - form: V (plain volitional) + か
        note: "Casual: 持とうか, often just 持とうか？ with rising intonation."
    examples:
      - japanese: 荷物を持ちましょうか。
        reading: にもつをもちましょうか。
        romaji: nimotsu o mochimashō ka.
        english: Shall I carry your bags?
      - japanese: 窓を開けましょうか。
        reading: まどをあけましょうか。
        romaji: mado o akemashō ka.
        english: Shall I open the window?
        note: Usually an offer, though in context it can mean "shall we".
      - japanese: ちょっと休みましょうか。
        reading: ちょっとやすみましょうか。
        romaji: chotto yasumimashō ka.
        english: Shall we take a short break?
      - japanese: 何時に会いましょうか。
        reading: なんじにあいましょうか。
        romaji: nanji ni aimashō ka.
        english: What time shall we meet?
    mistake:
      wrong: 荷物を持ちませんか。
      problem: "Meant as \"Shall I carry your bags?\", but ませんか asks whether the listener will do it: \"Won't you carry the bags?\" To offer your own help, use ましょうか."
      right: 荷物を持ちましょうか。
    distinguish_from:
      - id: OJG-0012
        note: ましょう decides ("let's"); ましょうか asks ("shall we?"), and can also offer ("shall I?").
      - id: OJG-0007
        note: ませんか asks whether the listener wants to do something; it is not used to offer the speaker's own help.
