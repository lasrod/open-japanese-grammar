  - id: OJG-0294
    pattern: だから
    title: "\"So\", \"that's why\", at the start of a sentence"
    meaning: "A。だから、B。: A. So B. だから opens a sentence giving the result of the last one. ですから is the polite form."
    when: "Use it to begin a sentence that follows from the one before: あしたはテストがあります。だから、今日は早く寝ます. In polite speech ですから is the matching form. In conversation だから can also sound insistent, like \"that's what I'm saying\", so take care using it in reply to someone above you."
    why: 'だから is だ, the plain "is", with から, "because": "it is so, and because of that". It works like the から that ends a reason clause, but the reason is the whole previous sentence, so だから opens the next one with the result. That fixes the order: the reason first, then だから, then what follows from it; it never introduces the reason itself, as English "because" can. Because it is built on plain だ, it is plain or casual; ですから keeps a polite conversation polite.'
    formation:
      - form: Sentence。だから、sentence。
        note: Plain or casual.
      - form: Sentence。ですから、sentence。
        note: Polite.
    examples:
      - japanese: あしたはテストがあります。だから、今日は早く寝ます。
        reading: あしたはテストがあります。だから、きょうははやくねます。
        romaji: ashita wa tesuto ga arimasu. dakara, kyō wa hayaku nemasu.
        english: There's a test tomorrow. So I'm going to bed early tonight.
      - japanese: 昨日は雨だった。だから、家にいた。
        reading: きのうはあめだった。だから、いえにいた。
        romaji: kinō wa ame datta. dakara, ie ni ita.
        english: It rained yesterday. So I stayed home.
      - japanese: この道は危ないです。ですから、気をつけてください。
        reading: このみちはあぶないです。ですから、きをつけてください。
        romaji: kono michi wa abunai desu. desu kara, ki o tsukete kudasai.
        english: This road is dangerous. So please be careful.
    mistake:
      wrong: だから、雨が降りました。家にいました。
      problem: Intended as "Because it rained, I stayed home." だから introduces the result, not the reason. The reason comes first, then だから and what follows from it.
      right: 雨が降りました。だから、家にいました。
    distinguish_from:
      - id: OJG-0017
        note: "から goes at the end of the reason clause inside one sentence: 雨だから、家にいました. だから begins a new sentence after the reason."
    register:
      - plain
