  - id: OJG-0016
    pattern: ～てはいけません
    title: You must not...
    meaning: 'V-てはいけません: "you must not V", a prohibition; literally "if you V, it is no good".'
    when: Use it to state rules and prohibitions (ここでたばこを吸ってはいけません), as teachers, parents, signs and rules do. As a question, V-てはいけませんか asks "Is it not allowed?" Said directly to an equal or someone above you, it can sound strict, so in conversation people often use ないでください or a softened refusal instead.
    why: "The て-form with は sets up a condition: \"doing V, as a case\". いけません means \"it won't do\". So the sentence says \"if you do V, it is no good\", and that is a prohibition. It is the same frame as てもいいです (OJG-0015) turned the other way: \"even if you do V, it is fine\". Because it states a rule rather than making a request, it tends to come from someone with authority or to describe a general rule."
    formation:
      - form: V (て-form) + は + いけません
        note: "Plain: V-てはいけない. The は is pronounced わ."
      - form: V-ちゃいけない / V-じゃいけない
        note: "Casual speech: ては becomes ちゃ, and では becomes じゃ (飲んではいけない → 飲んじゃいけない)."
    examples:
      - japanese: ここでたばこを吸ってはいけません。
        reading: ここでたばこをすってはいけません。
        romaji: koko de tabako o sutte wa ikemasen.
        english: You must not smoke here.
      - japanese: テストのとき、辞書を見てはいけません。
        reading: テストのとき、じしょをみてはいけません。
        romaji: tesuto no toki, jisho o mite wa ikemasen.
        english: You must not look at a dictionary during the test.
      - japanese: この川で泳いではいけません。
        reading: このかわでおよいではいけません。
        romaji: kono kawa de oyoide wa ikemasen.
        english: You must not swim in this river.
        note: 泳ぐ has the て-form 泳いで, so it is ではいけません.
    mistake:
      wrong: 明日は来てはいけません。
      problem: "Meant as \"You don't have to come tomorrow\", but てはいけません forbids: \"You must not come tomorrow.\" English \"don't have to\" means \"not required\", which Japanese says with ～なくてもいいです, \"it's fine even if you don't\"."
      right: 明日は来なくてもいいです。
    distinguish_from:
      - id: OJG-0015
        note: "The same frame reversed: てもいい allows, てはいけない forbids."
      - id: OJG-0020
        note: ないでください asks the listener not to do something; てはいけません states that it is not allowed, and sounds stricter.
      - id: OJG-0037
        note: なくちゃいけない is the same "no good" logic applied to not doing V, so it means "must V".
    register:
