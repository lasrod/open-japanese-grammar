  - id: OJG-0297
    pattern: AとBとどちらが～
    title: Asking which of two
    meaning: "AとBとどちらがXですか: which is more X, A or B? どっち is the casual form. The answer usually uses のほうが."
    when: "Use it to ask someone to choose between two: 電車とバスとどちらが速いですか. The answer normally picks one with のほうが: 電車のほうが速いです. Among friends, どっち replaces どちら. The second と is often left out: 電車とバスどちらが速いですか."
    why: 'どちら asks "which way, which side", so it is the usual question word when two alternatives are set against each other. どれ picks one from a set, especially of three or more, and の中で何が…いちばん compares a larger group. The two options are listed with と, and the choice is the unknown, so どちら takes が, as a question word asking who or what does. The answer picks one side with のほうが, since ほう also means "side". As in any comparison, the adjective does not change form: 速い means "faster" here because of the question.'
    formation:
      - form: A と B と どちらが + adjective + ですか / verb (ます-form) + か
        note: "Polite: どちらが速いですか, どちらがよく売れますか."
      - form: A と B と どっちが + adjective / verb (plain)
        note: "Casual: 夏と冬とどっちが好き？"
      - form: A と B どちらが …
        note: The second と is often dropped.
      - form: "Answer: A のほうが + adjective or verb predicate"
        note: "When both are equal: どちらも好きです."
    examples:
      - japanese: 「電車とバスとどちらが速いですか。」「電車のほうが速いです。」
        reading: 「でんしゃとバスとどちらがはやいですか。」「でんしゃのほうがはやいです。」
        romaji: '"densha to basu to dochira ga hayai desu ka." "densha no hō ga hayai desu."'
        english: '"Which is faster, the train or the bus?" "The train is."'
      - japanese: 夏と冬とどっちが好き？
        reading: なつとふゆとどっちがすき？
        romaji: natsu to fuyu to dotchi ga suki?
        english: Which do you like better, summer or winter?
      - japanese: 紅茶とコーヒーとどちらがいいですか。
        reading: こうちゃとコーヒーとどちらがいいですか。
        romaji: kōcha to kōhī to dochira ga ii desu ka.
        english: Which would you like, tea or coffee?
    mistake:
      wrong: 電車とバスとどれが速いですか。
      problem: When two alternatives are named and compared, どちら (or どっち in casual speech) is the natural word. どれ usually picks one from a larger set.
      right: 電車とバスとどちらが速いですか。
    distinguish_from:
      - id: OJG-0025
        note: "The answer to this question: のほうが picks one side, and より names the other if needed."
      - id: OJG-0026
        note: "For three or more, ask with の中で: 果物の中で何がいちばん好きですか."
    register:
      - plain
