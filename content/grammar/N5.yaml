  - id: OJG-0322
    pattern: あげる
    title: Giving (away from me)
    meaning: "あげる: \"give\", when the gift goes away from the speaker's side: I give to others, or others give to others."
    when: Use it when the speaker gives something (私は友だちに本をあげました), or when one person gives to another and the receiver is not the speaker or someone on the speaker's side (田中さんは山田さんに花をあげました). When the gift comes to the speaker or the speaker's family or group, use くれる instead.
    why: Japanese chooses the giving verb by the direction the thing moves, seen from the speaker. あげる is written 上げる, "to raise", and it is the verb for giving outward, away from the speaker. So the giver is the speaker or someone at least as close to the speaker as the receiver, and the receiver is never the speaker. The giver takes は or が, the receiver に, and the thing given を. For giving to someone above you, a humble verb (さしあげる) is used; that belongs to a later level.
    formation:
      - form: Giver + は／が + Receiver + に + Thing + を + あげる
        note: "Polite: あげます."
    examples:
      - japanese: 私は妹にかばんをあげました。
        reading: わたしはいもうとにかばんをあげました。
        romaji: watashi wa imōto ni kaban o agemashita.
        english: I gave my younger sister a bag.
      - japanese: 田中さんは山田さんに花をあげました。
        reading: たなかさんはやまださんにはなをあげました。
        romaji: tanaka-san wa yamada-san ni hana o agemashita.
        english: Mr Tanaka gave Ms Yamada flowers.
      - japanese: 友だちの誕生日に何をあげますか。
        reading: ともだちのたんじょうびになにをあげますか。
        romaji: tomodachi no tanjōbi ni nani o agemasu ka.
        english: What will you give your friend for their birthday?
    mistake:
      wrong: 田中さんは私にチョコレートをあげました。
      problem: The chocolate came to the speaker, so it moved toward the speaker's side. That takes くれる, not あげる.
      right: 田中さんは私にチョコレートをくれました。
    distinguish_from:
      - id: OJG-0323
        note: くれる is giving toward the speaker's side; あげる is giving away from it.
      - id: OJG-0324
        note: "もらう describes the same kind of event from the receiver's side: the receiver is the subject."
      - id: OJG-0325
        note: さしあげる is the humble form of あげる, for giving to someone above you.
      - id: OJG-0055
        note: ～てあげる gives an action, a favour, rather than a thing.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～に あげます (〜 ni agemasu)
        - source_id: hanabira
          level: N4
          item: Noun を あげる (Noun wo ageru)
    references:
      - source_id: hanabira
        ref: あげる
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: "Not covered: やる for giving to animals, plants or younger family (many speakers now use あげる for pets). Should it be mentioned? Is 'at least as close to the speaker as the receiver' a fair way to state the in-group rule at N5? The 上げる etymology is offered as reasoning; confirm it is not overstated."
  - id: OJG-0323
    pattern: くれる
    title: Giving to me
    meaning: "くれる: someone gives to the speaker, or to someone on the speaker's side such as family."
    when: 'Use it when a gift comes to you or to someone close to you: 友だちが本をくれました, "a friend gave me a book"; 田中さんが弟にりんごをくれました, "Mr Tanaka gave my younger brother apples". The speaker can never be the giver with くれる. 私に is usually left out, because くれる already says the gift came your way.'
    why: 'Like あげる, くれる is chosen by direction, but it points the other way: toward the speaker. Since the verb itself says "to me or my side", Japanese rarely needs 私に, and adding it can sound heavy. The receiver is the speaker or someone closer to the speaker than the giver is. The giver is usually marked with が, sometimes は. For a giver above you, the honorific くださる is used; that belongs to a later level.'
    formation:
      - form: Giver + が／は + (私に) + Thing + を + くれる
        note: "Polite: くれます. 私に is often left out."
      - form: Giver + が + (my family member) + に + Thing + を + くれる
        note: The receiver is on the speaker's side.
    examples:
      - japanese: 友だちが私に本をくれました。
        reading: ともだちがわたしにほんをくれました。
        romaji: tomodachi ga watashi ni hon o kuremashita.
        english: A friend gave me a book.
      - japanese: 母がこの時計をくれました。
        reading: ははがこのとけいをくれました。
        romaji: haha ga kono tokei o kuremashita.
        english: My mother gave me this watch.
        note: 私に is understood from くれる.
      - japanese: 田中さんが弟にりんごをくれました。
        reading: たなかさんがおとうとにりんごをくれました。
        romaji: tanaka-san ga otōto ni ringo o kuremashita.
        english: Mr Tanaka gave my younger brother some apples.
        note: The receiver is the speaker's brother, so the gift came to the speaker's side.
    mistake:
      wrong: 私は友だちにプレゼントをくれました。
      problem: くれる only describes giving toward the speaker. When the speaker gives, it is あげる.
      right: 私は友だちにプレゼントをあげました。
    distinguish_from:
      - id: OJG-0322
        note: あげる is giving away from the speaker's side; くれる is giving toward it.
      - id: OJG-0324
        note: "もらう tells the same event with the receiver as subject: 友だちに本をもらいました."
      - id: OJG-0325
        note: くださる is the honorific form of くれる, for a giver above you.
      - id: OJG-0056
        note: ～てくれる is someone doing an action for you, rather than giving a thing.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～が 私に くれます (〜ga watashi ni kuremasu)
        - source_id: hanabira
          level: N4
          item: Noun を くれる (Noun wo kureru)
    references:
      - source_id: hanabira
        ref: くれる
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: Is 'adding 私に can sound heavy' accurate, or should it just say 'is often left out'? Confirm the rule 'receiver closer to the speaker than the giver' at N5 level.
  - id: OJG-0324
    pattern: もらう
    title: Receiving
    meaning: 'もらう: "receive", "get"; the receiver is the subject, and the giver is marked with に or から.'
    when: "Use it to tell a giving event from the receiver's side: 私は姉に傘をもらいました, \"I got an umbrella from my sister\". The receiver is usually the speaker or someone on the speaker's side. When the giver is an organisation, such as a school or a company, から is the usual choice: 学校から手紙をもらいました."
    why: "Where あげる and くれる put the giver first, もらう makes the receiver the subject, so the sentence is about what the receiver got. The giver is the source the thing came from, which is why it can take から, \"from\". に also marks the giver here, and is common with people. Because the viewpoint is the receiver's, the receiver is not normally someone further from the speaker than the giver: when you are the giver, あげる tells it from your side. For receiving from someone above you, the humble いただく is used; that belongs to a later level."
    formation:
      - form: Receiver + は／が + Giver + に + Thing + を + もらう
        note: "Polite: もらいます."
      - form: Receiver + は／が + Giver + から + Thing + を + もらう
        note: から is usual when the giver is an organisation.
    examples:
      - japanese: 私は姉に傘をもらいました。
        reading: わたしはあねにかさをもらいました。
        romaji: watashi wa ane ni kasa o moraimashita.
        english: I got an umbrella from my older sister.
      - japanese: 学校から手紙をもらいました。
        reading: がっこうからてがみをもらいました。
        romaji: gakkō kara tegami o moraimashita.
        english: I received a letter from the school.
      - japanese: 誕生日に何をもらいましたか。
        reading: たんじょうびになにをもらいましたか。
        romaji: tanjōbi ni nani o moraimashita ka.
        english: What did you get for your birthday?
    mistake:
      wrong: 田中さんは私に本をもらいました。
      problem: The speaker is the giver here. Telling it from the receiver's side, when the receiver is further from the speaker, is unnatural; tell it from the speaker's side with あげる.
      right: 私は田中さんに本をあげました。
    distinguish_from:
      - id: OJG-0323
        note: "くれる tells the same event with the giver as subject: 姉が傘をくれました."
      - id: OJG-0322
        note: あげる is giving away from the speaker's side, with the giver as subject.
      - id: OJG-0325
        note: いただく is the humble form of もらう, for receiving from someone above you.
      - id: OJG-0057
        note: ～てもらう is having someone do an action for you, rather than receiving a thing.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～から もらいます (〜kara moraimasu)
        - source_id: hanabira
          level: N5
          item: ～に もらいます (〜ni moraimasu)
        - source_id: hanabira
          level: N4
          item: Noun もらう (Noun wo morau)
    references:
      - source_id: hanabira
        ref: もらう
