  - id: OJG-0004
    pattern: に／へ
    title: Where you are going
    meaning: "に／へ after a place with a verb of movement: where someone goes, comes, returns or arrives."
    when: "Use it on the destination of a verb of movement such as 行く, 来る, 帰る, 着く or 入る: 学校に行きます, 日本へ来ました. This entry covers only destinations; に's other uses (time, where something is, the person an action is aimed at) are OJG-0005. へ is written with the kana へ but pronounced え."
    why: 'に marks the point something ends up at, and へ marks the direction something heads in. With 行く, 来る and 帰る the two describe the same trip, so in everyday use they are largely interchangeable: 京都に行きます and 京都へ行きます mean the same. The difference shows at the edges. With verbs of arriving or entering, such as 着く and 入る, に is the usual choice, because the point is reaching the place. Only へ can be followed by の to make a phrase that modifies a noun: 母への手紙, "a letter to my mother". Some learners mark the destination with を, as in English "visit Japan"; を with a verb of movement marks the ground you move along or leave, not where you arrive (OJG-0006).'
    formation:
      - form: Place + に + verb of movement
        note: Focus on arriving at the place. Usual with 着く and 入る.
      - form: Place + へ + verb of movement
        note: "Focus on the direction. Pronounced え. へ + の modifies a noun: 日本への旅行."
    examples:
      - japanese: 明日、京都へ行きます。
        reading: あした、きょうとへいきます。
        romaji: ashita, kyōto e ikimasu.
        english: I'm going to Kyoto tomorrow.
      - japanese: 友だちが私の部屋に来ました。
        reading: ともだちがわたしのへやにきました。
        romaji: tomodachi ga watashi no heya ni kimashita.
        english: A friend came to my room.
      - japanese: 八時に駅に着きました。
        reading: はちじにえきにつきました。
        romaji: hachiji ni eki ni tsukimashita.
        english: I arrived at the station at eight.
        note: The first に marks the time (OJG-0005); the second marks the destination.
    mistake:
      wrong: 日本を行きたいです。
      problem: The place you go to is the destination, marked with に or へ. With a verb of movement, を marks the route you pass along or the place you leave.
      right: 日本に行きたいです。
    distinguish_from:
      - id: OJG-0005
        note: "に also marks times, the place where something exists, and recipients or other targets of an action. へ does not replace the time or existence uses, but with suitable verbs it can mark a recipient or addressee, as in 母へ手紙を送る. It cannot replace every に on a person: 友だちに会う, not 友だちへ会う."
      - id: OJG-0006
        note: With a verb of movement, を marks the ground covered or the place left (道を歩く, 家を出る), not the destination.
      - id: OJG-0003
        note: で marks how you travel (バスで); に／へ marks where you arrive.
      - id: OJG-0019
        note: In 買い物に行く, に marks the purpose of going, not a place.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: に/へ
          ref: 538
    references:
      - source_id: tanos
        ref: 538
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "The claim that に is 'the usual choice' with 着く and 入る is stated as a tendency; 部屋へ入る occurs. Please check it is not overstated. Also left out: へ in written headings and messages (～へ as 'to' on a gift or letter), and に／へ with 送る (sending to a place). Revised after review: the OJG-0005 note no longer says へ has only the direction use; it now allows へ for a recipient with suitable verbs (母へ手紙を送る)."
