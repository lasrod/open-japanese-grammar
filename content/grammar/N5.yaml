  - id: OJG-0011
    pattern: と
    title: And (joining nouns), and together with
    meaning: と joins nouns into a complete list, "A and B"; after a person it can also mean "with" (友だちと).
    when: 'Use it between nouns to list them all: パンと牛乳, "bread and milk". It joins nouns only; adjectives, verbs and whole sentences are joined in other ways, such as the て-form. After a person, と marks who you do something with (友だちと映画を見ました) or the other party of a verb like 話す, 会う or 結婚する.'
    why: 'と presents the nouns it joins as the whole list: these, and nothing else being mentioned. That is the difference from や, which lists examples. It stays between the items and normally does not follow the last one. Since と is a particle that works with nouns, it cannot link adjectives or verbs the way English "and" can: "big and clean" is 広くてきれい, not 広いときれい. The "with" use comes from the same idea of putting two together: 友だちと is "together with a friend". 一緒に is often added to make the "together" explicit.'
    formation:
      - form: Noun A + と + Noun B (+ と + Noun C …)
        note: In the basic pattern, と goes between the nouns. A final と is also possible (パンと牛乳とを買いました), but is normally omitted in simple lists.
      - form: Person + と + verb
        note: "Who you do it with, or the other party: 友だちと話す, 友だちと一緒に行く."
    examples:
      - japanese: パンと牛乳を買いました。
        reading: パンとぎゅうにゅうをかいました。
        romaji: pan to gyūnyū o kaimashita.
        english: I bought bread and milk.
      - japanese: 机の上に本とペンがあります。
        reading: つくえのうえにほんとペンがあります。
        romaji: tsukue no ue ni hon to pen ga arimasu.
        english: There is a book and a pen on the desk.
      - japanese: 日曜日に友だちと映画を見ました。
        reading: にちようびにともだちとえいがをみました。
        romaji: nichiyōbi ni tomodachi to eiga o mimashita.
        english: I saw a film with a friend on Sunday.
    mistake:
      wrong: この部屋は広いときれいです。
      problem: と joins nouns, not adjectives. To say two things about something, put the first い-adjective in the て-form (広くて); a な-adjective uses で (静かで).
      right: この部屋は広くてきれいです。
    distinguish_from:
      - id: OJG-0032
        note: と gives the full list; や gives some examples and implies there are others.
      - id: OJG-0003
        note: 友だちと is "with a friend"; 一人で is "on my own".
      - id: OJG-0002
        note: AとB lists items; AもBも says the same thing is true of both.
    register:
