  - id: OJG-0036
    pattern: ので
    title: Because (often softer than から)
    meaning: "X ので Y: Y because of X; often sounds softer or more matter-of-fact than から."
    when: "Use it to give a reason or cause, then the result: it is raining, so I will stay home. It is common when explaining yourself politely, in apologies and requests, and in speaking to someone you want to be polite to. In many sentences から would also be correct."
    why: "ので contains の, which presents what comes before it as a fact or circumstance. The reason then sounds like part of the situation, rather than the speaker's own argument, and that is why ので is often felt to be softer or more objective than から. This is a tendency, not a rule: both are used for ordinary reasons, and the choice often comes down to tone. Because of the の inside it, a noun or な-adjective before ので takes な, as it does before の elsewhere: 雨なので."
    formation:
      - form: V／い-adj (plain form) + ので
        note: 降るので, 降ったので, 高いので.
      - form: noun／な-adj + なので
        note: "な replaces だ: 休みなので, 静かなので."
      - form: V-ますので／～ですので
        note: Very polite, heard in formal or service speech.
    examples:
      - japanese: 雨が降っているので、今日は家にいます。
        reading: あめがふっているので、きょうはいえにいます。
        romaji: ame ga futte iru node, kyō wa ie ni imasu.
        english: It’s raining, so I’ll stay home today.
      - japanese: 明日はテストなので、早く寝ます。
        reading: あしたはテストなので、はやくねます。
        romaji: ashita wa tesuto na node, hayaku nemasu.
        english: I have a test tomorrow, so I’ll go to bed early.
      - japanese: すみません、電車が遅れたので、遅くなりました。
        reading: すみません、でんしゃがおくれたので、おそくなりました。
        romaji: sumimasen, densha ga okureta node, osoku narimashita.
        english: I’m sorry, I’m late because the train was delayed.
        note: "An apology: ので is a common choice for explaining yourself."
    mistake:
      wrong: 明日は休みだので、映画を見に行きます。
      problem: Before ので, a noun or な-adjective takes な, not だ. Learners who know だから often carry the だ across.
      right: 明日は休みなので、映画を見に行きます。
    distinguish_from:
      - id: OJG-0017
        note: Both give a reason and are often interchangeable. から tends to put the speaker's own reasoning to the front; ので tends to present the reason as a circumstance, so it often sounds softer. Before a command or a strong statement of will, から is more common.
      - id: OJG-0033
        note: ～んです also presents something as background, but ends the sentence; ので joins the reason to a result.
    register:
      - plain
      - polite
      - spoken
      - written
