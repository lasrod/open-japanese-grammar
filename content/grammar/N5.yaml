        provider: anthropic
        model: claude-opus-5-5
      note: 'Revised after review: the mistake is now a formation error (見るませんか), as the reviewer proposed, because 一緒に映画を見ますか can itself work as an invitation in context. The why still says the positive question "tends to" be heard as asking about plans, with the context caveat; the reviewer did not object to that sentence.'
