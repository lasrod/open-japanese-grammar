  - id: OJG-0028
    pattern: ～くなる／～になる
    title: Saying something becomes or gets ...
    meaning: "い-adj (い→く) + なる; な-adj or noun + になる: something changes and becomes that way."
    when: 'Use it for a change of state: it is getting cold, the room became clean, someone became a doctor. The past, なりました, is very common for a change that has happened, often where English would say "has got" or "is now".'
    why: 'なる means "become". To join a describing word to it, that word takes the form that describes a verb. An い-adjective swaps its final い for く, the same く you see in 寒くない: 寒い becomes 寒くなる, "become cold". な-adjectives and nouns take に, which marks the result of the change, much as に marks where you arrive: 静かになる, 医者になる. So the choice between く and に is decided by the kind of word, not by meaning. いい is irregular and uses its other stem, よ: よくなる. Some な-adjectives end in い, such as きれい, and still take に.'
    formation:
      - form: い-adjective (drop い) + くなる
        note: 寒い → 寒くなる. いい becomes よくなる.
      - form: な-adjective + になる
        note: 静か → 静かになる. No な before に.
      - form: noun + になる
        note: 医者 → 医者になる.
      - form: "Polite: なります; past: なりました"
        note: なる is an ordinary う-verb.
    examples:
      - japanese: だんだん寒くなりました。
        reading: だんだんさむくなりました。
        romaji: dandan samuku narimashita.
        english: It has gradually got colder.
      - japanese: 部屋がきれいになりました。
        reading: へやがきれいになりました。
        romaji: heya ga kirei ni narimashita.
        english: The room is clean now.
        note: きれい ends in い but is a な-adjective (きれいな部屋), so it takes に.
      - japanese: 兄は医者になりました。
        reading: あにはいしゃになりました。
        romaji: ani wa isha ni narimashita.
        english: My older brother became a doctor.
      - japanese: 天気がよくなりました。
        reading: てんきがよくなりました。
        romaji: tenki ga yoku narimashita.
        english: The weather has got better.
        note: いい becomes よく.
    mistake:
      wrong: 寒いになりました。
      problem: 寒い is an い-adjective, so it does not take に. Change the final い to く, then add なる.
      right: 寒くなりました。
    distinguish_from:
      - id: OJG-0084
        note: "する instead of なる: ～くする／～にする means someone makes something that way. なる says it becomes that way."
      - id: OJG-0001
        note: です states what something is now. なる states a change into it.
    register:
