  - id: OJG-0021
    pattern: ～のが好きです
    title: Saying you like doing something
    meaning: "V (dictionary form) + のが好きです: someone likes doing V. の turns the verb phrase into a noun that 好き can take."
    when: "Use it to say that you, or someone else, like an activity: reading, cooking, going for walks. The opposite is 嫌い (dislike), and 大好き makes it stronger. With a plain noun you do not need の: 犬が好きです."
    why: '好き is a な-adjective, and the thing that is liked is marked with が: 犬が好きです. Only a noun can stand in front of that が, so an activity has to be turned into a noun first. Adding の after the dictionary form of a verb does that: 本を読む becomes 本を読むの, "reading books". The verb phrase keeps its own particles inside it (本を読む), and the が that belongs to 好き comes after の. The person who does the liking usually takes は: 私は…のが好きです. こと can also make a verb into a noun here (読むことが好きです), and both are common in this pattern. The two are not interchangeable in every pattern, so learn this pairing as it is rather than treating の and こと as the same word.'
    formation:
      - form: V (dictionary form) + のが好きです
        note: "Plain: のが好きだ. Negative: のが好きではありません, or in speech のが好きじゃないです."
      - form: V (dictionary form) + のが嫌いです
        note: "The opposite: dislike doing V. In conversation 好きじゃない often sounds softer than 嫌い."
      - form: person は … V + のが好きです
        note: The person who likes it takes は; the activity takes が.
    examples:
      - japanese: 私は本を読むのが好きです。
        reading: わたしはほんをよむのがすきです。
        romaji: watashi wa hon o yomu no ga suki desu.
        english: I like reading books.
      - japanese: 弟は料理を作るのが好きです。
        reading: おとうとはりょうりをつくるのがすきです。
        romaji: otōto wa ryōri o tsukuru no ga suki desu.
        english: My younger brother likes cooking.
        note: 料理を stays inside the verb phrase; が comes after の.
      - japanese: 朝早く起きるのが嫌いです。
        reading: あさはやくおきるのがきらいです。
        romaji: asa hayaku okiru no ga kirai desu.
        english: I hate getting up early.
      - japanese: 休みの日に散歩するのが大好きです。
        reading: やすみのひにさんぽするのがだいすきです。
        romaji: yasumi no hi ni sanpo suru no ga daisuki desu.
        english: I love going for walks on my days off.
    mistake:
      wrong: 私は泳ぐが好きです。
      problem: "The activity marked by が before 好き must be a noun. 泳ぐ on its own is a verb, so add の to make it one: 泳ぐのが好きです."
      right: 私は泳ぐのが好きです。
    distinguish_from:
      - id: OJG-0022
        note: The same frame, V + のが + adjective. 好き is about liking an activity; 上手 is about being good at it.
      - id: OJG-0029
        note: "～たい is a wish to do something, often now or on a particular occasion. のが好き is a general liking: 泳ぐのが好き is true even when you do not want to swim today."
    register:
