  - id: OJG-0330
    pattern: ～とき
    title: "When ...: the time something happens"
    meaning: "Clause / Nの + とき: when, at the time that. 子どものとき, 暇なとき, 寒いとき, 日本に行ったとき."
    when: "Use it to set the time of the main event by another situation: 子どものとき、よく川で泳ぎました; 暇なとき、何をしますか. It works with nouns, adjectives and verbs. に after it (ときに) is common when it marks one particular occasion."
    why: 'とき (時) is a noun meaning "time". Like any noun, it can be described by what comes before it, so "the time when X" is simply X + とき. A noun joins it with の (子どものとき), a な-adjective with な (暇なとき), and verbs and い-adjectives directly (寒いとき, 寝るとき), as they do before any noun. The tense of a verb before とき is judged against the main event, not against now. 日本に行くとき、かばんを買いました: the bag was bought before the trip, or on the way. 日本に行ったとき、かばんを買いました: it was bought after arriving. English "when I went" covers both, which is why learners mix them up.'
    formation:
      - form: Noun + の + とき
        note: 子どものとき.
      - form: な-adjective + な + とき
        note: 暇なとき.
      - form: い-adjective + とき
        note: 寒いとき.
      - form: V (dictionary form / た-form / ない-form) + とき
        note: "The tense is judged against the main event: 行くとき (before going), 行ったとき (after arriving)."
    examples:
      - japanese: 子どものとき、よく川で泳ぎました。
        reading: こどものとき、よくかわでおよぎました。
        romaji: kodomo no toki, yoku kawa de oyogimashita.
        english: When I was a child, I often swam in the river.
      - japanese: 暇なとき、何をしますか。
        reading: ひまなとき、なにをしますか。
        romaji: hima na toki, nani o shimasu ka.
        english: What do you do in your free time?
      - japanese: 日本に行ったとき、富士山を見ました。
        reading: にほんにいったとき、ふじさんをみました。
        romaji: nihon ni itta toki, fujisan o mimashita.
        english: When I went to Japan, I saw Mt Fuji.
      - japanese: 寝るとき、「おやすみなさい」と言います。
        reading: ねるとき、「おやすみなさい」といいます。
        romaji: neru toki, "oyasuminasai" to iimasu.
        english: When you go to bed, you say "oyasuminasai".
    mistake:
      wrong: 子どもとき、大阪に住んでいました。
      problem: とき is a noun, so another noun joins it with の.
      right: 子どものとき、大阪に住んでいました。
    distinguish_from:
      - id: OJG-0039
        note: 'まえに is "before": 寝るまえに. とき is "at the time".'
      - id: OJG-0311
        note: 'あとで is "after": 食べたあとで. とき is "at the time".'
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～とき (〜toki)
        - source_id: hanabira
          level: N4
          item: Verb た ときに (Verb た ときに)
        - source_id: hanabira
          level: N4
          item: Verb るときに (〜ru toki ni)
    references:
      - source_id: hanabira
        ref: ～とき
