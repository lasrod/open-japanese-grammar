  - id: OJG-0040
    pattern: ～てから
    title: After doing something, then…
    meaning: "V-てから Y: after V, Y; also, since V."
    when: "Use it to say one action comes first and another follows it, especially when the order matters: wash your hands, then eat; finish homework, then go out. A second common use counts time from an event: 日本に来てから一年, “a year since I came to Japan”. ～たあとで also means “after”, and the two often overlap; ～てから tends to stress that the first action is done first, while ～たあとで tends to focus on the time that follows."
    why: "から marks a starting point. After a verb’s て-form, it sets an earlier event or situation as the starting point for what follows: 洗ってから is “starting from having washed”. In a sequence of actions, the first is normally finished before the next begins. In the “since” use, the starting point can be the beginning of a situation that is still going on: 東京に住んでから、もう十年になります. The tense and politeness go on the final verb, not on the て-form. After a plain form such as 帰った, から means “because” instead, so the form before から decides the meaning."
    formation:
      - form: V (て-form) + から、main clause
        note: "Tense and politeness go on the main clause: 食べてから出かけました."
      - form: V (て-form) + から + length of time
        note: "Time since: 来てから三年."
    examples:
      - japanese: 手を洗ってから、ご飯を食べます。
        reading: てをあらってから、ごはんをたべます。
        romaji: te o aratte kara, gohan o tabemasu.
        english: I wash my hands, then eat.
      - japanese: 宿題をしてから、遊びに行きました。
        reading: しゅくだいをしてから、あそびにいきました。
        romaji: shukudai o shite kara, asobi ni ikimashita.
        english: I did my homework and then went out to play.
      - japanese: 日本に来てから、一年になります。
        reading: にほんにきてから、いちねんになります。
        romaji: nihon ni kite kara, ichinen ni narimasu.
        english: It has been a year since I came to Japan.
        note: "The second use: time counted from an event."
    mistake:
      wrong: 家に帰ったから、テレビを見ました。
      problem: Meant as “after I got home”. But から after a plain past verb means “because”, so this says “Because I got home, I watched TV”. For “after”, から follows the て-form.
      right: 家に帰ってから、テレビを見ました。
    distinguish_from:
      - id: OJG-0017
        note: から after a plain form (帰ったから) gives a reason. から after the て-form (帰ってから) gives an order in time.
      - id: OJG-0039
        note: "～てから: V first, then the main action. ～まえに: the main action first, before V."
      - id: OJG-0030
        note: ～たり～たりする lists sample actions in no particular order; ～てから fixes the order.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
