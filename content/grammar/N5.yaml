  - id: OJG-0022
    pattern: ～のが上手です
    title: Saying someone is good at doing something
    meaning: "V (dictionary form) + のが上手です: someone is good at V. Mostly said of others; for yourself, 得意 is the usual word."
    when: "Use it to say that someone does an activity well: singing, drawing, speaking a language. It is often a compliment, said to or about another person. With a noun for the skill, no の is needed: 料理が上手です."
    why: "上手 is a な-adjective about skill, and the skill is marked with が, the same frame as 好き. A verb needs の to become a noun before it can take that が: 歌う becomes 歌うの, \"singing\". The person whose skill it is usually takes は. 上手 is a judgement of someone's skill, which is why it works as praise. For the same reason, using it about your own skill tends to sound like boasting, so speakers usually describe their own strengths with 得意 (\"my strong point\") instead. It is not forbidden about yourself: saying you are not good, 上手じゃありません, is a normal modest thing to say. When someone says 上手ですね to you, a modest reply is the usual response."
    formation:
      - form: V (dictionary form) + のが上手です
        note: "Plain: のが上手だ. Negative: のが上手ではありません, or in speech 上手じゃないです."
      - form: noun + が上手です
        note: "With a noun for the skill, no の: 日本語が上手です."
      - form: V (dictionary form) + のが得意です
        note: The usual way to name your own strong point.
    examples:
      - japanese: 田中さんは歌うのが上手です。
        reading: たなかさんはうたうのがじょうずです。
        romaji: tanaka-san wa utau no ga jōzu desu.
        english: Tanaka-san is good at singing.
      - japanese: 友だちは絵をかくのがとても上手です。
        reading: ともだちはえをかくのがとてもじょうずです。
        romaji: tomodachi wa e o kaku no ga totemo jōzu desu.
        english: My friend is very good at drawing.
      - japanese: 日本語が上手ですね。
        reading: にほんごがじょうずですね。
        romaji: nihongo ga jōzu desu ne.
        english: Your Japanese is good.
        note: A compliment to the listener. With a noun, no の is needed.
      - japanese: 私は泳ぐのが得意です。
        reading: わたしはおよぐのがとくいです。
        romaji: watashi wa oyogu no ga tokui desu.
        english: Swimming is my strong point.
        note: About yourself, 得意 is the usual word rather than 上手.
    mistake:
      wrong: 私はテニスをするのが上手です。
      problem: The grammar is fine, but calling your own skill 上手 tends to sound like bragging. English "I'm good at" is more neutral. For your own strengths, 得意 is the usual choice.
      right: 私はテニスをするのが得意です。
    distinguish_from:
      - id: OJG-0023
        note: "下手 is the opposite and uses the same frame. The tendencies also reverse: 下手 is a normal, modest thing to say about yourself, and can sound blunt about someone else."
      - id: OJG-0021
        note: Same frame, V + のが + adjective. 好き is about liking an activity; 上手 is about doing it well.
