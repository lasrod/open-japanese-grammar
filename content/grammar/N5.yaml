  - id: OJG-0300
    pattern: ～く／～に + verb
    title: Using an adjective to say how something is done
    meaning: "い-adjective く / な-adjective に + verb: do something in that way. 早く起きる, きれいに書く."
    when: "Use it to say how an action is done: 早く起きます (get up early), 名前をきれいに書いてください (please write your name neatly), 静かに話しましょう (let's talk quietly)."
    why: 'An adjective in its basic form describes a noun (早い電車, 静かな部屋) or ends a sentence. To describe a verb it needs its adverb form, made by changing the ending: い becomes く, and a な-adjective takes に instead of な. The adjective then goes before the verb. The same forms appear before なる, "become", because that is a verb too: 大きくなる. いい is the one irregular い-adjective: its adverb form is よく, from the older form よい, and よく also means "often". Watch for な-adjectives that happen to end in い, such as きれい and 嫌い: they take に, so きれいに.'
    formation:
      - form: い-adjective (drop い) + く + verb
        note: 早い → 早く起きる. いい → よく.
      - form: な-adjective + に + verb
        note: 静か → 静かに話す. きれい → きれいに書く.
    examples:
      - japanese: あしたは早く起きます。
        reading: あしたははやくおきます。
        romaji: ashita wa hayaku okimasu.
        english: I'll get up early tomorrow.
      - japanese: 名前をきれいに書いてください。
        reading: なまえをきれいにかいてください。
        romaji: namae o kirei ni kaite kudasai.
        english: Please write your name neatly.
      - japanese: 図書館では静かに話しましょう。
        reading: としょかんではしずかにはなしましょう。
        romaji: toshokan de wa shizuka ni hanashimashō.
        english: Let's talk quietly in the library.
      - japanese: 昨日はよく寝ました。
        reading: きのうはよくねました。
        romaji: kinō wa yoku nemashita.
        english: I slept well yesterday.
        note: よく is the adverb form of いい.
    mistake:
      wrong: 名前をきれく書いてください。
      problem: きれい ends in い but is a な-adjective, so its adverb form is きれいに, not きれく.
      right: 名前をきれいに書いてください。
    distinguish_from:
      - id: OJG-0028
        note: "The same forms before なる: 大きくなる, 静かになる. There the adjective says what something becomes, not how an action is done."
      - id: OJG-0084
        note: "The same forms before する: 部屋をきれいにする, make the room clean."
    register:
