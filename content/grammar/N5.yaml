  - id: OJG-0289
    pattern: N1のN2
    title: "Linking two nouns: of, 's, and more"
    meaning: "N1のN2: an N2 that N1 describes: whose it is, where it is from, what it is about. N2 is the main noun."
    when: "Use it to join two nouns so the first tells you more about the second: 私の本 (my book), 日本の車 (a car from Japan), 日本語の先生 (a Japanese teacher, one who teaches Japanese), 机の上 (the top of the desk). N1の can also stand for a whole noun phrase when the thing meant is clear, especially for whose it is: この本は私のです."
    why: "の makes the noun before it describe the noun after it, in the same order as English \"Tanaka's book\", but for many more relations than owning: where something is from, what it is about, what it is made of, where it is. の itself does not say which relation is meant; the two nouns do. 田中さんの車 is the car he owns, 日本の車 a car from Japan, 紙の箱 a box made of paper. The last noun is always the main one, the thing the phrase refers to: 私の友だちの車 is a car. Position words such as 上, 下, 中 and 前 are nouns in Japanese, so they join with の too: 机の上, 駅の前. When the thing meant is clear from context, N1の can often stand for the whole phrase, especially for possession: 私のです, \"it's mine\". This does not work for every noun: a position word such as 前 stays, as in 駅の前で."
    formation:
      - form: N1 + の + N2
        note: N1 describes N2; the phrase refers to N2.
      - form: N1 + の + N2 + の + N3
        note: "Several can be chained; the last noun is the main one: 私の友だちの車."
      - form: N1 + の (standing for the whole phrase)
        note: "Often for possession, when the thing is clear: これは私のです. Not for position words: 駅の前で stays."
      - form: Noun + の + position word
        note: "上, 下, 中, 前, 後ろ, 横: 机の上に, 駅の前で."
    examples:
      - japanese: これは私の本です。
        reading: これはわたしのほんです。
        romaji: kore wa watashi no hon desu.
        english: This is my book.
      - japanese: 母は日本語の先生です。
        reading: はははにほんごのせんせいです。
        romaji: haha wa nihongo no sensei desu.
        english: My mother is a Japanese teacher.
        note: A teacher of Japanese; の says what she teaches.
      - japanese: 猫は机の上にいます。
        reading: ねこはつくえのうえにいます。
        romaji: neko wa tsukue no ue ni imasu.
        english: The cat is on the desk.
        note: 上 is a noun, "the top", joined to 机 with の.
      - japanese: 「これはだれのかさですか。」「私のです。」
        reading: 「これはだれのかさですか。」「わたしのです。」
        romaji: '"kore wa dare no kasa desu ka." "watashi no desu."'
        english: "\"Whose umbrella is this?\" \"It's mine.\""
    mistake:
      wrong: これは大きいの犬です。
      problem: "の joins a noun to a noun. An い-adjective describes a noun directly, with nothing in between: 大きい犬. (A な-adjective takes な: きれいな犬.)"
      right: これは大きい犬です。
    distinguish_from:
      - id: OJG-0011
        note: "と joins nouns as equals: 母と先生 are two people. の makes the first describe the second: 母の先生 is one person, my mother's teacher."
      - id: OJG-0314
        note: "After a verb, の turns the verb phrase into a noun: 走るのは楽しい. Between two nouns it links them."
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～の (〜no)
    references:
      - source_id: hanabira
        ref: N1のN2
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: 'Questions: is 紙の箱 natural as an example of material? Is the gloss of 日本語の先生 as "a teacher of Japanese" safe, or should the entry mention that it could also be read as a teacher who is Japanese in some contexts (日本人の先生 would be the usual way to say that)? Revised after the first gpt-6-astra review to meet its objection (see reviews).'
