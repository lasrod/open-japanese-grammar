  - id: OJG-0313
    pattern: ～こと
    title: Turning a verb into a noun with こと
    meaning: 'V (plain form) + こと: an action or a fact, as a noun. With the dictionary form, often "doing V": 趣味は写真を撮ることです.'
    when: "Use it when an action has to fill a noun's place: 私の趣味は写真を撮ることです (My hobby is taking photos); 毎日日本語を話すことは大切です. It is also the piece used in ことができる (can do)."
    why: 'To use a verb phrase as the subject, object or topic in sentences like these, it has to be turned into a noun first; a plain verb also cannot stand before です when saying what something is (趣味は…です). こと is a noun meaning "matter, thing" in the abstract, and a verb phrase in front of it describes it, the way a clause describes any noun. So the whole phrase becomes a noun: 写真を撮ること, "the matter of taking photos". The verb keeps its own particles inside the phrase. こと suits naming an action as an idea: a hobby, a rule, a skill. Often の can replace it (読むのが好き, 読むことが好き), but not always: after は…です saying what something is, use こと (趣味は読むことです); for seeing or hearing an event as it happens, use の. こと can go with 聞く when you hear a fact: 田中さんが結婚したことを聞きました.'
    formation:
      - form: V (plain form) + こと
        note: "The dictionary form for an activity: 読むこと, 泳ぐこと. Past and negative forms also occur: 結婚したこと, 行かないこと. The verb keeps its own object: 本を読むこと."
      - form: … は V + ことです
        note: "Saying what something is: 趣味は…ことです."
      - form: V + ことができる
        note: Can do (OJG-0304).
    examples:
      - japanese: 私の趣味は写真を撮ることです。
        reading: わたしのしゅみはしゃしんをとることです。
        romaji: watashi no shumi wa shashin o toru koto desu.
        english: My hobby is taking photos.
      - japanese: 毎日日本語を話すことは大切です。
        reading: まいにちにほんごをはなすことはたいせつです。
        romaji: mainichi nihongo o hanasu koto wa taisetsu desu.
        english: Speaking Japanese every day is important.
      - japanese: 私は料理を作ることが好きです。
        reading: わたしはりょうりをつくることがすきです。
        romaji: watashi wa ryōri o tsukuru koto ga suki desu.
        english: I like cooking.
    mistake:
      wrong: 私の趣味は本を読むです。
      problem: The sentence says what the hobby is, so it needs a noun before です. 読む is a verb; add こと.
      right: 私の趣味は本を読むことです。
    distinguish_from:
      - id: OJG-0314
        note: の also turns a verb into a noun. It is more at home in everyday speech and with things seen and heard; こと with actions named as ideas, and before です.
      - id: OJG-0304
        note: 'ことができる: こと before が and できる, "can do".'
