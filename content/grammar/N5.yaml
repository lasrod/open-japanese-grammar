  - id: OJG-0027
    pattern: ～つもりです
    title: Saying what you intend to do
    meaning: "V (dictionary form) + つもりです: someone intends or plans to do V. V-ないつもりです: intends not to."
    when: "Use it to state a plan the speaker has already made: 来年日本へ行くつもりです. It is also used to ask about the listener's plans. The negative, V-ないつもり, says you intend not to do something."
    why: "つもり is a noun meaning an intention held in mind. A verb describes a noun by standing in front of it in its plain form, so the verb comes first and です follows: 行くつもりです, \"it is my intention to go\". Because つもり names what is in someone's mind, it is most natural about the speaker, or in a question to the listener. About someone else it is usually reported, since you are telling what they told you. つもり suggests a plan already decided, not a passing thought. Asking someone senior directly about their つもり can sound pointed, so people tend to phrase that question another way."
    formation:
      - form: V (dictionary form) + つもりです
        note: "Plain: つもりだ."
      - form: V (ない-form) + つもりです
        note: Intending not to do it.
      - form: V (dictionary form) + つもりはありません
        note: I have no intention of doing it. This can serve as a firm refusal in context, but it does not in itself express refusal. Compare V-ないつもりです, which states an intention not to do it.
    examples:
      - japanese: 夏休みに日本へ行くつもりです。
        reading: なつやすみににほんへいくつもりです。
        romaji: natsuyasumi ni nihon e iku tsumori desu.
        english: I plan to go to Japan in the summer holidays.
      - japanese: 今日はお酒を飲まないつもりです。
        reading: きょうはおさけをのまないつもりです。
        romaji: kyō wa osake o nomanai tsumori desu.
        english: I'm not planning to drink today.
      - japanese: 週末は何をするつもりですか。
        reading: しゅうまつはなにをするつもりですか。
        romaji: shūmatsu wa nani o suru tsumori desu ka.
        english: What are you planning to do this weekend?
        note: Asking the listener about their plans.
    mistake:
      wrong: 明日は雨が降るつもりです。
      problem: English "going to" covers both plans and predictions, but つもり is only someone's intention, and rain has none. For a prediction, use でしょう.
      right: 明日は雨が降るでしょう。
    distinguish_from:
      - id: OJG-0029
        note: ～たい says what you want to do. つもり says what you have decided to do; you can want something you do not intend.
      - id: OJG-0038
        note: でしょう is a guess about what will happen. つもり is a person's plan.
