  - id: OJG-0008
    pattern: は
    title: Setting up what you are talking about
    meaning: "は marks the topic: what the sentence is about. What follows says something about it. It can also set up a contrast."
    when: "Use it to name what you are going to say something about, then say it: 私は学生です, \"As for me, I'm a student\". Use it also to contrast one thing with another: 肉は食べますが、魚は食べません. は is written with the kana は but pronounced わ."
    why: "は does not mark the subject; it marks the topic, the frame for the rest of the sentence. The topic is often the subject, which is why the two are easy to confuse, but it need not be. In この本はもう読みました, the topic is the book, the thing that was read. In 田中さんは背が高いです, the topic is Mr Tanaka, while the subject of 高い is 背, his height. Because the topic is what you comment on, は tends to go on something already known or already in the conversation, and the new information comes after it. が, by contrast, tends to put the focus on the noun itself, as the new or the answering piece. So a question word asking who or what did something, which is the unknown, is not made the topic: だれが来ましたか, not だれは. Inside a clause that describes a noun, the subject is normally marked with が, not は: 私が作ったケーキ. は normally replaces が or を. It can follow other particles, as in 東京には and 学校では. Whether the other particle stays depends on its job; a time に can be dropped before は, as in 日曜日は."
    formation:
      - form: Noun + は …
        note: Normally replaces が or を when that noun is the topic.
      - form: Noun + particle + は …
        note: "It can follow other particles: 東京には, 学校では. Whether the particle stays depends on its job; a time に can be dropped: 日曜日は休みです."
    examples:
      - japanese: 私は学生です。
        reading: わたしはがくせいです。
        romaji: watashi wa gakusei desu.
        english: I'm a student.
      - japanese: この本はもう読みました。
        reading: このほんはもうよみました。
        romaji: kono hon wa mō yomimashita.
        english: I've already read this book.
        note: The topic is the book, the thing read; を is replaced by は.
      - japanese: 田中さんは背が高いです。
        reading: たなかさんはせがたかいです。
        romaji: tanaka-san wa se ga takai desu.
        english: Mr Tanaka is tall.
        note: "Topic: Mr Tanaka. Subject of 高い: 背, his height."
      - japanese: 肉は食べますが、魚は食べません。
        reading: にくはたべますが、さかなはたべません。
        romaji: niku wa tabemasu ga, sakana wa tabemasen.
        english: I eat meat, but I don't eat fish.
        note: "Two topics set against each other: the contrast use."
    mistake:
      wrong: だれは来ましたか。
      problem: "だれ is the unknown the question asks about, so it cannot be the topic. The unknown takes が, and so does the answer: 田中さんが来ました."
      right: だれが来ましたか。
    distinguish_from:
      - id: OJG-0002
        note: も also goes on the topic position, but says "this one as well" instead of setting it apart.
      - id: OJG-0010
        note: 机の上に猫がいます presents the presence of a cat on the desk, often introducing it into the conversation. 猫は机の上にいます takes the cat as the topic and states where it is.
      - id: OJG-0009
        note: "The same pattern with things: 本がありますか asks whether there is one; 本はどこにありますか asks where the known book is."
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: は
          ref: 542
    references:
      - source_id: tanos
        ref: 542
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "は and が is a large subject; the entry stays with topic vs subject, known vs new, question words, contrast, and が inside noun-modifying clauses, each stated as a tendency where it is one. Questions: is the question-word point narrow enough as stated (limited to a question word in the doer position)? Is the noun-modifying-clause point too advanced for N5, or worth keeping because learners meet it early? Revised after review: particle stacking before は is now stated as depending on the particle's job (a time に can drop); the OJG-0010 note no longer says が means the cat was unknown."
