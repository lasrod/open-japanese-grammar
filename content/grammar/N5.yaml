  - id: OJG-0303
    pattern: NかN
    title: A or B
    meaning: "AかB: A or B, one of them. The phrase acts as one noun, so a particle after it covers both."
    when: "Use it to offer alternatives: 朝はパンかご飯を食べます (I have bread or rice in the morning). It is common in suggestions and requests: 土曜日か日曜日に会いませんか; ペンか鉛筆で書いてください."
    why: "か is the question particle: it marks something as not settled. Between nouns it keeps the choice open: A, or B, one of them, without saying which. The whole phrase AかB then works as a single noun, so any particle comes after it: パンかご飯を, 土曜日か日曜日に. Compare と, which takes both: パンとご飯を食べます means you eat both. A か can also follow the last option (AかBか), which stresses that it is one or the other; in everyday sentences the final か is usually left out."
    formation:
      - form: N1 か N2 (+ particle)
        note: "The particle follows the whole phrase: パンかご飯を."
      - form: N1 か N2 か (+ particle)
        note: Stresses the choice; the final か is often dropped.
    examples:
      - japanese: 朝はパンかご飯を食べます。
        reading: あさはパンかごはんをたべます。
        romaji: asa wa pan ka gohan o tabemasu.
        english: In the morning I have bread or rice.
      - japanese: 土曜日か日曜日に会いませんか。
        reading: どようびかにちようびにあいませんか。
        romaji: doyōbi ka nichiyōbi ni aimasen ka.
        english: Shall we meet on Saturday or Sunday?
      - japanese: ペンか鉛筆で書いてください。
        reading: ペンかえんぴつでかいてください。
        romaji: pen ka enpitsu de kaite kudasai.
        english: Please write in pen or pencil.
    mistake:
      wrong: 土曜日と日曜日に会いませんか。
      problem: Intended as "Saturday or Sunday". と takes both, so this asks to meet on both days. For one or the other, use か.
      right: 土曜日か日曜日に会いませんか。
    distinguish_from:
      - id: OJG-0011
        note: "と joins nouns and takes all of them: パンとご飯 is both."
      - id: OJG-0032
        note: "や gives examples from a longer list: パンや果物, bread, fruit and so on. か offers a choice."
      - id: OJG-0319
        note: "The same か after a question word: 何か, something."
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun か Noun か～ (Noun ka Noun ka～)
