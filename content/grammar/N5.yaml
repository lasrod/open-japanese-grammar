        - source_id: hanabira
          level: N5
          item: どこへも Verb ないです (doko e mo + Verb + nai desu)
        - source_id: hanabira
          level: N5
          item: どこへも Verb ません (doko e mo + Verb + masen)
        - source_id: hanabira
          level: N5
          item: どこも Verb ないです (dokomo + Verb + naidesu)
        - source_id: hanabira
          level: N5
          item: どこも Verb ません (dokomo + Verb + masen)
        - source_id: hanabira
          level: N5
          item: なにも～ないです (nani mo~nai desu)
        - source_id: hanabira
          level: N5
          item: なにも～ません (nanimo~masen)
