      note: "Confirm: から is the usual choice (and に unnatural) when the giver is an organisation. Is the mistake one learners really make, or would a に/が confusion (友だちが私に本をもらいました) be a better choice?"
  - id: OJG-0330
    pattern: ～とき
    title: When, at the time that
    meaning: '～とき: "when", "at the time"; とき is the noun "time", described by the words in front of it.'
    when: "Use it to say when the main event happens: 子どものとき, \"when I was a child\"; 寒いとき, \"when it's cold\"; ひまなとき, \"when I'm free\"; 日本へ行ったとき, \"when I went to Japan\". The part before とき is in the plain form even in a polite sentence; politeness goes at the end."
    why: "とき is a noun meaning \"time\", so the words before it attach the way they attach to any noun: a verb or い-adjective directly, a な-adjective with な, a noun with の. The verb's tense before とき is judged from the main event, not from now. The dictionary form says that action has not happened yet when the main event takes place; the た-form says it already has. 日本へ行くとき、かばんを買いました: the bag was bought before going. 日本へ行ったとき、かばんを買いました: it was bought after arriving, in Japan. As with times, に can be added to pin the point (ときに), and は makes it the topic (ときは)."
    formation:
      - form: V (dictionary／ない-form) + とき
        note: The action has not happened yet at the time of the main event.
      - form: V (た-form) + とき
        note: The action has already happened at the time of the main event.
      - form: い-adjective + とき／な-adjective + な + とき
        note: 寒いとき, ひまなとき.
      - form: Noun + の + とき
        note: "子どものとき. に or は can follow: ときに, ときは."
    examples:
      - japanese: 子どものとき、よく川で泳ぎました。
        reading: こどものとき、よくかわでおよぎました。
        romaji: kodomo no toki, yoku kawa de oyogimashita.
        english: When I was a child, I often swam in the river.
      - japanese: 寝るとき、電気を消します。
        reading: ねるとき、でんきをけします。
        romaji: neru toki, denki o keshimasu.
        english: I turn off the light when I go to bed.
        note: "Dictionary form: the light goes off before sleeping."
      - japanese: 日本へ行ったとき、この本を買いました。
        reading: にほんへいったとき、このほんをかいました。
        romaji: nihon e itta toki, kono hon o kaimashita.
        english: I bought this book when I went to Japan.
        note: "た-form: bought after arriving, in Japan."
    mistake:
      wrong: 子どもとき、よく泳ぎました。
      problem: とき is a noun, so a noun before it needs の.
      right: 子どものとき、よく泳ぎました。
    distinguish_from:
      - id: OJG-0066
        note: ～たら is "when" or "if" for a condition that comes first; ～とき places an event at a time.
      - id: OJG-0039
        note: ～まえに says an action comes before another; with the dictionary form, ～とき only says it has not happened yet.
      - id: OJG-0311
        note: ～あとで says one action follows another; ～たとき places the main event at the time after the first.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～とき (〜toki)
        - source_id: hanabira
          level: N4
          item: Verb た ときに (Verb た ときに)
        - source_id: hanabira
          level: N4
          item: Verb るときに (〜ru toki ni)
    references:
      - source_id: hanabira
        ref: ～とき
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: The tense rule is simplified; ている + とき and stative predicates are not covered. Is 'に can be added, は makes it the topic' safe enough at N5? Should the entry say とき is usually written in kana in this use (vs 時)?
  - id: OJG-0333
    pattern: なんと言いますか
    title: How do you say ...?
    meaning: 'なんと言いますか: asks for the word for something: これは日本語でなんと言いますか, "what is this called in Japanese?"'
    when: "Use it to ask for a word you do not know, usually with the language marked by で: 「ありがとう」は英語でなんと言いますか. どう言いますか is also used for the same question. Among friends, なんて言う？ is the casual form."
    why: 'と marks the words of a quotation, what is said. なん "what" in front of と asks for the words that would fill that quotation, and 言います is "say". The thing you want a word for goes first as the topic with は, and で marks the means, the language: 日本語で, "in Japanese". 何 is read なん before と, which is why the phrase is なんと.'
    formation:
      - form: Thing + は + Language + で + なんと言いますか
        note: 何 is read なん before と.
      - form: Thing + は + Language + で + どう言いますか
        note: Also used for the same question.
      - form: Thing + (は) + Language + で + なんて言う？
        note: Casual.
    examples:
      - japanese: これは日本語でなんと言いますか。
        reading: これはにほんごでなんといいますか。
        romaji: kore wa nihongo de nan to iimasu ka.
        english: What is this called in Japanese?
      - japanese: 「ありがとう」は英語でなんと言いますか。
        reading: 「ありがとう」はえいごでなんといいますか。
        romaji: '"arigatō" wa eigo de nan to iimasu ka.'
        english: How do you say "arigatō" in English?
      - japanese: この花は日本語でどう言いますか。
        reading: このはなはにほんごでどういいますか。
        romaji: kono hana wa nihongo de dō iimasu ka.
        english: What do you call this flower in Japanese?
    mistake:
      wrong: これは日本語でなにと言いますか。
      problem: 何 before と is read なん, not なに.
      right: これは日本語でなんと言いますか。
    distinguish_from:
      - id: OJG-0003
        note: で marks the means; in 日本語で it marks the language used.
      - id: OJG-0078
        note: ～という～ uses the same quoting と to name something, "a thing called X"; なんと言いますか asks for that name.
      - id: OJG-0331
        note: ～と思う uses the same と to quote a thought rather than a word.
    register:
      - polite
      - casual
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～どう 言いますか。 (〜dou iimasu ka.)
        - source_id: hanabira
          level: N5
          item: ～なんと 言いますか。 (〜nan to iimasu ka.)
    references:
      - source_id: hanabira
        ref: なんと言いますか
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: Is there a difference in nuance between なんと言いますか and どう言いますか worth stating (word vs way of putting it)? The entry says only that both are used. Confirm なんて言う？ as the casual form, and whether なにと is a mistake learners really make. Example 2 romaji keeps quotation marks for 「」; confirm the format.
