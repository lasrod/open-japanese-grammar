  - id: OJG-0039
    pattern: ～まえに
    title: Before doing something
    meaning: "V (dictionary form) + まえに / N + の + まえに: do the main action before V or N."
    when: "Use it to say that one thing is done before another: brush your teeth before bed, study a little before coming to Japan, wash your hands before a meal. With a length of time, 前 has a related meaning, “ago”: 三年前に, “three years ago”."
    why: "前 means “front”, and in time it means “earlier”. The clause before まえに names a point in time, and the main action happens before it. At the time of the main action, that later event has not happened yet, so the verb before まえに is in the dictionary (non-past) form, even when the whole sentence is about the past: 来る前に勉強しました, “I studied before I came”. The tense of the sentence goes on the main verb at the end. A noun is joined with の, as nouns usually are before 前."
    formation:
      - form: V (dictionary form) + まえに
        note: The verb stays in the dictionary form even in a past sentence.
      - form: noun + の + まえに
        note: 食事の前に, 授業の前に.
      - form: time span + まえに
        note: "“Ago”: 三日前に, 二年前に. No の."
    examples:
      - japanese: 寝る前に歯をみがきます。
        reading: ねるまえにはをみがきます。
        romaji: neru mae ni ha o migakimasu.
        english: I brush my teeth before I go to bed.
      - japanese: 日本へ来る前に、少し日本語を勉強しました。
        reading: にほんへくるまえに、すこしにほんごをべんきょうしました。
        romaji: nihon e kuru mae ni, sukoshi nihongo o benkyō shimashita.
        english: Before I came to Japan, I studied a little Japanese.
        note: 来る stays in the dictionary form; the past is on 勉強しました.
      - japanese: 食事の前に手を洗いましょう。
        reading: しょくじのまえにてをあらいましょう。
        romaji: shokuji no mae ni te o araimashō.
        english: Let’s wash our hands before the meal.
    mistake:
      wrong: 日本へ来た前に、日本語を勉強しました。
      problem: English “before I came” is in the past, so learners put the verb in the た-form. Before まえに the verb stays in the dictionary form; the past goes on the main verb.
      right: 日本へ来る前に、日本語を勉強しました。
    distinguish_from:
