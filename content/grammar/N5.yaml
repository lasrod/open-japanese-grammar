  - id: OJG-0034
    pattern: ～すぎる
    title: Saying something is too much, or you did too much
    meaning: "V (ます-stem) / adjective stem + すぎる: too much. Doing V to excess, or being more X than is good."
    when: "Use it for going past the right amount: I ate too much, this bag is too expensive, the town is too quiet. It usually carries a complaint or explains a problem: 高すぎて買えません. In casual speech it is also used as strong praise, as in かわいすぎる, where nothing is really wrong."
    why: 'すぎる on its own means "go past". Joined to a verb or an adjective, it says the action or the quality went past a proper point: 食べすぎる is "eat past the limit". Going past the right point is usually a problem, which is why the pattern normally sounds negative. The result is itself a る-verb, so it changes like one: すぎます, すぎました, すぎて, すぎない. Verbs join with the ます-stem; adjectives join with their stem: an い-adjective drops its final い, and a な-adjective drops な. いい is irregular: よすぎる. The adjective ない ("there is none") normally becomes なさすぎる, as in お金がなさすぎる, "I have far too little money". Adjectives ending in ない do not all behave alike: 少ない becomes 少なすぎる, while a compound such as 申し訳ない becomes 申し訳なさすぎる.'
    formation:
      - form: V (ます-stem) + すぎる
        note: 食べます → 食べすぎる; 飲みます → 飲みすぎる.
      - form: い-adjective (drop い) + すぎる
        note: "高い → 高すぎる. いい becomes よすぎる. The adjective ない normally becomes なさすぎる (お金がなさすぎる); adjectives ending in ない do not all behave alike: 少ない normally becomes 少なすぎる, whereas a compound such as 申し訳ない normally becomes 申し訳なさすぎる."
      - form: な-adjective (no な) + すぎる
        note: 静か → 静かすぎる.
      - form: …すぎます／すぎました／すぎて
        note: すぎる is a る-verb. すぎて often gives the reason for a problem.
    examples:
      - japanese: 昨日の夜、食べすぎました。
        reading: きのうのよる、たべすぎました。
        romaji: kinō no yoru, tabesugimashita.
        english: I ate too much last night.
      - japanese: このかばんは高すぎます。
        reading: このかばんはたかすぎます。
        romaji: kono kaban wa takasugimasu.
        english: This bag is too expensive.
      - japanese: この町は静かすぎます。
        reading: このまちはしずかすぎます。
        romaji: kono machi wa shizukasugimasu.
        english: This town is too quiet.
      - japanese: この問題は難しすぎて、わかりません。
        reading: このもんだいはむずかしすぎて、わかりません。
        romaji: kono mondai wa muzukashisugite, wakarimasen.
        english: This question is too hard; I can't understand it.
        note: すぎて gives the reason for the problem.
    mistake:
      wrong: このかばんは高いすぎます。
      problem: With an い-adjective, the final い comes off before すぎる.
      right: このかばんは高すぎます。
    distinguish_from:
      - id: OJG-0029
        note: Both join the ます-stem, but 食べたい is an い-adjective (食べたくない) while 食べすぎる is a verb (食べすぎない).
    register:
      - plain
      - polite
      - casual
