  - id: OJG-0012
    pattern: ～ましょう
    title: Let's do it
    meaning: "V-ましょう: \"let's V\", a polite proposal to do something together, or agreeing to one."
    when: "Use it to propose doing something together when you expect the listener to agree (そろそろ帰りましょう), and to accept an invitation (ええ、行きましょう). Teachers, signs and announcements also use it for a gentle instruction to a group: 手を洗いましょう, \"let's wash our hands\", meaning \"please wash your hands\"."
    why: "ましょう is the polite form of the volitional, the form that expresses the will to do something. Said to a listener, it presents that will as shared: \"let's\". Because it states a decision rather than asking a question, it fits best when agreement is already likely: replying to an invitation, or when the plan is settled. To suggest something the listener may not want, speakers often choose the softer ませんか or ましょうか, which ask instead of deciding."
    formation:
      - form: V (ます-stem) + ましょう
        note: 行きます → 行きましょう; 食べます → 食べましょう; します → しましょう.
      - form: V (plain volitional)
        note: "Casual: 行こう, 食べよう, しよう, 来よう."
    examples:
      - japanese: そろそろ帰りましょう。
        reading: そろそろかえりましょう。
        romaji: sorosoro kaerimashō.
        english: It's about time. Let's go home.
      - japanese: ええ、行きましょう。
        reading: ええ、いきましょう。
        romaji: ē, ikimashō.
        english: Yes, let's go.
        note: A reply to an invitation such as 行きませんか.
      - japanese: 食べる前に手を洗いましょう。
        reading: たべるまえにてをあらいましょう。
        romaji: taberu mae ni te o araimashō.
        english: Let's wash our hands before we eat.
        note: From a teacher or on a sign, a gentle instruction.
    mistake:
      wrong: 一緒に食べるましょう。
      problem: ましょう replaces ます, so it attaches to the ます-stem (食べ), not to the dictionary form (食べる).
      right: 一緒に食べましょう。
    distinguish_from:
      - id: OJG-0007
        note: ませんか invites by asking and leaves the choice to the listener; ましょう decides, and suits cases where agreement is expected.
      - id: OJG-0013
        note: 'Adding か turns the proposal into a question: "shall we?" or, as an offer, "shall I?"'
    register:
      - polite
      - spoken
    levels:
      commonly: N5
