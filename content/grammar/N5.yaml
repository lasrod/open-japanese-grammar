  - id: OJG-0333
    pattern: なんと言いますか
    title: Asking what something is called, or how to say it
    meaning: "Xは日本語でなんと言いますか: what is X called in Japanese? どう言いますか: how do you say it?"
    when: "Use it to ask for a word: 「これは日本語でなんと言いますか。」「かさと言います。」 Ask the same way about a situation: 朝、先生に会ったとき、なんと言いますか. It is one of the most useful questions a learner has, in class and outside it."
    why: 'と marks the words that are said, the quotation, and 言う is "say". So なんと言いますか asks "say what?": which words are used. で marks the means, here the language: 日本語で, "in Japanese". The answer puts the word in the quotation slot: かさと言います. 何 is read なん before と. どう言いますか asks "say it how?" and is also common, especially for a phrase or a situation rather than a single word. In casual speech, なんて言う is the usual form.'
    formation:
      - form: X は 日本語で なんと 言いますか
        note: What is X called in Japanese? Also written 何と.
      - form: "Answer: Y と 言います"
        note: かさと言います.
      - form: X は 日本語で どう 言いますか
        note: How do you say X?
    examples:
      - japanese: 「これは日本語でなんと言いますか。」「かさと言います。」
        reading: 「これはにほんごでなんといいますか。」「かさといいます。」
        romaji: '"kore wa nihongo de nan to iimasu ka." "kasa to iimasu."'
        english: "\"What's this called in Japanese?\" \"It's called kasa.\""
      - japanese: 「ありがとう」は英語でなんと言いますか。
        reading: 「ありがとう」はえいごでなんといいますか。
        romaji: '"arigatō" wa eigo de nan to iimasu ka.'
        english: How do you say "arigatō" in English?
      - japanese: 朝、先生に会ったとき、なんと言いますか。
        reading: あさ、せんせいにあったとき、なんといいますか。
        romaji: asa, sensei ni atta toki, nan to iimasu ka.
        english: What do you say when you meet your teacher in the morning?
    mistake:
      wrong: これは日本語で何を言いますか。
      problem: "を marks an object, but the word being asked for is a quotation, which takes と: なんと言いますか."
      right: これは日本語でなんと言いますか。
    distinguish_from:
      - id: OJG-0078
        note: 'という joins a name to a noun: かさという言葉, "the word kasa".'
      - id: OJG-0011
        note: と meaning "and" or "with" is a different use; this と marks what is said.
    register:
      - polite
      - spoken
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～どう 言いますか。 (〜dou iimasu ka.)
        - source_id: hanabira
          level: N5
          item: ～なんと 言いますか。 (〜nan to iimasu ka.)
    references:
      - source_id: hanabira
        ref: なんと言いますか
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Questions: これは日本語で何ですか is also natural for asking a word; should the entry say so? Is なんて言う the right casual form to name?"
      reviews:
