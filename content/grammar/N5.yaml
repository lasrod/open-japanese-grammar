  - id: OJG-0310
    pattern: Nにする
    title: "Choosing: I'll have ..., let's go with ..."
    meaning: "Nにする／Nにします: decide on N, choose N. Common when ordering and making plans: コーヒーにします."
    when: "Use it when you choose among options: in a café, 私はコーヒーにします (I'll have coffee); making plans, パーティーは土曜日にしましょう. 何にしますか asks \"what will you have?\" or \"what will you choose?\". The past, にしました, reports a choice already made."
    why: 'に marks where something ends up, and する here means "make". So Nにする is "make it N": of the possible choices, the outcome is N. That is why it is the natural phrase for ordering and deciding, where ください is only a request for something. Compare Nになる, "become N": になる presents the result without itself saying who chose it; にする presents someone as choosing it.'
    formation:
      - form: Noun + に + する／します
        note: Choosing or deciding.
      - form: 何にしますか
        note: What will you have? What will you choose?
      - form: Noun + に + しました
        note: Reports a choice already made.
    examples:
      - japanese: 「何にしますか。」「私はコーヒーにします。」
        reading: 「なににしますか。」「わたしはコーヒーにします。」
        romaji: '"nani ni shimasu ka." "watashi wa kōhī ni shimasu."'
        english: "\"What will you have?\" \"I'll have coffee.\""
      - japanese: 母の誕生日のプレゼントは花にしました。
        reading: ははのたんじょうびのプレゼントははなにしました。
        romaji: haha no tanjōbi no purezento wa hana ni shimashita.
        english: I decided on flowers for my mother's birthday present.
      - japanese: パーティーは土曜日にしましょう。
        reading: パーティーはどようびにしましょう。
        romaji: pātī wa doyōbi ni shimashō.
        english: Let's have the party on Saturday.
    mistake:
      wrong: 私はコーヒーをします。
      problem: 'をする means doing an activity: テニスをする. Choosing something takes に: "make it coffee".'
      right: 私はコーヒーにします。
    distinguish_from:
      - id: OJG-0028
        note: になる presents a result, without saying who chose it. にする presents someone as choosing it.
      - id: OJG-0090
        note: "ことにする is the same idea with a verb: decide to do something."
    register:
      - plain
      - polite
    levels:
