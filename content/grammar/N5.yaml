  - id: OJG-0292
    pattern: では／じゃ／それでは
    title: '"Well then": moving on from what was just said'
    meaning: "では／じゃ／それでは at the start: well then, in that case. It takes what was just said and moves to the next step."
    when: "Use it to move on, based on what was just said or agreed: 「コーヒーはありません。」「じゃ、紅茶をください。」 It also opens or closes a stretch of talk: では、始めましょう; じゃ、またあした. じゃ (often じゃあ) is casual; では is neutral to polite; それでは and それじゃ are fuller forms, それでは sounding the most formal."
    why: 'それでは is roughly "that being so": それ points back to what was just said, and the sentence that follows builds on it. では is the same without それ, and じゃ is its spoken contraction, just as じゃありません is of ではありません. Because the word treats the situation just described as settled ground, it naturally opens a choice, a decision or a goodbye, right after someone else has spoken or after one step is over. Which form you choose sets the tone: じゃ, また is for friends and family; to a teacher or a customer, では and a polite phrase fit.'
    formation:
      - form: それでは、sentence。
        note: Fullest and most formal; meetings, announcements, lessons.
      - form: では、sentence。
        note: Neutral to polite.
      - form: それじゃ／じゃ、sentence。
        note: Casual; じゃあ, with a long vowel, is common in speech.
    examples:
      - japanese: 「コーヒーはありません。」「じゃ、紅茶をください。」
        reading: 「コーヒーはありません。」「じゃ、こうちゃをください。」
        romaji: '"kōhī wa arimasen." "ja, kōcha o kudasai."'
        english: "\"We don't have any coffee.\" \"Then I'll have tea, please.\""
      - japanese: では、授業を始めましょう。
        reading: では、じゅぎょうをはじめましょう。
        romaji: dewa, jugyō o hajimemashō.
        english: Well then, let's start the lesson.
      - japanese: じゃ、またあした。
        reading: じゃ、またあした。
        romaji: ja, mata ashita.
        english: OK, see you tomorrow.
    mistake:
      wrong: 先生、じゃ、またね。
      problem: じゃ and またね are casual, for friends and family. Taking leave of a teacher, では with a polite phrase fits.
      right: 先生、では、失礼します。
    distinguish_from:
      - id: OJG-0291
        note: 'でも turns against what came before: "but". では moves on from it: "then, in that case". Both open a sentence, and じゃ and でも are easy to mix up.'
      - id: OJG-0293
        note: そして and それから add the next thing; では draws the next step from what was said.
