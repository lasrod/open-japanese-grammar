      - japanese: 今日は昨日より寒いです。
        reading: きょうはきのうよりさむいです。
        romaji: kyō wa kinō yori samui desu.
        english: Today is colder than yesterday.
        note: "Here は, not のほうが: the sentence is simply about today, not picking one of a pair."
