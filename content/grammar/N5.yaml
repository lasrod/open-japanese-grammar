  - id: OJG-0035
    pattern: ～ほうがいい
    title: "Giving advice: you'd better, or you'd better not"
    meaning: "V-たほうがいい: you'd better do V. V-ないほうがいい: you'd better not. Used to give advice."
    when: "Use it to advise someone to do something or not to do it: 早く寝たほうがいいですよ. You can also ask for advice about yourself: 私も行ったほうがいいですか. After a noun, のほうがいい says which one you prefer: コーヒーのほうがいいです, \"I'd rather have coffee\"."
    why: 'ほう means "side", as in comparisons with のほうが, and いい means "good". So 行ったほうがいい is literally "the side of going is good": out of doing it and not doing it, doing it is better. That is why it sounds like a recommendation, and it can be fairly firm. For advice to do something, the past た-form is the usual choice (行ったほうがいい). The dictionary form (行くほうがいい) is also used, often when weighing options in general. For ordinary advice not to do something, normally use V-ないほうがいい (行かないほうがいい). Because it presses an opinion on the listener, it is often softened with と思います, or said with よ as friendly advice; to someone senior it can sound presumptuous.'
    formation:
      - form: V (た-form) + ほうがいい
        note: "The usual form of advice to do something: 休んだほうがいい."
      - form: V (dictionary form) + ほうがいい
        note: Also used, often when comparing options in general.
      - form: V (ない-form) + ほうがいい
        note: For ordinary advice not to do something, normally use V-ないほうがいい.
      - form: …ほうがいいです／ほうがいいと思います
        note: Polite forms. と思います softens the advice.
      - form: noun + のほうがいい
        note: Saying which one is better or which you prefer.
    examples:
      - japanese: 今日は早く寝たほうがいいですよ。
        reading: きょうははやくねたほうがいいですよ。
        romaji: kyō wa hayaku neta hō ga ii desu yo.
        english: You'd better go to bed early today.
      - japanese: 午後は雨ですから、傘を持っていったほうがいいですよ。
        reading: ごごはあめですから、かさをもっていったほうがいいですよ。
        romaji: gogo wa ame desu kara, kasa o motte itta hō ga ii desu yo.
        english: It's going to rain this afternoon, so you should take an umbrella.
      - japanese: この水は飲まないほうがいいです。
        reading: このみずはのまないほうがいいです。
        romaji: kono mizu wa nomanai hō ga ii desu.
        english: You'd better not drink this water.
      - japanese: 薬を飲んだほうがいいと思います。
        reading: くすりをのんだほうがいいとおもいます。
        romaji: kusuri o nonda hō ga ii to omoimasu.
        english: I think you should take some medicine.
        note: と思います makes the advice softer.
    mistake:
      wrong: この水は飲まなかったほうがいいです。
      problem: This copies the past form used in positive advice (飲んだほうがいい) onto the negative. Negative-past forms do occur, but for ordinary advice not to do something, the normal choice is V-ないほうがいい.
      right: この水は飲まないほうがいいです。
    distinguish_from:
      - id: OJG-0025
        note: The same ほう, "side". のほうが…より compares two things; ほうがいい recommends one course of action.
      - id: OJG-0014
        note: ～てください makes a request or gives an instruction. ～ほうがいい recommends an option as better.
      - id: OJG-0016
        note: ～てはいけません forbids. ～ないほうがいい only advises against, and leaves the choice to the listener.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N5
