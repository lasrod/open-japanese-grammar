  - id: OJG-0302
    pattern: ～くて／～で
    title: "Joining adjectives: ... and ..."
    meaning: "い-adjective くて / な-adjective or noun で: X and Y. It links a description to what follows, and can give a light reason."
    when: "Use it to give two qualities of one thing: この部屋は広くて明るいです; 図書館は静かできれいです. With a noun, it joins two statements: 兄は医者で、姉は先生です. The same form can give a loose cause for what follows: この本は難しくて、よくわかりません."
    why: 'Japanese does not join adjectives with と, which joins nouns only. Instead the first adjective takes its て-form, the form that links it to what comes next, the way verbs do (起きて、食べる). For an い-adjective, い becomes くて; for a な-adjective or a noun, で, the て-form of だ. Only the last word carries the tense and politeness: 広くて明るかったです is "was spacious and bright". Because the て-form only says "and, and so", context decides whether it is a list or a cause. Two qualities joined this way usually point the same way, both good or both bad; to set a good point against a bad one, use が or けど. いい becomes よくて.'
    formation:
      - form: い-adjective (drop い) + くて + …
        note: 広い → 広くて. いい → よくて.
      - form: な-adjective + で + …
        note: 静か → 静かで.
      - form: Noun + で + …
        note: 医者で, 学生で.
    examples:
      - japanese: この部屋は広くて明るいです。
        reading: このへやはひろくてあかるいです。
        romaji: kono heya wa hirokute akarui desu.
        english: This room is spacious and bright.
      - japanese: 図書館は静かできれいです。
        reading: としょかんはしずかできれいです。
        romaji: toshokan wa shizuka de kirei desu.
        english: The library is quiet and clean.
      - japanese: 兄は医者で、姉は先生です。
        reading: あにはいしゃで、あねはせんせいです。
        romaji: ani wa isha de, ane wa sensei desu.
        english: My older brother is a doctor, and my older sister is a teacher.
      - japanese: この本は難しくて、よくわかりません。
        reading: このほんはむずかしくて、よくわかりません。
        romaji: kono hon wa muzukashikute, yoku wakarimasen.
        english: This book is difficult, so I don't really understand it.
        note: Here the first half reads as the cause.
    mistake:
      wrong: 図書館は静かくて、きれいです。
      problem: 静か is a な-adjective; its joining form is で, not くて.
      right: 図書館は静かで、きれいです。
    distinguish_from:
      - id: OJG-0011
        note: "と joins nouns only: 犬と猫. Adjectives are joined with くて or で."
      - id: OJG-0312
        note: "The same て-form, on verbs: 起きて、食べます."
      - id: OJG-0290
        note: "To set a good point against a bad one, use が or けど: 高いけど、おいしいです."
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
