  - id: OJG-0026
    pattern: ～の中で～がいちばん～
    title: Saying which one is the most ... in a group
    meaning: "Group の中で A がいちばん X: of everything in the group, A is the most X."
    when: "Use it to identify the highest-ranked member of a group, usually three or more: the fruit you like best, the tallest person in the class. It is also how you ask the question: …の中で何／どれ／だれがいちばん…ですか. For exactly two things, のほうが is generally preferred, though 一番 is also possible."
    why: '中 means "inside", and で marks the range the choice is made within, so の中で sets out the group: "among these". いちばん, literally "number one", goes before the adjective and makes it "the most". The adjective itself does not change. が marks the one singled out, for the same reason as in のほうが: it answers "which one?". In the question, the question word fits what is being chosen: だれ for people, 何 or どれ for things, どこ for places. With a place or a period of time, で alone is common instead of の中で: 日本で一番高い山.'
    formation:
      - form: group の中で A が一番 + adjective
        note: "Polite: add です. 一番 is often written in kana, いちばん."
      - form: group の中で 何／どれ／だれ／どこ が一番 + adjective + ですか
        note: The question. The question word matches what is being chosen.
      - form: place / time で A が一番 + adjective
        note: With a place or a period, で alone is common.
    examples:
      - japanese: 果物の中でりんごが一番好きです。
        reading: くだもののなかでりんごがいちばんすきです。
        romaji: kudamono no naka de ringo ga ichiban suki desu.
        english: Of all fruit, I like apples best.
      - japanese: クラスの中でだれが一番背が高いですか。
        reading: クラスのなかでだれがいちばんせがたかいですか。
        romaji: kurasu no naka de dare ga ichiban se ga takai desu ka.
        english: Who is the tallest in the class?
      - japanese: 日本で一番高い山は富士山です。
        reading: にほんでいちばんたかいやまはふじさんです。
        romaji: nihon de ichiban takai yama wa fujisan desu.
        english: The highest mountain in Japan is Mount Fuji.
        note: With a place, で alone. Here 一番高い describes 山, and the answer comes after は.
    mistake:
      wrong: 果物の中にりんごが一番好きです。
      problem: "の中に says where something is, as with ある or いる: 箱の中にりんごがあります. The range a choice is made within is marked with で."
      right: 果物の中でりんごが一番好きです。
    distinguish_from:
      - id: OJG-0025
        note: のほうが…より contrasts two alternatives. の中で…一番 identifies the highest-ranked member of a group. For exactly two alternatives, のほうが is generally preferred, but 一番 is also possible.
