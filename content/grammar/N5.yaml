  - id: OJG-0007
    pattern: ～ませんか
    title: "Inviting someone: won't you...?"
    meaning: "V-ませんか: a polite invitation, \"won't you V (with me)?\", that leaves the choice to the listener."
    when: "Use it to invite someone to do something, often together with you (一緒に映画を見ませんか), or to offer them something to do (お茶を飲みませんか). In another context the same form is a plain negative question: 肉を食べませんか can also ask \"Don't you eat meat?\" The situation and intonation tell them apart."
    why: "ませんか is a negative question: \"won't you V?\" Asking in the negative does not assume the answer is yes, so it is easy for the listener to decline, and that is why it feels considerate as an invitation. A positive question, 映画を見ますか, tends to be heard as asking about the listener's plans or habits rather than inviting them, although context can make it an invitation too. To accept, people often say いいですね or reply with ましょう (ええ、行きましょう); to decline, they usually soften it (ちょっと…) rather than saying いいえ outright."
    formation:
      - form: V (ます-stem) + ませんか
        note: 行きます → 行きませんか; 食べます → 食べませんか.
      - form: 一緒に + V-ませんか
        note: Makes the "with me" explicit.
      - form: V (plain negative) + ？
        note: "Casual: 行かない？ with rising intonation."
    examples:
      - japanese: 一緒に昼ご飯を食べませんか。
        reading: いっしょにひるごはんをたべませんか。
        romaji: issho ni hirugohan o tabemasen ka.
        english: Would you like to have lunch together?
      - japanese: 日曜日に映画を見に行きませんか。
        reading: にちようびにえいがをみにいきませんか。
        romaji: nichiyōbi ni eiga o mi ni ikimasen ka.
        english: Would you like to go and see a film on Sunday?
      - japanese: お茶を飲みませんか。
        reading: おちゃをのみませんか。
        romaji: ocha o nomimasen ka.
        english: Would you like some tea?
        note: An offer to the listener; the speaker need not drink too.
    mistake:
      wrong: 一緒に映画を見るませんか。
      problem: ませんか attaches to the ます-stem, not to the dictionary form. 見る has the stem 見 (見ます), so it is 見ませんか.
      right: 一緒に映画を見ませんか。
    distinguish_from:
      - id: OJG-0012
        note: ましょう proposes and expects agreement ("let's"); ませんか asks, leaving the listener free to say no.
      - id: OJG-0013
        note: ましょうか also asks, but about doing something together or about the speaker doing it for the listener ("shall we / shall I"). ませんか asks whether the listener wants to.
    register:
      - polite
      - spoken
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: ～ませんか
          ref: 541
    references:
