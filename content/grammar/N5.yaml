  - id: OJG-0320
    pattern: 疑問詞 + でも
    title: Any ..., whatever, whenever
    meaning: "Question word + でも: any at all, no matter which. 何でも (anything), いつでも (any time), だれでも (anyone)."
    when: "Use it to say the choice does not matter because every option is fine: 私は何でも食べます (I'll eat anything); いつでも電話してください; 「どれがいいですか。」「どれでもいいです。」 The basic use is with a positive statement."
    why: 'でも here means "even": 何でも is "even what(ever)". If the statement holds even for the least likely choice, it holds for every choice, which gives "any, no matter which". That leaves the choice to the listener: どれでもいいです, "any one is fine". が and を are dropped: 何でも食べます. These words can appear with a negative too, but they never mean "none": 何でも食べません does not mean "I eat nothing". For that, the question word takes も: 何も食べません.'
    formation:
      - form: 何でも / だれでも / いつでも / どこでも / どれでも
        note: Anything, anyone, any time, anywhere, any one of several. 何でも is read なんでも.
      - form: Question word + でも + predicate
        note: "With a positive predicate, any choice at all: 何でも食べます, どれでもいいです."
    examples:
      - japanese: 私は何でも食べます。
        reading: わたしはなんでもたべます。
        romaji: watashi wa nan demo tabemasu.
        english: I'll eat anything.
      - japanese: いつでも電話してください。
        reading: いつでもでんわしてください。
        romaji: itsu demo denwa shite kudasai.
        english: Please call me any time.
      - japanese: 「どれがいいですか。」「どれでもいいです。」
        reading: 「どれがいいですか。」「どれでもいいです。」
        romaji: '"dore ga ii desu ka." "dore demo ii desu."'
        english: '"Which one would you like?" "Any of them is fine."'
      - japanese: この料理はだれでも作ることができます。
        reading: このりょうりはだれでもつくることができます。
        romaji: kono ryōri wa dare demo tsukuru koto ga dekimasu.
        english: Anyone can make this dish.
    mistake:
      wrong: 私は何でも食べません。
      problem: Intended as "I don't eat anything". 何でも食べません does not mean "I eat nothing". For that meaning, use 何も with the negative.
      right: 私は何も食べません。
    distinguish_from:
      - id: OJG-0319
        note: "Question word + か is \"some\": 何か, one thing I'm not naming. でも is \"any\": every choice would do."
      - id: OJG-0321
        note: 'Question word + も with a negative is "none": 何も食べません.'
      - id: OJG-0291
        note: でも at the start of a sentence means "but". That is a different use.
