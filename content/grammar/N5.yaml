  - id: OJG-0288
    pattern: が
    title: Marking the subject, and what is new
    meaning: が marks the subject of a verb or adjective, often picking it out as the new or the answering information.
    when: "Use が on who or what does something or is in some state, when that noun is part of what is new: 雨が降っています, \"It's raining\". A question word asking for the subject takes が, and so does the answer: だれが来ましたか, 田中さんが来ました. が also marks what is liked, understood or can be done: 犬が好きです, 日本語がわかります."
    why: "A sentence can report an event as a whole, with nothing set up first as the topic, and then its subject simply takes が: 雨が降っています tells you what is happening. Because が does not set the noun apart first as は does, it is the particle that can pick out the new or answering piece; in other sentences it simply marks the subject. That is why a question word asking for the subject, who or what did something, takes が, and the answer does too. Inside a clause that describes a noun, the subject normally takes が, not は: 母が作ったケーキ. Some words describe a feeling or an ability toward something rather than an action done to it: 好き, 嫌い, 上手, わかる, できる. With these, the thing liked, understood or done well is normally marked with が. Learn 日本語がわかります as the standard pattern; を does occur with わかる in some constructions, but not in this plain beginner sentence."
    formation:
      - form: Noun + が + verb / adjective
        note: The subject; often the new or answering information.
      - form: Question word + が …
        note: "だれが, 何が, どれが: the unknown takes が, and so does the answer."
      - form: Noun + が + 好き / 嫌い / 上手 / 下手 / わかる / できる
        note: The thing liked, understood or done well normally takes が.
    examples:
      - japanese: 雨が降っています。
        reading: あめがふっています。
        romaji: ame ga futte imasu.
        english: It's raining.
      - japanese: 「だれが来ましたか。」「田中さんが来ました。」
        reading: 「だれがきましたか。」「たなかさんがきました。」
        romaji: '"dare ga kimashita ka." "tanaka-san ga kimashita."'
        english: '"Who came?" "Mr Tanaka did."'
      - japanese: 私は日本語が少しわかります。
        reading: わたしはにほんごがすこしわかります。
        romaji: watashi wa nihongo ga sukoshi wakarimasu.
        english: I understand a little Japanese.
      - japanese: 母が作ったケーキはおいしいです。
        reading: ははがつくったケーキはおいしいです。
        romaji: haha ga tsukutta kēki wa oishii desu.
        english: The cake my mother made is delicious.
        note: Inside the clause that describes ケーキ, the subject takes が.
    mistake:
      wrong: 私は日本語をわかります。
      problem: わかる is not an action done to something; it says something is clear to you. In a plain sentence like this, what is understood is marked with が, and を sounds nonstandard.
      right: 私は日本語がわかります。
    distinguish_from:
      - id: OJG-0008
        note: は sets up the topic and the rest comments on it; が marks the subject, and can pick it out as the answering information. 田中さんが来ました answers who came; 田中さんは来ました says of Mr Tanaka that he came, often in contrast with others.
      - id: OJG-0298
        note: "Both can appear in one sentence: 田中さんは背が高いです. は names what the sentence is about; が marks what 高い is said of."
      - id: OJG-0290
        note: 'This が follows a noun. The が that means "but" follows a whole clause, and a comma usually comes after it: 高いですが、便利です.'
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～が (〜ga)
    references:
      - source_id: hanabira
        ref: が
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "が is a large subject; the entry keeps to new information, question words, noun-modifying clauses and the が of liking and understanding. Questions: is 母が作ったケーキ too advanced as an N5 example? Is 日本語をわかります a fair mistake to call wrong (it is heard in speech), or should the problem say it is nonstandard rather than wrong? Revised after the first gpt-6-astra review to meet its objection (see reviews)."
