  - id: OJG-0033
    pattern: ～んです
    title: Explaining, or asking for the story behind something
    meaning: "～んです (のです): frames a statement as an explanation or background, or a question as asking for one."
    when: "It adds the sense that something is being explained, or that the speaker wants an explanation. Typical situations: giving the reason behind something the listener can see or has asked about (頭が痛いんです, “I have a headache”, when leaving early); asking about something you have noticed (どうしたんですか, “What's wrong?”); and setting up a request or a question with background (駅へ行きたいんですが…, “I want to go to the station, but…”). Without んです, the same sentence usually just reports a fact."
    why: "の turns a sentence into a thing, roughly “it is that…”. Wrapping a statement this way tends to link it to something both people are aware of: what just happened, what the listener can see, or what was asked. That is why it often sounds like an explanation, and why a question with んですか often sounds like asking about the story behind something you noticed, which can show interest. The same framing is why overuse can cause trouble: with nothing to explain, it can sound as if the speaker is insisting on a point or pressing for a reason, and some questions can come across as pushy or accusatory. Learners are usually safer using it when there is a clear situation to explain or ask about."
    formation:
      - form: V／い-adj (plain form) + んです
        note: 行くんです, 行ったんです, 高いんです. Written and formal speech use のです.
      - form: noun／な-adj (plain form) + んです
        note: "Affirmative nonpast だ becomes な: 学生なんです, 静かなんです. Other forms attach directly: 学生だったんです, 学生ではないんです, 静かではなかったんです."
      - form: ～んですか
        note: Asking for an explanation or background.
      - form: ～んだ／～の
        note: "Casual. In casual questions, ～の？ with rising intonation: どうしたの？"
    examples:
      - japanese: すみません、今日は早く帰ります。頭が痛いんです。
        reading: すみません、きょうははやくかえります。あたまがいたいんです。
        romaji: sumimasen, kyō wa hayaku kaerimasu. atama ga itai n desu.
        english: Sorry, I’m going home early today. I have a headache.
        note: んです gives the reason behind leaving early.
      - japanese: どうしたんですか。
        reading: どうしたんですか。
        romaji: dō shita n desu ka.
        english: What’s wrong? / What happened?
        note: Asked when you notice something seems wrong.
      - japanese: その本、いいですね。どこで買ったんですか。
        reading: そのほん、いいですね。どこでかったんですか。
        romaji: sono hon, ii desu ne. doko de katta n desu ka.
        english: That book looks good. Where did you buy it?
        note: Asking about something you have just noticed.
    mistake:
      wrong: 私は学生んです。
      problem: With an affirmative nonpast noun or な-adjective predicate, insert な before んです, in the place where だ would be.
      right: 私は学生なんです。
    distinguish_from:
      - id: OJG-0017
        note: "から states a reason outright: 頭が痛いから帰ります. んです presents a statement as background to the situation, without a word meaning “because”."
      - id: OJG-0036
        note: ので marks a clause as the reason for what follows. のです／んです frames a statement as explanation or background. It often ends a sentence, but it can also come before a connective, as in 駅へ行きたいんですが….
    register:
      - plain
      - polite
      - spoken
      - casual
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: ～んです
          ref: 567
    references:
