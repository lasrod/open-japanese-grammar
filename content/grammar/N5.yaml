      note: "Question: is the remark that あげる to someone above you can sound like doing them a favour accurate and N5-appropriate? Revised after the first gpt-6-astra review to meet its objection (see reviews)."
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-27
          verdict: disagree
          content_sha256: 8b5aaf8d762b62adc79f4431660ffc94af7b698594a766ffe376c27059afb20a
          note: "The absolute exclusion of recipients on the speaker's side is incorrect. 私は妹に本をあげました is natural, and family membership alone does not require くれる. Replace the meaning and directional explanation with: 'あげる describes giving by the speaker to someone else, or giving between other people without presenting it as coming toward the speaker's viewpoint. For giving to the speaker, normally use くれる. For giving to someone close to the speaker, くれる is used when the speaker adopts that recipient's viewpoint; あげる can also be possible.' Replace the formation note with: 'Polite: あげます. In ordinary speaker-centered narration, the recipient is not the speaker; the recipient may be a family member.' In the mistake diagnosis, replace 'あげる only moves away from the speaker’s side' with 'あげる is not normally used for giving to the speaker in this sentence'."
