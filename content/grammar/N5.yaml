  - id: OJG-0290
    pattern: ～が、～／～けど、～
    title: Joining two clauses with "but"
    meaning: "Clause が、clause / clause けど、clause: A, but B. Also a soft lead-in before a question, request or invitation."
    when: "Use it to set two facts against each other in one sentence: このかばんは高いですが、とても便利です. It also opens with background, with little or no contrast, before what you really want to say: 来週パーティーをしますが、来ませんか. が is neutral and common in polite speech and writing; けど is conversational; けれど and けれども are a little more formal than けど. Ending a sentence with が or けど leaves the rest unsaid; it often softens a request or a reservation, and with some intonations it can sound like a complaint."
    why: "が and けど join the first clause to the second and signal that the second may go against what the first suggests. The main point comes last, so in 高いですが、便利です the speaker's weight is on 便利: it is expensive, yet worth it. Because the connector only links and leaves room, Japanese also uses it just to set the scene before a question, request or invitation; the first clause gives the background, the second is the point. The clause before が or けど keeps its own ending. In polite speech, both halves are usually polite (高いですが); in casual speech, plain forms go before けど (高いけど). After a noun or な-adjective, だ or です is needed, as it would be at the end of a sentence: 学生だけど, 静かですが. This が follows a whole clause, which is how it differs from the が that marks a subject after a noun."
    formation:
      - form: Clause + が、clause
        note: "Neutral; common in polite speech and writing: 高いですが、…"
      - form: Clause + けど、clause
        note: "Conversational: 高いけど、… けれど and けれども are slightly more formal."
      - form: Noun / な-adjective + だ or です + が / けど
        note: 学生だけど, 静かですが. 学生けど is wrong.
      - form: Clause + が。 / けど。
        note: "Ends the sentence and leaves the rest unsaid: ちょっと寒いんですけど…"
    examples:
      - japanese: このかばんは高いですが、とても便利です。
        reading: このかばんはたかいですが、とてもべんりです。
        romaji: kono kaban wa takai desu ga, totemo benri desu.
        english: This bag is expensive, but it's very handy.
      - japanese: 日本語は難しいけど、おもしろい。
        reading: にほんごはむずかしいけど、おもしろい。
        romaji: nihongo wa muzukashii kedo, omoshiroi.
        english: Japanese is hard, but it's interesting.
        note: Casual speech, with plain forms and けど.
      - japanese: 来週パーティーをしますが、来ませんか。
        reading: らいしゅうパーティーをしますが、きませんか。
        romaji: raishū pātī o shimasu ga, kimasen ka.
        english: We're having a party next week. Would you like to come?
        note: No contrast; が just sets the scene before the invitation.
    mistake:
      wrong: 私は学生けど、毎日働いている。
      problem: After a noun, けど needs だ first, as the clause would have at the end of a sentence (学生だ). Without it the noun is left hanging.
      right: 私は学生だけど、毎日働いている。
    distinguish_from:
      - id: OJG-0291
        note: "でも and しかし start a new sentence: 高いです。でも、便利です. けれども can start a new sentence or join clauses like けど. This entry is the clause-joining が and けど."
      - id: OJG-0288
        note: "The subject が follows a noun: 雨が降っています. This が follows a whole clause."
    register:
      - plain
      - polite
      - casual
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～が、～ (〜ga, 〜)
        - source_id: hanabira
          level: N5
          item: ～けど、～ (〜kedo、～)
        - source_id: hanabira
          level: N5
          item: ～けれど、～ (〜keredo、～)
        - source_id: hanabira
          level: N4
          item: ～けれど (〜keredo)
    references:
      - source_id: hanabira
        ref: ～が、～／～けど、～
    review:
      status: ai-reviewed
      drafted_by:
