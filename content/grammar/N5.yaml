  - id: OJG-0003
    pattern: で
    title: Where an action happens, and what it is done with
    meaning: "で marks the setting or the means of an action: where it happens, or with what, by what, or in what language."
    when: Use it for the place where an action happens (図書館で勉強します), the tool or means (はしで食べます, バスで行きます), the language (日本語で話します), and a total or a way of doing something counted in people (全部で千円, 一人で行きます).
    why: 'で marks the setting an action happens in, or what the action is carried out with: the frame around the action, not its goal. That is why a place takes で when something is done there, and に when something simply is there: 部屋で勉強します, but 部屋に猫がいます. Verbs of existing and staying, such as ある, いる and 住む, normally take に. An event, though, is something that happens, so where it takes place takes で even with ある: パーティーは友だちの家であります. The means and tool uses follow from the same idea: バスで is "by way of the bus", and 日本語で is "by way of Japanese".'
    formation:
      - form: Place + で + action verb
        note: Where the action happens.
      - form: Tool / vehicle / language + で
        note: はしで, 電車で, 日本語で.
      - form: Amount / number of people + で
        note: 全部で "altogether", 一人で "on my own", 二人で "the two of us".
    examples:
      - japanese: 図書館で本を読みます。
        reading: としょかんでほんをよみます。
        romaji: toshokan de hon o yomimasu.
        english: I read books at the library.
      - japanese: バスで学校へ行きます。
        reading: バスでがっこうへいきます。
        romaji: basu de gakkō e ikimasu.
        english: I go to school by bus.
      - japanese: 日本語で話してください。
        reading: にほんごではなしてください。
        romaji: nihongo de hanashite kudasai.
        english: Please speak in Japanese.
      - japanese: 全部で千円です。
        reading: ぜんぶでせんえんです。
        romaji: zenbu de sen'en desu.
        english: That's 1,000 yen altogether.
    mistake:
      wrong: 図書館に勉強します。
      problem: Studying is an action, and the library is where it happens, so the place takes で. に would mark where something is, or where someone goes.
      right: 図書館で勉強します。
    distinguish_from:
      - id: OJG-0005
        note: Place + に says where something is (公園に子どもがいます); place + で says where an action happens (公園で遊びます).
      - id: OJG-0004
        note: In バスで学校に行きます, で marks how you go and に／へ marks where you arrive.
      - id: OJG-0011
        note: 友だちと marks who you do it with; 一人で says you do it alone.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: で
          ref: 537
    references:
      - source_id: tanos
        ref: 537
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Not covered: で for a cause with a noun (風邪で休みました), material (木で作る), and the て-form of だ (学生で、…), which looks the same but is not the particle. Should cause be added here at N5, or left to a later entry?"
