  - id: OJG-0301
    pattern: ～くないです
    title: Saying an い-adjective is not so, politely
    meaning: "い-adjective, drop い, + くないです or くありません: is not X. いい becomes よくないです."
    when: "Use it to say something is not cold, not expensive, not interesting: 今日は寒くないです. くありません means the same and sounds a little more formal; くないです is common in everyday polite speech. Past: くなかったです, くありませんでした."
    why: "An い-adjective behaves like a verb: it carries its own tense and its own negative, and in plain speech it ends a sentence with nothing after it (高い, 高くない). です after an い-adjective only adds politeness; it is not a verb to be made negative. So the negative is built on the adjective itself, 高い → 高くない, and です is added on top: 高くないです. So the ordinary negative is 高くないです. じゃない is the negative of だ, used after nouns and な-adjectives; 高いじゃないです does not give the plain \"is not expensive\", and with some intonations is heard instead as confirmation or surprise (\"it's expensive, isn't it!\"). くありません is the same く form with ありません, the polite negative of ある. The only irregular one is いい, whose forms are built on よい: よくないです. な-adjectives that end in い, like きれい and 嫌い, are not い-adjectives: きれいじゃないです."
    formation:
      - form: い-adjective (drop い) + くないです
        note: "高い → 高くないです. Plain: 高くない."
      - form: い-adjective (drop い) + くありません
        note: A little more formal.
      - form: い-adjective (drop い) + くなかったです / くありませんでした
        note: Past.
      - form: いい → よくないです
        note: Irregular.
    examples:
      - japanese: 今日は寒くないです。
        reading: きょうはさむくないです。
        romaji: kyō wa samukunai desu.
        english: It isn't cold today.
      - japanese: このカレーは辛くありません。
        reading: このカレーはからくありません。
        romaji: kono karē wa karaku arimasen.
        english: This curry isn't spicy.
      - japanese: 昨日の映画はよくなかったです。
        reading: きのうのえいがはよくなかったです。
        romaji: kinō no eiga wa yokunakatta desu.
        english: Yesterday's film wasn't good.
    mistake:
      wrong: この本はおもしろいじゃないです。
      problem: "Intended as \"This book isn't interesting\". おもしろい is an い-adjective, so it makes its own negative: おもしろくない. おもしろいじゃないです does not give that ordinary negative meaning."
      right: この本はおもしろくないです。
    distinguish_from:
      - id: OJG-0001
        note: "Nouns and な-adjectives use the negative of the copula: ではない or じゃない, made polite as じゃありません or じゃないです (学生じゃありません, 静かじゃないです). い-adjectives change their own ending."
      - id: OJG-0315
        note: "あまり + くない softens it: not very."
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: "い-Adjective: Negative Polite Form"
