  - id: OJG-0031
    pattern: ～たことがある
    title: Have done something before (experience)
    meaning: "V-たことがある: have the experience of doing V at some point; ～たことがない: have never done V."
    when: "Use it to talk about experiences in your life so far: places you have been, food you have eaten, things you have tried. It is how you ask “Have you ever…?” (～たことがありますか) and say “I have never…” (～たことがありません)."
    why: "こと turns the clause before it into a thing: 行ったこと is “the fact of having gone”. がある then says that thing exists, in your life so far. So the sentence is about whether the experience exists, not about when it happened. That is why it usually sits badly with a specific recent time such as 昨日, where the plain past is used, and why it tends to sound odd with everyday actions nobody would count as an experience, unless the context makes them notable. The verb before こと is in the た-form; with the dictionary form, ～ることがある means something different, that something happens sometimes."
    formation:
      - form: V (た-form) + ことがある
        note: "Polite: ～たことがあります. Question: ～たことがありますか."
      - form: V (た-form) + ことがない
        note: "Never. Polite: ～たことがありません. In negatives, は often replaces が: 行ったことはありません."
    examples:
      - japanese: 日本へ行ったことがありますか。
        reading: にほんへいったことがありますか。
        romaji: nihon e itta koto ga arimasu ka.
        english: Have you ever been to Japan?
      - japanese: 私は富士山に登ったことがあります。
        reading: わたしはふじさんにのぼったことがあります。
        romaji: watashi wa fujisan ni nobotta koto ga arimasu.
        english: I have climbed Mount Fuji.
      - japanese: すしはまだ食べたことがありません。
        reading: すしはまだたべたことがありません。
        romaji: sushi wa mada tabeta koto ga arimasen.
        english: I’ve never had sushi yet.
    mistake:
      wrong: 昼ご飯を食べたことがありますか。
      problem: Meant as “Have you had lunch?”. English uses “have you…?” both for experience and for something done recently, but ～たことがある only asks about experience in your life, so this sounds like “Have you ever eaten lunch?”. For “yet”, ask with もう and the past.
      right: もう昼ご飯を食べましたか。
    distinguish_from:
      - id: OJG-0024
        note: "まだ～ていません: something expected has not happened yet. ～たことがない: you have never had the experience at all."
