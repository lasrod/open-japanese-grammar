# Open Japanese Grammar: points commonly listed at N5.
# See CONTRIBUTING.md before editing.

schema_version: 0.1.0
level: N5
entries:
  - id: OJG-0001
    pattern: です
    title: Saying what something is, politely
    meaning: 'です: ends a noun or adjective sentence politely; after a noun it links the topic to what it is ("X is Y").'
    when: "Use it at the end of a sentence whose main word is a noun or an adjective, when you are speaking politely: これは本です, 静かです, 高いです. It changes form for the negative (じゃありません), the past (でした) and questions (ですか). With a noun or a な-adjective it says what the topic is or what it is like; with an い-adjective it only makes the sentence polite."
    why: 'です does two jobs at once. After a noun or a な-adjective it is what links the topic to its description, and its plain counterpart is だ: 学生です, 学生だ. It also marks the sentence as polite. An い-adjective is already a complete predicate on its own (高い already means "is expensive"), so です after it adds only politeness. That is why the tense and the negative go on the い-adjective itself: 高かったです, 高くないです, not 高いでした. です describes and identifies; it does not usually say that something exists or is present somewhere. "There is a cat" uses あります／います, not です.'
    formation:
      - form: Noun / な-adjective + です
        note: "Past: でした. Question: add か, as in 学生ですか."
      - form: Noun / な-adjective + じゃありません
        note: "Also ではありません, which sounds more formal, and じゃないです, which is very common in speech. Past negative: じゃありませんでした / じゃなかったです."
      - form: い-adjective + です
        note: "Tense and negation go on the adjective: 高かったです, 高くないです (or 高くありません)."
    examples:
      - japanese: これは私のかばんです。
        reading: これはわたしのかばんです。
        romaji: kore wa watashi no kaban desu.
        english: This is my bag.
      - japanese: 田中さんは学生じゃありません。
        reading: たなかさんはがくせいじゃありません。
        romaji: tanaka-san wa gakusei ja arimasen.
        english: Mr Tanaka is not a student.
      - japanese: 昨日は雨でした。
        reading: きのうはあめでした。
        romaji: kinō wa ame deshita.
        english: It rained yesterday.
        note: 'Literally "yesterday was rain": a noun sentence in the past.'
      - japanese: この部屋は静かです。
        reading: このへやはしずかです。
        romaji: kono heya wa shizuka desu.
        english: This room is quiet.
    mistake:
      wrong: 昨日は楽しいでした。
      problem: 楽しい is an い-adjective, so it carries its own past tense. でした is the past of です after a noun or a な-adjective, not after an い-adjective.
      right: 昨日は楽しかったです。
    distinguish_from:
      - id: OJG-0009
        note: です says what something is or is like (これはペンです). ～があります says that a thing exists or is somewhere (ペンがあります).
      - id: OJG-0010
        note: To say that a person or animal is present somewhere, use ～がいます (庭に猫がいます). です is not a verb of existence, though it can identify where a known person is (先生は職員室です).
      - id: OJG-0038
        note: "でしょう is a guess built on the same ending: 雨です states it, 雨でしょう says it is probably so."
    register:
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: です
          ref: 535
    references:
      - source_id: tanos
        ref: 535
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Left out on purpose: sentences where です stands in for a verb in context (僕はコーヒーです when ordering, 田中さんは会議室です for 'is in the meeting room'). They are natural but would blur the 'describes, does not say where' line; the entry says 'does not usually' to leave room. Please confirm the relative formality given for ではありません / じゃありません / じゃないです is stated as a tendency, not a rule."
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-24
          verdict: agree
          content_sha256: 4ba16227daf027a8d58db4e05b470723ad455175d1aa236c3e9629835667a0b5
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
          date: 2026-09-24
          verdict: disagree
          content_sha256: 29474141a79252f562e9f7ade782556c7688db558797b15b2049723fbad4996c
          note: "The OJG-0010 distinction is too absolute: です can identify someone's location, as in 先生は職員室です. Replace the note with: \"To say that a person or animal is present somewhere, use ～がいます (庭に猫がいます). です is not an existential verb, though it can identify a known person's location (先生は職員室です).\""
        - by: gpt-6-astra
          kind: ai
