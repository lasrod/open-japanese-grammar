  - id: OJG-0318
    pattern: ～はどうですか／～はいかがですか
    title: How about ...? How is ...?
    meaning: "Nはどうですか: how is N? or how about N? Nはいかがですか is the politer form, for offers to guests and customers."
    when: "Use it to ask how something is or was: 日本の生活はどうですか (How is life in Japan?), 昨日のパーティーはどうでしたか. Use it also to suggest something: 「いつ会いましょうか。」「あしたはどうですか。」 いかがですか is the polite version, used when offering something to a guest or customer: お茶はいかがですか."
    why: 'どう is the question word for "how, in what way", so Nはどうですか asks for your view of N or how N is going. When N is something offered or proposed, a day or a drink, asking how it is becomes a suggestion: what do you think of this one? いかが means the same, but belongs to polite speech, so it suits offering a guest a drink or a shop suggesting an item. For something already over, use the past: どうでしたか.'
    formation:
      - form: Noun + は + どうですか
        note: How is N? How about N?
      - form: Noun + は + いかがですか
        note: Politer; offers to guests and customers.
      - form: Noun + は + どうでしたか
        note: How was N?
      - form: Noun + は + どう？
        note: Casual.
    examples:
      - japanese: 「日本の生活はどうですか。」「楽しいです。」
        reading: 「にほんのせいかつはどうですか。」「たのしいです。」
        romaji: '"nihon no seikatsu wa dō desu ka." "tanoshii desu."'
        english: "\"How is life in Japan?\" \"It's fun.\""
      - japanese: 「いつ会いましょうか。」「あしたはどうですか。」
        reading: 「いつあいましょうか。」「あしたはどうですか。」
        romaji: '"itsu aimashō ka." "ashita wa dō desu ka."'
        english: '"When shall we meet?" "How about tomorrow?"'
      - japanese: お茶はいかがですか。
        reading: おちゃはいかがですか。
        romaji: ocha wa ikaga desu ka.
        english: Would you like some tea?
      - japanese: 昨日のパーティーはどうでしたか。
        reading: きのうのパーティーはどうでしたか。
        romaji: kinō no pātī wa dō deshita ka.
        english: How was the party yesterday?
    mistake:
      wrong: 日本の生活は何ですか。
      problem: 何 asks what something is. To ask how something is going or what it is like, use どう.
      right: 日本の生活はどうですか。
    distinguish_from:
