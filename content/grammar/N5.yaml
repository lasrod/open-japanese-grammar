  - id: OJG-0024
    pattern: まだ～ていません
    title: Not yet
    meaning: "まだ V-ていません: V has not happened yet, and the situation is still open."
    when: "Use it to say something expected has not happened so far: the homework is not finished yet, a friend has not arrived yet. It is the usual negative answer to a question with もう, “already”: もう食べましたか, “Have you eaten?”, いいえ、まだ食べていません. The short answer is まだです, or まだ in casual speech."
    why: "“Not yet” describes how things stand now, and it leaves room for the action to happen later. In this use, V-ていない describes an action as not having occurred or been completed up to the reference time. With まだ and a present reference time, it means “not yet”. The polite past negative V-ませんでした (plain: V-なかった) normally reports that an action did not occur in a past situation, rather than that it remains undone now, so it is not the usual form for answering “Have you eaten yet?” negatively. This is why the question and its answers do not match in form: yes is もう食べました (the action is done), but no is まだ食べていません (it has not happened up to now). To say something had not yet happened at a past point, the reference time moves to the past: その時はまだ来ていませんでした."
    formation:
      - form: まだ + V (て-form) + いません
        note: Polite.
      - form: まだ + V (て-form) + いない
        note: "Plain. Casual speech often drops the い: まだ食べてない."
      - form: まだです／まだ
        note: Short answer to a もう question.
      - form: (past point) まだ + V (て-form) + いませんでした
        note: Not yet, as of a point in the past.
    examples:
      - japanese: いいえ、まだ食べていません。
        reading: いいえ、まだたべていません。
        romaji: iie, mada tabete imasen.
        english: No, I haven’t eaten yet.
        note: An answer to もう昼ご飯を食べましたか.
      - japanese: 宿題はまだ終わっていません。
        reading: しゅくだいはまだおわっていません。
        romaji: shukudai wa mada owatte imasen.
        english: My homework isn’t finished yet.
      - japanese: 田中さんはまだ来ていません。
        reading: たなかさんはまだきていません。
        romaji: tanaka-san wa mada kite imasen.
        english: Mr Tanaka hasn’t come yet.
    mistake:
      wrong: いいえ、まだ食べませんでした。
      problem: English speakers reach for the past because of “I didn’t eat yet”. But “not yet” is about whether the action has happened up to now, so Japanese uses the negative of the ている form. ませんでした normally reports that something did not happen in a past situation, so it is not the usual answer here.
      right: いいえ、まだ食べていません。
    distinguish_from:
      - id: OJG-0018
        note: "まだ～ていません is the negative of the ている state: not having done something so far. With an affirmative ている, まだ means “still”: まだ寝ています, “He is still asleep”."
      - id: OJG-0031
        note: ～たことがない says you have never had the experience at all. まだ～ていません says something expected has not happened yet. まだ can join ことがない to mean “have never yet”.
    register:
      - plain
      - polite
      - casual
