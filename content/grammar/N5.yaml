  - id: OJG-0029
    pattern: ～たい
    title: Saying what you want to do
    meaning: "V (ます-stem) + たい: I want to do V. It changes like an い-adjective: たくない, たかった."
    when: Use it to say what the speaker wants to do, and to ask what the listener wants to do. For someone else's wish, Japanese usually uses たがっている or reports it. To want a thing rather than an action, use ほしい instead.
    why: "たい joins the verb stem, the part left when you take ます away: 食べます → 食べ, 飲みます → 飲み, します → し. The result is an い-adjective, so it changes like one: 食べたい, 食べたくない, 食べたかった, and 食べたいです for polite speech. As a word of feeling, it reports a wish from the inside. Japanese tends not to state another person's inner feelings as plain fact, because you cannot see inside them, so for someone else speakers usually say what they can observe (行きたがっています, \"is showing that he wants to go\") or report it (行きたいと言っていました). Asking the listener is fine, but asking someone senior what they want can sound too direct; offers are often made with ～ませんか or ～ましょうか instead. With a verb that takes を, the object can be marked with を or with が: 水を飲みたい, 水が飲みたい."
    formation:
      - form: V (ます-stem) + たい
        note: 食べます → 食べたい; 行きます → 行きたい; します → したい; 来ます → 来たい (きたい).
      - form: V (ます-stem) + たいです
        note: "Polite: add です; たい itself does not change."
      - form: V (ます-stem) + たくない／たかった／たくなかった
        note: Negative, past, and negative past, as for any い-adjective.
      - form: object を／が + V-たい
        note: With a verb that takes を, both を and が are used for the object.
      - form: V (ます-stem) + たがっている
        note: "For someone else's wish: they show that they want to."
    examples:
      - japanese: 冷たい水が飲みたいです。
        reading: つめたいみずがのみたいです。
        romaji: tsumetai mizu ga nomitai desu.
        english: I want to drink some cold water.
      - japanese: 日本で何を食べたいですか。
        reading: にほんでなにをたべたいですか。
        romaji: nihon de nani o tabetai desu ka.
        english: What do you want to eat in Japan?
      - japanese: 今日はどこへも行きたくないです。
        reading: きょうはどこへもいきたくないです。
        romaji: kyō wa doko e mo ikitakunai desu.
        english: I don't want to go anywhere today.
      - japanese: 妹は外で遊びたがっています。
        reading: いもうとはそとであそびたがっています。
        romaji: imōto wa soto de asobitagatte imasu.
        english: My little sister wants to play outside.
        note: For someone else, たがっている describes the wish you can see.
    mistake:
      wrong: 私はすしを食べるたいです。
      problem: たい joins the ます-stem, not the dictionary form. Take ます off 食べます and add たい.
      right: 私はすしを食べたいです。
    distinguish_from:
      - id: OJG-0027
        note: つもり states a plan already decided. たい states a wish, which may never become a plan.
      - id: OJG-0021
        note: のが好き is a general liking. たい is wanting to do something, often now or on a given occasion.
      - id: OJG-0007
        note: To invite someone, ～ませんか is usual. ～たいですか asks about their wish, and can sound too direct to someone senior.
