  - id: OJG-0288
    pattern: が
    title: Marking the subject, often as the new information
    meaning: "が marks the subject: who does it, what is there, what is described. It often marks the new or answering part of the sentence."
    when: "Use が on the subject when you are introducing it or when it is the point of the sentence: 雨が降っています, \"It's raining\"; 公園に子どもがいます, \"There are children in the park\". A question word used as the subject takes が (だれが, 何が, どれが), and so does the word that answers it. With 好き, きらい, 上手, 下手, わかる and ほしい, the thing liked, understood or wanted takes が: 猫が好きです. Inside a clause that describes a noun, the subject usually takes が rather than は: 母が作ったケーキ, \"the cake my mother made\"."
    why: 'が points at one particular thing as "the one that" the predicate is about. That is why it goes on new information: the listener did not know which thing, and が supplies it. It is also why a question word takes が and not は: だれ asks for the unknown one, so it cannot be the known starting point that は sets up (だれは来ましたか is wrong). The answer comes back with が too: 田中さんが来ました. Once a thing is known and you go on talking about it, it usually becomes the topic with は. With 好き, わかる and similar words, Japanese treats the thing as the subject: 猫が好きです is close to "cats are likeable (to me)", so 猫 takes が, not を. A clause that describes a noun is not the main statement and does not normally set up a topic of its own, so its subject takes が.'
    formation:
      - form: Noun + が + verb／adjective
        note: "The subject of the predicate: 雨が降っています, 空が青いです."
      - form: Question word + が
        note: だれが, 何が, どれが, どこが. The answer also takes が.
      - form: Noun + が + 好き／きらい／上手／下手／わかる／ほしい
        note: The thing liked, understood or wanted takes が, not を.
      - form: Noun + が + ある／いる
        note: "What is there: see OJG-0009 and OJG-0010."
    examples:
      - japanese: 雨が降っています。
        reading: あめがふっています。
        romaji: ame ga futte imasu.
        english: It's raining.
      - japanese: だれが窓を開けましたか。
        reading: だれがまどをあけましたか。
        romaji: dare ga mado o akemashita ka.
        english: Who opened the window?
        note: A question word as subject takes が, never は.
      - japanese: 私は猫が好きです。
        reading: わたしはねこがすきです。
        romaji: watashi wa neko ga suki desu.
        english: I like cats.
        note: 私 is the topic with は; the thing liked, 猫, takes が.
    mistake:
      wrong: だれは来ましたか。
      problem: A question word asks for the unknown one, so it cannot be the topic set up with は. As the subject it takes が.
      right: だれが来ましたか。
    distinguish_from:
      - id: OJG-0008
        note: は sets up what the sentence is about, something known or in contrast; が picks out the subject as new or as the answer. 田中さんは来ました talks about Tanaka; 田中さんが来ました says who came.
      - id: OJG-0298
        note: "Both together: AはBが～ puts A as the topic and B as the subject of what is said about it."
      - id: OJG-0290
        note: The が meaning "but" comes after a whole clause (高いですが、…), not directly after the subject noun.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～が (〜ga)
    references:
      - source_id: hanabira
        ref: が
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Question: should 好き with を (猫を好きです), heard in some speech, be mentioned, or is "が, not を" right to state flatly at N5? Is "a noun-describing clause does not normally set up a topic" a safe simplification given contrastive は inside such clauses? Not covered: が replaced by の in noun-describing clauses (母の作ったケーキ).'
  - id: OJG-0289
    pattern: N1のN2
    title: "Linking two nouns: my, of, about, from"
    meaning: "N1のN2: N1 narrows down N2, saying whose it is, what it is about, where it is from or what kind: 私の本, 日本語の先生."
    when: 'Use の between two nouns when the first tells you which one or what kind the second is: who owns it (私のかばん), what it is about or what is taught (日本語の本, 日本語の先生), where it comes from or where it is (日本の車, 東京の大学), what it is made of (木の机), and who a person is to you (友だちの田中さん, "my friend Tanaka"). When the second noun is clear, it can be left out: これは私のです, "This is mine".'
    why: "In Japanese the describing word comes first and the word it describes comes last. の is the joint between them: N1のN2 is \"the N2 that is linked to N1\". Because the link is left open, の covers \"my\", \"of\", \"about\", \"from\", \"made of\" and more, and the listener works out which from the two nouns. The order matters: 先生の本 is the teacher's book, a book about teachers would be different, and the main noun is always the last one. You can chain it: 私の友だちの車, \"my friend's car\". の joins nouns only. An い-adjective goes straight onto the noun (大きい本), and a な-adjective takes な (静かな部屋)."
    formation:
      - form: Noun1 + の + Noun2
        note: Noun2 is the main noun; Noun1 narrows it down.
      - form: Noun + の (Noun2 left out)
        note: 'When Noun2 is clear: 私のです, "it is mine"; だれのですか, "whose is it?".'
    examples:
      - japanese: 田中さんの傘はどれですか。
        reading: たなかさんのかさはどれですか。
        romaji: tanaka-san no kasa wa dore desu ka.
        english: Which one is Mr Tanaka's umbrella?
      - japanese: 日本語の先生はやさしいです。
        reading: にほんごのせんせいはやさしいです。
        romaji: nihongo no sensei wa yasashii desu.
        english: The Japanese teacher is kind.
        note: 日本語 says what the teacher teaches, not where the teacher is from.
      - japanese: その本は私のです。
        reading: そのほんはわたしのです。
        romaji: sono hon wa watashi no desu.
        english: That book is mine.
        note: 本 is clear from the start of the sentence, so it is left out after の.
    mistake:
      wrong: これは大きいのかばんです。
      problem: の joins two nouns. 大きい is an い-adjective and goes straight onto the noun.
      right: これは大きいかばんです。
    distinguish_from:
      - id: OJG-0011
        note: AとB is "A and B", two things side by side; AのB is one thing, B, described by A.
      - id: OJG-0314
        note: That の comes after a verb or adjective and stands for a thing or an action (大きいの, 食べるの); here の joins two nouns.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～の (〜no)
    references:
      - source_id: hanabira
        ref: N1のN2
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Not covered: の after a particle (東京からの電車) and の replacing が in noun-describing clauses. Question: 日本語の先生 is glossed as "teacher of Japanese"; is that the default reading a native speaker would give, with 日本人の先生 for a teacher who is Japanese? Please confirm the OJG-0314 note matches what that entry will cover.'
  - id: OJG-0290
    pattern: ～が、～／～けど、～
    title: Joining two clauses with "but"
    meaning: '～が、～／～けど、～ joins two clauses: "…, but …", or just sets up what comes next. が is more formal; けど is conversational.'
    when: "Put が or けど at the end of the first clause to join a second one that goes against it: このレストランは高いですが、おいしいです. Both can also join two clauses with no real contrast, only to set up a question or request: すみません、駅に行きたいんですが、…. And a sentence can stop at が or けど with the rest left unsaid, which makes it softer: ちょっと寒いんですけど…, \"It's a bit cold (so could we…)\"."
    why: "が and けど go on the end of a complete clause and tell the listener \"there is more, and it does not simply follow on from this\". Most often what follows is a contrast, which gives \"but\". Because they only signal that a second part is coming, they can also set the scene before the main point, like English \"I'm calling about the order, (and) …\". Leaving the second part out lets the listener fill it in, so a sentence ending in けど sounds tentative or polite rather than blunt. が is the more formal choice, common in writing and after です／ます. けど is everyday speech; けれど and けれども are fuller, somewhat more careful forms of it. A noun or な-adjective clause needs its だ or です before them: 学生だけど, 静かですが."
    formation:
      - form: Clause + が、Clause
        note: "More formal; in polite speech usually after です／ます: 高いですが、…. Common in writing."
      - form: Clause + けど、Clause
        note: Conversational. けれど and けれども are fuller, somewhat more careful forms.
      - form: Noun／な-adjective + だ／です + けど／が
        note: "The clause keeps its だ or です: 学生だけど, 静かですが."
      - form: Clause + が／けど… (rest left unsaid)
        note: Softens a statement, request or refusal.
    examples:
      - japanese: このレストランは高いですが、とてもおいしいです。
        reading: このレストランはたかいですが、とてもおいしいです。
        romaji: kono resutoran wa takai desu ga, totemo oishii desu.
        english: This restaurant is expensive, but the food is very good.
      - japanese: 日本語は難しいけど、おもしろい。
        reading: にほんごはむずかしいけど、おもしろい。
        romaji: nihongo wa muzukashii kedo, omoshiroi.
        english: Japanese is hard, but it's interesting.
        note: Plain and casual, as between friends.
      - japanese: すみません、駅に行きたいんですが、この道でいいですか。
        reading: すみません、えきにいきたいんですが、このみちでいいですか。
        romaji: sumimasen, eki ni ikitai n desu ga, kono michi de ii desu ka.
        english: Excuse me, I want to get to the station. Is this the right way?
        note: "No contrast here: が only sets up the question."
    mistake:
      wrong: 私は学生けど、毎日働いている。
      problem: After a noun or な-adjective the first clause needs its だ (or です) before けど; 学生けど leaves it without a predicate.
      right: 私は学生だけど、毎日働いている。
    distinguish_from:
      - id: OJG-0291
        note: でも, しかし and けれども start a new sentence; が and けど sit at the end of the first clause, inside one sentence.
      - id: OJG-0288
        note: The subject-marking が goes directly on a noun (雨が); this が follows a whole clause (雨ですが).
      - id: OJG-0086
        note: のに, "even though", adds surprise or complaint that things went against expectation; が and けど just contrast, or only link.
    register:
      - plain
      - polite
      - casual
      - spoken
      - written
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～が、～ (〜ga, 〜)
        - source_id: hanabira
          level: N5
          item: ～けど、～ (〜kedo、～)
        - source_id: hanabira
          level: N5
          item: ～けれど、～ (〜keredo、～)
        - source_id: hanabira
          level: N4
          item: ～けれど (〜keredo)
    references:
      - source_id: hanabira
        ref: ～が、～／～けど、～
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: "Questions: is the formality order けど < けれど < けれども < が fair to present, or is が vs けれども not comparable this way? Is 学生けど a common enough learner error to headline, versus using けど in formal writing? Is ちょっと寒いんですけど… natural as the trailing-off example?"
  - id: OJG-0291
    pattern: でも／しかし／けれども
    title: Starting a sentence with "but"
    meaning: 'でも／しかし／けれども start a new sentence that goes against the one before: "But …", "However …".'
    when: "Use one at the start of a sentence when it runs against what you just said: 昨日は雨でした。でも、楽しかったです. でも is the everyday word in conversation, casual or polite. しかし is formal and written; in speech it belongs to speeches, lectures and news. けれども fits careful polite speech and writing."
    why: 'Each is a whole word that points back to the previous sentence, so the first sentence can finish with 。 and the turn comes fresh at the start of the next. The three do not differ much in meaning; they differ in setting, like "but" and "however" in English. Inside a single sentence the joining word goes on the end of the first clause instead: が or けど (OJG-0290). でも here stands alone at the start of the sentence; after a question word it is a different point (何でも, "anything").'
    formation:
      - form: Sentence A。でも、Sentence B。
        note: Everyday speech, casual or polite.
      - form: Sentence A。しかし、Sentence B。
        note: "Formal: writing, speeches, news."
      - form: Sentence A。けれども、Sentence B。
        note: Polite and somewhat careful, in speech or writing.
    examples:
      - japanese: 昨日は雨でした。でも、楽しかったです。
        reading: きのうはあめでした。でも、たのしかったです。
        romaji: kinō wa ame deshita. demo, tanoshikatta desu.
        english: It rained yesterday. But it was fun.
      - japanese: この部屋は広いです。しかし、駅から遠いです。
        reading: このへやはひろいです。しかし、えきからとおいです。
        romaji: kono heya wa hiroi desu. shikashi, eki kara tōi desu.
        english: This room is spacious. However, it's far from the station.
        note: しかし sounds written or formal; in conversation でも is more usual.
      - japanese: 何回も電話しました。けれども、だれも出ませんでした。
        reading: なんかいもでんわしました。けれども、だれもでませんでした。
        romaji: nankai mo denwa shimashita. keredomo, dare mo demasen deshita.
        english: I called many times. But nobody answered.
    mistake:
      wrong: このケーキ、おいしいね。しかし、ちょっと高いね。
      problem: しかし is formal and written. In a casual chat with a friend it sounds stiff, as if read from a text.
      right: このケーキ、おいしいね。でも、ちょっと高いね。
    distinguish_from:
      - id: OJG-0290
        note: が and けど join two clauses inside one sentence (高いですが、…); these start a new sentence (高いです。でも、…).
      - id: OJG-0320
        note: 'でも after a question word means "any": 何でも, "anything". At the start of a sentence, でも means "but".'
    register:
      - plain
      - polite
      - casual
      - spoken
      - written
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: A。けれども、～B。(A. Keredomo,~ B.)
        - source_id: hanabira
          level: N5
          item: A。しかし、～B。 (A. Shikashi, ~B.)
        - source_id: hanabira
          level: N5
          item: A。でも、～B。(A. Demo, ~B)
    references:
      - source_id: hanabira
        ref: でも／しかし／けれども
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: "Questions: is it fair to place けれども as careful polite speech and writing, between でも and しかし? Is しかし in casual speech always stiff, or natural from some speakers (e.g. older men)? Not covered: sentence-initial だけど, ですが, だが; should they be named here?"
  - id: OJG-0292
    pattern: では／じゃ／それでは
    title: '"Well then": moving on, starting or wrapping up'
    meaning: 'では／じゃ／それでは: "well then", "in that case". It moves on from what was just said to what follows from it.'
    when: "Use one at the start of a sentence to move on from where things stand: to begin something (では、始めましょう), to end a conversation or take your leave (じゃ、また明日), or to act on what the other person just said (told there is no coffee: じゃ、お茶をください). それでは is the most formal and suits announcements, meetings or a teacher starting a class; では is polite; じゃ and それじゃ are casual."
    why: "では is で, a form of だ (\"it is\"), plus は: roughly \"that being so\". それでは spells out the \"that\": \"that being the case\". Either way, it takes what has just been said or settled as given and moves to the next step. That is why it both starts things (\"with that settled, let's begin\") and ends them (\"well then, goodbye\"). It does not mean \"then\" in the sense of \"next in time\"; for that, use それから. じゃ is the spoken contraction of では, the same one as in じゃありません, and carries the same casual feel."
    formation:
      - form: では、～
        note: Polite.
      - form: それでは、～
        note: "Most formal: announcements, meetings, a class."
      - form: じゃ、～／それじゃ、～
        note: Casual contractions; also written じゃあ.
    examples:
      - japanese: では、授業を始めましょう。
        reading: では、じゅぎょうをはじめましょう。
        romaji: dewa, jugyō o hajimemashō.
        english: Well then, let's start the class.
      - japanese: じゃ、また明日。
        reading: じゃ、またあした。
        romaji: ja, mata ashita.
        english: Okay then, see you tomorrow.
      - japanese: じゃ、お茶をください。
        reading: じゃ、おちゃをください。
        romaji: ja, ocha o kudasai.
        english: In that case, I'll have tea, please.
        note: "Said after hearing, for example, that there is no coffee: じゃ builds on that news."
    mistake:
      wrong: 朝ご飯を食べました。では、学校に行きました。
      problem: では does not mean "then" as in "next"; it means "in that case" and moves on from a situation. For what happened next, use それから.
      right: 朝ご飯を食べました。それから、学校に行きました。
    distinguish_from:
      - id: OJG-0293
        note: それから gives what comes next in time or adds an item; では moves on from a situation, "in that case".
      - id: OJG-0294
        note: だから states a result that follows from a reason; では turns to what to do now, given the situation.
    register:
      - polite
      - casual
      - spoken
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: A。じゃ、～B。(A. Ja, ~B.)
        - source_id: hanabira
          level: N5
          item: A。それじゃ、～B。(A. Soreja,~B.)
        - source_id: hanabira
          level: N5
          item: A。それでは、～B。(A. Soredewa,~B.)
        - source_id: hanabira
          level: N5
          item: A。 では、～B。 (A. Dewa, ~B)
    references:
      - source_id: hanabira
        ref: では／じゃ／それでは
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Questions: is describing では as で (a form of だ) + は accurate enough as a memory aid? Should "written" be listed, since それでは and では appear in writing too? Is じゃ、お茶をください natural as a reply in a café, or would じゃあ be the usual spelling in dialogue?'
  - id: OJG-0293
    pattern: そして／それから
    title: '"And", "and then": adding the next thing'
    meaning: 'そして／それから start a sentence that adds to the last one: そして "and", それから "and then, after that", or "also".'
    when: "Use そして to add something to what you just said, whether the next point in a description or the next step: この店は安いです。そして、おいしいです. Use それから for what happens next in time (顔を洗いました。それから、朝ご飯を食べました) and to add one more item to a list or an order: コーヒーをください。それから、水も. Both begin a new sentence. To join nouns, use と instead."
    why: 'それから is それ "that" + から "from": "from that point". So its basic meaning is "after that", and from there "and one more thing". そして comes from そう "like that" + して "doing": "having done so", and it simply carries on to the next thing, in time or in a description. Both are whole words that point back to the previous sentence, so they stand at the start of the next one. They cannot join two nouns the way English "and" can.'
    formation:
      - form: Sentence A。そして、Sentence B。
        note: Adds the next point or step.
      - form: Sentence A。それから、Sentence B。
        note: '"After that"; also adds one more item: それから、水もください.'
    examples:
      - japanese: 顔を洗いました。それから、朝ご飯を食べました。
        reading: かおをあらいました。それから、あさごはんをたべました。
        romaji: kao o araimashita. sorekara, asagohan o tabemashita.
        english: I washed my face. Then I had breakfast.
      - japanese: この店は安いです。そして、おいしいです。
        reading: このみせはやすいです。そして、おいしいです。
        romaji: kono mise wa yasui desu. soshite, oishii desu.
        english: This place is cheap. And the food is good.
      - japanese: コーヒーを一つください。それから、水もお願いします。
        reading: コーヒーをひとつください。それから、みずもおねがいします。
        romaji: kōhī o hitotsu kudasai. sorekara, mizu mo onegai shimasu.
        english: One coffee, please. And some water too.
        note: Here それから adds one more item, not a later event.
    mistake:
      wrong: 私は犬そして猫が好きです。
      problem: そして joins sentences, not nouns. To list two nouns, use と.
      right: 私は犬と猫が好きです。
    distinguish_from:
      - id: OJG-0011
        note: "と joins nouns: 犬と猫. そして and それから start a new sentence."
      - id: OJG-0312
        note: The て-form joins clauses inside one sentence (顔を洗って、朝ご飯を食べました); そして and それから start a new one.
      - id: OJG-0040
        note: ～てから stresses that B happens only after A is done, inside one sentence; それから begins a new sentence with "after that".
    register:
      - plain
      - polite
      - spoken
      - written
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: そして、～ (soshite、～)
        - source_id: hanabira
          level: N5
          item: それから、～ (sorekara、～)
    references:
      - source_id: hanabira
        ref: そして／それから
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Questions: in conversation, does そして sound more deliberate or written than それから? A native check would help. The origins (そう＋して, それ＋から) are given as memory aids; acceptable? Is "coffee ... それから、水もお願いします" natural at a café counter?'
  - id: OJG-0294
    pattern: だから
    title: "\"So\", \"that's why\": giving the result"
    meaning: "だから starts a sentence giving the result of the one before: \"So …\", \"That's why …\". The polite form is ですから."
    when: "Say the reason first as a full sentence, then start the next one with だから for what follows from it: 雨が降っています。だから、今日は家にいます. ですから is the careful polite form; in everyday polite conversation だから is also used after a です／ます sentence. Said on its own in reply, だから can mean \"that's what I'm saying\" and can sound impatient."
    why: 'だ means "it is", and から means "because" (OJG-0017). だから is "it is so, and because of that": it takes the whole previous sentence as the reason. That is why it can start a new sentence while から cannot: から has to hang on the end of a clause, and だから brings its own だ to hang on. ですから does the same with です. Because it presents the result as following plainly from the reason, it can sound firm, and in an argument it can sound like "I told you".'
    formation:
      - form: Sentence A。だから、Sentence B。
        note: A is the reason, B the result.
      - form: Sentence A。ですから、Sentence B。
        note: Polite and careful.
    examples:
      - japanese: 雨が降っています。だから、今日は家にいます。
        reading: あめがふっています。だから、きょうはいえにいます。
        romaji: ame ga futte imasu. dakara, kyō wa ie ni imasu.
        english: It's raining. So I'm staying home today.
      - japanese: 明日はテストです。だから、今晩は勉強します。
        reading: あしたはテストです。だから、こんばんはべんきょうします。
        romaji: ashita wa tesuto desu. dakara, konban wa benkyō shimasu.
        english: There's a test tomorrow. So I'm studying tonight.
      - japanese: この道は危ないです。ですから、気をつけてください。
        reading: このみちはあぶないです。ですから、きをつけてください。
        romaji: kono michi wa abunai desu. desu kara, ki o tsukete kudasai.
        english: This road is dangerous. So please be careful.
    mistake:
      wrong: 雨が降っています。から、家にいます。
      problem: から goes on the end of a clause and cannot start a sentence. To start one, use だから (or ですから).
      right: 雨が降っています。だから、家にいます。
    distinguish_from:
      - id: OJG-0017
        note: ～から gives the reason inside one sentence (雨だから、…); だから starts a new sentence after the reason.
      - id: OJG-0295
        note: それで tells what happened as a result, often in a story; だから also works before a decision, request or opinion.
      - id: OJG-0292
        note: では turns to what to do now, given the situation; だから states a result that follows from a reason.
    register:
      - plain
      - polite
      - spoken
      - written
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: だから、～ (dakara、～)
        - source_id: hanabira
          level: N4
          item: 文A。だから 文B (Bun A. Dakara Bun B)
    references:
      - source_id: hanabira
        ref: だから
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Questions: is it right to present だから after a polite sentence as normal in everyday conversation, with ですから as the careful form? Romaji: ですから is written "desu kara" to match OJG-0017; should the conjunction be one word? The それで contrast is kept soft (it is an N4 point); please confirm that それで is avoided before a request or intention.'
  - id: OJG-0297
    pattern: AとBとどちらが～
    title: Asking which of two is more …
    meaning: 'AとBとどちらが～: asks "which is more …, A or B?". Casual: どっち. The usual answer is Aのほうが～.'
    when: 'Use it to ask someone to compare two things: 犬と猫とどちらが好きですか, "Which do you like better, dogs or cats?". The adjective, or 好き, comes after どちらが; no word for "more" is needed. どちら is the polite word and どっち the casual one. The usual answer uses のほうが (OJG-0025): 猫のほうが好きです. If neither wins, answer with どちらも: どちらも好きです.'
    why: 'と lists the two things being compared, and どちら means "which one of two". It is the question word for a choice of two, where どれ is for three or more. Because どちら asks for the unknown one and is the subject of the adjective, it takes が, not は (OJG-0288). Japanese adjectives have no separate "more" form: asking which one is fast, with two set side by side, already means "which is faster". The second と is often dropped in speech: 犬と猫、どちらが好きですか.'
    formation:
      - form: Noun A + と + Noun B + と + どちらが + adjective／好き etc.
        note: The full pattern, polite with ですか.
      - form: Noun A + と + Noun B、どちらが／どっちが + …
        note: The second と is often left out. どっち is casual.
    examples:
      - japanese: 犬と猫とどちらが好きですか。
        reading: いぬとねことどちらがすきですか。
        romaji: inu to neko to dochira ga suki desu ka.
        english: Which do you like better, dogs or cats?
      - japanese: 電車とバスとどちらが速いですか。
        reading: でんしゃとバスとどちらがはやいですか。
        romaji: densha to basu to dochira ga hayai desu ka.
        english: Which is faster, the train or the bus?
      - japanese: 肉と魚、どっちが食べたい？
        reading: にくとさかな、どっちがたべたい？
        romaji: niku to sakana, docchi ga tabetai?
        english: Which do you want to eat, meat or fish?
        note: "Casual: どっち, and the second と is left out."
    mistake:
      wrong: 犬と猫とどちらは好きですか。
      problem: どちら asks for the unknown one, so like any question word used as the subject it takes が, not は.
      right: 犬と猫とどちらが好きですか。
    distinguish_from:
      - id: OJG-0025
        note: That is the statement or answer, "A is more … than B"; this is the question.
      - id: OJG-0026
        note: For three or more, ask with の中で and 何／どれ／だれ + がいちばん; どちら is only for two.
    register:
      - plain
      - polite
      - casual
      - spoken
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Aと Bと どちら～ (A to B to dochira~)
        - source_id: hanabira
          level: N5
          item: AとBと どっち〜 (A to B to docchi〜)
    references:
      - source_id: hanabira
        ref: AとBとどちらが～
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: "Questions: is the full form with both と still usual in speech, or mostly textbook, with AとBでは／AとB、 more common? Is どっちが食べたい natural here, or would どっちを食べたい or どっちにする be more usual?"
  - id: OJG-0298
    pattern: AはBが～
    title: Saying something about A, with B as its subject
    meaning: 'AはBが～: A is the topic, and "B + predicate" is what is said about it: 私は頭が痛いです, "I have a headache".'
    when: 'Use it when what you say about A is itself a small subject and predicate: 田中さんは背が高いです, "Mr Tanaka is tall"; 私は頭が痛いです, "I have a headache"; この部屋は窓が大きいです, "This room has big windows". It is also how a person appears together with the object of 好き, 上手, わかる or ほしい: 妹は猫が好きです, "My sister likes cats"; 私は日本語が少しわかります.'
    why: は and が do different jobs, so a sentence can have both. は sets up what the whole sentence is about (OJG-0008); が marks the subject of the predicate right after it (OJG-0288). In 田中さんは背が高い, what is high is 背, his height, so 背 takes が; and all of 背が高い is said about 田中さん, so 田中さん takes は. Japanese often describes a person or thing this way, through one of its parts or features, where English uses "have" or a single adjective ("has big windows", "is tall"). With 好き or わかる, the person who likes or understands is the topic, and the thing liked or understood is the が subject.
    formation:
      - form: Noun A + は + Noun B + が + adjective／verb
        note: '"B + predicate" describes A: 田中さんは背が高い.'
      - form: Person + は + Noun + が + 好き／上手／わかる／ほしい etc.
        note: The person is the topic; what is liked, known or wanted takes が.
    examples:
      - japanese: 田中さんは背が高いです。
        reading: たなかさんはせがたかいです。
        romaji: tanaka-san wa se ga takai desu.
        english: Mr Tanaka is tall.
        note: Literally, "as for Mr Tanaka, (his) height is high".
      - japanese: 私は頭が痛いです。
        reading: わたしはあたまがいたいです。
        romaji: watashi wa atama ga itai desu.
        english: I have a headache.
      - japanese: 妹は料理が上手です。
        reading: いもうとはりょうりがじょうずです。
        romaji: imōto wa ryōri ga jōzu desu.
        english: My younger sister is good at cooking.
    mistake:
      wrong: 妹は料理を上手です。
      problem: 上手 is a な-adjective, not a verb, so it does not take an object with を. The skill is the subject of 上手 and takes が.
      right: 妹は料理が上手です。
    distinguish_from:
      - id: OJG-0008
        note: は alone sets up the topic; here the topic is followed by its own が subject and predicate.
      - id: OJG-0288
        note: が alone marks the subject; here that subject sits inside what is said about a は topic.
      - id: OJG-0022
        note: "With a verb, the skill becomes V + のが: 料理が上手 vs 料理を作るのが上手."
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: A は B が〜 (A wa B ga〜)
    references:
      - source_id: hanabira
        ref: AはBが～
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Questions: is the literal gloss "his height is high" helpful, or does it mislead? Not covered: possession with いる／ある (私は兄がいます, often 私には兄がいます) and contrastive は on B (私は肉は食べません). Should either be mentioned at N5?'
  - id: OJG-0300
    pattern: ～く／～に + verb
    title: Using an adjective to say how something is done
    meaning: '～く／～に + verb: an い-adjective (く) or な-adjective (に) describes the action: 早く起きる "get up early", 静かに話す "speak quietly".'
    when: "Use it to say how an action is done: 早く寝ます, きれいに書きます, 静かに歩いてください. It is common in requests with ～てください: もっと大きく書いてください. With なる and する the same forms say what something becomes or is made into, which are separate points (OJG-0028, OJG-0084)."
    why: 'An adjective on its own describes a noun or ends a sentence. To describe a verb it needs a different ending, much like English quick and quickly. い-adjectives change the final い to く: 早い → 早く, 大きい → 大きく. な-adjectives take に in place of な: 静か → 静かに, きれい → きれいに. いい is irregular: its く-form is よく, so "well" is よく, which also means "often". The adverb usually comes before the verb, often right before it.'
    formation:
      - form: い-adjective (drop い) + く + verb
        note: 早い → 早く起きる. いい → よく.
      - form: な-adjective + に + verb
        note: 静か → 静かに話す.
    examples:
      - japanese: 毎朝早く起きます。
        reading: まいあさはやくおきます。
        romaji: maiasa hayaku okimasu.
        english: I get up early every morning.
      - japanese: 図書館では静かに話してください。
        reading: としょかんではしずかにはなしてください。
        romaji: toshokan de wa shizuka ni hanashite kudasai.
        english: Please speak quietly in the library.
      - japanese: 名前をもっと大きく書いてください。
        reading: なまえをもっとおおきくかいてください。
        romaji: namae o motto ōkiku kaite kudasai.
        english: Please write your name bigger.
    mistake:
      wrong: 今日は早い寝ます。
      problem: 早い is the form that describes a noun or ends a sentence. Before a verb, change the い to く.
      right: 今日は早く寝ます。
    distinguish_from:
      - id: OJG-0028
        note: "With なる the same forms say what something becomes: 大きくなる, 静かになる."
      - id: OJG-0084
        note: "With する they say what someone makes something: 大きくする, 静かにする."
      - id: OJG-0302
        note: ～くて／～で joins an adjective to what follows in a sentence; ～く／～に describes how a verb is done.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: い-Adjective く + Verb (i-Adjective + ku + Verb)
        - source_id: hanabira
          level: N5
          item: な-Adjective に + Verb
    references:
      - source_id: hanabira
        ref: ～く／～に + verb
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Not covered: 早く vs 速く (early vs fast), and く-forms used as nouns (近く, 遠く). Question: should よく ("well", "often") have its own example? Is "the adverb usually comes before the verb, often right before it" accurate enough?'
  - id: OJG-0301
    pattern: ～くないです
    title: Saying politely that an い-adjective is not so
    meaning: '～くないです: the polite negative of an い-adjective, "is not …": 高い → 高くないです. 高くありません means the same.'
    when: "Use it to say politely that something is not so: この本は高くないです, \"This book isn't expensive\". It is the plain negative 高くない with です added. 高くありません means the same and sounds a little more formal. For the past: 高くなかったです or 高くありませんでした."
    why: 'An い-adjective works like a verb: it ends a sentence on its own and makes its own negative. Drop the final い, add く, and add ない: 高い → 高く → 高くない. ない itself ends in い and behaves like an い-adjective, so です goes on the end to make it polite, just as with 高いです. The other polite form puts ありません, "there is not", after the く instead of ない. Nouns and な-adjectives make the negative with じゃない (静かじゃないです); い-adjectives do not, which is why 高いじゃないです is wrong. いい is irregular: its negative is よくない.'
    formation:
      - form: い-adjective (drop い) + くないです
        note: "高い → 高くないです. Past: 高くなかったです."
      - form: い-adjective (drop い) + くありません
        note: "Same meaning, a little more formal. Past: 高くありませんでした."
      - form: いい → よくないです
        note: "いい builds its other forms on よ: よくない, よかった."
    examples:
      - japanese: この本は高くないです。
        reading: このほんはたかくないです。
        romaji: kono hon wa takakunai desu.
        english: This book isn't expensive.
      - japanese: 今日は寒くありません。
        reading: きょうはさむくありません。
        romaji: kyō wa samuku arimasen.
        english: It isn't cold today.
      - japanese: 昨日の映画はあまりおもしろくなかったです。
        reading: きのうのえいがはあまりおもしろくなかったです。
        romaji: kinō no eiga wa amari omoshirokunakatta desu.
        english: Yesterday's film wasn't very interesting.
        note: あまり with a negative softens it to "not very" (OJG-0315).
    mistake:
      wrong: この本は高いじゃないです。
      problem: "じゃない is for nouns and な-adjectives. An い-adjective makes its own negative: drop い and add くない."
      right: この本は高くないです。
    distinguish_from:
      - id: OJG-0001
        note: Nouns and な-adjectives with です make the negative with じゃないです／ではありません; い-adjectives use くないです.
      - id: OJG-0315
        note: 'あまり + くない softens the negative to "not very": あまり高くないです.'
    register:
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: "い-Adjective: Negative Polite Form"
    references:
      - source_id: hanabira
        ref: ～くないです
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Questions: is 高くありません fairly described as "a little more formal" than 高くないです? Some courses teach it as the standard polite form. Romaji: くない is joined to the adjective (takakunai), following toranaide in OJG-0020; confirm house style. Is the OJG-0001 note right about what that entry covers?'
  - id: OJG-0302
    pattern: ～くて／～で
    title: "Joining descriptions: ... and ..."
    meaning: '～くて／～で joins an adjective, or a noun with だ, to what follows: "... and ..."; sometimes "..., so ...".'
    when: "Use it to put two descriptions in one sentence: この部屋は広くて明るいです, \"This room is big and bright\". An い-adjective takes ～くて; a な-adjective or a noun takes ～で: 静かで、きれいな公園, 兄は医者で、姉は先生です. The first part can also give the cause of what follows: この本は難しくて、分かりません, \"This book is difficult, so I don't understand it\"."
    why: 'Japanese marks tense and politeness once, on the last predicate of the sentence. Every description before it goes into a joining form that carries neither: the て-form. For an い-adjective that form is ～くて (高い → 高くて; いい becomes よくて). な-adjectives and nouns are joined with だ, and the て-form of だ is で, so 静かだ becomes 静かで and 学生だ becomes 学生で. Because the joined part has no tense of its own, it takes the tense of the end: 昨日は寒くて、雨でした describes yesterday throughout. The form only says "and the sentence goes on", so whether the link is a simple "and" or a cause comes from the meaning of the two parts. It lists qualities side by side; when they pull in opposite directions ("cheap, but not good"), が or けど is the usual choice.'
    formation:
      - form: い-Adjective (drop い) + くて
        note: "いい → よくて. Negative: 高くなくて."
      - form: な-Adjective + で
        note: "きれい and 有名 are な-adjectives: きれいで, 有名で."
      - form: Noun + で
        note: "Negative: 学生じゃなくて."
    examples:
      - japanese: この部屋は広くて明るいです。
        reading: このへやはひろくてあかるいです。
        romaji: kono heya wa hirokute akarui desu.
        english: This room is big and bright.
      - japanese: この公園は静かで、きれいです。
        reading: このこうえんはしずかで、きれいです。
        romaji: kono kōen wa shizuka de, kirei desu.
        english: This park is quiet and clean.
      - japanese: 兄は医者で、姉は先生です。
        reading: あにはいしゃで、あねはせんせいです。
        romaji: ani wa isha de, ane wa sensei desu.
        english: My older brother is a doctor, and my older sister is a teacher.
        note: Two nouns joined with で; each half has its own topic.
    mistake:
      wrong: この町はきれいくて静かです。
      problem: きれい ends in い but is a な-adjective, so it joins with で, not くて.
      right: この町はきれいで静かです。
    distinguish_from:
      - id: OJG-0300
        note: ～く／～に before a verb makes an adjective describe how the action is done (早く起きる); ～くて／～で joins one description to the next.
      - id: OJG-0312
        note: Both use the て-form to join. ～て、～ joins verbs (actions); ～くて／～で joins adjectives and nouns (descriptions).
      - id: OJG-0290
        note: ～くて／～で lists things side by side; ～が／～けど sets up a contrast, "..., but ...".
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: い-Adjective て (i-Adjective + te~)
        - source_id: hanabira
          level: N5
          item: な-Adjective で～ (na-Adjective de~)
    references:
      - source_id: hanabira
        ref: ～くて／～で
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: "Question: is \"when the qualities pull in opposite directions, が or けど is the usual choice\" stated at the right strength (安くておいしくない and similar are judged odd by many speakers but may be heard)? Not covered: the cause reading's restriction that the result is usually not a request or intention (難しくて、やめましょう)."
  - id: OJG-0303
    pattern: NかN
    title: Or (between nouns)
    meaning: 'NかN offers nouns as alternatives: "A or B"; one of them is meant, not all.'
    when: 'Use it when one of several things is meant and it is not yet settled which: 朝はパンかご飯を食べます, "In the morning I eat bread or rice". It is common for proposing times and places (土曜日か日曜日に), for offering a choice, and with numbers for a rough amount: 二つか三つ, "two or three". Each item can also take か, AかBか, when the choices are set out one by one, as in a question: コーヒーか紅茶か、どちらがいいですか.'
    why: 'か is the particle that makes a question. Put after a noun, it leaves that noun open, "this one?", and a row of open nouns means "one of these". That is the difference from と, which gathers all the nouns in: 月曜日と火曜日 is both days, 月曜日か火曜日 is one of them. The whole group plays one role in the sentence, so the particle for that role goes once, after the last noun: パンかご飯を, ペンか鉛筆で.'
    formation:
      - form: Noun A + か + Noun B (+ particle)
        note: "The particle for the whole group comes after the last noun: パンかご飯を."
      - form: Noun A + か + Noun B + か
        note: "Sets the choices out one by one, often before a question: AかBか、どちらが～."
      - form: Number + か + Number + counter
        note: "A rough amount: 二つか三つ."
    examples:
      - japanese: 朝はパンかご飯を食べます。
        reading: あさはパンかごはんをたべます。
        romaji: asa wa pan ka gohan o tabemasu.
        english: In the morning I eat bread or rice.
      - japanese: 土曜日か日曜日に行きましょう。
        reading: どようびかにちようびにいきましょう。
        romaji: doyōbi ka nichiyōbi ni ikimashō.
        english: Let's go on Saturday or Sunday.
      - japanese: ペンか鉛筆で書いてください。
        reading: ペンかえんぴつでかいてください。
        romaji: pen ka enpitsu de kaite kudasai.
        english: Please write with a pen or a pencil.
    mistake:
      wrong: 月曜日と火曜日に行きます。
      problem: 'Meant as "Monday or Tuesday", this says "on Monday and Tuesday": と includes both. For one or the other, use か.'
      right: 月曜日か火曜日に行きます。
    distinguish_from:
      - id: OJG-0011
        note: AとB includes every item; AかB means one of them.
      - id: OJG-0032
        note: AやB gives some examples of a longer list, all included; AかB offers alternatives, one of which is meant.
      - id: OJG-0319
        note: 'After a question word, か makes an indefinite: 何か "something", だれか "someone". Between nouns it gives "or".'
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun か Noun か～ (Noun ka Noun ka～)
    references:
      - source_id: hanabira
        ref: NかN
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: "Question: in AかBか before a noun predicate, is dropping が/を after the second か worth stating?"
  - id: OJG-0304
    pattern: ～ができる／～ことができる
    title: "Can: saying something is possible"
    meaning: '～ができる／V-ることができる says someone can do something, or that it is possible: "can", "be able to".'
    when: "Use Noun + ができる for a skill or activity: 日本語ができます, \"I can speak Japanese\"; ピアノができます, \"I can play the piano\". For any other action, turn the verb into a noun with こと: 漢字を読むことができます, \"I can read kanji\". It also says whether circumstances allow something: ここで写真をとることができますか, \"Can one take photos here?\". The negative できません says \"can't\"."
    why: 'できる means "is possible" or "comes about". What is possible is its subject, so it is marked with が, not を: 日本語ができます. The person who is able is usually the topic, with は: 私は日本語ができます. A verb cannot take が directly, so こと ("the act of") first turns the action into a noun: 泳ぐこと is "swimming", and 泳ぐことができる is "swimming is possible (for me)". Inside the こと part, the verb keeps its own particles: 漢字を読むこと. Nouns for activities (料理, テニス, 運転) work with ができる on their own because they already name an action. Japanese also has a shorter potential form (読める, 泳げる), which is more common in everyday talk; ことができる sounds more careful and is common in writing and notices.'
    formation:
      - form: Noun + が + できる
        note: "Polite: できます. Negative: できない／できません. Past: できた／できました."
      - form: V (dictionary form) + こと + が + できる
        note: "The verb keeps its particles: 漢字を読むことができる."
    examples:
      - japanese: 妹はピアノができます。
        reading: いもうとはピアノができます。
        romaji: imōto wa piano ga dekimasu.
        english: My younger sister can play the piano.
      - japanese: 私は漢字を読むことができます。
        reading: わたしはかんじをよむことができます。
        romaji: watashi wa kanji o yomu koto ga dekimasu.
        english: I can read kanji.
      - japanese: ここで写真をとることができますか。
        reading: ここでしゃしんをとることができますか。
        romaji: koko de shashin o toru koto ga dekimasu ka.
        english: Can one take photos here?
        note: About what is allowed or possible in this place, not about skill.
    mistake:
      wrong: 私は日本語をできます。
      problem: What is possible is the subject of できる, so it takes が, not を.
      right: 私は日本語ができます。
    distinguish_from:
      - id: OJG-0022
        note: ～のが上手です says someone is good at it; ～ことができる only says they can.
      - id: OJG-0015
        note: ～てもいいですか asks for permission; ～ことができますか asks whether something is possible or allowed in general.
      - id: OJG-0313
        note: ことができる is one of the main uses of ～こと, which turns any verb into a noun.
    register:
      - plain
      - polite
      - written
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun が できます (Noun ga dekimasu)
        - source_id: hanabira
          level: N5
          item: Verb る こと が できます (ru koto ga dekimasu)
        - source_id: hanabira
          level: N5
          item: Verb る こと ができる (ru koto ga dekiru)
        - source_id: hanabira
          level: N4
          item: Verb ることができる (〜ru koto ga dekiru)
    references:
      - source_id: hanabira
        ref: ～ができる／～ことができる
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Question: is "ことができる sounds more careful and is common in writing and notices" (versus the potential form) accurate and not overstated? Is 日本語をできます common enough in speech (some native speakers do say it) that the mistake should be softened? The potential form has no id in the N5/N4 index to link to (OJG-0081 ～られる may be the passive).'
  - id: OJG-0305
    pattern: ～から～まで／～まで
    title: From ... to ..., and until
    meaning: '～から～まで marks where or when something starts and ends: "from A to B"; ～まで alone is "until" or "as far as".'
    when: "Use it for spans of time and distance: 九時から五時まで働きます, 家から駅まで歩きます. Either half can stand alone: 三時まで待ちます, \"I'll wait until three\"; 駅まで行きます, \"I'll go as far as the station\". It can end a sentence with です to give hours or a range: 銀行は九時から三時までです."
    why: 'から marks the point something starts from, and まで marks the limit it reaches. まで says the action or state continues all the way up to that point, so it goes with things that last: 待つ, 働く, 寝る, 歩く. For something done once, at some moment before a limit (a deadline), Japanese adds に: 五時までに, "by five". So ask whether the action fills the time up to the point (まで) or happens once before it (までに). This から is the starting point; after a whole clause, から means "because" instead.'
    formation:
      - form: Noun + から + Noun + まで
        note: "Time or place: 九時から五時まで, 東京から大阪まで."
      - form: Noun + まで
        note: '"Until" a time, "as far as" a place.'
      - form: ～から～までです
        note: "As the predicate: 授業は九時から三時までです."
    examples:
      - japanese: 銀行は九時から三時までです。
        reading: ぎんこうはくじからさんじまでです。
        romaji: ginkō wa kuji kara sanji made desu.
        english: The bank is open from nine to three.
      - japanese: 家から駅まで歩きます。
        reading: いえからえきまであるきます。
        romaji: ie kara eki made arukimasu.
        english: I walk from home to the station.
      - japanese: 昨日は十時まで寝ました。
        reading: きのうはじゅうじまでねました。
        romaji: kinō wa jūji made nemashita.
        english: Yesterday I slept until ten.
    mistake:
      wrong: 五時まで宿題を出してください。
      problem: Handing in homework happens once, before a deadline. まで would mean keep handing it in until five; a deadline needs までに.
      right: 五時までに宿題を出してください。
    distinguish_from:
      - id: OJG-0306
        note: "まで: the action continues up to the point. までに: it happens once, some time before the point (a deadline)."
      - id: OJG-0017
        note: After a noun, から is the starting point; after a clause, ～から gives a reason, "because".
      - id: OJG-0040
        note: ～てから says "after doing A"; Noun + から gives where or when something starts.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun から Noun まで (Noun kara Noun made)
        - source_id: hanabira
          level: N4
          item: ～まで (〜made)
    references:
      - source_id: hanabira
        ref: ～から～まで／～まで
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Not covered: V (dictionary form) + まで, "until someone does" (彼が来るまで待つ). Question: include it here, or is it a separate point?'
  - id: OJG-0307
    pattern: 数量 + くらい／ぐらい
    title: About (an amount)
    meaning: '数量 + くらい／ぐらい makes an amount approximate: "about", "roughly".'
    when: "Put it after a number with a counter to say the amount is not exact: 一時間ぐらい, 千円くらい, 十人ぐらい. It works for lengths of time, prices, distances and counts. どのくらい or どれぐらい asks \"how much\" or \"how long\". For a point on the clock or calendar (\"around three o'clock\"), ごろ is the usual word."
    why: 'くらい expresses a degree or extent: "at about this level". After an amount it says the real figure is somewhere near that level, not exactly on it. Because it is about how much, it goes after the number and counter, where the amount is, and takes no particle of its own before it: 二時間ぐらい待ちました. くらい and ぐらい are the same word and mean the same here; both are used after numbers. It can describe a noun with の: 十分ぐらいの所, "a place about ten minutes away".'
    formation:
      - form: Number + counter + くらい／ぐらい
        note: "No particle between the counter and ぐらい: 二時間ぐらい."
      - form: どのくらい／どれぐらい
        note: '"How much?", "how long?"'
      - form: Number + counter + ぐらい + の + Noun
        note: "Describes a noun: 十分ぐらいの所."
    examples:
      - japanese: 駅まで十分ぐらいです。
        reading: えきまでじゅっぷんぐらいです。
        romaji: eki made juppun gurai desu.
        english: It's about ten minutes to the station.
      - japanese: 毎日二時間くらい勉強します。
        reading: まいにちにじかんくらいべんきょうします。
        romaji: mainichi nijikan kurai benkyō shimasu.
        english: I study for about two hours every day.
      - japanese: このかばんは五千円ぐらいでした。
        reading: このかばんはごせんえんぐらいでした。
        romaji: kono kaban wa gosen'en gurai deshita.
        english: This bag was about five thousand yen.
    mistake:
      wrong: 駅で二時間ごろ待ちました。
      problem: ごろ goes on a point in time. Two hours is a length of time, an amount, so it takes ぐらい.
      right: 駅で二時間ぐらい待ちました。
    distinguish_from:
      - id: OJG-0308
        note: ぐらい goes on an amount (二時間ぐらい, "for about two hours"); ごろ goes on a point in time (二時ごろ, "around two o'clock").
      - id: OJG-0050
        note: Number + も stresses that the amount is large ("as many as"); ぐらい only makes it approximate.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun くらい～ (Noun kurai～)
        - source_id: hanabira
          level: N5
          item: Noun ぐらい～ (Noun gurai～)
    references:
      - source_id: hanabira
        ref: 数量 + くらい／ぐらい
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'The stub notes that OJG-0113 ～ぐらい and OJG-0105 ～は～くらいです (N3) cover the "to the extent" uses; they are not in the N5/N4 index I was given, so they are not linked in distinguish_from. Question: 三時ぐらいに会いましょう ("around three") is heard in speech; is "ごろ is the usual word" the right strength? 十分: じゅっぷん chosen over じっぷん.'
  - id: OJG-0308
    pattern: 時間 + ごろ
    title: Around (a point in time)
    meaning: "時間 + ごろ makes a point in time approximate: \"around three o'clock\", \"around May\"."
    when: 'Put it after a clock time, a date, a month or a year: 七時ごろ, 五月ごろ, 何時ごろ. It says the time is not exact: 毎朝七時ごろ起きます, "I get up around seven every morning". に may follow it or be left out: 七時ごろ起きます and 七時ごろに起きます are both used.'
    why: 'ごろ is a word for "the time around". It widens a single point on the clock or calendar into a window around that point. Because it works on a point, it cannot go on a length of time or an amount: "for about two hours" is 二時間ぐらい, not 二時間ごろ. It goes straight after the time word, and any に comes after it, not before: 三時ごろに, never 三時にごろ.'
    formation:
      - form: Time word + ごろ
        note: "Clock times, dates, months, years: 三時ごろ, 十日ごろ, 八月ごろ."
      - form: Time word + ごろ + に
        note: "に is optional: 三時ごろ(に)会います."
      - form: 何時ごろ
        note: '"Around what time?"'
    examples:
      - japanese: 毎朝七時ごろ起きます。
        reading: まいあさしちじごろおきます。
        romaji: maiasa shichiji goro okimasu.
        english: I get up around seven every morning.
      - japanese: 田中さんは何時ごろ来ますか。
        reading: たなかさんはなんじごろきますか。
        romaji: tanaka-san wa nanji goro kimasu ka.
        english: Around what time is Mr Tanaka coming?
      - japanese: 八月ごろ日本へ行きます。
        reading: はちがつごろにほんへいきます。
        romaji: hachigatsu goro nihon e ikimasu.
        english: I'm going to Japan around August.
    mistake:
      wrong: 三時にごろ会いましょう。
      problem: ごろ goes directly on the time word; に, if used, comes after ごろ.
      right: 三時ごろ会いましょう。
    distinguish_from:
      - id: OJG-0307
        note: ごろ goes on a point in time (三時ごろ); ぐらい goes on an amount, including a length of time (三時間ぐらい).
      - id: OJG-0005
        note: "Time + に gives an exact point: 三時に. ごろ makes it approximate, and に may follow it."
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun ごろ～ (Noun + goro～)
    references:
      - source_id: hanabira
        ref: 時間 + ごろ
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Question: is there any difference worth stating between 七時ごろ起きます and 七時ごろに起きます, or is "optional" enough at N5? ごろ is written here in kana only (頃 kanji not used).'
  - id: OJG-0309
    pattern: ～だけ
    title: Only, just
    meaning: '～だけ limits what is said to the word it follows: "only", "just".'
    when: "Put it on the word that is the only one: 水だけ飲みました, \"I only drank water\"; 一つだけください, \"Just one, please\"; 私だけ行きました, \"Only I went\". After a verb it says \"just do this, nothing more\": 見ているだけです, \"I'm just looking\". The verb after it can be positive or negative, and keeps its usual meaning."
    why: "だけ draws a line around the word it follows: this, and nothing beyond it. So it goes directly on the word being limited, and moving it changes what is limited: 私だけコーヒーを飲みました is \"Only I drank coffee\", and 私はコーヒーだけ飲みました is \"I drank only coffee\". だけ is neutral about whether the amount is a lot or a little; it just sets the limit. は, が and を can be left out after it or kept: 水だけ飲みました and 水だけを飲みました are both used. Other particles such as に and で stay in the sentence. Because だけ does not change the verb, a negative verb after it negates the limited item: 水だけ飲みませんでした means \"Water was the only thing I didn't drink\"."
    formation:
      - form: Noun + だけ
        note: "は, が, を may follow or be left out: 水だけ(を)飲みました."
      - form: Number + counter + だけ
        note: "A limited amount: 一つだけ, 五分だけ."
      - form: V (dictionary form, or ている) + だけ
        note: '"Just doing": 見るだけ, 見ているだけ.'
    examples:
      - japanese: 朝は水だけ飲みました。
        reading: あさはみずだけのみました。
        romaji: asa wa mizu dake nomimashita.
        english: In the morning I only drank water.
      - japanese: りんごを一つだけください。
        reading: りんごをひとつだけください。
        romaji: ringo o hitotsu dake kudasai.
        english: Just one apple, please.
      - japanese: 見ているだけです。
        reading: みているだけです。
        romaji: mite iru dake desu.
        english: I'm just looking.
        note: A common thing to say to a shop assistant.
    mistake:
      wrong: 朝は水だけ飲みませんでした。
      problem: Meant as "I only drank water", this says "water was the only thing I didn't drink". だけ keeps the verb as it is; to say "only" with a negative verb, use しか.
      right: 朝は水だけ飲みました。
    distinguish_from:
      - id: OJG-0051
        note: だけ + positive verb is a neutral "only". しか always takes a negative verb and stresses that there is nothing else, often "only this little".
      - id: OJG-0002
        note: も adds the word to others ("also"); だけ excludes the others ("only").
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun だけ〜 (〜dake)
    references:
      - source_id: hanabira
        ref: ～だけ
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Not covered: the order of だけ with に／で (日本でだけ vs 日本だけで), which may differ in nuance. Question: is "neutral about a lot or a little" accurate enough, and is omitting が/を after だけ "both used" without further nuance acceptable?'
  - id: OJG-0310
    pattern: Nにする
    title: "Deciding on something: I'll have ..., let's make it ..."
    meaning: "Nにする says what you choose or decide on: \"I'll have N\", \"let's make it N\"."
    when: "Use it when choosing from options: ordering (私はコーヒーにします, \"I'll have coffee\"), fixing a day or a place (旅行は土曜日にしましょう), or asking what someone will choose (何にしますか). The past, Nにしました, reports a choice already made: 昼ご飯はカレーにしました."
    why: 'に marks where something ends up, and する is "do" or "make". Together, Nにする says you actively make your choice land on N. That is the difference from Nになる: なる is "become", something that happens, while する is something a person does. So choosing, which is a decision someone makes, takes にする. The noun is one of the options on offer, so the pattern suits menus, dates and plans. にします in the present announces the decision as you make it; にしました says it was made earlier.'
    formation:
      - form: Noun + に + する
        note: "Polite: します. \"I'll have / take / go with N.\""
      - form: Noun + に + しましょう
        note: "\"Let's make it N\", when deciding together."
      - form: 何 + に + しますか
        note: '"What will you have?"'
    examples:
      - japanese: 私はコーヒーにします。
        reading: わたしはコーヒーにします。
        romaji: watashi wa kōhī ni shimasu.
        english: I'll have coffee.
      - japanese: 旅行は来週の土曜日にしましょう。
        reading: りょこうはらいしゅうのどようびにしましょう。
        romaji: ryokō wa raishū no doyōbi ni shimashō.
        english: Let's make the trip next Saturday.
      - japanese: 昼ご飯はカレーにしました。
        reading: ひるごはんはカレーにしました。
        romaji: hirugohan wa karē ni shimashita.
        english: I went with curry for lunch.
    mistake:
      wrong: 私はコーヒーになります。
      problem: 'なる is "become", so this says "I will become coffee". Choosing is something you do: にする.'
      right: 私はコーヒーにします。
    distinguish_from:
      - id: OJG-0028
        note: "Nになる: something becomes N, with no one choosing. Nにする: someone chooses or makes it N."
      - id: OJG-0090
        note: ことにする decides on an action (V-ることにする, "decide to do"); Nにする decides on a thing.
      - id: OJG-0084
        note: ～く／～にする makes something into a state (部屋をきれいにする); Nにする as taught here chooses N.
    register:
      - plain
      - polite
      - spoken
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun に します (Noun ni shimasu)
        - source_id: hanabira
          level: N4
          item: Noun に する (Noun ni suru)
    references:
      - source_id: hanabira
        ref: Nにする
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Question: shop staff say コーヒーになります ("this is your coffee"); should the mistake note mention it so learners are not confused when they hear it?'
  - id: OJG-0311
    pattern: ～あとで
    title: After (an event or an action)
    meaning: '～あとで places an action after another: "after N", "after doing"; あとで alone means "later".'
    when: "Use it to say one thing happens after another: 授業のあとで図書館へ行きます, \"I'll go to the library after class\"; 晩ご飯を食べたあとで、テレビを見ました. On its own, あとで means \"later\": あとで電話します, \"I'll call you later\"."
    why: 'あと is a noun meaning "the time after". Like any noun, it takes の after another noun (授業のあと), and a verb goes directly before it (食べたあと). The earlier event is finished by the time of the later one, so the verb before あと is in the past (た) form, even when the whole sentence is about the future: 食べたあとで歯をみがきます. で places the main action in that time. Because あと is a noun, it can also stand alone, with the event understood: あとで, "later".'
    formation:
      - form: Noun + の + あとで
        note: 授業のあとで, 仕事のあとで.
      - form: V (た-form) + あとで
        note: "Always た, even about the future: 食べたあとで."
      - form: あとで
        note: 'Alone: "later".'
    examples:
      - japanese: 授業のあとで図書館へ行きます。
        reading: じゅぎょうのあとでとしょかんへいきます。
        romaji: jugyō no ato de toshokan e ikimasu.
        english: I'll go to the library after class.
      - japanese: 晩ご飯を食べたあとで、テレビを見ました。
        reading: ばんごはんをたべたあとで、テレビをみました。
        romaji: bangohan o tabeta ato de, terebi o mimashita.
        english: After eating dinner, I watched TV.
      - japanese: あとで電話します。
        reading: あとででんわします。
        romaji: ato de denwa shimasu.
        english: I'll call you later.
    mistake:
      wrong: ご飯を食べるあとで、歯をみがきます。
      problem: The eating is finished before the brushing, so the verb before あと takes the た-form, even about the future.
      right: ご飯を食べたあとで、歯をみがきます。
    distinguish_from:
      - id: OJG-0040
        note: Both put B after A. ～てから attaches only to verbs and stresses doing A first; ～あとで also takes nouns (授業のあとで).
      - id: OJG-0039
        note: まえに is "before" and takes the dictionary form (食べるまえに); あとで is "after" and takes the た-form (食べたあとで).
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun の あとで (Noun no atode)
        - source_id: hanabira
          level: N5
          item: Verb た あとで (ta ato de)
    references:
      - source_id: hanabira
        ref: ～あとで
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Not covered: ～あとに (without で), and ～たあと, alone, at a clause end. Question: is "で places the main action in that time" a sound explanation of the で? Is the てから vs あとで contrast stated at the right strength?'
  - id: OJG-0312
    pattern: ～て、～
    title: Joining actions in order
    meaning: 'V-て、～ joins actions or clauses: "do A and (then) B"; only the last verb shows tense and politeness.'
    when: 'Use it to tell a series of actions in the order they happen: 朝起きて、顔を洗います, "I get up and wash my face". When the first action is how the second is done, it gives the means: 駅まで歩いて行きました, "I walked to the station". The first part can also be the cause of what follows: 風邪をひいて、学校を休みました.'
    why: 'The て-form is a verb without tense or an ending: it says "this, and the sentence goes on". Japanese marks tense and politeness only once, on the last verb, so every earlier verb waits in the て-form and takes its tense from the end: 起きて、顔を洗いました puts both actions in the past. The clauses come in the order of events, so the plain reading is sequence. Whether the link is "and then", "by", or "so" comes from the meaning of the two actions, not from the form. How to make the て-form depends on how the verb ends: う, つ, る → って; む, ぶ, ぬ → んで; く → いて (but 行く → 行って); ぐ → いで; す → して; ichidan (る) verbs drop る and add て; する → して, 来る → 来て.'
    formation:
      - form: V (て-form) + 、 + next clause
        note: Any number of verbs can be joined; only the last one carries tense and ます.
      - form: て-form of godan verbs
        note: う/つ/る → って, む/ぶ/ぬ → んで, く → いて (行く → 行って), ぐ → いで, す → して.
      - form: て-form of ichidan and irregular verbs
        note: 食べる → 食べて, 見る → 見て; する → して, 来る → 来て.
    examples:
      - japanese: 朝起きて、顔を洗います。
        reading: あさおきて、かおをあらいます。
        romaji: asa okite, kao o araimasu.
        english: In the morning I get up and wash my face.
      - japanese: デパートへ行って、くつを買いました。
        reading: デパートへいって、くつをかいました。
        romaji: depāto e itte, kutsu o kaimashita.
        english: I went to the department store and bought shoes.
      - japanese: 駅まで歩いて行きました。
        reading: えきまであるいていきました。
        romaji: eki made aruite ikimashita.
        english: I walked to the station.
        note: Here the first action is how the second is done.
    mistake:
      wrong: 昨日は映画を見ました、晩ご飯を食べました。
      problem: Two full sentences are not joined with just a comma. The first verb goes into the て-form, and the last verb carries the past and ます.
      right: 昨日は映画を見て、晩ご飯を食べました。
    distinguish_from:
      - id: OJG-0040
        note: ～て、～ just joins actions in order; ～てから stresses that B happens only after A is done.
      - id: OJG-0030
        note: ～て、～ tells actions in sequence; ～たり～たりする gives some examples of things done, in no set order.
      - id: OJG-0302
        note: Both use the て-form. ～て joins verbs; ～くて／～で joins adjectives and nouns.
      - id: OJG-0293
        note: そして／それから join separate sentences; the て-form joins clauses within one sentence.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Verb て～ (Verb + te～)
    references:
      - source_id: hanabira
        ref: ～て、～
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: "Question: is the comma-splice mistake (見ました、食べました) common enough among learners, or would a different error be more typical? Not covered: restrictions on the cause reading (no request or invitation after it)."
  - id: OJG-0313
    pattern: ～こと
    title: Turning a verb into a noun with こと
    meaning: V-る + こと turns an action into a noun, "doing ...", so it can take は, が or を, or come before です.
    when: 'Use it to talk about an action as a thing: 私の趣味は写真をとることです, "My hobby is taking photos"; 毎日運動することは体にいいです, "Exercising every day is good for you". It is also the base of ～ことができる, "can do".'
    why: A verb normally ends a clause. To use the action itself as a subject, topic, object or predicate, Japanese puts a noun after it, and the clause describes that noun, the same way 大きい describes 犬 in 大きい犬. こと is a noun for an abstract thing or matter, so 本を読むこと is "the matter of reading books", that is, "reading books". The clause keeps its own particles inside it (本を), and the whole unit then takes a particle like any noun. こと and の both do this job, but only こと works before です to say what something is (趣味は～ことです) and before できる; ～のです at the end of a sentence is a different pattern, used for explaining.
    formation:
      - form: V (dictionary form) + こと
        note: "The clause keeps its particles: 本を読むこと."
      - form: Noun + は + V-る + ことです
        note: "Says what something is: 趣味は泳ぐことです."
      - form: V-る + こと + が／は／を
        note: The action as subject, topic or object.
    examples:
      - japanese: 私の趣味は写真をとることです。
        reading: わたしのしゅみはしゃしんをとることです。
        romaji: watashi no shumi wa shashin o toru koto desu.
        english: My hobby is taking photos.
      - japanese: 毎日運動することは体にいいです。
        reading: まいにちうんどうすることはからだにいいです。
        romaji: mainichi undō suru koto wa karada ni ii desu.
        english: Exercising every day is good for your body.
      - japanese: 田中さんは中国語を話すことができます。
        reading: たなかさんはちゅうごくごをはなすことができます。
        romaji: tanaka-san wa chūgokugo o hanasu koto ga dekimasu.
        english: Mr Tanaka can speak Chinese.
    mistake:
      wrong: 私の趣味は本を読みます。
      problem: 'The hobby is a thing, so the predicate needs a noun: 趣味 cannot "read books". Turn the action into a noun with こと.'
      right: 私の趣味は本を読むことです。
    distinguish_from:
      - id: OJG-0314
        note: Both turn a verb into a noun. こと is needed before です (趣味は～ことです) and できる; の is usual with 好き, 上手 and verbs of seeing and hearing.
      - id: OJG-0304
        note: '～ことができる is one use of こと: "doing X is possible".'
      - id: OJG-0021
        note: ～のが好きです uses の; ～ことが好きです is also heard.
    register:
      - plain
      - polite
      - written
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Verb ること～ (〜ru koto)
    references:
      - source_id: hanabira
        ref: ～こと
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Question: is "only こと works before です to say what something is" too strong (趣味は写真をとるのです is not natural in that meaning, I believe, but please confirm)? Is ～ことが好きです acceptable enough to mention as "also heard"?'
  - id: OJG-0314
    pattern: ～の
    title: Turning a verb into a noun with の
    meaning: V-る + の turns an action into a noun, "doing ...", often before が好き, が上手 or は + an adjective.
    when: 'Use it to talk about an action as a thing in everyday sentences: 料理を作るのが好きです, "I like cooking"; 朝早く起きるのは大変です, "Getting up early is hard". With verbs of seeing and hearing, の gives the action someone saw or heard happening: 子どもたちが歌うのを聞きました.'
    why: 'Here の is a light noun, "the act of", placed after a clause so the action can take が, は or を like any noun. The clause describes の the way an adjective describes a noun, and keeps its own particles (料理を). の is the everyday choice with feelings and skills (好き, きらい, 上手, 下手) and with adjectives about the action (楽しい, 大変). With 見る and 聞く it presents the action as something actually perceived, and こと cannot replace it there. Two places take こと, not の: before です to say what something is (趣味は～ことです), and before できる. A sentence ending in ～のです is a different pattern, used for explaining.'
    formation:
      - form: V (dictionary form) + の + が／は／を
        note: "The clause keeps its particles: 料理を作るの."
      - form: V-る + のが + 好き／上手／下手
        note: '"Like / be good at / be bad at doing."'
      - form: V-る + のは + adjective
        note: '"Doing ... is ...": 起きるのは大変です.'
    examples:
      - japanese: 私は料理を作るのが好きです。
        reading: わたしはりょうりをつくるのがすきです。
        romaji: watashi wa ryōri o tsukuru no ga suki desu.
        english: I like cooking.
      - japanese: 朝早く起きるのは大変です。
        reading: あさはやくおきるのはたいへんです。
        romaji: asa hayaku okiru no wa taihen desu.
        english: Getting up early in the morning is hard.
      - japanese: 子どもたちが歌うのを聞きました。
        reading: こどもたちがうたうのをききました。
        romaji: kodomotachi ga utau no o kikimashita.
        english: I heard the children singing.
        note: With 聞く and 見る, の gives the action as it was heard or seen.
    mistake:
      wrong: 私は料理を作るが好きです。
      problem: が goes on a noun, and 作る is a verb. Turn the action into a noun with の first.
      right: 私は料理を作るのが好きです。
    distinguish_from:
      - id: OJG-0313
        note: Both turn a verb into a noun. の is usual with 好き, 上手 and verbs of seeing and hearing; こと is needed before です and できる.
      - id: OJG-0021
        note: ～のが好きです is the most common use of this の.
      - id: OJG-0033
        note: ～んです／～のです at the end of a sentence explains or asks for the story behind something; it is not a verb turned into a noun.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Verb る の～ (Verb + ru + no~)
    references:
      - source_id: hanabira
        ref: ～の
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Question: is the perception use (歌うのを聞きました) appropriate at N5, or should it be moved to a later point? Is "こと cannot replace it there" safe as stated?'
  - id: OJG-0315
    pattern: あまり～ない
    title: Not very, not much
    meaning: 'あまり～ない: "not very" or "not much"; あまり with a negative says the degree or amount is low, not zero.'
    when: "Use it with a negative predicate to soften a denial: この店はあまり高くないです, \"this shop isn't very expensive\"; お酒をあまり飲みません, \"I don't drink much\". With an action it can also mean \"not often\": あまり出かけません. It is a common, gentle way to answer a question with \"not really\" instead of a flat no. In conversation it is often said あんまり."
    why: 'あまり is related to 余る, "to be more than enough". In a negative sentence it says the thing does not go far: the negative is partial, not total. That is why it needs a negative predicate: あまり tells the listener how much of the negative to take, so without one there is nothing for it to soften. To say "very" in a positive sentence, use とても instead. The negative can be a verb (飲みません), an い-adjective (高くない), or a な-adjective or noun (好きじゃない). Because it says "a little" rather than "none", it is weaker and politer than ぜんぜん～ない.'
    formation:
      - form: あまり + V (negative)
        note: あまり飲みません, あまり飲まない.
      - form: あまり + い-adjective stem + くない(です)／くありません
        note: あまり高くないです.
      - form: あまり + な-adjective／Noun + じゃない(です)／ではありません
        note: あまり好きじゃないです.
    examples:
      - japanese: この店はあまり高くないです。
        reading: このみせはあまりたかくないです。
        romaji: kono mise wa amari takakunai desu.
        english: This shop isn't very expensive.
      - japanese: 私はお酒をあまり飲みません。
        reading: わたしはおさけをあまりのみません。
        romaji: watashi wa osake o amari nomimasen.
        english: I don't drink much alcohol.
      - japanese: 日曜日はあまり出かけません。
        reading: にちようびはあまりでかけません。
        romaji: nichiyōbi wa amari dekakemasen.
        english: I don't go out much on Sundays.
        note: With an action, あまり can mean "not often".
    mistake:
      wrong: このケーキはあまりおいしいです。
      problem: あまり in the sense "not very" needs a negative predicate. To say "very" in a positive sentence, use とても.
      right: このケーキはとてもおいしいです。
    distinguish_from:
      - id: OJG-0316
        note: ぜんぜん～ない says the amount is zero, "not at all"; あまり～ない says it is low, "not very".
      - id: OJG-0317
        note: そんなに～ない compares with an expectation already in the air, "not as ... as that"; あまり～ない simply says the degree is low.
      - id: OJG-0301
        note: ～くないです is the negative form itself; あまり is added in front of it to make the negative partial.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: あまり～ありません (amari ~ arimasen)
        - source_id: hanabira
          level: N5
          item: あまり～ないです (amari ~ nai desu)
    references:
      - source_id: hanabira
        ref: あまり～ない
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: 'Question: should あまりに(も) with a positive predicate ("too", as in あまりに高い) be mentioned at N5, or left out as a different use? Is the link between あまり and 余る worth keeping as reasoning, or does it overstate? あんまり is described as conversational; confirm.'
  - id: OJG-0316
    pattern: ぜんぜん～ない
    title: Not at all
    meaning: 'ぜんぜん～ない: "not at all"; ぜんぜん with a negative says the amount or degree is zero.'
    when: "Use it to deny something completely: ぜんぜんわかりません, \"I don't understand at all\"; ぜんぜん寒くないです, \"it isn't cold at all\". It works with verbs, adjectives and nouns in the negative. It is strong, so about someone else's things (their cooking, their gift) it can sound blunt."
    why: 'ぜんぜん is written 全然; 全 means "whole". With a negative it spreads the negation over the whole thing, so nothing is left: "not at all". Compare あまり～ない, which leaves a little. As with あまり, the negative predicate is what ぜんぜん works on, so the ordinary pattern needs one. In casual conversation you will also hear ぜんぜん with a positive word, for example ぜんぜん大丈夫, "totally fine", usually to wave away a worry; this is informal, and it does not simply replace とても "very".'
    formation:
      - form: ぜんぜん + V (negative)
        note: ぜんぜんわかりません, ぜんぜん寝なかった.
      - form: ぜんぜん + い-adjective stem + くない(です)／くありません
        note: ぜんぜん寒くないです.
      - form: ぜんぜん + な-adjective／Noun + じゃない(です)／ではありません
        note: ぜんぜん上手じゃないです.
    examples:
      - japanese: ぜんぜんわかりません。
        reading: ぜんぜんわかりません。
        romaji: zenzen wakarimasen.
        english: I don't understand at all.
      - japanese: 今日はぜんぜん寒くないです。
        reading: きょうはぜんぜんさむくないです。
        romaji: kyō wa zenzen samukunai desu.
        english: It isn't cold at all today.
      - japanese: 昨日はぜんぜん寝ませんでした。
        reading: きのうはぜんぜんねませんでした。
        romaji: kinō wa zenzen nemasen deshita.
        english: I didn't sleep at all yesterday.
    mistake:
      wrong: このラーメンはぜんぜんおいしいです。
      problem: In the pattern taught here ぜんぜん needs a negative. Casual ぜんぜん with a positive word dismisses a worry; it is not a way to say "very". Use とても.
      right: このラーメンはとてもおいしいです。
    distinguish_from:
      - id: OJG-0315
        note: あまり～ない says the degree is low, "not very"; ぜんぜん～ない says it is zero, "not at all".
      - id: OJG-0321
        note: 何も～ない and だれも～ない say there is no thing or no person; ぜんぜん～ない says how much, not which one.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ぜんぜん～ (zenzen～)
    references:
      - source_id: hanabira
        ref: ぜんぜん～ない
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: Examples write ぜんぜん in kana; 全然 is common in adult text. Confirm the description of casual positive ぜんぜん (ぜんぜん大丈夫) as informal and 'waving away a worry'. Is 'blunt about someone else's things' a fair warning?
  - id: OJG-0318
    pattern: ～はどうですか／～はいかがですか
    title: How is it? How about ...?
    meaning: "～はどうですか／～はいかがですか: asks how something is, or suggests or offers it; いかが is the politer word."
    when: Use it to ask for an impression (新しい学校はどうですか, "how is your new school?"), to suggest an option (土曜日はどうですか, "how about Saturday?"), or to offer something (お茶はいかがですか, "would you like some tea?"). いかが suits guests, customers and people above you, and is the usual word for offering food or drink politely. Among friends, どう？ alone is enough.
    why: 'どう is the question word "how". は puts the thing on the table as the topic, and どうですか asks the listener to say how it seems. When the thing is an option you are putting forward (a day, a dish), asking how it seems is a suggestion, so the same sentence covers both uses. いかが means the same as どう but is a more formal word, which is why it is chosen for offering things to someone you want to treat with care. Asking about something that is over uses the past: どうでしたか.'
    formation:
      - form: Noun + は + どうですか
        note: "Past: どうでしたか."
      - form: Noun + は + いかがですか
        note: More polite; common when offering food or drink.
      - form: Noun + (は) + どう？
        note: Casual; は is often left out.
    examples:
      - japanese: 新しい学校はどうですか。
        reading: あたらしいがっこうはどうですか。
        romaji: atarashii gakkō wa dō desu ka.
        english: How is your new school?
      - japanese: お茶はいかがですか。
        reading: おちゃはいかがですか。
        romaji: ocha wa ikaga desu ka.
        english: Would you like some tea?
        note: Offering politely.
      - japanese: 土曜日はどうですか。
        reading: どようびはどうですか。
        romaji: doyōbi wa dō desu ka.
        english: How about Saturday?
        note: Suggesting a day to meet.
    mistake:
      wrong: 旅行はどうですか。
      problem: Asked after the trip is over, this asks about a trip still going on. The trip is past, so the question takes でした.
      right: 旅行はどうでしたか。
    distinguish_from:
      - id: OJG-0049
        note: ～たらどうですか suggests an action for the listener to take ("why don't you ..."); ～はどうですか asks about or suggests a thing.
      - id: OJG-0007
        note: ～ませんか invites someone to do an action with you; ～はどうですか puts forward a thing or an option.
    register:
      - polite
      - casual
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～いかがですか。 (〜ikaga desu ka.)
        - source_id: hanabira
          level: N5
          item: ～どうですか。 (〜dou desu ka.)
    references:
      - source_id: hanabira
        ref: ～はどうですか／～はいかがですか
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: Is 'いかが is a more formal word' the right framing, or should it be called honorific-leaning? Is the claim that は is often dropped in casual どう？ questions accurate? The mistake line contains a Japanese stage direction （旅行のあとで）; confirm that format is acceptable.
  - id: OJG-0319
    pattern: 疑問詞 + か
    title: Someone, something, somewhere
    meaning: '疑問詞 + か (question word + か): turns だれ, 何, どこ, いつ into "someone", "something", "somewhere", "sometime".'
    when: 'Use it when something exists or might exist but you do not know or do not say which: だれか来ました, "someone came"; 何か飲みますか, "will you have something to drink?"; いつか行きたいです, "I want to go someday". A question with 何か or どこか asks whether there is one, so it is answered with はい or いいえ, unlike a question with 何 or どこ alone.'
    why: "か marks something as undecided, as at the end of a question. On a question word it wraps the unknown up as a single item, \"some one, I don't know which\". The sentence then stops asking which one and states, or asks, that there is one. That is why 何を食べましたか asks \"what did you eat?\", but 何か食べましたか asks \"did you eat anything?\". が and を are usually left off after these words (だれか来ました, 何か買います); other particles are kept: どこかへ, だれかと."
    formation:
      - form: だれか／何か／どこか／いつか／どれか
        note: 何か is read なにか.
      - form: 疑問詞 + か + particle
        note: "が and を are usually left off; に, へ, と and others stay: どこかへ, だれかと."
    examples:
      - japanese: 何か飲みますか。
        reading: なにかのみますか。
        romaji: nanika nomimasu ka.
        english: Will you have something to drink?
      - japanese: だれか来ましたよ。
        reading: だれかきましたよ。
        romaji: dareka kimashita yo.
        english: Someone's here.
      - japanese: 夏休みにどこかへ行きましたか。
        reading: なつやすみにどこかへいきましたか。
        romaji: natsuyasumi ni dokoka e ikimashita ka.
        english: Did you go anywhere in the summer holidays?
        note: "A yes-or-no question: はい or いいえ comes first in the answer."
    mistake:
      wrong: 冷蔵庫に何がありますか。
      problem: "When you want to know whether there is anything at all, 何が is wrong: it asks what the thing is and takes for granted that something is there. Use 何か."
      right: 冷蔵庫に何かありますか。
    distinguish_from:
      - id: OJG-0320
        note: Question word + でも means "any at all", every choice works; question word + か means "some", one unnamed choice.
      - id: OJG-0321
        note: Question word + も with a negative means "none"; question word + か means "some".
      - id: OJG-0303
        note: NかN offers alternatives, "A or B"; question word + か stands for one unnamed thing.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: いつか～ (itsuka～)
        - source_id: hanabira
          level: N5
          item: だれか〜 (dareka〜)
        - source_id: hanabira
          level: N5
          item: どこか～ (dokoka～)
        - source_id: hanabira
          level: N5
          item: なにか～ (nanika～)
    references:
      - source_id: hanabira
        ref: 疑問詞 + か
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: Is 'が and を are usually left off' accurate enough (だれかが来ました is also fine)? Should casual なんか (for 何か) be mentioned? The mistake line uses a Japanese stage direction in brackets; confirm the format.
  - id: OJG-0320
    pattern: 疑問詞 + でも
    title: Anyone, anything, anywhere
    meaning: '疑問詞 + でも: "any ... at all": だれでも "anyone", なんでも "anything", どこでも "anywhere", いつでも "any time".'
    when: 'Use it to say the choice does not matter, because every choice works: いつでも来てください, "come any time"; なんでも食べます, "I eat anything"; どれでもいいです, "any of them is fine". It mostly goes with an affirmative predicate. To say "nothing" or "nobody", use question word + も with a negative instead.'
    why: 'でも here means "even". "Even who", "even where": whichever one you pick, the statement still holds. So the result is "any at all", with the stress on free choice. Because it says every choice fits, it naturally goes with an affirmative sentence; the "none" meaning belongs to question word + も and a negative. 何 is read なん before でも: なんでも. Other particles go before でも: だれとでも, "with anyone".'
    formation:
      - form: だれでも／なんでも／どこでも／いつでも／どれでも
        note: "何 is read なん: なんでも."
      - form: 疑問詞 + particle + でも
        note: だれとでも, どこにでも.
    examples:
      - japanese: いつでも来てください。
        reading: いつでもきてください。
        romaji: itsudemo kite kudasai.
        english: Come any time.
      - japanese: 私はなんでも食べます。
        reading: わたしはなんでもたべます。
        romaji: watashi wa nandemo tabemasu.
        english: I eat anything.
      - japanese: この中のどれでもいいですよ。
        reading: このなかのどれでもいいですよ。
        romaji: kono naka no doredemo ii desu yo.
        english: Any of these is fine.
    mistake:
      wrong: 冷蔵庫になんでもありません。
      problem: でも means "any at all"; it does not give "nothing". Use 何も with the negative. (なんでもありません on its own is a fixed phrase, "it's nothing".)
      right: 冷蔵庫に何もありません。
    distinguish_from:
      - id: OJG-0319
        note: Question word + か means "some", one unnamed choice; question word + でも means "any", every choice works.
      - id: OJG-0321
        note: Question word + も with a negative means "none"; question word + でも with an affirmative means "any".
      - id: OJG-0291
        note: でも at the start of a sentence is a different word, "but".
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: いつでも～ (itsudemo～)
        - source_id: hanabira
          level: N5
          item: だれでも～ (dare demo～)
        - source_id: hanabira
          level: N5
          item: どこでも～ (dokodemo～)
        - source_id: hanabira
          level: N5
          item: どれでも～ (dore demo～)
        - source_id: hanabira
          level: N5
          item: なんでも～ (nandemo～)
    references:
      - source_id: hanabira
        ref: 疑問詞 + でも
    review:
      status: draft
      drafted_by:
        provider: anthropic
      note: Romaji joins these words (daredemo, doredemo) where the stub list had 'dare demo'; confirm the house convention. Is 'mostly with an affirmative predicate' accurate enough, given sentences such as だれでもできるわけではない?
  - id: OJG-0321
    pattern: 疑問詞 + も + negative
    title: No one, nothing, nowhere
    meaning: '疑問詞 + も + negative: "no one", "nothing", "nowhere": だれもいません, 何もありません.'
    when: "Use it to say there is not a single one: だれもいません, \"there is nobody\"; 何も食べませんでした, \"I didn't eat anything\"; どこにも行きません, \"I don't go anywhere\". The predicate must be negative. Another particle can come before も to mark the word's role: どこにも, どこへも, だれにも, だれとも. どこも行きません is also used, especially in conversation. いつも is a separate word meaning \"always\"."
    why: 'も says "also" or "even". On a question word with a negative it says "even taking any one you like, it is not so": no choice makes the sentence true, so the answer is none. In this use も replaces が and を (だれも, 何も, not だれもが, 何もを), while に, へ, と and other particles stay in front of it: どこにも, だれとも. The negative is what gives the "none" meaning, so a positive predicate does not.'
    formation:
      - form: だれも／何も + negative predicate
        note: 何も is read なにも. も replaces が and を.
      - form: 疑問詞 + particle + も + negative predicate
        note: どこにも, どこへも, だれにも, だれとも. どこも + negative is also used in conversation.
    examples:
      - japanese: 教室にはだれもいません。
        reading: きょうしつにはだれもいません。
        romaji: kyōshitsu ni wa dare mo imasen.
        english: There's nobody in the classroom.
      - japanese: かばんの中には何もありません。
        reading: かばんのなかにはなにもありません。
        romaji: kaban no naka ni wa nani mo arimasen.
        english: There's nothing in the bag.
      - japanese: 日曜日はどこにも行きませんでした。
        reading: にちようびはどこにもいきませんでした。
        romaji: nichiyōbi wa doko ni mo ikimasen deshita.
        english: I didn't go anywhere on Sunday.
        note: に marks the destination and stays before も.
    mistake:
      wrong: 店で何もを買いませんでした。
      problem: も replaces を here; the two are not stacked.
      right: 店で何も買いませんでした。
    distinguish_from:
      - id: OJG-0002
        note: も in general adds "also"; with a question word and a negative it gives "none".
      - id: OJG-0320
        note: Question word + でも with an affirmative means "any at all"; question word + も with a negative means "none".
      - id: OJG-0319
        note: Question word + か means "some"; question word + も with a negative means "none".
      - id: OJG-0316
        note: ぜんぜん～ない says the degree is zero; 何も／だれも say there is no thing or no person.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: だれも～ないです (dare mo ~ nai desu)
        - source_id: hanabira
          level: N5
          item: だれも～ません (daremo ~masen)
        - source_id: hanabira
          level: N5
          item: どこにも + Verb + ないです (doko ni mo + Verb + nai desu)
        - source_id: hanabira
