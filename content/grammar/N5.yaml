  - id: OJG-0309
    pattern: ～だけ
    title: Only, just
    meaning: "N + だけ: only N, just N, nothing more. だけ follows the thing it limits."
    when: "Use it to limit something to what is named: 朝はコーヒーだけ飲みました (I only had coffee this morning), りんごを一つだけください (just one apple, please). It also follows a verb: 見ているだけです, \"I'm just looking\", in a shop."
    why: "だけ marks a limit: this much and no further. It goes right after the word it limits, so moving it changes what is limited: 私だけ行きます is \"only I go\". が and を after だけ are often left out, though they can stay (コーヒーだけ飲みました, コーヒーだけを飲みました); other particles stay, and usually come before だけ: 田中さんにだけ話しました. だけ restricts whatever it follows and can go with a positive or a negative verb, but the meaning differs: コーヒーだけ飲みました is \"I drank only coffee\"; コーヒーだけ飲みませんでした is \"coffee was the one thing I didn't drink\". The pattern しか～ない (N4) says \"only\" through what is missing, with a negative verb, and often suggests \"not enough\"."
    formation:
      - form: Noun (+ particle) + だけ
        note: 水だけ, 田中さんにだけ.
      - form: Number + counter + だけ
        note: 一つだけ, 五分だけ.
      - form: V (plain form) + だけ
        note: 見るだけ, 見ているだけ.
    examples:
      - japanese: 朝はコーヒーだけ飲みました。
        reading: あさはコーヒーだけのみました。
        romaji: asa wa kōhī dake nomimashita.
        english: I only had coffee this morning.
      - japanese: りんごを一つだけください。
        reading: りんごをひとつだけください。
        romaji: ringo o hitotsu dake kudasai.
        english: Just one apple, please.
      - japanese: 「いらっしゃいませ。」「ちょっと見ているだけです。」
        reading: 「いらっしゃいませ。」「ちょっとみているだけです。」
        romaji: '"irasshaimase." "chotto mite iru dake desu."'
        english: "\"Welcome!\" \"I'm just looking.\""
    mistake:
      wrong: 朝はコーヒーだけ飲みませんでした。
      problem: Intended as "I only had coffee". That meaning needs 飲みました. With 飲みませんでした, this normally means coffee was the one thing I didn't drink. For "nothing but" with a negative verb, Japanese uses しか (N4).
      right: 朝はコーヒーだけ飲みました。
    distinguish_from:
      - id: OJG-0051
        note: 'しか～ない also means "only", with a negative verb, and often suggests "not enough": コーヒーしか飲みませんでした.'
    register:
      - plain
      - polite
    levels:
      commonly: N5
