  - id: OJG-0307
    pattern: 数量 + くらい／ぐらい
    title: About, roughly (with amounts)
    meaning: "Amount + くらい／ぐらい: about, roughly that much. 二十分ぐらい, 三十人くらい."
    when: "Use it after an amount to show it is approximate: 駅までバスで二十分ぐらいかかります; 教室に学生が三十人くらいいます. どのくらい or どれくらい asks \"about how much, how long\". For a point in time, like three o'clock, ごろ is the usual word."
    why: 'くらい and ぐらい mark an extent: "to about this degree". After a number, that makes it approximate. The two forms mean the same thing, and both are correct; after a number, ぐらい is very common in speech. An amount includes a length of time: 二時間ぐらい, "about two hours". A point in time takes ごろ: 三時ごろ, "around three". In everyday speech くらい is also heard after a clock time (三時ぐらいに), but ごろ never goes after a length of time.'
    formation:
      - form: Number + counter + くらい／ぐらい
        note: 二十分ぐらい, 五人くらい.
      - form: どのくらい／どれくらい／どれぐらい
        note: About how much? About how long?
    examples:
      - japanese: 駅までバスで二十分ぐらいかかります。
        reading: えきまでバスでにじゅっぷんぐらいかかります。
        romaji: eki made basu de nijuppun gurai kakarimasu.
        english: It takes about twenty minutes by bus to the station.
      - japanese: 教室に学生が三十人くらいいます。
        reading: きょうしつにがくせいがさんじゅうにんくらいいます。
        romaji: kyōshitsu ni gakusei ga sanjūnin kurai imasu.
        english: There are about thirty students in the classroom.
      - japanese: 「毎日どのくらい勉強しますか。」「一時間ぐらいです。」
        reading: 「まいにちどのくらいべんきょうしますか。」「いちじかんぐらいです。」
        romaji: '"mainichi dono kurai benkyō shimasu ka." "ichijikan gurai desu."'
        english: '"How long do you study every day?" "About an hour."'
    mistake:
      wrong: 駅で三十分ごろ待ちました。
      problem: ごろ marks a point in time. Thirty minutes is a length of time, which takes ぐらい or くらい.
      right: 駅で三十分ぐらい待ちました。
    distinguish_from:
