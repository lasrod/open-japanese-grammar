  - id: OJG-0304
    pattern: ～ができる／～ことができる
    title: Saying someone can do something
    meaning: "Nができる / V (dictionary form) + ことができる: can do, is able to. What can be done takes が."
    when: "Use Nができる with a skill, sport or language: 日本語ができます, テニスができます. Use ～ことができる with a verb to say someone can do an action: 漢字を読むことができます. It also says something is possible or allowed somewhere: この部屋でご飯を食べることができます."
    why: 'できる means "can be done, is possible". In this ability pattern, できる takes the skill or activity with が: テニスができる. Learn this as the particle pattern of できる, as with わかる and 好き; it is not a rule for every word that describes a state. A verb cannot directly take this が, which marks a noun, so it is first turned into a noun with こと, "the act of": 読むこと. Then ができる follows. The verb keeps its own object with を inside that phrase: 漢字を読むことができます. Japanese also has a shorter potential form of the verb (読める), which is very common in speech and usually taught at N4; ことができる sounds more formal, and it is built the same way for every verb.'
    formation:
      - form: Noun + が + できる
        note: 日本語ができます. For skills, sports, languages.
      - form: V (dictionary form) + こと + が + できる
        note: "泳ぐことができます. する-verbs: 運転することができます."
      - form: ～ことができません / ～ことができました
        note: Negative and past.
    examples:
      - japanese: 兄は中国語ができます。
        reading: あにはちゅうごくごができます。
        romaji: ani wa chūgokugo ga dekimasu.
        english: My older brother can speak Chinese.
      - japanese: 私は泳ぐことができません。
        reading: わたしはおよぐことができません。
        romaji: watashi wa oyogu koto ga dekimasen.
        english: I can't swim.
      - japanese: この部屋でご飯を食べることができます。
        reading: このへやでごはんをたべることができます。
        romaji: kono heya de gohan o taberu koto ga dekimasu.
        english: You can eat in this room.
    mistake:
      wrong: 私は泳ぐができます。
      problem: In this pattern, what can be done must be a noun before が. A verb cannot take that が directly; turn it into a noun with こと first.
      right: 私は泳ぐことができます。
    distinguish_from:
      - id: OJG-0313
        note: The こと that makes a verb into a noun, used here before が.
      - id: OJG-0081
        note: The potential form (泳げる) says the same more briefly, and is more common in speech.
    register:
