  - id: OJG-0019
    pattern: ～に行く
    title: Going (or coming) somewhere to do something
    meaning: "V (ます-stem) + に行く／来る／帰る: go, come or go home in order to do V."
    when: "Use it when you move somewhere for a purpose: to see a film, to buy bread, to eat lunch at home. The purpose goes before に, and a verb of movement follows, most often 行く, 来る or 帰る. A noun that names an activity, such as 買い物 or 散歩, can also take this に directly: 買い物に行く, “go shopping”. The destination, if you say it, is usually marked with へ or に earlier in the sentence."
    why: "The ます-stem of a verb (食べ from 食べます, 見 from 見ます) works a little like a noun that names the activity. に marks where the movement is aimed, and here it is aimed at an activity rather than a place: 見に行く is “go towards seeing”. That is why the verb before に is in the stem form, not the dictionary form, and why the verb after it is one of moving somewhere. Because a sentence can name both a place and a purpose, it can contain two に; many speakers prefer へ for the place in that case (図書館へ本を借りに行く), though に for the place is also heard."
    formation:
      - form: V (ます-stem) + に + 行く／来る／帰る
        note: "Polite: 行きます, 来ます, 帰ります. Tense and politeness go on the verb of movement: 見に行きました."
      - form: activity noun + に + 行く／来る
        note: "With nouns that name an activity, often ones that also take する: 買い物に行く, 散歩に行く. 買い物をしに行く is also possible."
      - form: place へ／に … purpose に + 行く
        note: "The place and the purpose can both appear: デパートへ買い物に行く."
    examples:
      - japanese: 友だちと映画を見に行きます。
        reading: ともだちとえいがをみにいきます。
        romaji: tomodachi to eiga o mi ni ikimasu.
        english: I’m going to see a film with a friend.
      - japanese: 昼ご飯を食べに家へ帰ります。
        reading: ひるごはんをたべにいえへかえります。
        romaji: hirugohan o tabe ni ie e kaerimasu.
        english: I go home to eat lunch.
      - japanese: 日曜日にデパートへ買い物に行きました。
        reading: にちようびにデパートへかいものにいきました。
        romaji: nichiyōbi ni depāto e kaimono ni ikimashita.
        english: On Sunday I went shopping at the department store.
        note: 買い物 is an activity noun, so it takes に directly.
      - japanese: 田中さんが本を返しに来ました。
        reading: たなかさんがほんをかえしにきました。
        romaji: tanaka-san ga hon o kaeshi ni kimashita.
        english: Mr Tanaka came to return the book.
    mistake:
      wrong: 昼ご飯を食べるに行きます。
      problem: The purpose before に is the ます-stem of the verb, not the dictionary form. English “go to eat” makes the dictionary form feel right, but 食べるに does not work here.
      right: 昼ご飯を食べに行きます。
    distinguish_from:
      - id: OJG-0004
        note: に／へ after a place marks where you go (駅に行く). The に of this pattern follows a verb stem or activity noun and marks what you go to do (本を買いに行く). Both can appear in one sentence.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: ～にいく
          ref: 553
    references:
      - source_id: tanos
        ref: 553
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Two points to confirm: (1) the claim that many speakers prefer へ for the place when a purpose に follows is a tendency I believe is right but have stated softly; (2) the list of movement verbs is limited to 行く／来る／帰る as the scope asked, though 出かける and 戻る also occur. Not covered: ～ために as a general purpose form, which is not N5."
