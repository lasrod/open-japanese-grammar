  - id: OJG-0017
    pattern: ～から
    title: "Giving a reason: because"
    meaning: 'Clause + から: "because". The reason usually comes first, then the result, request or decision.'
    when: "This entry is から after a clause, giving a reason: 雨だから、行きません, \"It's raining, so I won't go\". The reason normally comes before the main clause, but it can follow as an added explanation: 行きません。雨ですから。 It can also end a sentence, especially in answer to どうして: 頭が痛かったからです. The particle から after a noun, meaning \"from\" (九時から, 東京から), is a different use of the same word."
    why: "から marks a starting point: 東京から is \"from Tokyo\". After a clause, the same idea marks the situation the rest of the sentence starts from, which is its reason. So in the usual order the reason clause comes first and the main point last, the reverse of English \"X because Y\"; the reason can also be added afterwards as a separate sentence ending in から. For a nonpast affirmative noun or な-adjective predicate, use だ or です before this から: 雨だから, 静かですから. Without it, 雨から reads as \"from the rain\". Past or negative predicates use the matching form: 雨だったから, 静かではないから. から is common with requests, invitations and decisions: 寒いから窓を閉めてください. Compared with ので, から tends to sound more like the speaker's own reasoning, and ので more like a plain statement of circumstances, so ので is often preferred for polite excuses and requests. This is a tendency, and both are used in all of these situations."
    formation:
      - form: Verb / い-adjective (plain or polite) + から
        note: 行くから, 行きますから, 高いから, 高いですから. The polite form before から is more polite.
      - form: Noun / な-adjective + だから (or ですから)
        note: 'For nonpast affirmative predicates; 雨から would mean "from the rain". Past or negative: 雨だったから, 静かではないから.'
      - form: Plain-form clause + からです。
        note: "Gives a reason, often answering どうして or なぜ: 行くからです, 高いからです, 雨だからです, 静かだったからです. Use the plain form inside this construction; the final です supplies the politeness."
    examples:
      - japanese: 今日は雨だから、どこにも行きません。
        reading: きょうはあめだから、どこにもいきません。
        romaji: kyō wa ame da kara, doko ni mo ikimasen.
        english: It's raining today, so I'm not going anywhere.
      - japanese: 暑いですから、窓を開けてください。
        reading: あついですから、まどをあけてください。
        romaji: atsui desu kara, mado o akete kudasai.
        english: It's hot, so please open the window.
      - japanese: 明日はテストがありますから、今晩勉強します。
        reading: あしたはテストがありますから、こんばんべんきょうします。
        romaji: ashita wa tesuto ga arimasu kara, konban benkyō shimasu.
        english: I have a test tomorrow, so I'll study tonight.
      - japanese: 「どうして来なかったんですか。」「頭が痛かったからです。」
        reading: 「どうしてこなかったんですか。」「あたまがいたかったからです。」
        romaji: '"dōshite konakatta n desu ka." "atama ga itakatta kara desu."'
        english: "\"Why didn't you come?\" \"Because I had a headache.\""
    mistake:
      wrong: 雨から、行きません。
      problem: 'In a nonpast affirmative sentence, a noun before the "because" から needs だ or です. Without it, 雨から reads as the particle "from": "from the rain".'
      right: 雨だから、行きません。
    distinguish_from:
      - id: OJG-0036
        note: ので also gives a reason. It tends to sound softer and more like a statement of circumstances; から tends to sound more like the speaker's own reasoning.
      - id: OJG-0040
        note: '～てから means "after doing": 食べてから is "after eating", not "because I eat".'
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
