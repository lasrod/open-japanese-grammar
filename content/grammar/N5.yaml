  - id: OJG-0038
    pattern: でしょう
    title: Probably; or “…, right?”
    meaning: "～でしょう: says something is probably so; with rising intonation, asks the listener to agree."
    when: "Use it for a guess or a prediction you are fairly but not fully sure of: weather forecasts use it constantly (明日は雨が降るでしょう). It is often paired with たぶん, “probably”. With rising intonation, でしょう？ asks the listener to confirm something you expect they will agree with: “…, right?”. でしょうか is a softer, polite question, “I wonder…?” or “Would it be…?”. The plain form is だろう."
    why: "In its conjectural use, でしょう presents something as probable rather than asserting it outright: です says “it is”, でしょう says “it would be”, which is why it fits guesses and forecasts. In its confirmation-seeking use, said with rising intonation, it presents something as expected to be shared or accepted by the listener; the speaker may be fully confident, and it can sometimes sound insistent. Normally attach でしょう directly to the plain form, omitting present affirmative だ after nouns and な-adjectives. ～ますでしょう(か) also occurs in especially polite speech, but plain form + でしょう is the standard learner pattern. In conversation, plain だろう can sound blunt, and casual speech often uses でしょ？ for “right?”."
    formation:
      - form: V／い-adj (plain form) + でしょう
        note: 降るでしょう, 降ったでしょう, 高いでしょう.
      - form: noun／な-adj + でしょう
        note: "No だ: 雨でしょう, 静かでしょう."
      - form: ～でしょう？ (rising)
        note: "Asking for agreement. Casual: ～でしょ？"
      - form: ～だろう
        note: The plain form, common in writing and in thinking to oneself.
    examples:
      - japanese: 明日は雨が降るでしょう。
        reading: あしたはあめがふるでしょう。
        romaji: ashita wa ame ga furu deshō.
        english: It will probably rain tomorrow.
        note: The typical weather-forecast sentence.
      - japanese: 田中さんはたぶん来ないでしょう。
        reading: たなかさんはたぶんこないでしょう。
        romaji: tanaka-san wa tabun konai deshō.
        english: Mr Tanaka probably won’t come.
      - japanese: この店のケーキ、おいしいでしょう？
        reading: このみせのケーキ、おいしいでしょう？
        romaji: kono mise no kēki, oishii deshō?
        english: The cakes at this shop are good, aren’t they?
        note: "Rising intonation: the speaker expects agreement."
    mistake:
      wrong: 明日は暑いですでしょう。
      problem: In the standard learner construction, でしょう attaches directly to 暑い, without です. 暑いですでしょう layers polite endings and is not the standard form.
      right: 明日は暑いでしょう。
    distinguish_from:
      - id: OJG-0001
        note: です states something as so. でしょう presents it as probable, or, rising, as something the listener should confirm.
      - id: OJG-0012
        note: ～ましょう proposes an action, including invitations and offers; ～でしょう expresses conjecture or seeks confirmation. The two only look alike.
    register:
      - plain
      - polite
      - spoken
      - written
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: でしょう
          ref: 572
    references:
      - source_id: tanos
        ref: 572
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Revised after review: the why no longer says ます can never come before でしょう; it now gives plain form + でしょう as the standard pattern and notes ～ますでしょう(か) in especially polite speech. The mistake calls 暑いですでしょう redundant and non-standard rather than impossible, and the ましょう comparison no longer limits ましょう to doing something together. Still open: whether “it would be” is a fair gloss, and whether “だろう can sound blunt” is safe. The link between だろう and male speakers is left out on purpose."
      reviews:
