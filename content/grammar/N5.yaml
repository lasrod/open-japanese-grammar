  - id: OJG-0006
    pattern: を
    title: What an action is done to, and the ground a movement covers
    meaning: を marks what an action acts on (パンを食べる), and with verbs of movement the route taken or the place left.
    when: "Use it on the direct object of a verb: what is eaten, read, bought, made (コーヒーを飲みます). With verbs of movement it marks the ground you move along or through (公園を散歩します, 道を歩きます) or the place you leave (家を出ます, 電車を降ります). を is pronounced お."
    why: 'を marks what the action passes over or works on. For most verbs that is the thing affected: the bread that gets eaten, the letter that gets written. With verbs of movement, the ground covered is treated the same way, as the thing the movement goes over: 道を歩く, "walk along the road"; and a place you leave is what you move away from: 家を出る. Whether a verb takes を is a fact about the Japanese verb, not about its English translation. 会う ("meet") normally marks the person with に or と, and 乗る ("ride") normally marks the vehicle with に. In the basic patterns taught here, わかる ("understand") marks what is understood with が, and 好き and ほしい, which are adjectives, mark what is liked or wanted with が.'
    formation:
      - form: Noun + を + verb
        note: The thing acted on.
      - form: Place + を + verb of movement
        note: The route (歩く, 散歩する, 渡る, 走る) or the place left (出る, 降りる).
    examples:
      - japanese: 毎朝コーヒーを飲みます。
        reading: まいあさコーヒーをのみます。
        romaji: maiasa kōhī o nomimasu.
        english: I drink coffee every morning.
      - japanese: 昨日、友だちに手紙を書きました。
        reading: きのう、ともだちにてがみをかきました。
        romaji: kinō, tomodachi ni tegami o kakimashita.
        english: Yesterday I wrote a letter to a friend.
      - japanese: 日曜日は公園を散歩しました。
        reading: にちようびはこうえんをさんぽしました。
        romaji: nichiyōbi wa kōen o sanpo shimashita.
        english: On Sunday I took a walk in the park.
        note: The park is the ground walked through, so it takes を.
      - japanese: 八時に家を出ます。
        reading: はちじにいえをでます。
        romaji: hachiji ni ie o demasu.
        english: I leave home at eight.
    mistake:
      wrong: 駅で友だちを会いました。
      problem: '"Meet" takes a direct object in English, but 会う marks the person met with に (or と, when it is a meeting of both).'
      right: 駅で友だちに会いました。
    distinguish_from:
      - id: OJG-0004
        note: With verbs of movement, に marks a destination and へ marks the direction toward it; を marks the route covered or the place left.
      - id: OJG-0005
        note: に marks the person an action is aimed at (友だちに手紙を書く); を marks the thing acted on (手紙を).
      - id: OJG-0021
        note: "好き is an adjective, so what is liked takes が: すしが好きです, 読むのが好きです."
