  - id: OJG-0009
    pattern: ～があります
    title: Saying a thing is there, or that you have it
    meaning: "N があります: there is N (a thing, plant or event, not a person or animal), or someone has N. が marks what is there."
    when: Use it to say that a thing is somewhere (机の上にかばんがあります), that an event will take place (明日テストがあります), and to say you have something or do not (時間がありません). The negative is ありません in polite speech and ない in plain speech.
    why: 'ある normally describes things, plants, events and abstract things such as time or plans; いる normally describes people and animals. The choice follows the thing that exists, not the place, and it can also depend on how the speaker presents that thing (see OJG-0010). が marks that thing. It often presents something the listener has not heard about yet, which is why the usual order is place first, as the setting, and the new thing last: 机の上にかばんがあります. When the thing is already the topic and the question is where it is, it takes は and the place becomes the new information: かばんは机の上にあります. "I have N" works the same way: literally "for me, N exists", so N still takes が, not を. For an event, the place where it is held usually takes で, because an event is something that happens there: 公園でお祭りがあります.'
    formation:
      - form: place に + N が あります
        note: 'Introduces something new: "there is N at the place". Past: ありました. Negative: ありません.'
      - form: N は + place に あります
        note: Says where a known thing is.
      - form: (person は) + N が あります
        note: 'Having something: 時間があります, "I have time".'
      - form: (time) + (event location で) + event が あります
        note: "For an event taking place somewhere, use で: 公園でお祭りがあります. Relative time words such as 明日 or 今日 normally appear without に; clock times and dates take に: 三時に会議があります."
      - form: ある / ない
        note: Plain forms. The plain negative of ある is ない, not あらない.
    examples:
      - japanese: 机の上にかばんがあります。
        reading: つくえのうえにかばんがあります。
        romaji: tsukue no ue ni kaban ga arimasu.
        english: There is a bag on the desk.
      - japanese: 庭に大きい木があります。
        reading: にわにおおきいきがあります。
        romaji: niwa ni ōkii ki ga arimasu.
        english: There is a big tree in the garden.
        note: A tree is alive, but it does not move about, and plants usually take ある.
      - japanese: 明日、テストがあります。
        reading: あした、テストがあります。
        romaji: ashita, tesuto ga arimasu.
        english: There is a test tomorrow.
        note: An event also "exists", so it takes ある.
      - japanese: 今日は時間がありません。
        reading: きょうはじかんがありません。
        romaji: kyō wa jikan ga arimasen.
        english: I don't have time today.
    mistake:
      wrong: 私は車をあります。
      problem: English "have" takes an object, so learners reach for を. ある is not an action done to something; it says the car exists, so the car is the subject and takes が.
      right: 私は車があります。
    distinguish_from:
      - id: OJG-0010
        note: います is for people and animals; あります is for things, plants and events. The choice depends on what exists, not on where it is.
      - id: OJG-0001
        note: です says what something is or is like (これは本です). あります says that something exists or is somewhere (本があります).
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: ～があります
          ref: 543
    references:
      - source_id: tanos
        ref: 543
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Possession example 私は車があります: natural, but some speakers prefer 車を持っています for owning a car; is the mistake/right pair fine as is? The で-for-events point (公園でお祭りがあります) is stated as \"usually\"; please confirm that level of hedging. Revised after review: the animate/inanimate sentence is now \"normally\", with the speaker's presentation as a factor (pointing to OJG-0010), and a formation line for events was added. The reviewer's note said time words \"normally appear without に\"; that holds for relative words (明日, 今日) but not for clock times or dates (三時に), so the note distinguishes the two."
      reviews:
        - by: gpt-6-astra
          kind: ai
          provider: openai
          model: gpt-6-astra
