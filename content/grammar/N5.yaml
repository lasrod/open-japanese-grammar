      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Questions: is the tense point (行くとき vs 行ったとき) appropriate at N5, or better left to N4? Is the 行くとき reading (bought before the trip, or on the way) stated correctly?"
