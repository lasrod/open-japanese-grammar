  - id: OJG-0324
    pattern: もらう
    title: "Receiving: getting something from someone"
    meaning: "AはBに／からNをもらう: A receives N from B. The receiver is the subject, and the event is told from their side."
    when: "Use it to tell a gift from the receiver's point of view: 私は友だちに本をもらいました; 母から手紙をもらいました. The receiver can be you, someone close to you, or someone else. When the gift comes to you, the same event can also be told with くれる."
    why: "もらう makes the receiver the subject, so the sentence is about the person who got something. The giver is marked with に or から. から marks the source explicitly, and is generally the safest choice when the giver is a group such as a school or a company: 学校から手紙をもらいました. に is also possible when the group is treated as the one giving. The same event can be told with different subjects: 友だちが本をくれました makes the giver the subject and presents the gift as coming toward me; 私は友だちに本をもらいました makes me, the receiver, the subject. When the speaker is the one giving, あげる is the usual way to tell it; that is a matter of viewpoint, not a strict ban, and 私から何をもらいたいですか is natural. For receiving from someone above you, the humble verb is いただく (N4)."
    formation:
      - form: Receiver は Giver に Thing を もらう
        note: "Polite: もらいます."
      - form: Receiver は Giver から Thing を もらう
        note: から marks the source explicitly, and is generally preferred with a school, a company or another group, though に is also possible.
    examples:
      - japanese: 私は友だちに本をもらいました。
        reading: わたしはともだちにほんをもらいました。
        romaji: watashi wa tomodachi ni hon o moraimashita.
        english: I got a book from a friend.
      - japanese: 母から手紙をもらいました。
        reading: ははからてがみをもらいました。
        romaji: haha kara tegami o moraimashita.
        english: I got a letter from my mother.
      - japanese: 弟は誕生日に自転車をもらいました。
        reading: おとうとはたんじょうびにじてんしゃをもらいました。
        romaji: otōto wa tanjōbi ni jitensha o moraimashita.
        english: My younger brother got a bicycle for his birthday.
    mistake:
      wrong: 友だちは私に本をもらいました。
      problem: Intended as "my friend gave me a book". With もらう the subject is the receiver and に marks the giver, so this says the friend got a book from me. For a gift to me, use くれる, or make me the receiver of もらう.
      right: 私は友だちに本をもらいました。
    distinguish_from:
      - id: OJG-0323
        note: "くれる makes the giver the subject and describes giving toward the speaker or someone the speaker identifies with: 友だちが本をくれました."
      - id: OJG-0322
        note: あげる makes the giver the subject and normally describes giving to someone other than the speaker; it can also describe giving between third parties.
      - id: OJG-0057
        note: ～てもらう is having someone do something for you.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～から もらいます (〜kara moraimasu)
        - source_id: hanabira
          level: N5
          item: ～に もらいます (〜ni moraimasu)
        - source_id: hanabira
          level: N4
          item: Noun もらう (Noun wo morau)
    references:
