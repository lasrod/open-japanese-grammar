  - id: OJG-0014
    pattern: ～てください
    title: Please do...
    meaning: 'V-てください: "please V", a polite request, instruction or invitation for the listener to do something.'
    when: "Use it to ask someone to do something (ちょっと待ってください), to give directions or instructions (ここに名前を書いてください), and to urge a guest to do something for their own sake (どうぞ食べてください). For a thing rather than an action, use N をください: 水をください."
    why: 'ください is an honorific request form of くださる, a verb meaning "give (to me)". After the て-form it asks the listener to give you the doing of V: to do it for you, or as you ask. So this construction is polite in form, though it can sound directive: it still tells the listener what to do, which is why it is common for instructions and directions. When asking a favour of someone above you or a stranger, speakers often soften it further, for example with ～てくださいませんか. With an ordinary action verb, ～てください asks the listener to perform that action; it does not by itself mean "May I…?" A causative form such as 行かせてください ("please let me go") can ask the listener to let the speaker act.'
    formation:
      - form: V (て-form) + ください
        note: 待つ → 待ってください; 書く → 書いてください; 見る → 見てください.
      - form: N + を + ください
        note: "Asking for a thing: 水をください."
      - form: V (て-form)
        note: "Casual: 待って, 見て."
    examples:
      - japanese: ちょっと待ってください。
        reading: ちょっとまってください。
        romaji: chotto matte kudasai.
        english: Please wait a moment.
      - japanese: ここに名前を書いてください。
        reading: ここになまえをかいてください。
        romaji: koko ni namae o kaite kudasai.
        english: Please write your name here.
      - japanese: どうぞ、たくさん食べてください。
        reading: どうぞ、たくさんたべてください。
        romaji: dōzo, takusan tabete kudasai.
        english: Please, help yourself and eat plenty.
        note: Offered for the listener's own sake, as a host would.
    mistake:
      wrong: トイレに行ってください。
      problem: 'Meant as "May I go to the toilet?", but with an ordinary verb てください asks the listener to do the action: this tells the teacher to go to the toilet. To ask permission for yourself, use てもいいですか.'
      right: トイレに行ってもいいですか。
    distinguish_from:
      - id: OJG-0020
        note: "ないでください is the negative request: \"please don't V\"."
      - id: OJG-0015
        note: てもいいですか asks whether an action is permitted, often the speaker's own; てください requests an action from the listener.
    register:
      - polite
      - spoken
    levels:
      commonly: N5
