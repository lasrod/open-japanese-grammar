      note: "Revised after review: the ban on なかったほうがいい is gone; V-ないほうがいい is now 'the normal choice', and the mistake is framed as copying the positive past form. The てください comparison no longer says advice is for the listener's own good. Still open: た-form vs dictionary-form ほうがいい is stated only as a tendency (た for specific advice, dictionary form for general comparison); a reviewer may prefer to say less."
