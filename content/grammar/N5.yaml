  - id: OJG-0314
    pattern: ～の
    title: Turning a verb into a noun with の
    meaning: 'V (plain form) + の: "doing V", as a noun. Common before が好き, は楽しい, を忘れる, and with seeing and hearing.'
    when: "Use it to put an action where a noun is needed, especially in everyday speech: 走るのは楽しいです; 宿題を持ってくるのを忘れました. It is the usual choice for something seen or heard happening: 子どもたちが遊んでいるのを見ました."
    why: 'の after a verb phrase does the job it does in 私のです: it stands in for a noun, and the words before it describe it. So 走るの is "running", a noun that can take は, が or を. Compared with こと, の tends to present the action as a concrete event, which is why verbs of seeing and hearing take の: you see children playing, an event in front of you. こと suits an action named as an idea, as in 趣味は読むことです; 読むのです would instead be read as the explaining の (see ～んです). The verb before の is in the plain form, and can be past or ている: 遊んでいるのを見ました.'
    formation:
      - form: V (plain form) + の + は／が／を
        note: 走るのは, 泳ぐのが, 持ってくるのを.
      - form: V (ている) + の + を + 見る／聞く
        note: "Something seen or heard as it happens: 遊んでいるのを見ました."
    examples:
      - japanese: 走るのは楽しいです。
        reading: はしるのはたのしいです。
        romaji: hashiru no wa tanoshii desu.
        english: Running is fun.
      - japanese: 宿題を持ってくるのを忘れました。
        reading: しゅくだいをもってくるのをわすれました。
        romaji: shukudai o motte kuru no o wasuremashita.
        english: I forgot to bring my homework.
      - japanese: 公園で子どもたちが遊んでいるのを見ました。
        reading: こうえんでこどもたちがあそんでいるのをみました。
        romaji: kōen de kodomotachi ga asonde iru no o mimashita.
        english: I saw the children playing in the park.
    mistake:
      wrong: 走るは楽しいです。
      problem: "Here the action of running is the topic, so the verb phrase has to become a noun before は. Add の: 走るのは楽しいです."
      right: 走るのは楽しいです。
    distinguish_from:
      - id: OJG-0313
        note: "こと also turns a verb into a noun, and is the one to use before です when saying what something is: 趣味は走ることです."
      - id: OJG-0021
        note: のが好きです is this の in its most common frame.
      - id: OJG-0033
        note: の or ん at the end of a sentence (走るんです) explains. That is a different use.
      - id: OJG-0289
        note: "Between two nouns, の links them: 私の本."
    register:
