  - id: OJG-0322
    pattern: あげる
    title: Giving (to someone else)
    meaning: "AはBにNをあげる: A gives N to B. Used for giving by the speaker, or between others; not for giving to the speaker."
    when: "Use it when you, or someone else, give something to another person: 私は友だちにプレゼントをあげました; 田中さんは山田さんに花をあげました. It is not used when the receiver is you; for that, use くれる. You can use it for your own gift to your family: 私は妹に本をあげました."
    why: "Japanese chooses its verb of giving by the direction the thing moves, seen from the speaker. あげる is for giving by the speaker to someone else, or between other people when the gift is not seen as coming toward the speaker. Giving to the speaker takes くれる, and so, normally, does giving to someone close to the speaker when the speaker sides with that person (友だちが妹にお菓子をくれました). So 友だちが私に本をあげました is wrong: the book is coming to me. The receiver is marked with に and the thing with を. Toward someone above you, such as a teacher, あげる can sound like doing them a favour; the respectful verb is さしあげる (N4). For animals and plants, あげる is widely used (犬に水をあげる), and やる is also heard."
    formation:
      - form: Giver は Receiver に Thing を あげる
        note: "Polite: あげます. The receiver is not the speaker; it can be the speaker's family, when the speaker is the giver."
    examples:
      - japanese: 私は友だちに誕生日のプレゼントをあげました。
        reading: わたしはともだちにたんじょうびのプレゼントをあげました。
        romaji: watashi wa tomodachi ni tanjōbi no purezento o agemashita.
        english: I gave my friend a birthday present.
      - japanese: 田中さんは山田さんに花をあげました。
        reading: たなかさんはやまださんにはなをあげました。
        romaji: tanaka-san wa yamada-san ni hana o agemashita.
        english: Mr Tanaka gave Ms Yamada flowers.
      - japanese: 毎朝、犬に水をあげます。
        reading: まいあさ、いぬにみずをあげます。
        romaji: maiasa, inu ni mizu o agemasu.
        english: I give the dog water every morning.
    mistake:
      wrong: 友だちが私にチョコレートをあげました。
      problem: The chocolate comes to the speaker, so the verb is くれる. あげる is not used for giving to the speaker.
      right: 友だちが私にチョコレートをくれました。
    distinguish_from:
      - id: OJG-0323
        note: "くれる is giving that comes to the speaker, or to someone the speaker sides with: 友だちが本をくれました."
      - id: OJG-0324
        note: "もらう tells the event from the receiver's side: 山田さんは田中さんに花をもらいました."
      - id: OJG-0055
        note: ～てあげる is doing something for someone, with the same direction as あげる.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～に あげます (〜 ni agemasu)
        - source_id: hanabira
          level: N4
          item: Noun を あげる (Noun wo ageru)
    references:
