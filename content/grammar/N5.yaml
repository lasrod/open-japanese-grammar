  - id: OJG-0321
    pattern: 疑問詞 + も + negative
    title: Nobody, nothing, nowhere
    meaning: "Question word + も + negative: no one, nothing, nowhere. だれもいません, 何も食べません, どこにも行きません."
    when: "Use it for a complete no: 教室にはだれもいません (There's no one in the classroom); 冷蔵庫に何もありません; 日曜日はどこにも行きませんでした. The verb or adjective at the end must be negative."
    why: 'も means "also, even". On a question word it covers every possible answer, and with a negative it says the negative is true of each one: not this person, not that one, nobody. That is why the verb must be negative. が and を are dropped (だれもいません, 何も食べません), but other particles are kept, before も: どこにも, どこへも, だれにも, だれとも. For the "nobody, nothing" meaning taught here, the ending must be negative. だれも also has positive uses meaning "everyone", usually as だれもが, but that is a later point; みんな is the simple way to say "everyone".'
    formation:
      - form: だれも + negative
        note: Nobody.
      - form: 何も + negative
        note: Nothing. 何も is read なにも.
      - form: どこにも／どこへも + negative
        note: Nowhere. The particle stays, before も. In speech どこも is also heard.
      - form: Question word + particle + も + negative
        note: だれにも, だれとも.
    examples:
      - japanese: 教室にはだれもいません。
        reading: きょうしつにはだれもいません。
        romaji: kyōshitsu ni wa dare mo imasen.
        english: There's no one in the classroom.
      - japanese: 冷蔵庫に何もありません。
        reading: れいぞうこになにもありません。
        romaji: reizōko ni nani mo arimasen.
        english: There's nothing in the fridge.
      - japanese: 日曜日はどこにも行きませんでした。
        reading: にちようびはどこにもいきませんでした。
        romaji: nichiyōbi wa doko ni mo ikimasen deshita.
        english: I didn't go anywhere on Sunday.
    mistake:
      wrong: 教室にはだれもいます。
      problem: Intended as "There's no one in the classroom". The "nobody" meaning needs a negative ending.
      right: 教室にはだれもいません。
    distinguish_from:
      - id: OJG-0319
        note: 'Question word + か is "some": 何か, だれか.'
      - id: OJG-0320
        note: 'Question word + でも is "any", usually with a positive predicate: 何でも食べます.'
      - id: OJG-0002
        note: The same も, "also, even", here on a question word.
