  - id: OJG-0037
    pattern: ～なくちゃいけない
    title: I have to... (casual)
    meaning: "V-なくちゃいけない: casual \"have to V\"; literally \"if I don't V, it is no good\"."
    when: 'Use it in casual speech to say that something has to be done, often by the speaker (もう帰らなくちゃいけない). It is often cut short to なくちゃ alone: 行かなくちゃ, "I have to go". In formal speech and formal writing, prefer fuller forms such as ～なくてはいけません and ～なければなりません.'
    why: "Start from the ない-form, \"not doing V\". Its て-form is なくて, and なくては sets up the condition \"if (you) don't do V\". いけない means \"it won't do\". So the sentence says \"not doing V is no good\", and two negatives make an obligation: you must do V. なくちゃ contracts なくては: ては → ちゃ. The corresponding voiced contraction is では → じゃ, as in 飲んではいけない → 飲んじゃいけない. The logic matches てはいけません (OJG-0016), which says doing V is no good; here it is not doing V that is no good. なければなりません is built the same way with a different conditional (なければ, \"if not\") and a different ending (ならない, \"it won't do\"), and is the usual choice in formal speech and writing."
    formation:
      - form: V (ない-form, drop い) + くちゃいけない
        note: 行かない → 行かなくちゃいけない; 食べない → 食べなくちゃいけない.
      - form: V-なくちゃ
        note: "Casual, with いけない left unsaid: 帰らなくちゃ."
      - form: V-なくてはいけません / V-なければなりません
        note: Polite and formal relatives with the same meaning.
      - form: V-なきゃ(いけない)
        note: Another casual contraction, from なければ.
    examples:
      - japanese: 明日は早く起きなくちゃいけない。
        reading: あしたははやくおきなくちゃいけない。
        romaji: ashita wa hayaku okinakucha ikenai.
        english: I have to get up early tomorrow.
      - japanese: もう九時だ。帰らなくちゃ。
        reading: もうくじだ。かえらなくちゃ。
        romaji: mō kuji da. kaeranakucha.
        english: It's already nine. I have to go home.
      - japanese: 毎日、薬を飲まなければなりません。
        reading: まいにち、くすりをのまなければなりません。
        romaji: mainichi, kusuri o nomanakereba narimasen.
        english: I have to take medicine every day.
        note: The formal relative, for polite speech or writing.
    mistake:
      wrong: 明日、会社に行かないちゃいけない。
      problem: ない becomes なく before て or ちゃ, just as an い-adjective does (高い → 高くて). The contraction comes from 行かなくては, so it is 行かなくちゃ.
      right: 明日、会社に行かなくちゃいけない。
    distinguish_from:
      - id: OJG-0016
        note: てはいけない says doing V is no good (must not); なくちゃいけない says not doing V is no good (must).
      - id: OJG-0035
        note: ほうがいい gives advice ("you had better"); なくちゃいけない states an obligation.
    register:
      - plain
      - casual
      - spoken
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: ～なくちゃいけない
          ref: 571
    references:
      - source_id: tanos
        ref: 571
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: 'Revised after review: the contraction sentence now separates ては → ちゃ from では → じゃ, and the register claim in when is limited to formal speech and formal writing (なくちゃいけません does occur in conversational polite speech). The differences between なければならない and なくてはいけない (ならない often felt more general or formal, いけない more personal) are deliberately not stated as a rule; only "usual choice in formal speech and writing" is claimed for なければなりません. Please check that claim.'
