  - id: OJG-0323
    pattern: くれる
    title: Someone gives (to me or my side)
    meaning: "AがNをくれる: A gives N to me, or to someone on my side. The thing moves toward the speaker."
    when: "Use it when someone gives something to you or to someone close to you, such as your family: 友だちが本をくれました; 田中さんが妹にお菓子をくれました. 私に is usually left out, because くれる already says it came to you."
    why: "くれる is the inward verb of giving: the thing moves toward the speaker's side. Because the verb itself says where it went, 私に is normally left out: 友だちが本をくれました already means \"gave me\". The speaker's side is the speaker and the people the speaker counts as their own, such as family, as against the giver. Giving the other way, from you to someone, takes あげる. For someone above you giving to you, the respectful verb is くださる (N4)."
    formation:
      - form: Giver が／は (Receiver に) Thing を くれる
        note: "Polite: くれます. The receiver is the speaker or someone on the speaker's side; 私に is usually left out."
    examples:
      - japanese: 友だちが本をくれました。
        reading: ともだちがほんをくれました。
        romaji: tomodachi ga hon o kuremashita.
        english: A friend gave me a book.
      - japanese: 田中さんが妹にお菓子をくれました。
        reading: たなかさんがいもうとにおかしをくれました。
        romaji: tanaka-san ga imōto ni okashi o kuremashita.
        english: Mr Tanaka gave my younger sister some sweets.
      - japanese: 誕生日に父が時計をくれました。
        reading: たんじょうびにちちがとけいをくれました。
        romaji: tanjōbi ni chichi ga tokei o kuremashita.
        english: My father gave me a watch for my birthday.
    mistake:
      wrong: 私は友だちに花をくれました。
      problem: The flowers go away from the speaker, so the verb is あげる. くれる is only for giving toward the speaker's side.
      right: 私は友だちに花をあげました。
    distinguish_from:
      - id: OJG-0322
        note: あげる is giving that moves away from the speaker's side.
      - id: OJG-0324
        note: "もらう tells the same event from the receiver: 私は友だちに本をもらいました = 友だちが本をくれました."
      - id: OJG-0056
        note: ～てくれる is someone doing something for you, with the same direction as くれる.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: ～が 私に くれます (〜ga watashi ni kuremasu)
        - source_id: hanabira
          level: N4
          item: Noun を くれる (Noun wo kureru)
    references:
