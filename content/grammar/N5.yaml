  - id: OJG-0311
    pattern: ～あとで
    title: After ...
    meaning: "V (た-form) + あとで / N + のあとで: after doing V, after N. The first event is over before the second."
    when: 'Use it to put one event after another: 晩ご飯を食べたあとで、散歩します; 授業のあとで、図書館に行きました. あとで on its own means "later": あとで電話します.'
    why: 'あと (後) means "after, behind", the time that comes later. The verb before it takes the た-form because, by the time of the main event, the first one is already finished, even when both are still in the future: 食べたあとで散歩します. A noun joins with の, as other time and position nouns do: 授業のあと. で marks the point at which the main event happens; あと with a comma and no で is also common. Compared with ～てから, あとで simply puts the two events in order; てから stresses that the second follows once the first is done, often straight after it.'
    formation:
      - form: V (た-form) + あとで
        note: 食べたあとで. The た-form even when talking about the future.
      - form: Noun + の + あとで
        note: 授業のあとで.
      - form: あとで
        note: "Alone: later."
    examples:
      - japanese: 晩ご飯を食べたあとで、散歩します。
        reading: ばんごはんをたべたあとで、さんぽします。
        romaji: bangohan o tabeta ato de, sanpo shimasu.
        english: After dinner, I go for a walk.
      - japanese: 授業のあとで、図書館に行きました。
        reading: じゅぎょうのあとで、としょかんにいきました。
        romaji: jugyō no ato de, toshokan ni ikimashita.
        english: After class, I went to the library.
      - japanese: 今は忙しいので、あとで電話します。
        reading: いまはいそがしいので、あとででんわします。
        romaji: ima wa isogashii node, ato de denwa shimasu.
        english: I'm busy now, so I'll call you later.
    mistake:
      wrong: 宿題をするあとで、テレビを見ます。
      problem: The first action has to be finished before the second, so the verb before あとで takes the た-form, even about the future.
      right: 宿題をしたあとで、テレビを見ます。
    distinguish_from:
      - id: OJG-0040
        note: ～てから also means "after", and stresses that the second action follows once the first is done.
      - id: OJG-0039
        note: まえに is the opposite, "before", and takes the dictionary form, because the event has not happened yet.
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: hanabira
          level: N5
          item: Noun の あとで (Noun no atode)
        - source_id: hanabira
          level: N5
          item: Verb た あとで (ta ato de)
    references:
      - source_id: hanabira
        ref: ～あとで
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Questions: is the あとで / てから contrast stated fairly? Is the remark that あと without で is also common accurate (e.g. 食べたあと、散歩します)?"
      reviews:
