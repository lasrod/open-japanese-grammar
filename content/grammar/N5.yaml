  - id: OJG-0315
    pattern: あまり～ない
    title: Not very, not much
    meaning: "あまり + negative: not very, not much, not often. あまり高くない, あまり食べません."
    when: "Use it to soften a negative: この店はあまり高くないです (not very expensive); 私は肉をあまり食べません (I don't eat much meat). It is gentler than a flat negative, and is often a polite way of saying no."
    why: 'With a negative, あまり says the amount or degree does not reach far: "not to any great extent". For this meaning, "not very, not much, not often", あまり is paired with a negative ending later in the sentence. With a positive ending it never means a neutral "very"; あまり(に) with a positive belongs to a different use, "too, excessively". Because it avoids a flat no, Japanese speakers use it where English might just say no: 「辛いものは好きですか。」「あまり好きじゃないです。」 あんまり is a common spoken form.'
    formation:
      - form: あまり + verb (negative)
        note: あまり食べません.
      - form: あまり + い-adjective (くない)
        note: あまり高くないです.
      - form: あまり + な-adjective + じゃない／ではない
        note: 'あまり好きじゃないです. Not with just any noun: the word has to allow "how much".'
    examples:
      - japanese: この店はあまり高くないです。
        reading: このみせはあまりたかくないです。
        romaji: kono mise wa amari takakunai desu.
        english: This shop isn't very expensive.
      - japanese: 私は肉をあまり食べません。
        reading: わたしはにくをあまりたべません。
        romaji: watashi wa niku o amari tabemasen.
        english: I don't eat much meat.
      - japanese: 「辛いものは好きですか。」「あまり好きじゃないです。」
        reading: 「からいものはすきですか。」「あまりすきじゃないです。」
        romaji: '"karai mono wa suki desu ka." "amari suki ja nai desu."'
        english: '"Do you like spicy food?" "Not really."'
    mistake:
      wrong: この映画はあまりおもしろいです。
      problem: Intended as "very interesting". For a neutral "very", use とても. あまり with a negative means "not very" (あまりおもしろくないです); あまり(に) with a positive is a different use, "too".
      right: この映画はとてもおもしろいです。
    distinguish_from:
      - id: OJG-0316
        note: "ぜんぜん～ない is stronger: not at all."
      - id: OJG-0317
        note: そんなに～ない is "not that much", measured against something expected or just said.
