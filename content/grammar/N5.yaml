        model: claude-opus-5-5
      note: "Revised after review: the noun／な-adjective formation now covers past and negative forms, and な is limited to the affirmative nonpast; the mistake’s problem is qualified the same way. Still open for a human: (1) whether “insisting on a point … pushy or accusatory” fairly summarises the overuse problem, and (2) whether 学生んです is a frequent enough learner error, or whether the mistake should instead show unneeded んです. のです is given as written/formal but the register does not list written, since the headword is ～んです."
