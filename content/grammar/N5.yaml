  - id: OJG-0002
    pattern: も
    title: Also, too, and not … either
    meaning: 'も adds a word as one more case of what was said: "also", "too"; with a negative verb, "not … either".'
    when: "Use it on a word to say the same thing is true of it as well: 私も学生です, \"I am a student too\". With a negative it gives \"not … either\". AもBも says \"both A and B\" (or \"neither A nor B\" with a negative). Forms such as 何も and だれも combine with a negative predicate to mean \"nothing\" and \"nobody\": 何も食べません, \"I don't eat anything\". Another particle can come before も to mark the word’s role: どこにも行きません means “I don’t go anywhere”, with に marking the destination; どこも行きません is also used, especially in conversation."
    why: 'も says "this one as well": it adds the word it follows to something already said or understood. So it goes directly on the word that is "also" true, and moving it changes the meaning: 私もコーヒーを飲みます is "I too drink coffee", and 私はコーヒーも飲みます is "I drink coffee too (as well as other things)". In the ordinary additive use taught here, も replaces は, が and を (not はも, がも). をも also occurs for emphasis, especially in written Japanese. After other particles, も is added on: 東京にも, 友だちとも. With 何 and だれ and a negative predicate, も gives "not a single one": 何も, だれも. Another particle can come before も to mark the word’s role: どこにも行きません means “I don’t go anywhere”, with に marking the destination; どこも行きません is also used, especially in conversation. いつも is a fixed expression meaning "always" or "usually", with either a positive or a negative predicate.'
    formation:
      - form: Noun + も
        note: "In the ordinary additive use, replaces は, が or を: 私も, 本も. をも also occurs for emphasis, mostly in writing."
      - form: Noun + particle + も
        note: "に, で, と, から and others stay: 日曜日にも, 友だちとも."
      - form: Noun A + も + Noun B + も
        note: '"Both A and B"; with a negative verb, "neither A nor B".'
      - form: 何も／だれも + negative predicate
        note: '何も～ません "nothing", だれも～ません "nobody"; another particle can come first to mark the word’s role: どこにも行きません (どこも行きません is also used, especially in conversation). いつも "always" is a fixed expression.'
    examples:
      - japanese: 私も学生です。
        reading: わたしもがくせいです。
        romaji: watashi mo gakusei desu.
        english: I am a student too.
      - japanese: 田中さんはコーヒーも飲みます。
        reading: たなかさんはコーヒーものみます。
        romaji: tanaka-san wa kōhī mo nomimasu.
        english: Mr Tanaka drinks coffee too.
        note: も is on コーヒー, so coffee is the added item, not Mr Tanaka.
      - japanese: 犬も猫も好きです。
        reading: いぬもねこもすきです。
        romaji: inu mo neko mo suki desu.
        english: I like both dogs and cats.
      - japanese: 今朝は何も食べませんでした。
        reading: けさはなにもたべませんでした。
        romaji: kesa wa nani mo tabemasen deshita.
        english: I didn't eat anything this morning.
    mistake:
      wrong: 私はも学生です。
      problem: も replaces は; the two are not used together. Put も directly on the word that is "also" true.
      right: 私も学生です。
    distinguish_from:
      - id: OJG-0008
        note: Both can go on the topic. は sets it up, often in contrast with others; も says it is one more case of what was already said.
      - id: OJG-0011
        note: AとB lists items together; AもBも stresses that the same is true of each, "both A and B".
    register:
      - plain
      - polite
    levels:
      commonly: N5
      listed:
        - source_id: tanos
          level: N5
          item: も
          ref: 536
    references:
      - source_id: tanos
        ref: 536
    review:
      status: ai-reviewed
      drafted_by:
        provider: anthropic
        model: claude-opus-5-5
      note: "Not covered: も after a number or amount for emphasis (三時間も, 'as much as three hours'), and をも in formal writing. Question: is the statement that も 'replaces を' fine at this level, given that をも exists in written style?"
      reviews:
        - by: gpt-6-astra
