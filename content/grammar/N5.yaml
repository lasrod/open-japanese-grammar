      note: "The から / ので contrast is kept deliberately soft; please check it does not overstate. Sentence-final から without です in casual speech (だって、痛かったから) is not covered. Revised after review: the だ／です rule is limited to nonpast affirmative predicates, with past and negative forms shown; reason-first order is now 'usually', with the afterthought order (行きません。雨ですから。) mentioned."
      reviews:
