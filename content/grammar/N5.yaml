  - id: OJG-0293
    pattern: そして／それから
    title: '"And", "and then" at the start of a sentence'
    meaning: 'そして: and, adding the next point or event. それから: and then, after that; also "and also" when adding to a list.'
    when: "Use そして to add another point or the next event: この部屋は広いです。そして、明るいです. Use それから for what happens next in time: 朝ご飯を食べました。それから、学校に行きました. それから also adds one more item, as when ordering: コーヒーを一つください。それから、ケーキも一つ."
    why: 'それから is それ, "that", with から, "from": from that point on, which is why it orders events in time. そして simply carries on from the last sentence and adds to it, so it fits both a further fact and a next event. Both usually link statements, most often at the start of a new sentence. After a pause they can also add one more item to a list of nouns (コーヒー、それからケーキ), but for a simple list of nouns と is the ordinary word: 犬と猫. Inside one sentence, a string of actions is usually joined with the て-form instead (起きて、食べて、出かけます); そして and それから are clearer when each step is its own sentence.'
    formation:
      - form: Sentence。そして、sentence。
        note: Adds a further point or the next event.
      - form: Sentence。それから、sentence。
        note: The next event in time, or one more item in a list.
    examples:
      - japanese: この部屋は広いです。そして、明るいです。
        reading: このへやはひろいです。そして、あかるいです。
        romaji: kono heya wa hiroi desu. soshite, akarui desu.
        english: This room is spacious. And it's bright.
      - japanese: 朝ご飯を食べました。それから、学校に行きました。
        reading: あさごはんをたべました。それから、がっこうにいきました。
        romaji: asagohan o tabemashita. sorekara, gakkō ni ikimashita.
        english: I ate breakfast. Then I went to school.
      - japanese: コーヒーを一つください。それから、ケーキも一つください。
        reading: コーヒーをひとつください。それから、ケーキもひとつください。
        romaji: kōhī o hitotsu kudasai. sorekara, kēki mo hitotsu kudasai.
        english: One coffee, please. And one cake as well.
    mistake:
      wrong: 私は犬そして猫が好きです。
      problem: For a simple list of two nouns, と is the ordinary connector. そして usually links statements; between two bare nouns with no pause it sounds like translated English.
      right: 私は犬と猫が好きです。
    distinguish_from:
      - id: OJG-0011
        note: "と is the ordinary way to list nouns: 犬と猫. そして and それから usually link statements."
      - id: OJG-0040
        note: "～てから joins two predicates inside one sentence: 食べてから行きました. それから is a separate connector, usually starting the next sentence."
      - id: OJG-0312
        note: The て-form joins predicates inside one sentence; そして and それから are separate connectors, usually starting a new sentence but also possible after a pause within one.
    register:
      - plain
      - polite
      - spoken
      - written
